<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>출근 시프트</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
:root{
  --ink:#3a2a63; --ink2:#6b5a95; --muted:#a99ec9;
  --violet:#7c3aed; --violet2:#a78bfa; --pink:#f472b6; --amber:#fbbf24;
  --maid:#f472b6; --devil:#7c3aed; --matsuri:#fb923c;
  --card:rgba(255,255,255,.95);
  --bg:radial-gradient(135% 95% at 50% -15%, #ffe1c9 0%, #fbd0e4 25%, #c9b8f3 57%, #9d8df0 100%);
}
html,body{height:100%}
body{
  font-family:'Apple SD Gothic Neo','Pretendard','Noto Sans KR',-apple-system,system-ui,'Malgun Gothic',sans-serif;
  color:var(--ink); background:var(--bg); background-attachment:fixed;
  display:flex; justify-content:center; letter-spacing:-0.2px;
}
.app{width:100%;max-width:480px;min-height:100vh;min-height:100dvh;position:relative;display:flex;flex-direction:column}
.stars{position:fixed;inset:0;opacity:.5;pointer-events:none;background-image:
  radial-gradient(2px 2px at 18% 20%,#fff9,transparent),radial-gradient(2px 2px at 72% 14%,#fff6,transparent),
  radial-gradient(1.5px 1.5px at 42% 38%,#fff7,transparent),radial-gradient(2px 2px at 86% 50%,#fff6,transparent),
  radial-gradient(1.5px 1.5px at 28% 62%,#fff5,transparent),radial-gradient(2px 2px at 62% 76%,#fff6,transparent)}

/* header */
.head{position:relative;z-index:10;padding:max(22px,calc(env(safe-area-inset-top) + 14px)) 18px 10px}
.kicker{font-size:10px;font-weight:800;letter-spacing:3px;color:rgba(255,255,255,.82)}
.brand{font-size:23px;font-weight:900;color:#fff;text-shadow:0 2px 8px rgba(80,40,150,.35)}
.brand-sub{font-size:12.5px;font-weight:700;color:rgba(255,255,255,.9);margin-top:3px}

/* body */
.body{position:relative;z-index:10;flex:1;padding:8px 16px 28px;overflow-y:auto}

/* date bar */
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;
  background:rgba(255,255,255,.62);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:18px;padding:8px 10px;box-shadow:0 8px 22px -12px rgba(80,40,150,.4)}
.datebar button{border:none;cursor:pointer;background:#fff;width:34px;height:34px;border-radius:12px;font-size:17px;font-weight:900;color:var(--violet);font-family:inherit}
.datebar .dlabel{flex:1;text-align:center;font-weight:900;font-size:15px;color:var(--ink)}
.datebar .dlabel small{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.today-btn{font-size:11px !important;width:auto !important;padding:0 11px;height:34px}

/* workplace chips */
.chips{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.chip{border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:12.5px;padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.55);color:var(--ink2)}
.chip.on{color:#fff;box-shadow:0 6px 14px -6px rgba(80,40,150,.5)}
.chip.on[data-w="전체"]{background:linear-gradient(135deg,#a78bfa,#f472b6)}
.chip.on[data-w="메이드"]{background:var(--maid)}
.chip.on[data-w="데빌"]{background:var(--devil)}
.chip.on[data-w="마츠리"]{background:var(--matsuri)}

/* workplace section */
.wp-sec{margin-bottom:16px}
.wp-h{display:flex;align-items:center;gap:8px;margin:0 2px 9px}
.wp-dot{width:11px;height:11px;border-radius:50%}
.wp-dot.메이드{background:var(--maid)}.wp-dot.데빌{background:var(--devil)}.wp-dot.마츠리{background:var(--matsuri)}
.wp-name{font-weight:900;font-size:16px;color:#fff;text-shadow:0 1px 5px rgba(80,40,150,.3)}
.wp-count{font-size:12px;font-weight:800;color:rgba(255,255,255,.85)}

/* shift card */
.card{background:var(--card);border-radius:18px;padding:14px 15px;margin-bottom:10px;box-shadow:0 12px 28px -16px rgba(80,50,150,.35),0 2px 5px rgba(80,50,150,.05)}
.s-row{display:flex;align-items:center;gap:12px}
.s-time{font-weight:900;font-size:15px;color:var(--ink);min-width:96px}
.s-name{flex:1;font-weight:800;font-size:15px;color:var(--ink)}
.s-name.empty{color:var(--muted);font-weight:700}
.s-memo{font-size:12px;color:var(--ink2);margin-top:7px;padding-top:7px;border-top:1px dashed #eee6fb}
.none{text-align:center;color:var(--muted);font-weight:700;font-size:13px}

/* empty */
.empty-box{text-align:center;padding:44px 20px;color:#fff}
.empty-box .e-ic{font-size:46px}
.empty-box .e-t{font-weight:900;font-size:16px;margin-top:10px;text-shadow:0 1px 5px rgba(80,40,150,.3)}
.empty-box .e-s{font-size:13px;font-weight:600;opacity:.9;margin-top:5px}

.spin{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* setup screen */
.setup{padding:40px 22px;color:#fff}
.setup h1{font-size:24px;font-weight:900;text-shadow:0 2px 8px rgba(80,40,150,.32)}
.setup p{font-size:14px;line-height:1.7;margin-top:12px;font-weight:600;opacity:.95}
.setup code{background:rgba(255,255,255,.22);padding:2px 7px;border-radius:6px;font-size:13px;font-weight:800}

/* footer */
.foot{position:relative;z-index:10;text-align:center;padding:6px 16px max(18px,env(safe-area-inset-bottom));font-size:11px;font-weight:700;color:rgba(255,255,255,.6)}
.foot a{color:rgba(255,255,255,.7);text-decoration:underline}
</style>
</head>
<body>
<div class="stars"></div>
<div class="app">

  <!-- 설정 미완료 안내 -->
  <div id="setupScreen" class="setup" style="display:none">
    <h1>🌙 출근 시프트</h1>
    <p>아직 Supabase 연결이 안 됐어요. <code>index.html</code> 상단 <code>CONFIG</code> 값을 채워주세요. 자세한 내용은 <code>SHIFT_SETUP.md</code> 참고.</p>
  </div>

  <div id="mainApp" style="display:none;flex:1;flex-direction:column">
    <div class="head">
      <div class="kicker">TODAY</div>
      <div class="brand">출근 시프트</div>
      <div class="brand-sub">오늘 누가 출근하는지 확인하세요 ✨</div>
    </div>

    <div class="body">
      <div class="datebar">
        <button id="prevDay">‹</button>
        <div class="dlabel" id="dateLabel"></div>
        <button id="nextDay">›</button>
        <button class="today-btn" id="todayBtn">오늘</button>
      </div>
      <div class="chips" id="wpChips"></div>
      <div id="scheduleList"></div>
    </div>

    <div class="foot">출근자이신가요? <a href="staff.html">직원용 페이지로 →</a></div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* CONFIG · Supabase (직원용 staff.html 과 동일하게 유지) */
const CONFIG = {
  SUPABASE_URL:      'https://izpotztbvjazfvcntqyh.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_ToHVeUEnJVmlHCcu_-QcnQ_ofP55Q_N',
};

const WORKPLACES = ['메이드','데빌','마츠리'];
const $ = id => document.getElementById(id);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

let supa = null, selectedDate = new Date(), wpFilter = '전체';

function isConfigured(){
  return CONFIG.SUPABASE_URL && !CONFIG.SUPABASE_URL.startsWith('YOUR_') &&
         CONFIG.SUPABASE_ANON_KEY && !CONFIG.SUPABASE_ANON_KEY.startsWith('YOUR_');
}
function boot(){
  if(!isConfigured()){ $('setupScreen').style.display='block'; return; }
  supa = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  $('mainApp').style.display='flex';
  renderChips();
  $('prevDay').onclick = ()=>{ selectedDate.setDate(selectedDate.getDate()-1); render(); };
  $('nextDay').onclick = ()=>{ selectedDate.setDate(selectedDate.getDate()+1); render(); };
  $('todayBtn').onclick = ()=>{ selectedDate=new Date(); render(); };
  render();
  setInterval(()=>{ if(document.visibilityState==='visible') render(); }, 30000);
}

function renderDateLabel(){
  const d = selectedDate, days=['일','월','화','수','목','금','토'];
  const isToday = ymd(d)===ymd(new Date());
  $('dateLabel').innerHTML = `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})<small>${isToday?'오늘':''}</small>`;
}
function renderChips(){
  const c = $('wpChips');
  c.innerHTML = ['전체',...WORKPLACES].map(w=>
    `<button class="chip${w===wpFilter?' on':''}" data-w="${w}">${w}</button>`).join('');
  c.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ wpFilter=b.dataset.w; renderChips(); render(); });
}
async function render(){
  renderDateLabel();
  const list = $('scheduleList');
  list.innerHTML = `<div style="text-align:center;padding:30px"><span class="spin"></span></div>`;
  const { data, error } = await supa.from('shift_view').select('*')
    .eq('work_date', ymd(selectedDate)).order('workplace').order('start_time');
  if(error){ list.innerHTML = `<div class="empty-box"><div class="e-ic">⚠️</div><div class="e-t">불러오기 실패</div><div class="e-s">${esc(error.message)}</div></div>`; return; }
  const shifts = data || [];
  const groups = (wpFilter==='전체'?WORKPLACES:[wpFilter]);
  let html='', total=0;
  groups.forEach(wp=>{
    const rows = shifts.filter(s=>s.workplace===wp);
    total += rows.length;
    html += `<div class="wp-sec"><div class="wp-h"><span class="wp-dot ${wp}"></span><span class="wp-name">${wp}</span><span class="wp-count">${rows.length}명</span></div>`;
    if(rows.length===0){
      html += `<div class="card none">오늘 근무 없음</div>`;
    } else {
      rows.forEach(s=>{
        const name = s.staff_name
          ? `<span class="s-name">${esc(s.staff_name)}</span>`
          : `<span class="s-name empty">미정</span>`;
        const memo = s.memo? `<div class="s-memo">📝 ${esc(s.memo)}</div>`:'';
        html += `<div class="card"><div class="s-row"><div class="s-time">${esc(s.start_time)}~${esc(s.end_time)}</div>${name}</div>${memo}</div>`;
      });
    }
    html += `</div>`;
  });
  if(total===0){
    list.innerHTML = `<div class="empty-box"><div class="e-ic">🗓️</div><div class="e-t">이 날은 등록된 근무가 없어요</div><div class="e-s">다른 날짜를 확인해 보세요</div></div>`;
    return;
  }
  list.innerHTML = html;
}

boot();
</script>
</body>
</html>

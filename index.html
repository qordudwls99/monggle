<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>모에 스케줄</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#bd7783" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="모에 스케줄" />
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
:root{
  --ink:#3f2e30; --ink2:#8a7173; --muted:#b5919a;
  --rose:#bd7783; --rose-deep:#a85565; --gold:#9a6f1e;
  --maid:#c27c87; --devil:#8e7aa6; --matsuri:#c2925e;
  --card:#ffffff; --line:#f0e3e4; --paper:#faf4f3;
  /* 테마별로 바뀌는 연한 강조 색 */
  --soft:#f7e6e9; --soft2:#f7eef0; --avbg:#f5e5e8;
  --seg-bg:#f3e7e9; --nm-bg:#f8eef0; --ev-border:#eecdd3;
  --appbg:transparent;
}
html,body{height:100%}
body{
  font-family:'Apple SD Gothic Neo','Pretendard','Noto Sans KR',-apple-system,system-ui,'Malgun Gothic',sans-serif;
  color:var(--ink); background:var(--paper);
  display:flex; justify-content:center; letter-spacing:-0.2px;
}
.app{width:100%;max-width:480px;min-height:100vh;min-height:100dvh;position:relative;display:flex;flex-direction:column;background:var(--appbg);transition:background .4s ease}
.stars{display:none}

.head{position:relative;z-index:10;padding:max(22px,calc(env(safe-area-inset-top) + 14px)) 20px 8px}
.kicker{font-size:10px;font-weight:800;letter-spacing:3px;color:var(--rose);text-transform:uppercase}
.brand{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.5px}
.brand-sub{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:4px}

.body{position:relative;z-index:10;flex:1;padding:8px 20px 28px;overflow-y:auto;overscroll-behavior-y:contain}
.ptr{height:44px;margin-top:-44px;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-size:12.5px;font-weight:800}

/* view toggle */
.seg{display:flex;background:var(--seg-bg);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:13px;padding:9px 0;border-radius:9px;background:none;color:var(--muted);transition:.15s}
.seg button.on{background:#fff;color:var(--rose-deep);box-shadow:0 1px 3px rgba(80,40,50,.12)}

.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;padding:11px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.datebar button{border:none;cursor:pointer;background:none;width:32px;height:32px;font-size:19px;font-weight:700;color:var(--rose);font-family:inherit}
.datebar .dlabel{flex:1;text-align:center;font-weight:800;font-size:15.5px;color:var(--ink)}
.datebar .dlabel small{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.today-btn{font-size:11px !important;width:auto !important;padding:0 11px;height:32px;color:var(--muted) !important}

.chips{display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap}
.chip{border:1px solid var(--line);cursor:pointer;font-family:inherit;font-weight:700;font-size:12.5px;padding:7px 15px;border-radius:99px;background:#fff;color:var(--muted)}
.chip.on{color:#fff;border-color:transparent}
.chip.on[data-w="메이드"]{background:var(--maid)}
.chip.on[data-w="데빌"]{background:var(--devil)}
.chip.on[data-w="마츠리"]{background:var(--matsuri)}

/* day view */
.wp-sec{margin-bottom:22px}
.wp-h{display:flex;align-items:center;gap:8px;margin:2px 2px 6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.wp-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.wp-dot.메이드{background:var(--maid)}.wp-dot.데빌{background:var(--devil)}.wp-dot.마츠리{background:var(--matsuri)}
.wp-name{font-weight:800;font-size:16px;color:var(--ink)}
.wp-count{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--muted)}
.names{display:flex;flex-direction:column}
.tag{display:flex;align-items:center;gap:13px;padding:13px 4px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px;color:var(--ink)}
.tag .av{width:34px;height:34px;border-radius:50%;background:var(--avbg);color:var(--rose-deep);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;background-size:cover;background-position:center}
.tag .tnm{flex:1}
.tag .gtag{font-size:10px;font-weight:800;color:var(--gold);background:#f3e7c8;padding:3px 9px;border-radius:6px;letter-spacing:.3px}
.tag .ig{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9px;color:#fff;flex-shrink:0;background:linear-gradient(45deg,#f09433,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888)}
.tag.guest .av{background:#f3e7c8;color:var(--gold)}
.ev-banner{display:flex;align-items:center;gap:8px;background:var(--soft);color:var(--rose-deep);font-weight:800;font-size:13.5px;padding:10px 14px;border-radius:10px;margin-bottom:12px;border:1px solid var(--ev-border)}
.ev-banner::before{content:"●";font-size:7px}
.night-banner{display:flex;align-items:center;gap:8px;background:#ece9f4;color:#4f4a7a;font-weight:800;font-size:13.5px;padding:10px 14px;border-radius:10px;margin-bottom:12px;border:1px solid #d8d3ea}
.night-banner::before{content:"☾";font-size:13px}
.night-tag{display:block;margin:4px auto 0;font-size:9px;font-weight:800;color:#4f4a7a;background:#ece9f4;padding:2px 7px;border-radius:99px;width:fit-content}
/* 주간/야간 좌우 배치 */
.daynight{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
.dn-col{background:#fbfaff;border:1px solid var(--line);border-radius:12px;padding:9px}
.dn-col.night{background:#f6f5fb;border-color:#e4e0f0}
.dn-h{font-size:11.5px;font-weight:800;color:var(--ink2);text-align:center;margin-bottom:6px}
.dn-col.night .dn-h{color:#4f4a7a}
.dn-col .names{gap:0}
.dn-col .tag{padding:8px 4px;gap:8px}
.dn-col .tag .av{width:26px;height:26px;font-size:11px}
.dn-col .tag .tnm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn-col .tag .ig{width:24px;height:24px}
.dn-empty{text-align:center;color:var(--muted);font-weight:600;font-size:12px;padding:8px 0}
.night-row{display:flex;align-items:center;gap:8px;padding:7px 2px;min-width:0;border-bottom:1px solid #efeaf6}
.night-row:last-of-type{border-bottom:none}
.night-row .nmav{width:26px;height:26px;border-radius:50%;background:#e6e2f2;color:#4f4a7a;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;background-size:cover;background-position:center}
.night-row .nmav.guest{background:#f3e7c8;color:var(--gold)}
.night-row .nmname{flex:1;font-weight:700;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.night-row .ig.sm{width:24px;height:24px;border-radius:7px}
.memo-row{font-size:12px;color:var(--ink2);margin:8px 2px 0}
.none{text-align:center;color:var(--muted);font-weight:600;font-size:13px;padding:16px}

/* week view — 4(위)+3(아래) 그리드, 화면 꽉 차게 */
.weekgrid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:8px;min-height:calc(100dvh - 235px)}
.daycol{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 8px;box-shadow:0 6px 16px -14px rgba(80,40,50,.4);cursor:pointer;min-width:0;display:flex;flex-direction:column}
.daycol.today{border-color:var(--rose);box-shadow:0 0 0 1px var(--rose)}
.dcol-h{text-align:center;font-weight:800;font-size:12px;color:var(--ink);margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--line);line-height:1.3}
.dcol-h .dow{font-size:17px;line-height:1.2}
.dcol-h.weekend .dow{color:var(--rose-deep)}
.dcol-h .tdy{display:inline-block;color:#fff;background:var(--rose);font-size:9px;font-weight:800;padding:1px 6px;border-radius:99px;margin-left:3px}
.dcol-ev{display:block;margin:4px auto 0;font-size:9px;font-weight:800;color:var(--rose-deep);background:var(--soft);padding:2px 7px;border-radius:99px;line-height:1.3;width:fit-content}
.dcol-body{flex:1;overflow-y:auto}
.wpgrp{margin-bottom:7px}
.wpgrp:last-child{margin-bottom:0}
.wpgrp-h{display:flex;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:800;color:var(--muted);margin-bottom:4px}
.wpgrp .nm{font-size:13px;font-weight:600;color:var(--ink);padding:5px 2px;text-align:center;background:var(--nm-bg);border-radius:8px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wpgrp .nm.op{background:none;color:var(--muted);font-weight:600;font-size:11px}
.wpgrp .nm.guest{background:#f3e7c8;color:var(--gold)}
.dcol-off{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:14px 0}

.empty-box{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-box .e-ic{font-size:32px;opacity:.45}
.empty-box .e-t{font-weight:800;font-size:16px;margin-top:12px;color:var(--ink)}
.empty-box .e-s{font-size:13px;font-weight:500;margin-top:6px}
.spin{display:inline-block;width:20px;height:20px;border:3px solid #f0e3e4;border-top-color:var(--rose);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
/* 전환 애니메이션 */
@keyframes slideR{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideL{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.anim-r{animation:slideR .26s cubic-bezier(.22,.61,.36,1)}
.anim-l{animation:slideL .26s cubic-bezier(.22,.61,.36,1)}
.anim-f{animation:fadeUp .24s ease}
.seg button,.chip,.datebar button,.daycol,.tag .ig{transition:transform .12s ease, background .15s ease, color .15s ease, border-color .15s ease}
.chip:active,.daycol:active,.tag .ig:active{transform:scale(.95)}
.datebar button:active{transform:scale(.85)}
.seg button:active{transform:scale(.97)}

.setup{padding:40px 22px;color:var(--ink)}
.setup h1{font-size:24px;font-weight:800}
.setup p{font-size:14px;line-height:1.7;margin-top:12px;font-weight:600;color:var(--ink2)}
.setup code{background:var(--seg-bg);color:var(--rose-deep);padding:2px 7px;border-radius:6px;font-size:13px;font-weight:800}

.foot{position:relative;z-index:10;text-align:center;padding:6px 16px max(18px,env(safe-area-inset-bottom));font-size:11px;font-weight:700;color:var(--muted)}
.foot a{color:var(--rose-deep);text-decoration:underline}

/* ===== 근무지별 테마 ===== */
body{transition:background .4s ease}
body[data-theme="devil"]{
  --ink:#2c2433; --ink2:#6f6378; --muted:#a99cb4;
  --rose:#8a4fb0; --rose-deep:#6a2f97; --gold:#9a6f1e;
  --line:#e7e0ef; --paper:#f3eff7;
  --soft:#ece2f5; --soft2:#efe8f7; --avbg:#e9dff3;
  --seg-bg:#ece4f4; --nm-bg:#efe6f6; --ev-border:#ddd0ec;
  --appbg:radial-gradient(120% 60% at 50% -10%, #efe6f8 0%, #f3eff7 46%, #faf7fc 100%);
}
body[data-theme="devil"]{ background:#f3eff7; }
body[data-theme="devil"] .kicker::after{ content:" ♆"; letter-spacing:0; }
body[data-theme="matsuri"]{
  --ink:#2c2622; --ink2:#7a6f63; --muted:#b6a78f;
  --rose:#d2462f; --rose-deep:#b23320; --gold:#b07d12;
  --line:#efe4d3; --paper:#fbf6ed;
  --soft:#fbe7df; --soft2:#f8efe2; --avbg:#f8e3d9;
  --seg-bg:#f7ecdd; --nm-bg:#fbf0e6; --ev-border:#f0d8c6;
  --appbg:radial-gradient(120% 60% at 50% -10%, #fdeede 0%, #fbf6ed 46%, #fffdf8 100%);
}
body[data-theme="matsuri"]{ background:#fbf6ed; }
body[data-theme="matsuri"] .kicker::after{ content:" ⛩"; letter-spacing:0; }
</style>
</head>
<body>
<div class="stars"></div>
<div class="app">

  <div id="setupScreen" class="setup" style="display:none">
    <h1>모에 스케줄</h1>
    <p>아직 Supabase 연결이 안 됐어요. <code>index.html</code> 상단 <code>CONFIG</code> 값을 채워주세요. 자세한 내용은 <code>SHIFT_SETUP.md</code> 참고.</p>
  </div>

  <div id="mainApp" style="display:none;flex:1;flex-direction:column">
    <div class="head">
      <div class="kicker">TODAY</div>
      <div class="brand">모에 스케줄</div>
    </div>

    <div class="body">
      <div class="ptr" id="ptr"><span class="spin" id="ptrSpin" style="display:none;width:15px;height:15px;border-width:2px"></span><span id="ptrTxt">↓ 당겨서 새로고침</span></div>
      <div class="seg" id="viewSeg">
        <button data-v="day" class="on">일별</button>
        <button data-v="week">주간(월~일)</button>
      </div>
      <div class="datebar">
        <button id="prev">‹</button>
        <div class="dlabel" id="dateLabel"></div>
        <button id="next">›</button>
        <button class="today-btn" id="todayBtn">오늘</button>
      </div>
      <div class="chips" id="wpChips"></div>
      <div id="list"></div>
    </div>

  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const CONFIG = {
  SUPABASE_URL:      'https://izpotztbvjazfvcntqyh.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_ToHVeUEnJVmlHCcu_-QcnQ_ofP55Q_N',
};

const WORKPLACES = ['메이드','데빌','마츠리'];
const DAYS = ['일','월','화','수','목','금','토'];
const $ = id => document.getElementById(id);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const igUrl = h => { h=String(h||'').trim(); if(!h) return null; return /^https?:\/\//i.test(h)?h:'https://instagram.com/'+h.replace(/^@/,''); };
const IG_SVG = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>';
const mondayOf = d => { const x=new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); x.setHours(0,0,0,0); return x; };
const avStyle = url => url?`background-image:url('${String(url).replace(/'/g,'%27')}')`:'';

let supa=null, selectedDate=new Date(), wpFilter='메이드', viewMode='day', navDir=0;
let minDate=null, maxDate=null;   // 손님이 볼 수 있는 범위 (1개월 전 ~ 마지막 등록일)
let draftMonths=new Set();        // 아직 공개 안 된(작성중) 달 → 손님에게 숨김
const ymOf = d => ymd(d).slice(0,7);
async function loadDraftMonths(){
  try{ const { data } = await supa.from('schedule_status_view').select('*').eq('published', false);
    draftMonths = new Set((data||[]).map(r=>r.ym)); }catch(e){ draftMonths=new Set(); }
}

function isConfigured(){
  return CONFIG.SUPABASE_URL && !CONFIG.SUPABASE_URL.startsWith('YOUR_') &&
         CONFIG.SUPABASE_ANON_KEY && !CONFIG.SUPABASE_ANON_KEY.startsWith('YOUR_');
}
async function loadBounds(){
  const today=new Date(); const mn=new Date(today); mn.setMonth(mn.getMonth()-1);
  minDate=ymd(mn);
  const [a,b]=await Promise.all([
    supa.from('shift_view').select('work_date').order('work_date',{ascending:false}).limit(1),
    supa.from('closure_view').select('work_date').order('work_date',{ascending:false}).limit(1)
  ]);
  let m=null;
  if(a.data&&a.data[0]) m=a.data[0].work_date;
  if(b.data&&b.data[0] && (!m||b.data[0].work_date>m)) m=b.data[0].work_date;
  maxDate = m || ymd(today);
}
function clampSel(){
  let t=ymd(selectedDate);
  if(maxDate && t>maxDate) selectedDate=new Date(maxDate+'T00:00:00');
  if(minDate && ymd(selectedDate)<minDate) selectedDate=new Date(minDate+'T00:00:00');
}
function updateNav(){
  const t=ymd(selectedDate); let cp=true, cn=true;
  if(viewMode==='day'){ cp=!minDate||t>minDate; cn=!maxDate||t<maxDate; }
  else { const mon=mondayOf(selectedDate); const nm=new Date(mon); nm.setDate(nm.getDate()+7);
    cp=!minDate||ymd(mon)>minDate; cn=!maxDate||ymd(nm)<=maxDate; }
  $('prev').disabled=!cp; $('next').disabled=!cn;
  $('prev').style.opacity=cp?'':'.3'; $('next').style.opacity=cn?'':'.3';
}
async function boot(){
  if(!isConfigured()){ $('setupScreen').style.display='block'; return; }
  supa = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  $('mainApp').style.display='flex';
  applyTheme(wpFilter);
  renderChips();
  await loadBounds(); await loadDraftMonths(); clampSel();
  $('viewSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    viewMode=b.dataset.v; navDir=0;
    $('viewSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    render();
  });
  $('prev').onclick = ()=>{ navDir=-1; selectedDate.setDate(selectedDate.getDate()-(viewMode==='week'?7:1)); clampSel(); render(); };
  $('next').onclick = ()=>{ navDir=1; selectedDate.setDate(selectedDate.getDate()+(viewMode==='week'?7:1)); clampSel(); render(); };
  $('todayBtn').onclick = ()=>{ navDir=0; selectedDate=new Date(); clampSel(); render(); };
  render();
  setupPTR(document.querySelector('.body'), async()=>{ navDir=0; await loadBounds(); await loadDraftMonths(); render(); });
  setInterval(async()=>{ if(document.visibilityState==='visible'){ navDir=0; await loadBounds(); await loadDraftMonths(); render(); } }, 30000);
}
function setupPTR(container, onRefresh){
  let startY=0, pulling=false, applied=0, refreshing=false;
  const THRESH=56, MAX=90, txt=$('ptrTxt'), spin=$('ptrSpin');
  container.addEventListener('touchstart', e=>{
    if(refreshing || e.touches.length!==1){ pulling=false; return; }
    if(container.scrollTop<=0){ startY=e.touches[0].clientY; pulling=true; applied=0; }
    else pulling=false;
  }, {passive:true});
  container.addEventListener('touchmove', e=>{
    if(!pulling || refreshing) return;
    const dy=e.touches[0].clientY - startY;
    if(dy<=0 || container.scrollTop>0){ pulling=false; container.style.transform=''; return; }
    applied=Math.min(dy*0.5, MAX);
    container.style.transform=`translateY(${applied}px)`;
    if(txt) txt.textContent = applied>=THRESH ? '놓으면 새로고침' : '↓ 당겨서 새로고침';
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
  const finish=async()=>{
    if(!pulling) return;
    pulling=false;
    container.style.transition='transform .22s';
    if(applied>=THRESH){
      refreshing=true;
      container.style.transform='translateY(44px)';
      if(spin) spin.style.display='inline-block';
      if(txt) txt.textContent='새로고침 중…';
      try{ await onRefresh(); }catch(e){}
      refreshing=false;
      if(spin) spin.style.display='none';
      if(txt) txt.textContent='↓ 당겨서 새로고침';
    }
    container.style.transform='';
    setTimeout(()=>{ container.style.transition=''; }, 240);
    applied=0;
  };
  container.addEventListener('touchend', finish);
  container.addEventListener('touchcancel', finish);
}
function animList(){
  const l=$('list'); const c = navDir>0?'anim-r':navDir<0?'anim-l':'anim-f';
  l.classList.remove('anim-r','anim-l','anim-f'); void l.offsetWidth; l.classList.add(c);
}

function applyTheme(wp){
  const t = wp==='데빌'?'devil':wp==='마츠리'?'matsuri':'maid';
  document.body.setAttribute('data-theme', t);
  const colors={maid:'#bd7783',devil:'#8a4fb0',matsuri:'#d2462f'};
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=colors[t];
}
function renderChips(){
  const c = $('wpChips');
  c.innerHTML = WORKPLACES.map(w=>`<button class="chip${w===wpFilter?' on':''}" data-w="${w}">${w}</button>`).join('');
  c.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ wpFilter=b.dataset.w; applyTheme(wpFilter); renderChips(); render(); });
}
async function fetchRange(from,to){
  const { data, error } = await supa.from('shift_view').select('*')
    .gte('work_date', from).lte('work_date', to).order('work_date').order('workplace').order('start_time');
  if(error){ $('list').innerHTML=`<div class="empty-box"><div class="e-ic">⚠️</div><div class="e-t">불러오기 실패</div><div class="e-s">${esc(error.message)}</div></div>`; return null; }
  return data||[];
}
async function fetchClosures(from,to){
  const { data } = await supa.from('closure_view').select('*').gte('work_date',from).lte('work_date',to);
  return new Set((data||[]).map(c=>c.work_date+'|'+c.workplace));
}
async function fetchNight(from,to){
  const { data } = await supa.from('night_view').select('*').gte('work_date',from).lte('work_date',to);
  const m={}; (data||[]).forEach(n=>m[n.work_date+'|'+n.workplace]=n.hours); return m;
}
async function fetchNightMembers(dateStr){
  const { data } = await supa.from('night_member_view').select('*').eq('work_date',dateStr);
  const m={}; (data||[]).forEach(r=>(m[r.work_date+'|'+r.workplace]=m[r.work_date+'|'+r.workplace]||[]).push(r)); return m;
}

function render(){ updateNav(); viewMode==='week' ? renderWeek() : renderDay(); }

async function renderDay(){
  const d=selectedDate, isToday=ymd(d)===ymd(new Date());
  $('dateLabel').innerHTML = `${d.getMonth()+1}월 ${d.getDate()}일 (${DAYS[d.getDay()]})<small>${isToday?'오늘':''}</small>`;
  if(draftMonths.has(ymOf(d))){
    $('list').innerHTML = `<div class="empty-box"><div class="e-ic"></div><div class="e-t">아직 공개되지 않은 달이에요</div><div class="e-s">스케줄이 확정되면 볼 수 있어요</div></div>`;
    animList(); return;
  }
  $('list').innerHTML = `<div style="text-align:center;padding:30px"><span class="spin"></span></div>`;
  const shifts = await fetchRange(ymd(d), ymd(d)); if(shifts===null) return;
  const closed = await fetchClosures(ymd(d), ymd(d));
  const night = await fetchNight(ymd(d), ymd(d));
  const nmem = await fetchNightMembers(ymd(d));
  const groups = (wpFilter==='전체'?WORKPLACES:[wpFilter]);
  let html='', total=0;
  groups.forEach(wp=>{
    const isClosed = closed.has(ymd(d)+'|'+wp);
    const nightHrs = night[ymd(d)+'|'+wp];
    const rows = shifts.filter(s=>s.workplace===wp);
    const named = rows.filter(s=>s.display_name||s.staff_name); total+=named.length+(isClosed?1:0)+(nightHrs?1:0);
    named.sort((a,b)=> ((b.is_guest?1:0)-(a.is_guest?1:0)) || String(a.start_time).localeCompare(String(b.start_time)));
    const memo = rows.find(r=>r.memo)?.memo;
    html += `<div class="wp-sec"><div class="wp-h"><span class="wp-dot ${wp}"></span><span class="wp-name">${wp}</span><span class="wp-count">${isClosed?'휴무':named.length+'명'}</span></div>`;
    if(isClosed){ html += `<div class="none">휴무일</div></div>`; return; }
    if(nightHrs) html += `<div class="night-banner">${esc(nightHrs)}</div>`;
    if(memo) html += `<div class="ev-banner">${esc(memo)}</div>`;
    const tagHtml = s=>{ const dn=s.display_name||s.staff_name;
      const ig=(!s.is_guest)?igUrl(s.staff_instagram):null;
      const avi=(!s.is_guest)&&s.staff_avatar;
      const av=`<span class="av" style="${avi?avStyle(s.staff_avatar):''}">${avi?'':esc(dn.charAt(0))}</span>`;
      return `<div class="tag${s.is_guest?' guest':''}">${av}<span class="tnm">${esc(dn)}</span>${s.is_guest?'<span class="gtag">게스트</span>':''}${ig?`<a class="ig" href="${esc(ig)}" target="_blank" rel="noopener">${IG_SVG}</a>`:''}</div>`;
    };
    if(nightHrs){
      const mem = nmem[ymd(d)+'|'+wp]||[];
      const dayCol = named.length ? named.map(tagHtml).join('') : `<div class="dn-empty">없음</div>`;
      const nightCol = mem.length ? mem.map(m=>{
        const ig=(!m.is_guest)?igUrl(m.instagram):null; const avi=!m.is_guest&&m.avatar;
        return `<div class="night-row"><span class="nmav${m.is_guest?' guest':''}" style="${avi?avStyle(m.avatar):''}">${avi?'':esc((m.member_name||'·').charAt(0))}</span><span class="nmname">${esc(m.member_name)}</span>${ig?`<a class="ig sm" href="${esc(ig)}" target="_blank" rel="noopener">${IG_SVG}</a>`:''}</div>`;
      }).join('') : `<div class="dn-empty">미정</div>`;
      html += `<div class="daynight"><div class="dn-col"><div class="dn-h">주간</div><div class="names">${dayCol}</div></div><div class="dn-col night"><div class="dn-h">야간</div>${nightCol}</div></div>`;
    } else {
      if(named.length===0){ html += `<div class="none">근무 없음</div>`; }
      else html += `<div class="names">${named.map(tagHtml).join('')}</div>`;
    }
    html += `</div>`;
  });
  $('list').innerHTML = total===0
    ? `<div class="empty-box"><div class="e-ic"></div><div class="e-t">이 날은 등록된 근무가 없어요</div><div class="e-s">다른 날짜를 확인해 보세요</div></div>`
    : html;
  animList();
}

async function renderWeek(){
  const mon=mondayOf(selectedDate); const sun=new Date(mon); sun.setDate(sun.getDate()+6);
  $('dateLabel').innerHTML = `${mon.getMonth()+1}/${mon.getDate()} ~ ${sun.getMonth()+1}/${sun.getDate()}<small>주간 · 좌우로 넘겨보세요</small>`;
  $('list').innerHTML = `<div style="text-align:center;padding:30px"><span class="spin"></span></div>`;
  const shifts = await fetchRange(ymd(mon), ymd(sun)); if(shifts===null) return;
  const closed = await fetchClosures(ymd(mon), ymd(sun));
  const night = await fetchNight(ymd(mon), ymd(sun));
  const todayStr = ymd(new Date());
  const groups = (wpFilter==='전체'?WORKPLACES:[wpFilter]);
  let cols='';
  for(let i=0;i<7;i++){
    const day=new Date(mon); day.setDate(day.getDate()+i); const ds=ymd(day);
    const dayDraft = draftMonths.has(ymOf(day));
    const dayShifts = dayDraft ? [] : shifts.filter(s=>s.work_date===ds);
    const memo = dayShifts.find(r=>r.workplace===wpFilter && r.memo)?.memo;
    const isNight = dayDraft ? false : night[ds+'|'+wpFilter];
    const isToday = ds===todayStr, weekend = (day.getDay()===0||day.getDay()===6);
    let body=''; const multi=groups.length>1;
    if(!dayDraft) groups.forEach(wp=>{
      if(closed.has(ds+'|'+wp)){ body += `<div class="dcol-off">휴무</div>`; return; }
      const filled=dayShifts.filter(s=>s.workplace===wp&&(s.display_name||s.staff_name));
      if(filled.length===0) return;
      filled.sort((a,b)=> ((b.is_guest?1:0)-(a.is_guest?1:0)) || String(a.start_time).localeCompare(String(b.start_time)));
      const nm = filled.map(s=>`<div class="nm${s.is_guest?' guest':''}">${esc(s.display_name||s.staff_name)}</div>`).join('');
      body += `<div class="wpgrp">${multi?`<div class="wpgrp-h"><span class="wp-dot ${wp}"></span>${wp}</div>`:''}${nm}</div>`;
    });
    if(!body) body = dayDraft ? `<div class="dcol-off">미공개</div>` : `<div class="dcol-off">휴무</div>`;
    cols += `<div class="daycol${isToday?' today':''}" data-goday="${ds}">
      <div class="dcol-h${weekend?' weekend':''}"><div class="dow">${DAYS[day.getDay()]}</div>${day.getMonth()+1}/${day.getDate()}${isToday?' <span class="tdy">오늘</span>':''}${isNight?'<div class="night-tag">야간</div>':''}${memo?`<div class="dcol-ev">${esc(memo)}</div>`:''}</div>
      <div class="dcol-body">${body}</div></div>`;
  }
  $('list').innerHTML = `<div class="weekgrid">${cols}</div>`;
  animList();
  $('list').querySelectorAll('[data-goday]').forEach(c=>c.onclick=()=>{
    selectedDate=new Date(c.dataset.goday+'T00:00:00'); viewMode='day';
    $('viewSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v==='day'));
    render();
  });
}

boot();
</script>

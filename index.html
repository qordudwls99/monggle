<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>출근 시프트</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
:root{
  --ink:#3a2a63; --ink2:#6b5a95; --muted:#a99ec9;
  --violet:#7c3aed; --violet2:#a78bfa; --pink:#f472b6; --amber:#fbbf24;
  --maid:#f472b6; --devil:#7c3aed; --matsuri:#fb923c;
  --card:rgba(255,255,255,.95);
  --bg:radial-gradient(135% 95% at 50% -15%, #ffe1c9 0%, #fbd0e4 25%, #c9b8f3 57%, #9d8df0 100%);
}
html,body{height:100%}
body{
  font-family:'Apple SD Gothic Neo','Pretendard','Noto Sans KR',-apple-system,system-ui,'Malgun Gothic',sans-serif;
  color:var(--ink); background:var(--bg); background-attachment:fixed;
  display:flex; justify-content:center; letter-spacing:-0.2px;
}
.app{width:100%;max-width:480px;min-height:100vh;min-height:100dvh;position:relative;display:flex;flex-direction:column}
.stars{position:fixed;inset:0;opacity:.5;pointer-events:none;background-image:
  radial-gradient(2px 2px at 18% 20%,#fff9,transparent),radial-gradient(2px 2px at 72% 14%,#fff6,transparent),
  radial-gradient(1.5px 1.5px at 42% 38%,#fff7,transparent),radial-gradient(2px 2px at 86% 50%,#fff6,transparent),
  radial-gradient(1.5px 1.5px at 28% 62%,#fff5,transparent),radial-gradient(2px 2px at 62% 76%,#fff6,transparent)}

.head{position:relative;z-index:10;padding:max(22px,calc(env(safe-area-inset-top) + 14px)) 18px 8px}
.kicker{font-size:10px;font-weight:800;letter-spacing:3px;color:rgba(255,255,255,.82)}
.brand{font-size:23px;font-weight:900;color:#fff;text-shadow:0 2px 8px rgba(80,40,150,.35)}
.brand-sub{font-size:12.5px;font-weight:700;color:rgba(255,255,255,.9);margin-top:3px}

.body{position:relative;z-index:10;flex:1;padding:8px 16px 28px;overflow-y:auto}

/* view toggle */
.seg{display:flex;background:rgba(255,255,255,.45);border-radius:99px;padding:4px;margin-bottom:11px}
.seg button{flex:1;border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:13px;padding:8px 0;border-radius:99px;background:none;color:rgba(255,255,255,.92);transition:.15s}
.seg button.on{background:#fff;color:var(--violet);box-shadow:0 6px 14px -7px rgba(80,40,150,.5)}

.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;
  background:rgba(255,255,255,.62);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:18px;padding:8px 10px;box-shadow:0 8px 22px -12px rgba(80,40,150,.4)}
.datebar button{border:none;cursor:pointer;background:#fff;width:34px;height:34px;border-radius:12px;font-size:17px;font-weight:900;color:var(--violet);font-family:inherit}
.datebar .dlabel{flex:1;text-align:center;font-weight:900;font-size:15px;color:var(--ink)}
.datebar .dlabel small{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.today-btn{font-size:11px !important;width:auto !important;padding:0 11px;height:34px}

.chips{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.chip{border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:12.5px;padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.55);color:var(--ink2)}
.chip.on{color:#fff;box-shadow:0 6px 14px -6px rgba(80,40,150,.5)}
.chip.on[data-w="전체"]{background:linear-gradient(135deg,#a78bfa,#f472b6)}
.chip.on[data-w="메이드"]{background:var(--maid)}
.chip.on[data-w="데빌"]{background:var(--devil)}
.chip.on[data-w="마츠리"]{background:var(--matsuri)}

/* day view */
.wp-sec{margin-bottom:16px}
.wp-h{display:flex;align-items:center;gap:8px;margin:0 2px 9px}
.wp-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.wp-dot.메이드{background:var(--maid)}.wp-dot.데빌{background:var(--devil)}.wp-dot.마츠리{background:var(--matsuri)}
.wp-name{font-weight:900;font-size:16px;color:#fff;text-shadow:0 1px 5px rgba(80,40,150,.3)}
.wp-count{font-size:12px;font-weight:800;color:rgba(255,255,255,.85)}
.names{background:var(--card);border-radius:18px;padding:14px 15px;box-shadow:0 12px 28px -16px rgba(80,50,150,.35),0 2px 5px rgba(80,50,150,.05);display:flex;flex-wrap:wrap;gap:8px}
.tag{background:#f3effb;color:var(--ink);font-weight:800;font-size:14px;padding:7px 13px;border-radius:12px}
.tag.open{background:#f1f5f9;color:#64748b;font-weight:700}
.memo-row{font-size:12px;color:var(--ink2);margin:8px 2px 0}
.none{text-align:center;color:var(--muted);font-weight:700;font-size:13px;background:var(--card);border-radius:18px;padding:14px}

/* week view — 가로 컬럼 (스프레드시트형) */
.weekgrid{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.weekgrid::-webkit-scrollbar{height:6px}
.weekgrid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.5);border-radius:99px}
.daycol{flex:0 0 auto;width:116px;background:var(--card);border-radius:16px;padding:10px 9px;box-shadow:0 12px 28px -16px rgba(80,50,150,.35),0 2px 5px rgba(80,50,150,.05);scroll-snap-align:start;cursor:pointer}
.daycol.today{outline:2px solid var(--violet2)}
.dcol-h{text-align:center;font-weight:900;font-size:12.5px;color:var(--ink);margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid #f3effb}
.dcol-h .dow{font-size:16px;line-height:1.2}
.dcol-h.weekend .dow{color:var(--pink)}
.dcol-h .tdy{color:var(--violet);font-size:10px;font-weight:900}
.dcol-ev{margin-top:4px;font-size:9.5px;font-weight:800;color:#ea580c;background:#fff7ed;padding:2px 6px;border-radius:99px;display:inline-block}
.wpgrp{margin-bottom:9px}
.wpgrp:last-child{margin-bottom:0}
.wpgrp-h{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:900;color:var(--ink2);margin-bottom:4px}
.wpgrp .nm{font-size:12.5px;font-weight:700;color:var(--ink);padding:2px 0;text-align:center;background:#f6f3ff;border-radius:7px;margin-bottom:3px}
.wpgrp .nm.op{background:none;color:#94a3b8;font-weight:600;font-size:11px}
.dcol-off{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding:10px 0}

.empty-box{text-align:center;padding:44px 20px;color:#fff}
.empty-box .e-ic{font-size:46px}
.empty-box .e-t{font-weight:900;font-size:16px;margin-top:10px;text-shadow:0 1px 5px rgba(80,40,150,.3)}
.empty-box .e-s{font-size:13px;font-weight:600;opacity:.9;margin-top:5px}
.spin{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.setup{padding:40px 22px;color:#fff}
.setup h1{font-size:24px;font-weight:900;text-shadow:0 2px 8px rgba(80,40,150,.32)}
.setup p{font-size:14px;line-height:1.7;margin-top:12px;font-weight:600;opacity:.95}
.setup code{background:rgba(255,255,255,.22);padding:2px 7px;border-radius:6px;font-size:13px;font-weight:800}

.foot{position:relative;z-index:10;text-align:center;padding:6px 16px max(18px,env(safe-area-inset-bottom));font-size:11px;font-weight:700;color:rgba(255,255,255,.6)}
.foot a{color:rgba(255,255,255,.7);text-decoration:underline}
</style>
</head>
<body>
<div class="stars"></div>
<div class="app">

  <div id="setupScreen" class="setup" style="display:none">
    <h1>🌙 출근 시프트</h1>
    <p>아직 Supabase 연결이 안 됐어요. <code>index.html</code> 상단 <code>CONFIG</code> 값을 채워주세요. 자세한 내용은 <code>SHIFT_SETUP.md</code> 참고.</p>
  </div>

  <div id="mainApp" style="display:none;flex:1;flex-direction:column">
    <div class="head">
      <div class="kicker">TODAY</div>
      <div class="brand">출근 시프트</div>
      <div class="brand-sub">오늘 누가 출근하는지 확인하세요 ✨</div>
    </div>

    <div class="body">
      <div class="seg" id="viewSeg">
        <button data-v="day" class="on">📅 일별</button>
        <button data-v="week">🗓️ 주간(월~일)</button>
      </div>
      <div class="datebar">
        <button id="prev">‹</button>
        <div class="dlabel" id="dateLabel"></div>
        <button id="next">›</button>
        <button class="today-btn" id="todayBtn">오늘</button>
      </div>
      <div class="chips" id="wpChips"></div>
      <div id="list"></div>
    </div>

    <div class="foot">출근자이신가요? <a href="staff.html">직원용 페이지로 →</a></div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const CONFIG = {
  SUPABASE_URL:      'https://izpotztbvjazfvcntqyh.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_ToHVeUEnJVmlHCcu_-QcnQ_ofP55Q_N',
};

const WORKPLACES = ['메이드','데빌','마츠리'];
const DAYS = ['일','월','화','수','목','금','토'];
const $ = id => document.getElementById(id);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const mondayOf = d => { const x=new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); x.setHours(0,0,0,0); return x; };

let supa=null, selectedDate=new Date(), wpFilter='전체', viewMode='day';

function isConfigured(){
  return CONFIG.SUPABASE_URL && !CONFIG.SUPABASE_URL.startsWith('YOUR_') &&
         CONFIG.SUPABASE_ANON_KEY && !CONFIG.SUPABASE_ANON_KEY.startsWith('YOUR_');
}
function boot(){
  if(!isConfigured()){ $('setupScreen').style.display='block'; return; }
  supa = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  $('mainApp').style.display='flex';
  renderChips();
  $('viewSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    viewMode=b.dataset.v;
    $('viewSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    render();
  });
  $('prev').onclick = ()=>{ selectedDate.setDate(selectedDate.getDate()-(viewMode==='week'?7:1)); render(); };
  $('next').onclick = ()=>{ selectedDate.setDate(selectedDate.getDate()+(viewMode==='week'?7:1)); render(); };
  $('todayBtn').onclick = ()=>{ selectedDate=new Date(); render(); };
  render();
  setInterval(()=>{ if(document.visibilityState==='visible') render(); }, 30000);
}

function renderChips(){
  const c = $('wpChips');
  c.innerHTML = ['전체',...WORKPLACES].map(w=>`<button class="chip${w===wpFilter?' on':''}" data-w="${w}">${w}</button>`).join('');
  c.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ wpFilter=b.dataset.w; renderChips(); render(); });
}
async function fetchRange(from,to){
  const { data, error } = await supa.from('shift_view').select('*')
    .gte('work_date', from).lte('work_date', to).order('work_date').order('workplace').order('start_time');
  if(error){ $('list').innerHTML=`<div class="empty-box"><div class="e-ic">⚠️</div><div class="e-t">불러오기 실패</div><div class="e-s">${esc(error.message)}</div></div>`; return null; }
  return data||[];
}

function render(){ viewMode==='week' ? renderWeek() : renderDay(); }

async function renderDay(){
  const d=selectedDate, isToday=ymd(d)===ymd(new Date());
  $('dateLabel').innerHTML = `${d.getMonth()+1}월 ${d.getDate()}일 (${DAYS[d.getDay()]})<small>${isToday?'오늘':''}</small>`;
  $('list').innerHTML = `<div style="text-align:center;padding:30px"><span class="spin"></span></div>`;
  const shifts = await fetchRange(ymd(d), ymd(d)); if(shifts===null) return;
  const groups = (wpFilter==='전체'?WORKPLACES:[wpFilter]);
  let html='', total=0;
  groups.forEach(wp=>{
    const rows = shifts.filter(s=>s.workplace===wp); total+=rows.length;
    const memo = rows.find(r=>r.memo)?.memo;
    html += `<div class="wp-sec"><div class="wp-h"><span class="wp-dot ${wp}"></span><span class="wp-name">${wp}</span><span class="wp-count">${rows.length}명</span></div>`;
    if(rows.length===0){ html += `<div class="none">오늘 근무 없음</div>`; }
    else {
      const tags = rows.map(s=> s.staff_name
        ? `<span class="tag">${esc(s.staff_name)}</span>`
        : `<span class="tag open">모집중</span>`).join('');
      html += `<div class="names">${tags}</div>`;
      if(memo) html += `<div class="memo-row">📝 ${esc(memo)}</div>`;
    }
    html += `</div>`;
  });
  $('list').innerHTML = total===0
    ? `<div class="empty-box"><div class="e-ic">🗓️</div><div class="e-t">이 날은 등록된 근무가 없어요</div><div class="e-s">다른 날짜를 확인해 보세요</div></div>`
    : html;
}

async function renderWeek(){
  const mon=mondayOf(selectedDate); const sun=new Date(mon); sun.setDate(sun.getDate()+6);
  $('dateLabel').innerHTML = `${mon.getMonth()+1}/${mon.getDate()} ~ ${sun.getMonth()+1}/${sun.getDate()}<small>주간 · 좌우로 넘겨보세요</small>`;
  $('list').innerHTML = `<div style="text-align:center;padding:30px"><span class="spin"></span></div>`;
  const shifts = await fetchRange(ymd(mon), ymd(sun)); if(shifts===null) return;
  const todayStr = ymd(new Date());
  const groups = (wpFilter==='전체'?WORKPLACES:[wpFilter]);
  let cols='';
  for(let i=0;i<7;i++){
    const day=new Date(mon); day.setDate(day.getDate()+i); const ds=ymd(day);
    const dayShifts = shifts.filter(s=>s.work_date===ds);
    const memo = dayShifts.find(r=>r.memo)?.memo;
    const isToday = ds===todayStr, weekend = (day.getDay()===0||day.getDay()===6);
    let body='';
    if(dayShifts.length===0){ body = `<div class="dcol-off">휴무</div>`; }
    else groups.forEach(wp=>{
      const rows=dayShifts.filter(s=>s.workplace===wp); if(rows.length===0) return;
      const names=rows.filter(s=>s.staff_name).map(s=>esc(s.staff_name));
      const open=rows.length-names.length;
      const nm = names.map(n=>`<div class="nm">${n}</div>`).join('') + (open>0?`<div class="nm op">모집중 ${open}</div>`:'');
      body += `<div class="wpgrp"><div class="wpgrp-h"><span class="wp-dot ${wp}"></span>${wp}</div>${nm||'<div class="nm op">모집중</div>'}</div>`;
    });
    cols += `<div class="daycol${isToday?' today':''}" data-goday="${ds}">
      <div class="dcol-h${weekend?' weekend':''}"><div class="dow">${DAYS[day.getDay()]}</div>${day.getMonth()+1}/${day.getDate()}${isToday?' <span class="tdy">오늘</span>':''}${memo?`<div class="dcol-ev">${esc(memo)}</div>`:''}</div>
      ${body}</div>`;
  }
  $('list').innerHTML = `<div class="weekgrid">${cols}</div>`;
  $('list').querySelectorAll('[data-goday]').forEach(c=>c.onclick=()=>{
    selectedDate=new Date(c.dataset.goday+'T00:00:00'); viewMode='day';
    $('viewSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v==='day'));
    render();
  });
}

boot();
</script>
</body>
</html>

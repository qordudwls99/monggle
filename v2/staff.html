        if (container.scrollTop > 0 || dy < 0) { mode = -1; return; }
        if (dy < DEAD) return;
        mode = 1;
      }
      if (container.scrollTop > 0) { mode = -1; container.style.transform = ''; show(0); return; }
      applied = Math.max(0, Math.min((dy - DEAD) * 0.5, MAX));
      container.style.transform = `translateY(${applied}px)`;
      show(applied);
      if (txt) txt.textContent = applied >= THRESH ? '놓으면 새로고침' : '당겨서 새로고침';
      if (e.cancelable) e.preventDefault();
    }, { passive: false });
    const finish = async () => {
      if (mode !== 1) { mode = 0; return; }
      const goNow = applied >= THRESH; mode = 0;
      container.style.transition = 'transform .22s';
      if (goNow) {
        refreshing = true;
        container.style.transform = 'translateY(44px)';
        show(THRESH);
        if (spin) spin.hidden = false;
        if (txt) txt.textContent = '새로고침 중…';
        try { await onRefresh(); } catch (e) { console.error(e); }
        refreshing = false;
        if (spin) spin.hidden = true;
        if (txt) txt.textContent = '당겨서 새로고침';
      }
      container.style.transform = '';
      show(0);
      setTimeout(() => { container.style.transition = ''; }, 240);
      applied = 0;
    };
    container.addEventListener('touchend', finish);
    container.addEventListener('touchcancel', finish);
  }

  // ── 시작: 모든 파일이 등록을 마친 뒤 (한 모듈 안이라 microtask 가 맨 끝에 돌아요) ──
  async function boot() {
    try { if (A.auth) await A.auth.boot(); } catch (e) { console.error(e); }
    const t = tabFromHash(); if (t) state.tab = t;
    window.addEventListener('hashchange', () => { const k = tabFromHash(); if (k && k !== state.tab) go(k); });
    setupPTR(document.getElementById('screen'), async () => { A.store.invalidateAll(); await render({ keep: true }); });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
    await render();
    if (A.auth) A.auth.afterBoot();
    if (!A.session && A.auth) A.auth.openLogin();
  }

  Object.assign(A, {
    $, esc, pad, ymd, parse, DAYS, fmt, fmtShort, ymOf, firstSyl, today, sundayOf, ymShift, igUrl,
    FLOORS, THEMES, floorOf, themeKey, logo, storeName, josa, ICON, emptyBox, avatar, storeTag, pageHead, isAdmin,
    cho, nameHit, staffPick, bindStaffPick,
    sheet, confirm: confirmBox, prompt: promptBox, toast,
    state, TABS, go, goDay, render, renderShell, screens, views,
    screen: (k, def) => { screens[ALIAS[k] || k] = def; },
    view: (k, def) => { views[k] = def; },
  });
  queueMicrotask(boot);
}

// ── js/04-auth.js ──
// 로그인·세션 (운영 staff.html 905-1120 과 같은 저장 모양): shift_session, 예전 PIN 세션 바꾸기,
// 로그인 시트, 임시 PIN, 로그아웃, 죽은 토큰 처리, 푸시 알림 띠(push_ask_dismiss), 설치 띠(install_dismiss)
{
  const A = window.App;
  const KEY = 'shift_session';   // {id, name, is_admin, avatar, pin, pin_temp} · pin 칸에는 PIN 대신 세션 토큰(tk_…)
  const load = () => { try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); return s && s.id != null ? s : null; } catch (e) { return null; } };
  let session = load();
  Object.defineProperty(A, 'session', { configurable: true, enumerable: true, get: () => session });
  const save = () => { if (session) localStorage.setItem(KEY, JSON.stringify(session)); else localStorage.removeItem(KEY); };

  // 예전 로그인(PIN 을 저장해 둔 기기)은 다시 로그인할 필요 없이 세션 토큰으로 조용히 교체 (운영 969-978)
  async function upgradeSession() {
    if (!session || String(session.pin || '').startsWith('tk_')) return;
    try {
      const { data, error } = await A.supa.rpc('staff_signin', { p_name: session.name, p_pin: session.pin });
      if (error) return;                                   // 네트워크 오류 등 → 다음 실행 때 다시
      const me = data && data[0];
      if (me && me.token) { session.pin = me.token; save(); }
      else { session = null; save(); }                     // PIN 이 바뀌었거나 잠김 → 로그아웃 상태
    } catch (e) { /* 다음에 다시 */ }
  }

  // 세션 일부 바꾸기 (사진·관리자 여부·임시 PIN 표시)
  function update(patch = {}) {
    if (!session) return;
    const adminChanged = 'is_admin' in patch && !!patch.is_admin !== !!session.is_admin;
    for (const k of ['name', 'is_admin', 'avatar', 'pin_temp']) if (k in patch) session[k] = patch[k];
    save();
    if (adminChanged) { A.store.invalidateAll(); A.render({ keep: true }); } else A.renderShell();
  }

  // ── 로그인 시트 ──
  let loginSheet = null;
  const waiters = [];
  const settle = v => { while (waiters.length) waiters.shift()(v); };
  function openLogin() {
    if (loginSheet) return loginSheet;
    let busy = false;
    const html = `<div class="login-f">
      <label class="fld-l">이름<input class="fld" data-l="name" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="30"></label>
      <label class="fld-l">PIN<input class="fld" data-l="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="current-password" placeholder="숫자 6자리"></label>
      <p class="sheet-err" hidden></p></div>`;
    const submit = async (close, el) => {
      if (busy) return;
      const nameEl = el.querySelector('[data-l="name"]'), pinEl = el.querySelector('[data-l="pin"]'), err = el.querySelector('.sheet-err');
      const btn = el.querySelector('.sheet-a .primary');
      const name = nameEl.value.trim(), pin = pinEl.value.trim();
      const show = m => { err.hidden = false; err.textContent = m; };
      if (!name) { show('이름을 적어 주세요'); nameEl.focus(); return; }
      if (!pin) { show('PIN을 입력하세요'); pinEl.focus(); return; }
      busy = true; btn.setAttribute('aria-busy', 'true'); err.hidden = true;
      let res;
      try { res = await A.supa.rpc('staff_signin', { p_name: name, p_pin: pin }); } catch (e) { res = { error: e }; }
      busy = false; btn.removeAttribute('aria-busy');
      const { data, error } = res;
      if (error) { show(A.api.errText(error, '로그인 실패')); return; }
      if (!data || data.length === 0) { show('이름 또는 PIN이 올바르지 않아요'); pinEl.value = ''; pinEl.focus(); return; }
      const me = data[0];
      if (me.err) { show(me.err); pinEl.value = ''; pinEl.focus(); return; }   // 틀린 PIN 남은 횟수 · 잠김 문구 그대로
      session = { id: me.id, name: me.name, is_admin: me.is_admin, avatar: me.avatar_url || null, pin: me.token, pin_temp: !!me.pin_temp };
      save();
      pinEl.value = '';
      close();
      afterLogin(me);
    };
    loginSheet = A.sheet({
      title: '로그인', html,
      actions: [{ label: '취소' }, { label: '로그인', kind: 'primary', onClick: submit }],
      onClose: () => { loginSheet = null; if (!session) settle(false); },
      onOpen: (el, close) => {
        const nameEl = el.querySelector('[data-l="name"]'), pinEl = el.querySelector('[data-l="pin"]');
        nameEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); pinEl.focus(); } });
        pinEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(close, el); } });
        nameEl.focus();
      },
    });
    return loginSheet;
  }
  function afterLogin(me) {
    A.toast(`${me.name}님 환영해요!`);
    A.store.invalidateAll();
    A.render({ keep: true });
    settle(true);
    if (me.pin_temp) {
      // 내 정보 화면(23-account.js)이 App.onTempPin 을 정해 두면 그 PIN 바꾸기를 열어요.
      if (typeof A.onTempPin === 'function') {
        A.toast('임시 PIN으로 로그인했어요. 새 PIN으로 바꿔 주세요');
        setTimeout(() => { try { A.onTempPin(); } catch (e) { console.error(e); } }, 700);
      } else {
        setTimeout(() => A.toast('임시 PIN으로 로그인했어요. 내 정보에서 PIN을 바꿔 주세요'), 700);
      }
    } else {
      setTimeout(maybeAskPush, 800);
    }
  }
  // 로그인이 필요한 동작 앞에서: 이미 로그인했으면 true, 아니면 시트를 열고 로그인하면 true / 닫으면 false
  function requireLogin() {
    if (session) return Promise.resolve(true);
    return new Promise(res => { waiters.push(res); openLogin(); });
  }
  // 토큰이 죽었을 때 (다른 기기에서 PIN 변경, 관리자가 PIN 재설정 등)
  function expire() {
    if (!session) return;
    session = null; save();
    A.store.invalidateAll();
    A.toast('로그인이 풀렸어요. 다시 로그인해 주세요', true);
    A.render({ keep: true });
    openLogin();
  }
  function logout() {
    if (session) { const s = session; Promise.resolve(A.supa.rpc('staff_signout', { p_staff_id: s.id, p_pin: s.pin })).then(() => {}, () => {}); }
    session = null; save();
    A.store.invalidateAll();
    A.go('schedule');
    A.toast('로그아웃 했어요');
  }

  // ── 푸시 알림 (운영 980-1009) ──
  const isStandalone = () => matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
  const bar = id => document.getElementById(id);
  function urlB64ToUint8(base64) {
    const padStr = '='.repeat((4 - base64.length % 4) % 4);
    const b = (base64 + padStr).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(b); const arr = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }
  // 켜기만 있어요 (끄기 RPC 는 막혀 있음). 성공하면 true
  async function enablePush() {
    if (!session) { openLogin(); return false; }
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) { A.toast('이 기기는 푸시 알림을 지원하지 않아요', true); return false; }
    try {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { A.toast('알림 권한이 꺼져 있어요. 브라우저 설정에서 허용해 주세요', true); return false; }
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8(A.VAPID_PUBLIC) });
      const j = sub.toJSON();
      const ok = await A.api.rpc('save_push_subscription', { p_staff_id: session.id, p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth }, { ok: '알림을 켰어요' });
      if (ok === false) return false;
      bar('pushBar').hidden = true;
      return true;
    } catch (e) { A.toast('알림 켜기 실패: ' + ((e && e.message) || e), true); return false; }
  }
  // 이 기기에서 알림이 켜져 있는지 (내 정보 버튼 표시용)
  async function pushOn() {
    try {
      if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return false;
      const reg = await navigator.serviceWorker.getRegistration();
      const sub = reg && await reg.pushManager.getSubscription();
      return !!sub && Notification.permission === 'granted';
    } catch (e) { return false; }
  }
  function maybeAskPush() {
    if (!session) return;
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return;
    if (Notification.permission !== 'default') return;            // 이미 허용/거부면 안 물어봄
    if (localStorage.getItem('push_ask_dismiss')) return;        // 이전에 닫았으면 안 물어봄
    if (isIOS() && !isStandalone()) return;                      // 아이폰은 앱 설치 후에만 가능
    bar('pushBar').hidden = false;
  }

  // ── 앱 설치 띠 (운영 2638-2652) ──
  let deferredPrompt = null;
  function showInstallBar() { if (isStandalone() || localStorage.getItem('install_dismiss')) return; bar('installBar').hidden = false; }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; showInstallBar(); });
  function wireBars() {
    bar('installX').innerHTML = A.ICON.x;
    bar('pushAskX').innerHTML = A.ICON.x;
    bar('installX').onclick = () => { bar('installBar').hidden = true; localStorage.setItem('install_dismiss', '1'); };
    bar('installBtn').onclick = async () => {
      if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; bar('installBar').hidden = true; }
      else if (isIOS()) A.sheet({ title: '아이폰에 설치하기', html: '<p class="sheet-p">1. 사파리 아래 가운데 공유 버튼을 눌러요.<br>2. "홈 화면에 추가"를 골라요.<br>3. 추가를 누르면 홈 화면에 앱이 생겨요.</p>', actions: [{ label: '알겠어요', kind: 'primary' }] });
      else A.sheet({ title: '앱으로 설치하기', html: '<p class="sheet-p">브라우저 메뉴에서 "앱 설치" 또는 "홈 화면에 추가"를 눌러 주세요.</p>', actions: [{ label: '알겠어요', kind: 'primary' }] });
    };
    bar('pushAskBtn').onclick = enablePush;
    bar('pushAskX').onclick = () => { bar('pushBar').hidden = true; localStorage.setItem('push_ask_dismiss', '1'); };
  }

  // core 의 boot 가 불러요: 첫 그리기 전 / 뒤
  async function boot() { wireBars(); await upgradeSession(); }
  function afterBoot() {
    if (session) setTimeout(maybeAskPush, 1200);
    if (isIOS() && !isStandalone() && !localStorage.getItem('install_dismiss')) showInstallBar();
  }

  A.auth = {
    openLogin, require: requireLogin, logout, expire, update, upgradeSession,
    enablePush, pushOn, maybeAskPush, isIOS, isStandalone, boot, afterBoot,
  };
}

// ── js/10-day.js ──
// 스케줄 화면 틀(보기 전환·편집·매장 칩·날짜 줄·달력 시트) + 일별 보기 + 관리자 편집 도구
// 주간·월간·야간은 11-views.js 가 App.view() 로 등록해요. 끌어 옮기기는 13-drag.js (App.drag.bind).
// 운영 staff.html: 렌더 2052-2147, 근무 카드 2170-2220, 근무 시트 2223-2310, 달력 1732-1753
{
  const A = window.App;
  const S = A.state, I = A.ICON, esc = A.esc;
  const VIEWS = [['day', '일별'], ['week', '주간'], ['month', '월간'], ['night', '야간']];
  const NIGHT_DEFAULT = '주간 16:00~23:00 · 야간 23:00~익일 05:00';
  const me = () => A.session;
  const isMine = p => !!(me() && p.staffId != null && p.staffId === me().id);
  const where = (ds, wp) => `${A.fmt(ds)} ${A.storeName(wp)}`;
  const v2db = () => !!(A.features && A.features.v2db);
  const rpc = (fn, args, opt) => A.api.rpc(fn, args, opt);
  const adminId = () => (me() ? me().id : null);
  // 쓰기 성공 뒤: 캐시 비우기 → 다시 그리기 → 알림
  async function done(ds, msg, all = false) {
    if (all) A.store.invalidateAll(); else A.store.invalidate(ds, ds);
    await A.render({ keep: true });
    if (msg) A.toast(msg);
  }

  // ── 모든 보기가 같이 쓰는 도우미 (공개 전 달) ──
  A.draftBar = ds => `<div class="draft-bar">${I.lock}<span><b>${+String(ds).slice(5, 7)}월은 작성 중</b> · 직원·손님에겐 안 보여요</span><button class="btn sm primary" data-publish="${A.ymOf(ds)}">공개하기</button></div>`;
  A.lockedMonth = () => A.emptyBox('lock', '아직 공개되지 않은 달이에요', '스케줄이 확정되면 볼 수 있어요');
  A.bindDraft = root => root.querySelectorAll('[data-publish]').forEach(b => b.onclick = async () => {
    const ym = b.dataset.publish, m = +ym.slice(5);
    if (!await A.confirm({ title: `${m}월 스케줄을 공개할까요?`, text: '공개하면 직원과 손님이 이 달 스케줄을 볼 수 있어요.', ok: '공개하기' })) return;
    const r = await rpc('admin_set_published', { p_admin_id: adminId(), p_ym: ym, p_pub: true });
    if (r === false) return;
    if (v2db()) A.api.notify({ event: 'published', ym });   // 직원들에게 (v2 DB 가 있을 때만)
    await done(`${ym}-01`, `${m}월 스케줄을 공개했어요`, true);
  });

  // ── 스케줄 화면 ──
  function chipsHtml() {
    const chip = (wp, inner, cls = '') => { const t = A.THEMES[wp];
      return `<button class="chip${cls}${S.wp === wp ? ' on' : ''}" data-chip="${wp}" aria-pressed="${S.wp === wp}" style="--c:${t.c};--cs:${t.cs};--ci:${t.ci}">${inner}</button>`; };
    return `<div class="chips" role="group" aria-label="매장">${chip('전체', '<b>전체</b>', ' all')}${A.FLOORS.map(([wp, fl]) =>
      chip(wp, `<img src="${A.logo(wp)}" alt=""><span class="ct"><b>${wp}</b><small>${fl}</small></span>`)).join('')}</div>`;
  }

  A.screen('schedule', { async render(el) {
    const admin = A.isAdmin();
    if (!admin || S.view !== 'day') S.edit = false;
    const v = A.views[S.view];
    const nav = v || A.views.day;                         // 아직 등록 안 된 보기: 날짜 줄은 일별 규칙으로
    el.dataset.theme = A.themeKey(S.wp);
    const editBtn = admin && S.view === 'day'
      ? `<button class="btn sm edit-tg${S.edit ? ' on' : ''}" data-edit-tg aria-pressed="${S.edit}">${S.edit ? '완료' : '편집'}</button>` : '';
    el.innerHTML = `<div class="sched-h"><div class="seg" role="tablist" aria-label="보기">${VIEWS.map(([k, l]) => `<button data-v="${k}" role="tab" aria-selected="${S.view === k}" class="${S.view === k ? 'on' : ''}">${l}</button>`).join('')}</div>${editBtn}</div>
      ${v && v.chips === false ? '' : chipsHtml()}
      <div class="datebar"><button class="nav" data-step="-1" aria-label="이전">${I.prev}</button><button class="dlabel" data-cal></button><button class="nav" data-step="1" aria-label="다음">${I.next}</button></div>
      <div class="subline"><span class="today-tag" data-today-tag hidden></span><button class="today-btn" data-today hidden></button></div>
      <div id="list"></div>`;
    const q = s => el.querySelector(s);
    const title = nav.title(S.date), now = nav.isNow(S.date), [tagT, btnT] = nav.now || ['오늘', '오늘로'];
    q('[data-cal]').textContent = title;
    q('[data-cal]').setAttribute('aria-label', `${title} · 눌러서 날짜 고르기`);
    q('[data-today-tag]').textContent = tagT; q('[data-today-tag]').hidden = !now;
    q('[data-today]').textContent = btnT; q('[data-today]').hidden = now;
    el.querySelectorAll('.sched-h [data-v]').forEach(b => b.onclick = () => { if (S.view === b.dataset.v) return; S.view = b.dataset.v; S.dir = 0; A.render(); });
    el.querySelectorAll('.chips [data-chip]').forEach(b => b.onclick = () => { if (S.wp === b.dataset.chip) return; S.wp = b.dataset.chip; S.dir = 0; A.render(); });
    el.querySelectorAll('.datebar [data-step]').forEach(b => b.onclick = () => { const dir = +b.dataset.step; S.date = nav.step(S.date, dir); S.dir = dir; A.render(); });
    q('[data-today]').onclick = () => { const t = A.today(); S.dir = A.ymd(S.date) < t ? 1 : -1; S.date = A.parse(t); A.render(); };
    q('[data-cal]').onclick = () => openCalendar();
    const tg = q('[data-edit-tg]');
    if (tg) tg.onclick = async () => { S.edit = !S.edit; await A.render({ keep: true }); A.toast(S.edit ? '편집 중이에요. 바꾼 내용은 바로 저장돼요' : '편집을 마쳤어요'); };
    const list = q('#list');
    if (!v) list.innerHTML = A.emptyBox('cal', '준비 중인 보기예요', '다른 보기를 골라 주세요');
    else await v.render(list, { ds: A.ymd(S.date), wp: S.wp, admin, edit: admin && S.edit });
    if (!S.quiet) list.classList.add(S.dir > 0 ? 'anim-r' : S.dir < 0 ? 'anim-l' : 'anim-f');
    A.bindDraft(list);
  } });

  // ── 달력 시트 (운영 openCalendar/renderCal) ──
  function openCalendar() {
    const sel = A.ymd(S.date);
    let y = S.date.getFullYear(), m = S.date.getMonth();
    const grid = () => {
      const t = A.today(), first = new Date(y, m, 1).getDay(), n = new Date(y, m + 1, 0).getDate();
      let h = '';
      for (let i = 0; i < first; i++) h += '<span class="calp-c blank" aria-hidden="true"></span>';
      for (let d = 1; d <= n; d++) {
        const ds = A.ymd(new Date(y, m, d)), dow = new Date(y, m, d).getDay();
        h += `<button class="calp-c${dow === 0 ? ' sun' : dow === 6 ? ' sat' : ''}${ds === t ? ' today' : ''}${ds === sel ? ' sel' : ''}" data-d="${ds}" aria-label="${A.fmt(ds)}"${ds === sel ? ' aria-current="date"' : ''}>${d}</button>`;
      }
      return h;
    };
    const html = `<div class="calp"><div class="calp-h"><button class="nav" data-cm="-1" aria-label="이전 달">${I.prev}</button><b data-ct></b><button class="nav" data-cm="1" aria-label="다음 달">${I.next}</button></div>
      <div class="calp-dow">${A.DAYS.map((x, i) => `<span class="${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${x}</span>`).join('')}</div><div class="calp-g" data-cg></div></div>`;
    A.sheet({ title: '날짜 고르기', html, onOpen: (wrap, close) => {
      const paint = () => {
        wrap.querySelector('[data-ct]').textContent = `${y}년 ${m + 1}월`;
        const g = wrap.querySelector('[data-cg]');
        g.innerHTML = grid();
        g.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { close(); S.date = A.parse(b.dataset.d); S.dir = 0; A.render(); });
      };
      wrap.querySelectorAll('[data-cm]').forEach(b => b.onclick = () => { const d = new Date(y, m + +b.dataset.cm, 1); y = d.getFullYear(); m = d.getMonth(); paint(); });
      paint();
    } });
  }

  // ── 일별 보기 ──
  const igBtn = p => { const u = !p.guest ? A.igUrl(p.insta) : null;
    return u ? `<a class="ig" href="${esc(u)}" target="_blank" rel="noopener" aria-label="${esc(p.name)} 인스타그램"><span>${I.ig}</span></a>` : ''; };
  const itemAttrs = (p, night) => night
    ? ` data-night-id="${p.id}" data-date="${esc(p.date)}" data-wp="${esc(p.wp)}" data-name="${esc(p.name)}"`
    : ` data-shift-id="${p.id}" data-date="${esc(p.date)}" data-wp="${esc(p.wp)}" data-name="${esc(p.empty ? '빈 자리' : p.name)}"`;
  const moreBtn = (p, night, label) => `<button class="more" data-more="${night ? 'n' : 's'}:${p.id}" aria-label="${esc(label)} 근무 바꾸기">${I.more}</button>`;

  function memberRow(p, ctx, night, sm) {
    if (night && p.short) {
      return `<div class="row short${sm ? ' sm' : ''}"${itemAttrs(p, true)}><span class="av empty">${I.plus}</span><span class="nm">부족</span>${ctx.edit ? moreBtn(p, true, '부족') : ''}</div>`;
    }
    const mine = isMine(p);
    const seek = !night && p.status === 'seeking_sub' ? '<span class="seek">대타 구하는 중</span>' : '';
    let tail, hasSub = false;
    if (ctx.edit) tail = moreBtn(p, night, p.name);
    else {
      const sub = !night && mine && !ctx.admin && p.status === 'confirmed'
        ? `<button class="btn sm sub-btn" data-sub="${p.id}" aria-label="${esc(where(p.date, p.wp))} 대타 구하기">${sm ? '대타' : '대타 구하기'}</button>` : '';
      hasSub = !!sub;
      tail = sub && sm ? sub : sub + igBtn(p);   // 좁은 칸: 내 줄은 대타 버튼만
    }
    return `<div class="row${sm ? ' sm' : ''}${mine ? ' me' : ''}"${itemAttrs(p, night)}>${A.avatar({ name: p.name, avatar: p.guest ? null : p.avatar })}<span class="nm">${esc(p.name)}</span>${p.guest ? '<span class="gbadge">게스트</span>' : ''}${mine && !(sm && hasSub) ? '<span class="mybadge">나</span>' : ''}${seek}${tail}</div>`;
  }
  function slotRow(s, ctx) {
    let side = '', sub = '';
    const apps = s.applicants || [];
    if (ctx.admin) {
      if (apps.length === 1) { sub = `${esc(apps[0].name)}님이 신청했어요`;
        side = `<div class="slot-a"><button class="btn sm ghost" data-app-no="${apps[0].appId}" data-slot="${s.id}">거절</button><button class="btn sm" data-app-ok="${apps[0].appId}" data-slot="${s.id}">수락</button></div>`; }
      else if (apps.length > 1) { sub = `${apps.length}명이 신청했어요`; side = `<button class="btn sm" data-slot-pick="${s.id}">고르기</button>`; }
      else sub = '아직 신청한 사람이 없어요';
      if (ctx.edit) side += moreBtn(s, false, '빈 자리');
    } else {
      const mine = !!me() && apps.some(a => a.staffId === me().id);
      sub = mine ? (v2db() ? '신청했어요 · 관리자가 확인하면 알려 드려요' : '신청했어요 · 관리자 확인을 기다려요') : '이 자리에 들어갈 수 있어요';
      side = mine ? `<button class="btn sm ghost" data-slot-cancel="${s.id}">신청 취소</button>` : `<button class="btn sm" data-slot-apply="${s.id}">신청하기</button>`;
    }
    return `<div class="row slot"${itemAttrs(s, false)}><span class="av empty">${I.plus}</span><span class="nm">빈 자리<span class="ap">${sub}</span></span>${side}</div>`;
  }
  function floorTools(info) {
    const b = (k, l) => `<button class="btn sm" data-tool="${k}" data-twp="${info.wp}">${l}</button>`;
    if (info.closed) return `<div class="ftools">${b('closed', '휴무 풀기')}</div>`;
    const add = info.night ? b('add', '+ 주간에 넣기') + b('nadd', '+ 야간에 넣기') : b('add', '+ 사람 넣기');
    return `<div class="ftools">${add}${b('event', info.event ? '이벤트 바꾸기' : '이벤트')}${info.wp === '데빌' ? b('night', info.night ? '야간 시간' : '야간 열기') : ''}${b('closed', '휴무로')}</div>`;
  }
  // 영업시간 글은 그대로 보여 줘요. '주간 … · 야간 …' 모양이면 칸 머리에 나눠 싣고, 아니면 한 줄로 (손님 페이지와 같음)
  function dnHtml(info, ctx) {
    const hrs = info.night.hours;
    const pick = k => ((String(hrs).match(new RegExp(k + '\\s*([^·]+)')) || [])[1] || '').trim();
    const dh = pick('주간'), nh = pick('야간');
    const sm = !ctx.edit;                                  // 편집 중에는 이름이 잘리지 않게 위아래로 쌓음
    const people = info.night.members.filter(p => !p.short);
    const col = (cls, head, h, count, html, empty) => `<div class="dn-col${cls}"><div class="dn-h">${head}<span>${count}명</span>${h ? `<small>${esc(h)}</small>` : ''}</div>${html || `<div class="none">${empty}</div>`}</div>`;
    const dayHtml = info.shifts.map(p => memberRow(p, ctx, false, sm)).join('') + info.slots.map(s => slotRow(s, ctx)).join('');
    const nightHtml = info.night.members.map(p => memberRow(p, ctx, true, sm)).join('');
    return `${(!dh && !nh) ? `<div class="hrs-line">${esc(hrs)}</div>` : ''}<div class="dn${sm ? '' : ' stack'}">${col('', '<b>주간</b>', dh, info.shifts.length, dayHtml, '없음')}${col(' night', `${I.moon}<b>야간</b>`, nh, people.length, nightHtml, '미정')}</div>`;
  }

  // ── 편집 중 희망자 (출근표 짜기를 스케줄에 합침, 2026-10-28) ──
  // 이 매장을 고른 사람(이 매장에 아직 없을 때) + 상관없음(그날 아무 데도 없을 때). 운영 희망자 넣기와 같은 기준
  const ansCache = {};
  async function hopeData(ds) {
    const ym = A.ymOf(ds), c = ansCache[ym];
    if (!c || Date.now() - c.at > 60000) ansCache[ym] = { at: Date.now(), list: await A.store.answers(ym) };
    const placed = {};
    A.FLOORS.forEach(([w]) => A.store.day(ds, w).shifts.forEach(x => { if (x.staffId != null) (placed[x.staffId] = placed[x.staffId] || new Set()).add(w); }));
    const day = ansCache[ym].list.filter(a => a.qkey === 'd:' + ds), byName = (a, b) => String(a.staffName).localeCompare(String(b.staffName), 'ko');
    // 다른 매장에 이미 있으면 칩에 그 매장을 작게 적어서 겹치는 걸 알 수 있게
    const elsewhere = (a, w) => [...(placed[a.staffId] || [])].filter(x => x !== w).map(A.storeName).join('·');
    return w => ({
      p: day.filter(a => a.choice === w && !(placed[a.staffId] && placed[a.staffId].has(w))).map(a => ({ ...a, also: elsewhere(a, w) })).sort(byName),
      any: day.filter(a => a.choice === '상관없음' && !placed[a.staffId]).sort(byName),
      total: day.filter(a => a.choice === w || a.choice === '상관없음').length,
    });
  }
  function hopeHtml(h, w) {
    const chip = (a, any) => `<button class="hchip${any ? ' any' : ''}" data-hope="${esc(a.staffId)}" data-hwp="${esc(w)}" data-hn="${esc(a.staffName)}" aria-label="${esc(a.staffName)}님을 ${esc(w)}에 넣기${a.also ? ` (지금 ${esc(a.also)}에 있어요)` : ''}">${esc(a.staffName)}${a.also ? `<small>${esc(a.also)}</small>` : ''}${I.plus}</button>`;
    const has = h.p.length || h.any.length;
    const body = has ? `<div class="hchips">${h.p.map(a => chip(a, false)).join('')}${h.any.map(a => chip(a, true)).join('')}</div>`
      : `<p class="hope-none">${h.total ? '희망한 사람은 모두 넣었어요' : '이 날 고른 사람이 없어요'}</p>`;
    return `<div class="hope"><div class="hope-h"><b>희망</b>${has ? `<span>눌러서 넣어요${h.any.length ? ' · 흐린 이름은 상관없음' : ''}${h.p.some(a => a.also) ? ' · 빨간 글씨는 이미 들어간 매장' : ''}</span>` : ''}</div>${body}</div>`;
  }
  let hoping = false;
  async function addHope(ds, b) {
    if (hoping) return;
    hoping = true; b.disabled = true; b.setAttribute('aria-busy', 'true');
    try {
      const wp = b.dataset.hwp, name = b.dataset.hn;
      const r = await rpc('admin_assign_from_submission', { p_admin_id: adminId(), p_date: ds, p_workplace: wp, p_staff_ids: [Number(b.dataset.hope)] });
      if (r === false) { b.disabled = false; b.removeAttribute('aria-busy'); return; }
      await done(ds, r === 0 ? `${name}님은 이미 ${A.storeName(wp)}에 있어요` : `${name}님을 ${A.storeName(wp)}에 넣었어요`);
    } finally { hoping = false; }
  }

  async function renderDayList(list, { ds, wp, admin, edit }) {
    const ok = await A.store.ensure(ds, ds);
    if (A.store.isDraft(ds) && !admin) { list.innerHTML = A.lockedMonth(); return; }
    if (!ok) { list.innerHTML = A.emptyBox('cal', '불러오지 못했어요', '당겨서 새로고침해 주세요'); return; }
    const all = wp === '전체';
    edit = !!(admin && edit);
    const ctx = { admin, edit };
    const hopes = edit ? await hopeData(ds) : null;
    let html = admin && A.store.isDraft(ds) ? A.draftBar(ds) : '', shown = 0, closedAll = true;
    (all ? A.FLOORS.map(f => f[0]) : [wp]).forEach(w => {
      const info = A.store.day(ds, w);
      if (!info.closed) closedAll = false;
      const empty = !info.shifts.length && !info.night && !info.slots.length;
      if (all && !edit && (info.closed || empty)) return;
      shown++;
      let inner = edit ? floorTools(info) : '';
      if (info.closed) inner += all || edit ? '<div class="none">휴무일이에요</div>' : A.emptyBox('closed', '휴무일이에요', `이 날은 ${w} 매장이 쉬어요`);
      else {
        if (info.event) inner += `<div class="event"><span class="ev-tag">이벤트</span><span class="ev-name">${esc(info.event)}</span></div>`;
        if (info.night) inner += dnHtml(info, ctx);
        else if (!empty) inner += info.shifts.map(p => memberRow(p, ctx, false)).join('') + info.slots.map(s => slotRow(s, ctx)).join('');
        else inner += '<div class="none">근무 없음</div>';
        if (hopes) inner += hopeHtml(hopes(w), w);
      }
      const nightPeople = info.night ? info.night.members.filter(p => !p.short) : [];
      const guests = info.shifts.filter(p => p.guest).length + nightPeople.filter(p => p.guest).length;
      const cnt = info.closed ? '휴무' : info.night ? `주간 ${info.shifts.length} · 야간 ${nightPeople.length}` : `${info.shifts.length}명`;
      html += `<section class="floor" data-theme="${A.themeKey(w)}" data-drop-wp="${w}" data-date="${ds}"><div class="floor-h"><span class="store"><img src="${A.logo(w)}" alt=""><span class="fl">${A.floorOf(w)}</span><b>${w}</b></span><span class="cnt">${!info.closed && guests ? `<span class="gcount">게스트 ${guests}</span>` : ''}${cnt}</span></div>${inner}</section>`;
    });
    if (!shown) html += closedAll ? A.emptyBox('closed', '휴무일이에요', '이 날은 모든 매장이 쉬어요') : A.emptyBox('cal', '이 날은 등록된 근무가 없어요', '다른 날짜를 확인해 보세요');
    list.innerHTML = html;
    bindDay(list, ds);
    A.drag?.bind?.(list);
  }
  A.view('day', {
    title: d => A.fmt(A.ymd(d)),
    isNow: d => A.ymd(d) === A.today(),
    now: ['오늘', '오늘로'],
    step: (d, dir) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + dir),
    render: renderDayList,
  });

  // ── 일별 동작 ──
  const findShift = (ds, id) => { for (const [w] of A.FLOORS) { const i = A.store.day(ds, w); const s = [...i.shifts, ...i.slots].find(x => String(x.id) === String(id)); if (s) return s; } return null; };
  const findNight = (ds, id) => { for (const [w] of A.FLOORS) { const i = A.store.day(ds, w); const m = i.night && i.night.members.find(x => String(x.id) === String(id)); if (m) return m; } return null; };

  function bindDay(list, ds) {
    list.querySelectorAll('[data-app-ok]').forEach(b => b.onclick = () => { const s = findShift(ds, b.dataset.slot); const a = s && s.applicants.find(x => String(x.appId) === b.dataset.appOk); if (a) approve(s, a); });
    list.querySelectorAll('[data-app-no]').forEach(b => b.onclick = () => { const s = findShift(ds, b.dataset.slot); const a = s && s.applicants.find(x => String(x.appId) === b.dataset.appNo); if (a) reject(s, a); });
    list.querySelectorAll('[data-slot-pick]').forEach(b => b.onclick = () => { const s = findShift(ds, b.dataset.slotPick); if (s) pickApplicant(s); });
    list.querySelectorAll('[data-slot-apply]').forEach(b => b.onclick = () => apply(ds, b.dataset.slotApply));
    list.querySelectorAll('[data-slot-cancel]').forEach(b => b.onclick = () => cancelApply(ds, b.dataset.slotCancel));
    list.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => { const s = findShift(ds, b.dataset.sub); if (!s) return;
      if (A.swap && A.swap.request) A.swap.request(s); else A.toast('대타 구하기는 준비 중이에요'); });
    list.querySelectorAll('[data-more]').forEach(b => b.onclick = () => { const [k, id] = b.dataset.more.split(':');
      if (k === 'n') { const m = findNight(ds, id); if (m) nightMenu(m); } else { const s = findShift(ds, id); if (s) shiftMenu(s); } });
    list.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => TOOLS[b.dataset.tool](ds, b.dataset.twp));
    list.querySelectorAll('[data-hope]').forEach(b => b.onclick = () => addHope(ds, b));
  }

  // 빈 자리 신청 (관리자: 수락·거절 / 직원: 신청·취소)
  let deciding = false;   // 수락·거절 하나 처리 중에는 다른 결정 막기
  async function approve(s, a) {
    if (deciding) return;
    const others = s.applicants.length - 1;
    if (!await A.confirm({ title: `${a.name}님 신청을 수락할까요?`, text: `${where(s.date, s.wp)} 근무에 들어가요.${others ? ` 다른 신청 ${others}개는 거절돼요.` : ''}`, ok: '수락' })) return;
    deciding = true;
    try {
      if (await rpc('admin_approve_application', { p_admin_id: adminId(), p_app_id: Number(a.appId) }) === false) return;
      if (v2db()) A.api.notify({ event: 'application_decided', app_id: Number(a.appId) });   // 신청자들에게 (v2 DB 가 있을 때만)
      await done(s.date, `${a.name}님을 넣었어요`);   // 다시 그릴 때까지 막아 둬요
    } finally { deciding = false; }
  }
  async function reject(s, a) {
    if (deciding) return;
    if (!await A.confirm({ title: `${a.name}님 신청을 거절할까요?`, text: v2db() ? `${a.name}님에게 거절 알림이 가요.` : '', ok: '거절하기', danger: true })) return;
    deciding = true;
    try {
      if (await rpc('admin_reject_application', { p_admin_id: adminId(), p_app_id: Number(a.appId) }) === false) return;
      if (v2db()) A.api.notify({ event: 'application_decided', app_id: Number(a.appId) });
      await done(s.date, `${a.name}님 신청을 거절했어요`);
    } finally { deciding = false; }
  }
  function pickApplicant(s) {
    const html = `<p class="sheet-p">${esc(where(s.date, s.wp))} 빈 자리에 신청한 사람이에요.</p><div class="pick-list">${s.applicants.map(a => `<div class="lrow">${A.avatar(a.name)}<span class="lm"><span class="lt">${esc(a.name)}</span></span><span class="la"><button class="btn sm ghost" data-pno="${a.appId}">거절</button><button class="btn sm" data-pok="${a.appId}">수락</button></span></div>`).join('')}</div>`;
    A.sheet({ title: '빈 자리에 넣을 사람', html, onOpen: (el, close) => {
      const of = id => s.applicants.find(x => String(x.appId) === id);
      el.querySelectorAll('[data-pok]').forEach(b => b.onclick = () => { close(); approve(s, of(b.dataset.pok)); });
      el.querySelectorAll('[data-pno]').forEach(b => b.onclick = () => { close(); reject(s, of(b.dataset.pno)); });
    } });
  }
  async function apply(ds, id) {
    if (!await A.auth.require()) return;
    if (A.isAdmin()) return;                               // 관리자로 로그인했으면 다시 그려진 화면에서 고르기
    const s = me();
    if (await rpc('apply_slot', { p_staff_id: s.id, p_shift_id: Number(id) }) === false) return;
    A.api.notify({ to: 'admins', title: '빈자리 신청', body: `${s.name}님이 빈자리에 신청했어요`, exclude_id: s.id });
    await done(ds, v2db() ? '신청했어요. 관리자가 확인하면 알려 드려요' : '신청했어요. 관리자 확인을 기다려 주세요');
  }
  async function cancelApply(ds, id) {
    if (!await A.auth.require()) return;
    if (!await A.confirm({ title: '신청을 취소할까요?', ok: '신청 취소', cancel: '그대로 두기', danger: true })) return;
    if (await rpc('cancel_application', { p_staff_id: me().id, p_shift_id: Number(id) }) === false) return;
    await done(ds, '신청을 취소했어요');
  }

  // 두 번 부르는 옮기기: 넣기가 된 뒤에만 빼요. 하나라도 됐으면 다시 그려요
  async function twoStep(ds, add, remove, msg, afterAdd) {
    if (await rpc(add[0], add[1]) === false) return;
    if (afterAdd) await afterAdd();
    const r = await rpc(remove[0], remove[1]);
    await done(ds, r === false ? '' : msg);
  }
  const nightAddArgs = (ds, wp, p) => ({ p_admin_id: adminId(), p_date: ds, p_workplace: wp, p_staff_id: p.staffId ?? null, p_name: p.staffId != null ? null : (p.short ? '부족' : p.name) });
  // 게스트 표시 (supabase-v2-guest-label.sql 적용 뒤에만 A.guestLabel): 그 날·매장·이름의 게스트 근무(주간·야간) 표시를 켜고 꺼요
  const setGuestLabel = (ds, wp, name, show) => rpc('admin_set_guest_label', { p_admin_id: adminId(), p_date: ds, p_workplace: wp, p_name: name, p_show: !!show });
  const labelRow = p => A.guestLabel && p.gname ? `<button class="menu-row" data-glabel>${p.showGuest === false ? "손님 페이지에 '게스트' 표시하기" : "'게스트' 표시 끄기"}${I.chev}</button>` : '';
  const bindLabel = (el, close, p) => { const b = el.querySelector('[data-glabel]'); if (!b) return;
    b.onclick = async () => { close(); const on = p.showGuest === false;
      if (await setGuestLabel(p.date, p.wp, p.name, on) === false) return;
      await done(p.date, on ? `${p.name}님을 다시 게스트로 표시해요` : `${p.name}님은 이제 게스트로 표시하지 않아요`); }; };
  // 주간↔야간 옮기면 새 줄이 생겨서 표시가 기본(켜짐)으로 돌아가요 → 꺼 둔 표시를 새 자리에도 다시 꺼요
  const keepLabel = (p, ds, wp) => A.guestLabel && p.gname && p.showGuest === false ? setGuestLabel(ds, wp, p.name, false) : null;

  // 줄 ⋯ (주간 근무·빈 자리): 수정 · 다른 층으로 · 야간으로 · 게스트→직원 · 빼기
  function shiftMenu(s) {
    const ds = s.date, wp = s.wp, info = A.store.day(ds, wp), label = s.empty ? '빈 자리' : s.name;
    const moves = A.FLOORS.filter(f => f[0] !== wp && !A.store.day(ds, f[0]).closed).map(([w]) => `<button class="menu-row" data-mv="${w}">${A.storeName(w)}로 옮기기${I.chev}</button>`).join('');
    const flip = info.night && !s.empty ? `<button class="menu-row" data-flip>야간으로 옮기기${I.chev}</button>` : '';
    const conv = s.gname && A.guest && A.guest.convert ? `<button class="menu-row" data-conv>직원으로 바꾸기${I.chev}</button>` : '';
    A.sheet({ title: `${label} · 주간`, html: `<p class="sheet-p">${esc(where(ds, wp))}</p><div class="menu-list"><button class="menu-row" data-edit>수정하기${I.chev}</button>${moves}${flip}${labelRow(s)}${conv}</div>`,
      actions: [{ label: '이 날 근무에서 빼기', kind: 'danger', onClick: async c => { c();
        if (!await A.confirm({ title: s.empty ? '빈 자리를 지울까요?' : `${label}님을 뺄까요?`, text: `${where(ds, wp)} 주간 근무에서 빠져요.`, ok: '빼기', danger: true })) return;
        if (await rpc('admin_delete_shift', { p_admin_id: adminId(), p_shift_id: Number(s.id) }) === false) return;
        await done(ds, s.empty ? '빈 자리를 지웠어요' : `${label}님을 뺐어요`); } }],
      onOpen: (el, close) => {
        el.querySelector('[data-edit]').onclick = () => { close(); A.editShift(s); };
        el.querySelectorAll('[data-mv]').forEach(x => x.onclick = async () => { close(); const to = x.dataset.mv;
          if (await rpc('admin_move_shift', { p_admin_id: adminId(), p_shift_id: Number(s.id), p_workplace: to }) === false) return;
          await done(ds, s.empty ? `빈 자리를 ${A.storeName(to)}로 옮겼어요` : `${label}님을 ${A.storeName(to)}로 옮겼어요`); });
        const f = el.querySelector('[data-flip]');
        if (f) f.onclick = () => { close();
          twoStep(ds, ['admin_add_night_member', nightAddArgs(ds, wp, s)], ['admin_delete_shift', { p_admin_id: adminId(), p_shift_id: Number(s.id) }], `${label}님을 야간으로 옮겼어요`, () => keepLabel(s, ds, wp)); };
        bindLabel(el, close, s);
        const cv = el.querySelector('[data-conv]');
        if (cv) cv.onclick = () => { close(); A.guest?.convert?.(s.name); };
      } });
  }
  // 줄 ⋯ (야간 멤버): 다른 층 야간으로 · 주간으로 · 게스트→직원 · 빼기
  function nightMenu(m) {
    const ds = m.date, wp = m.wp, label = m.short ? '부족' : m.name;
    const moves = A.FLOORS.filter(f => f[0] !== wp && A.store.day(ds, f[0]).night).map(([w]) => `<button class="menu-row" data-mv="${w}">${A.storeName(w)} 야간으로 옮기기${I.chev}</button>`).join('');
    const conv = m.gname && A.guest && A.guest.convert ? `<button class="menu-row" data-conv>직원으로 바꾸기${I.chev}</button>` : '';
    A.sheet({ title: `${label} · 야간`, html: `<p class="sheet-p">${esc(where(ds, wp))}</p><div class="menu-list">${moves}<button class="menu-row" data-flip>${m.short ? '주간 빈 자리로 바꾸기' : '주간으로 옮기기'}${I.chev}</button>${labelRow(m)}${conv}</div>`,
      actions: [{ label: '야간에서 빼기', kind: 'danger', onClick: c => { c();
        if (A.night && A.night.remove) A.night.remove(m); else A.toast('야간 멤버 빼기는 준비 중이에요'); } }],
      onOpen: (el, close) => {
        el.querySelectorAll('[data-mv]').forEach(x => x.onclick = () => { close(); const to = x.dataset.mv;
          twoStep(ds, ['admin_add_night_member', nightAddArgs(ds, to, m)], ['admin_remove_night_member', { p_admin_id: adminId(), p_id: Number(m.id) }], `${label}${m.short ? '' : '님'}을 ${A.storeName(to)} 야간으로 옮겼어요`, () => keepLabel(m, ds, to)); });
        el.querySelector('[data-flip]').onclick = () => { close();
          const add = { p_admin_id: adminId(), p_work_date: ds, p_workplace: wp, p_start: '', p_end: '', p_assignee: m.staffId ?? null, p_memo: null, p_guest: m.staffId != null || m.short ? null : m.name };
          twoStep(ds, ['admin_add_shift', add], ['admin_remove_night_member', { p_admin_id: adminId(), p_id: Number(m.id) }], m.short ? '주간 빈 자리로 바꿨어요' : `${label}님을 주간으로 옮겼어요`, () => keepLabel(m, ds, wp)); };
        bindLabel(el, close, m);
        const cv = el.querySelector('[data-conv]');
        if (cv) cv.onclick = () => { close(); A.guest?.convert?.(m.name); };
      } });
  }

  // 층별 도구 (편집 중)
  const TOOLS = {
    async closed(ds, wp) {
      const info = A.store.day(ds, wp);
      if (info.closed) {
        if (!await A.confirm({ title: `${A.storeName(wp)} 휴무를 풀까요?`, text: `${A.fmt(ds)}에 다시 문을 열어요.${v2db() ? ' 쉬는 동안 지워 둔 근무가 돌아와요.' : ''}`, ok: '휴무 풀기' })) return;
        if (await rpc('admin_set_day_off', { p_admin_id: adminId(), p_date: ds, p_workplace: wp, p_off: false }) === false) return;
        return done(ds, '휴무를 풀었어요');
      }
      const n = info.shifts.length, slots = info.slots.length;
      const text = v2db() ? `${A.fmt(ds)}. 휴무를 풀면 근무가 돌아와요.` : `${A.fmt(ds)}.${n ? ` 이 날 근무 ${n}명이 지워져요.` : ''}${slots ? ` 빈 자리 ${slots}개도 지워져요.` : ''}`;
      if (!await A.confirm({ title: `${A.storeName(wp)}${A.josa(wp, '을', '를')} 휴무로 할까요?`, text, ok: '휴무로', danger: !v2db() && n + slots > 0 })) return;
      if (await rpc('admin_set_day_off', { p_admin_id: adminId(), p_date: ds, p_workplace: wp, p_off: true }) === false) return;
      await done(ds, `${A.fmt(ds)} ${wp}${A.josa(wp, '을', '를')} 휴무로 했어요`);
    },
    async night(ds, wp) {
      const info = A.store.day(ds, wp), cur = info.night && info.night.hours;
      const ask = async () => {
        const v = await A.prompt({ title: cur ? '야간 시간 바꾸기' : '야간 열기', text: `${where(ds, wp)} · 손님 페이지에 이 글 그대로 보여요.`, label: '영업시간 표시', value: cur || NIGHT_DEFAULT, maxlength: 60, ok: cur ? '저장' : '야간 열기' });
        if (v === null) return;
        const hrs = v || cur || NIGHT_DEFAULT;
        if (cur && hrs === cur) return;
        if (await rpc('admin_set_night', { p_admin_id: adminId(), p_date: ds, p_workplace: wp, p_on: true, p_hours: hrs }) === false) return;
        await done(ds, cur ? '야간 시간을 바꿨어요' : '야간을 열었어요');
      };
      if (!cur) return ask();
      const n = info.night.members.length;
      A.sheet({ title: '야간', html: `<p class="sheet-p">${esc(where(ds, wp))}</p><div class="box hrs-box">${esc(cur)}</div>`, actions: [
        { label: '야간 닫기', kind: 'danger', onClick: async c => { c();
          if (!await A.confirm({ title: '야간을 닫을까요?', text: n ? `야간 멤버 ${n}명도 같이 빠져요.` : '', ok: '야간 닫기', danger: true })) return;
          if (await rpc('admin_set_night', { p_admin_id: adminId(), p_date: ds, p_workplace: wp, p_on: false, p_hours: cur }) === false) return;
          await done(ds, '야간을 닫았어요'); } },
        { label: '시간 바꾸기', kind: 'primary', onClick: c => { c(); ask(); } }] });
    },
    async event(ds, wp) {
      const cur = A.store.day(ds, wp).event || '';
      const v = await A.prompt({ title: cur ? '이벤트 바꾸기' : '이벤트 넣기', text: `${where(ds, wp)}${cur ? ' · 비우고 저장하면 이벤트가 지워져요' : ''}`, label: '이벤트 이름', value: cur, placeholder: '예: 할로윈', maxlength: 30, ok: '저장',
        validate: x => (!x && !cur ? '이벤트 이름을 적어 주세요' : '') });
      if (v === null || v === cur) return;
      if (await rpc('admin_set_day_event', { p_admin_id: adminId(), p_date: ds, p_workplace: wp, p_event: v }) === false) return;
      await done(ds, v ? '이벤트를 저장했어요' : '이벤트를 지웠어요');
    },
    hopes(ds, wp) { if (A.adminTools && A.adminTools.openHopes) A.adminTools.openHopes(ds, wp); else A.toast('희망자 보기는 준비 중이에요'); },
    add(ds, wp) { A.addShift(ds, wp); },
    nadd(ds, wp) { if (A.night && A.night.openAdd) A.night.openAdd(ds, wp); else A.toast('야간 멤버 넣기는 준비 중이에요'); },
  };

  // ── 근무 시트 (관리자): 직원 / 게스트 / 빈 자리, 시작·끝, 지우기 (운영 2223-2267, 2305-2310) ──
  async function shiftSheet(s, ds, wp) {
    const staff = A.store.staff().length ? A.store.staff() : await A.store.directory();
    const edit = !!s;
    let kind = !s ? 'staff' : s.staffId != null ? 'staff' : s.gname ? 'guest' : 'open';
    const KINDS = [['staff', '직원'], ['guest', '게스트'], ['open', '빈 자리']];
    const conv = edit && s.gname && A.guest && A.guest.convert ? `<div class="menu-list"><button class="menu-row" data-conv>직원으로 바꾸기${I.chev}</button></div>` : '';
    const html = `<p class="sheet-p">${esc(where(ds, wp))}</p>
      <div class="seg" role="radiogroup" aria-label="누가 들어가나요">${KINDS.map(([k, l]) => `<button data-k="${k}" role="radio" aria-checked="${kind === k}" class="${kind === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      ${A.staffPick({ staff, sel: s ? s.staffId : null, attr: 'data-f="staff"', wrap: 'data-p="staff"' })}
      <label class="fld-l" data-p="guest">게스트 이름<input class="fld" data-f="guest" maxlength="30" autocomplete="off" value="${esc(s && s.gname ? s.name : '')}" placeholder="예: 하루"></label>
      ${A.guestLabel ? `<label class="chk-row" data-p="guest"><input type="checkbox" data-f="showGuest"${s && s.gname && s.showGuest === false ? '' : ' checked'}><span class="lm"><span class="lt">손님 페이지에 '게스트'로 표시</span><span class="ls">직원인데 명단에 아직 없으면 꺼 두세요</span></span></label>` : ''}
      <p class="sheet-note" data-p="open">직원들이 이 빈 자리에 신청할 수 있어요.</p>
      <div class="fld-row"><label class="fld-l">시작 (선택)<input class="fld" data-f="start" maxlength="10" autocomplete="off" value="${esc(s ? s.start : '')}" placeholder="예: 18:00"></label><label class="fld-l">끝 (선택)<input class="fld" data-f="end" maxlength="10" autocomplete="off" value="${esc(s ? s.end : '')}" placeholder="예: 23:00"></label></div>
      ${conv}<p class="sheet-err" hidden></p>`;
    let busy = false;
    const save = async (close, el) => {
      if (busy) return;
      const err = el.querySelector('.sheet-err'), show = m => { err.hidden = false; err.textContent = m; };
      const f = k => el.querySelector(`[data-f="${k}"]`);
      let assignee = null, guest = null;
      if (kind === 'staff') { assignee = f('staff').value ? Number(f('staff').value) : null; if (!assignee) { show('직원을 골라 주세요'); return; } }
      else if (kind === 'guest') { guest = f('guest').value.trim(); if (!guest) { show('게스트 이름을 적어 주세요'); f('guest').focus(); return; } }
      const start = f('start').value.trim(), end = f('end').value.trim();
      busy = true; err.hidden = true;
      const btn = el.querySelector('.sheet-a .primary'); if (btn) btn.setAttribute('aria-busy', 'true');
      const r = edit
        ? await rpc('admin_update_shift', { p_admin_id: adminId(), p_shift_id: Number(s.id), p_start: start, p_end: end, p_assignee: assignee, p_guest: guest })
        : await rpc('admin_add_shift', { p_admin_id: adminId(), p_work_date: ds, p_workplace: wp, p_start: start, p_end: end, p_assignee: assignee, p_memo: null, p_guest: guest });
      // 게스트 표시: 넣을 때 끄거나, 고칠 때 바꿨으면 이름 기준으로 따로 저장 (새 줄은 켜짐으로 시작)
      const lb = kind === 'guest' && A.guestLabel ? f('showGuest') : null, want = lb ? lb.checked : true;
      const was = edit && s.gname ? s.showGuest !== false : true;
      const lr = r !== false && lb && (!want || want !== was) ? await setGuestLabel(ds, wp, guest, want) : null;
      busy = false; if (btn) btn.removeAttribute('aria-busy');
      if (r === false) return;
      close();
      await done(ds, (edit ? '근무를 고쳤어요' : kind === 'open' ? '빈 자리를 만들었어요. 직원들이 신청할 수 있어요' : '근무를 넣었어요') + (lb && !want && lr !== false ? ' · 게스트 표시 없이' : ''));
    };
    const del = async c => { c();
      if (!await A.confirm({ title: '이 근무를 지울까요?', text: `${where(ds, wp)}${s.empty ? ' 빈 자리' : ` ${s.name}님`} 근무가 지워져요.`, ok: '지우기', danger: true })) return;
      if (await rpc('admin_delete_shift', { p_admin_id: adminId(), p_shift_id: Number(s.id) }) === false) return;
      await done(ds, '근무를 지웠어요'); };
    A.sheet({ title: edit ? '근무 고치기' : '근무 넣기', html,
      actions: edit ? [{ label: '지우기', kind: 'danger', onClick: del }, { label: '저장', kind: 'primary', onClick: save }]
                    : [{ label: '취소' }, { label: '넣기', kind: 'primary', onClick: save }],
      onOpen: (el, close) => {
        A.bindStaffPick(el);
        const paint = () => {
          el.querySelectorAll('[data-k]').forEach(b => { const on = b.dataset.k === kind; b.classList.toggle('on', on); b.setAttribute('aria-checked', String(on)); });
          el.querySelectorAll('[data-p]').forEach(p => { p.hidden = p.dataset.p !== kind; });
        };
        el.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { kind = b.dataset.k; paint(); });
        const cv = el.querySelector('[data-conv]');
        if (cv) cv.onclick = () => { close(); A.guest?.convert?.(s.name); };
        paint();
      } });
  }
  A.editShift = shift => { if (shift) shiftSheet(shift, shift.date, shift.wp); };
  A.addShift = (ds, wp) => shiftSheet(null, ds, wp);
}

// ── js/11-views.js ──
// 스케줄의 주간 · 월간 · 야간 보기 + 야간 멤버 넣기/빼기 (A.night).
// 틀(보기 전환·매장 칩·날짜 바)은 10-day.js 가 그리고, 여기 render(listEl, {ds, wp, admin, edit}) 를 불러요.
// 운영 staff.html: 야간 시트 1232-1301, 야간 1853-1912, 월간 1913-1998, 주간 2000-2049. 생김새·문구는 시안 proto/js/views.js
{
  const A = window.App;
  const esc = s => A.esc(s);
  const I = A.ICON;
  const NIGHT_WP = '데빌';
  const DEFAULT_HOURS = '주간 16:00~23:00 · 야간 23:00~익일 05:00';   // 운영 기본값 (ensureNightOn, 2131)
  const floorsOf = wp => wp === '전체' ? A.FLOORS.map(f => f[0]) : [wp];
  const dowCls = d => d.getDay() === 0 ? ' sun' : d.getDay() === 6 ? ' sat' : '';
  const stepMonth = (d, dir) => new Date(d.getFullYear(), d.getMonth() + dir, 1);   // setMonth 는 31일에 달을 건너뛰어요
  const sameYM = (d, ds) => A.ymd(d).slice(0, 7) === String(ds).slice(0, 7);
  const sundayOf = d => new Date(d.getFullYear(), d.getMonth(), d.getDate() - d.getDay());
  const isMe = p => !!(A.session && p && p.staffId != null && Number(p.staffId) === Number(A.session.id));
  const meMark = '<span class="sr">(나)</span>';
  const locked = () => (A.lockedMonth && A.lockedMonth()) || A.emptyBox('lock', '아직 공개되지 않은 달이에요', '스케줄이 확정되면 볼 수 있어요');
  const failBox = () => A.emptyBox('cal', '불러오지 못했어요', '당겨서 새로고침해 주세요');
  const draftBar = ds => (A.draftBar && A.draftBar(ds)) || '';
  const sid = () => (A.session ? A.session.id : null);
  const vw = () => Math.min(window.innerWidth || 390, 480);

  // 이름을 한 줄에: 칸 너비(px)에 맞춰 긴 이름만 글자를 줄임 (한글 1em, 영문·기호 약 0.55em)
  const fitName = (name, base, avail) => {
    let u = 0; for (const ch of String(name)) u += /[ㄱ-힣]/.test(ch) ? 1 : 0.55;
    const fs = Math.max(7, Math.min(base, Math.floor(avail / Math.max(u, 1) * 10) / 10));
    return fs < base ? ` style="font-size:${fs}px"` : '';
  };
  // div 칸(안에 버튼·링크가 있어서 button 으로 못 씀): 누르기 + Enter/Space
  function bindTap(root, sel, fn) {
    root.querySelectorAll(sel).forEach(c => {
      c.addEventListener('click', e => { if (e.target.closest('[data-act], a')) return; fn(c); });
      c.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === c) { e.preventDefault(); fn(c); } });
    });
  }
  const act = (root, name, fn) => root.querySelectorAll(`[data-act="${name}"]`).forEach(b => b.addEventListener('click', e => { e.stopPropagation(); fn(b); }));
  // 쓰기 뒤: 읽기 버림 → 다시 그림 → 알림
  async function after(ds, msg) {
    if (ds) A.store.invalidate(ds, ds); else A.store.invalidateAll();
    await A.render({ keep: true });
    if (msg) A.toast(msg);
  }
  // 공개 전 달 띠 (관리자): 보이는 날짜 중 공개 전인 달마다 하나
  function draftBars(dss) {
    const seen = new Set(), out = [];
    dss.forEach(ds => { const ym = A.ymOf(ds); if (!seen.has(ym) && A.store.isDraft(ds)) { seen.add(ym); out.push(draftBar(ds)); } });
    return out.join('');
  }

  // ───────────────────────── 주간 ─────────────────────────
  function person(p, o) {
    const me = isMe(p);
    const attrs = o.night ? ` data-night-id="${p.id}"` : ` data-shift-id="${p.id}" data-date="${esc(p.date)}" data-wp="${esc(p.wp)}"`;
    return `<span class="n vw-p${p.guest ? ' g' : ''}${me ? ' me' : ''}"${attrs}>${A.avatar({ name: p.name, avatar: p.guest ? null : p.avatar }, 'wav')}<span class="vw-nm"${fitName(p.name, 11.5, o.avail)}>${esc(p.name)}</span>${me ? meMark : ''}</span>`;
  }
  // 칸 안 이름: 게스트를 위에 모아 작은 '게스트' 글자로 묶고, 선 아래에 직원
  function weekNames(list, o) {
    const gs = list.filter(p => p.guest), st = list.filter(p => !p.guest);
    return (gs.length ? `<span class="gl">게스트</span>${gs.map(p => person(p, o)).join('')}${st.length ? '<span class="gsep"></span>' : ''}` : '') + st.map(p => person(p, o)).join('');
  }
  function weekCell(info, avail) {
    const open = info.slots.length ? `<span class="vw-op">모집중 ${info.slots.length}</span>` : '';
    const day = weekNames(info.shifts, { avail }) + open;
    let html = (info.event ? `<span class="ev"${fitName(info.event, 10, avail + 14)}>${esc(info.event)}</span>` : '') + (day || '<span class="no">없음</span>');
    if (info.night) {
      const ms = info.night.members.filter(m => !m.short), sh = info.night.members.length - ms.length;
      const nm = weekNames(ms, { avail, night: true }) + (sh ? `<span class="vw-op">부족 ${sh}</span>` : '');
      html += `<span class="nsep"></span><span class="ntl">${I.moon}야간</span>${nm || '<span class="no">미정</span>'}`;
    }
    return html;
  }
  function weekTitle(d) {
    const a = sundayOf(d), b = new Date(a.getFullYear(), a.getMonth(), a.getDate() + 6);
    return `${a.getMonth() + 1}월 ${a.getDate()}일 – ${b.getMonth() !== a.getMonth() ? `${b.getMonth() + 1}월 ` : ''}${b.getDate()}일`;
  }
  async function renderWeek(listEl, { ds, wp, admin }) {
    const sun = sundayOf(A.parse(ds));
    const dates = [...Array(7)].map((_, i) => new Date(sun.getFullYear(), sun.getMonth(), sun.getDate() + i));
    const dss = dates.map(A.ymd);
    if (!await A.store.ensure(dss[0], dss[6])) { listEl.innerHTML = failBox(); return; }
    const groups = floorsOf(wp), today = A.today();
    const avail = (vw() - 20) / 7 - 20;   // 칸 너비 - 사진(14) - 틈
    const days = dates.map((day, i) => {
      const d = dss[i], draft = A.store.isDraft(d), hide = draft && !admin, per = {};
      if (!hide) groups.forEach(g => { per[g] = A.store.day(d, g); });
      return { day, ds: d, draft, hide, per, off: !hide && groups.every(g => per[g].closed) };
    });
    if (days.every(x => x.hide)) { listEl.innerHTML = locked(); return; }
    const head = days.map(x => `<button class="wt-h${dowCls(x.day)}${x.ds === today ? ' today' : ''}" data-goday="${x.ds}" aria-label="${A.fmt(x.ds)} 일별로 보기"><span class="dow">${A.DAYS[x.day.getDay()]}</span><span class="dn">${x.day.getDate()}</span>${x.draft ? '<span class="st">미공개</span>' : x.off ? '<span class="st">휴무</span>' : ''}</button>`).join('');
    const bands = groups.map(g => {
      const cells = days.map(x => {
        const info = x.per[g];
        let inner, label;
        if (x.hide) { inner = '<span class="no">비공개</span>'; label = '비공개'; }
        else if (info.closed) { inner = '<span class="no">휴무</span>'; label = '휴무'; }
        else {
          inner = weekCell(info, avail);
          const nightN = info.night ? info.night.members.filter(m => !m.short).length : 0;
          const mine = info.shifts.some(isMe) || (info.night && info.night.members.some(isMe));
          label = `${info.shifts.length}명${info.slots.length ? ` · 모집중 ${info.slots.length}` : ''}${info.night ? ` · 야간 ${nightN}명` : ''}${info.event ? ` · ${info.event}` : ''}${mine ? ' · 내 근무' : ''}`;
        }
        return `<div class="wt-c" role="button" tabindex="0" data-goday="${x.ds}" data-drop-wp="${esc(g)}" data-date="${x.ds}" aria-label="${esc(`${A.fmt(x.ds)} ${A.storeName(g)} ${label}`)}">${inner}</div>`;
      }).join('');
      return `<div class="wt-band" data-theme="${A.themeKey(g)}"><div class="wt-label"><i></i>${A.floorOf(g)} ${esc(g)}</div><div class="wt-row">${cells}</div></div>`;
    }).join('');
    const bar = admin ? draftBars(dss) : '';
    listEl.innerHTML = `${bar}<div class="wt vw"><div class="wt-row wt-head">${head}</div>${bands}</div><p class="wk-hint">칸을 누르면 그날 출근표로 가요</p>`;
    listEl.querySelectorAll('.wt-h[data-goday]').forEach(b => b.onclick = () => A.goDay(b.dataset.goday, wp));
    bindTap(listEl, '.wt-c[data-goday]', c => A.goDay(c.dataset.goday, wp));
    if (bar && A.bindDraft) A.bindDraft(listEl);
    if (A.drag && A.drag.bind) A.drag.bind(listEl);
  }
  A.view('week', {
    title: weekTitle,
    isNow: d => A.ymd(sundayOf(d)) === A.ymd(sundayOf(A.parse(A.today()))),
    now: ['이번 주', '이번 주로'],
    step: (d, dir) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + dir * 7),
    render: renderWeek,
  });

  // ───────────────────────── 월간 (층마다 달력) ─────────────────────────
  function monthNames(list, o) {
    const nm = p => {
      const me = isMe(p);
      const attrs = o.night ? ` data-night-id="${p.id}"` : ` data-shift-id="${p.id}" data-date="${esc(p.date)}" data-wp="${esc(p.wp)}"`;
      return `<span class="mnm${p.guest ? ' g' : ''}${me ? ' me' : ''}"${attrs}${fitName(p.name, 10, o.avail)}>${esc(p.name)}${me ? meMark : ''}</span>`;
    };
    const gs = list.filter(p => p.guest), st = list.filter(p => !p.guest);
    return (gs.length ? `<span class="vm-gl">게스트</span>${gs.map(nm).join('')}${st.length ? '<span class="vm-gsep"></span>' : ''}` : '') + st.map(nm).join('');
  }
  const shortTag = (admin, act, id, ds, wp) => admin
    ? `<button class="vm-short" data-act="${act}" data-id="${id}" data-ds="${ds}" data-wp="${esc(wp)}" aria-label="부족 자리 빼기">부족</button>`
    : '<span class="vm-short">부족</span>';
  function monthCell(info, day, o) {
    const ds = info.ds, wp = info.wp;
    const night = !info.closed && info.night;
    const num = `<span class="mn">${day.getDate()}${night ? `<span class="vm-moon" aria-hidden="true">${I.moon}</span>` : ''}</span>`;
    let body, label;
    if (info.closed) { body = '<span class="moff">휴무</span>'; label = '휴무'; }
    else {
      const ev = info.event
        ? (o.admin ? `<button class="mev vm-ev" data-act="event" data-ds="${ds}" data-wp="${esc(wp)}" aria-label="이벤트 ${esc(info.event)} 바꾸기">${esc(info.event)}</button>` : `<span class="mev">${esc(info.event)}</span>`)
        : (o.admin ? `<button class="vm-ev add" data-act="event" data-ds="${ds}" data-wp="${esc(wp)}" aria-label="이벤트 넣기">＋데이</button>` : '');
      let ns = '';
      if (night) {
        const ms = info.night.members.filter(m => !m.short), sh = info.night.members.filter(m => m.short);
        ns = `<span class="vm-nsep"></span><span class="vm-ntl">${I.moon}야간</span>${monthNames(ms, { avail: o.avail, night: true })}${sh.map(m => shortTag(o.admin, 'nshort', m.id, ds, wp)).join('')}`;
      }
      const hope = o.admin ? `<button class="vm-tb" data-act="hope" data-ds="${ds}" data-wp="${esc(wp)}" aria-label="희망자 넣기">＋희망</button>` : '';
      body = ev + monthNames(info.shifts, { avail: o.avail }) + info.slots.map(s => shortTag(o.admin, 'short', s.id, ds, wp)).join('') + ns + hope;
      const mine = info.shifts.some(isMe) || (night && info.night.members.some(isMe));
      label = `${info.shifts.length}명${info.slots.length ? ` 부족 ${info.slots.length}` : ''}${night ? ` 야간 ${info.night.members.filter(m => !m.short).length}명` : ''}${info.event ? `, ${info.event}` : ''}${mine ? ', 내 근무' : ''}`;
    }
    return `<div class="mc vm-c${dowCls(day)}${ds === o.today ? ' today' : ''}" role="button" tabindex="0" data-goday="${ds}" data-drop-wp="${esc(wp)}" data-date="${ds}" aria-label="${esc(`${A.fmt(ds)} ${A.storeName(wp)} ${label}`)}">${num}${body}</div>`;
  }
  async function renderMonth(listEl, { ds, wp, admin }) {
    const d0 = A.parse(ds), y = d0.getFullYear(), m = d0.getMonth(), N = new Date(y, m + 1, 0).getDate();
    const ym = A.ymOf(ds), first = `${ym}-01`, last = `${ym}-${A.pad(N)}`;
    if (!await A.store.ensure(first, last)) { listEl.innerHTML = failBox(); return; }
    const draft = A.store.isDraft(first);
    if (draft && !admin) { listEl.innerHTML = locked(); return; }
    const groups = floorsOf(wp), today = A.today(), lead = new Date(y, m, 1).getDay();
    const avail = (vw() - 50) / 7 - 6;
    const dow = `<div class="mdow" aria-hidden="true">${A.DAYS.map((x, i) => `<span class="${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${x}</span>`).join('')}</div>`;
    const grids = groups.map(g => {
      let cells = '<span class="mc blank" aria-hidden="true"></span>'.repeat(lead);
      for (let d = 1; d <= N; d++) {
        const day = new Date(y, m, d);
        cells += monthCell(A.store.day(A.ymd(day), g), day, { admin, avail, today });
      }
      return `<section class="vm-floor" data-theme="${A.themeKey(g)}"><div class="vm-h">${A.storeTag(g)}</div>${dow}<div class="mgrid">${cells}</div></section>`;
    }).join('');
    const bar = admin && draft ? draftBar(first) : '';
    const tip = admin ? '날짜를 누르면 그날로 가요. 부족을 누르면 뺄 수 있어요' : '날짜를 누르면 그날 출근표로 가요';
    listEl.innerHTML = `${bar}<button class="btn vm-capture" data-act="capture">스케줄 이미지</button>${grids}<p class="wk-hint">${tip}</p>`;
    bindTap(listEl, '.vm-c[data-goday]', c => A.goDay(c.dataset.goday, wp));
    act(listEl, 'capture', () => (A.capture && A.capture.open) ? A.capture.open(ym, wp) : A.toast('스케줄 이미지는 준비 중이에요'));
    if (admin) {
      act(listEl, 'event', b => editEvent(b.dataset.ds, b.dataset.wp));
      act(listEl, 'hope', b => (A.adminTools && A.adminTools.openHopes) ? A.adminTools.openHopes(b.dataset.ds, b.dataset.wp) : A.toast('희망자 넣기는 준비 중이에요'));
      act(listEl, 'short', b => deleteShort(Number(b.dataset.id), b.dataset.ds, b.dataset.wp));
      act(listEl, 'nshort', b => {
        const ds2 = b.dataset.ds, info = A.store.day(ds2, NIGHT_WP);
        const mem = info.night && info.night.members.find(x => x.id === Number(b.dataset.id));
        remove(mem || { id: Number(b.dataset.id), date: ds2, wp: NIGHT_WP, name: '부족', short: true });
      });
    }
    if (bar && A.bindDraft) A.bindDraft(listEl);
    if (A.drag && A.drag.bind) A.drag.bind(listEl);
  }
  async function editEvent(ds, wp) {
    const cur = A.store.day(ds, wp).event || '';
    const v = await A.prompt({ title: cur ? '이벤트 바꾸기' : '이벤트 넣기', text: `${A.fmt(ds)} ${wp}`, label: '이벤트 이름', value: cur, placeholder: '비우면 이벤트가 지워져요', ok: '저장' });
    if (v === null || v === cur) return;
    const r = await A.api.rpc('admin_set_day_event', { p_admin_id: sid(), p_date: ds, p_workplace: wp, p_event: v });
    if (r === false) return;
    await after(ds, v ? '이벤트를 저장했어요' : '이벤트를 지웠어요');
  }
  async function deleteShort(id, ds, wp) {
    if (!await A.confirm({ title: '이 부족 자리를 뺄까요?', text: `${A.fmt(ds)} ${wp} 빈 자리가 없어져요.`, ok: '빼기', danger: true })) return;
    const r = await A.api.rpc('admin_delete_shift', { p_admin_id: sid(), p_shift_id: Number(id) });
    if (r === false) return;
    await after(ds, '부족 자리를 뺐어요');
  }
  A.view('month', {
    title: d => `${d.getFullYear()}년 ${d.getMonth() + 1}월`,
    isNow: d => sameYM(d, A.today()),
    now: ['이번 달', '이번 달로'],
    step: stepMonth,
    render: renderMonth,
  });

  // ───────────────────────── 야간 (데빌) ─────────────────────────
  function pill(m, admin) {
    if (m.short) {
      return admin
        ? `<button class="nt-p short" data-act="rm" data-id="${m.id}" data-night-id="${m.id}" aria-label="부족 자리 빼기">부족</button>`
        : `<span class="nt-p short" data-night-id="${m.id}">부족</span>`;
    }
    const me = isMe(m);
    const inner = `${A.avatar({ name: m.name, avatar: m.guest ? null : m.avatar }, 'nt-av')}<span class="nt-nm">${esc(m.name)}</span>${m.guest ? '<span class="nt-g">게스트</span>' : ''}${me ? '<span class="nt-me">나</span>' : ''}`;
    const main = admin
      ? `<button class="nt-pb" data-act="rm" data-id="${m.id}" aria-label="${esc(m.name)}님을 야간에서 빼기">${inner}</button>`
      : `<span class="nt-pb">${inner}</span>`;
    const url = A.igUrl(m.insta);
    const ig = url ? `<a class="ig-mini nt-ig" href="${esc(url)}" target="_blank" rel="noopener" aria-label="${esc(m.name)} 인스타그램">${I.ig}</a>` : '';
    return `<span class="nt-p${url ? ' has-ig' : ''}" data-night-id="${m.id}">${main}${ig}</span>`;
  }
  async function renderNight(listEl, { ds, admin }) {
    listEl.dataset.theme = 'devil';
    const d0 = A.parse(ds), y = d0.getFullYear(), m = d0.getMonth(), N = new Date(y, m + 1, 0).getDate();
    const ym = A.ymOf(ds), first = `${ym}-01`;
    if (!await A.store.ensure(first, `${ym}-${A.pad(N)}`)) { listEl.innerHTML = failBox(); return; }
    const draft = A.store.isDraft(first);
    if (draft && !admin) { listEl.innerHTML = locked(); return; }
    const today = A.today();
    // 야간은 토요일에만 → 토요일 + (혹시 야간 잡힌 날)만 목록으로
    const items = [];
    for (let d = 1; d <= N; d++) {
      const day = new Date(y, m, d), info = A.store.day(A.ymd(day), NIGHT_WP);
      if (day.getDay() === 6 || info.night) items.push(info);
    }
    const rows = items.map(info => {
      const x = info.ds, isToday = x === today, members = info.night ? info.night.members : [];
      const hours = info.night ? info.night.hours : '';
      const acts = admin && !info.closed
        ? `<span class="nt-acts">${info.night ? `<button class="btn sm" data-act="hours" data-ds="${x}" aria-label="${A.fmt(x)} 야간 시간 바꾸기">시간</button>` : ''}<button class="btn sm" data-act="add" data-ds="${x}" aria-label="${A.fmt(x)} 야간에 멤버 넣기">＋ 멤버</button></span>` : '';
      const body = members.length
        ? `<div class="nt-m">${members.map(p => pill(p, admin)).join('')}</div>`
        : `<div class="nt-none${info.night ? ' wait' : ''}">${info.closed ? '휴무일이에요' : info.night ? '멤버 미정' : '야간 없음'}</div>`;
      return `<li class="nt-i${isToday ? ' today' : ''}" data-ds="${x}"><div class="nt-h"><span class="nt-d">${A.fmtShort(x)}</span>${isToday ? '<span class="tag">오늘</span>' : ''}${acts}</div>${hours ? `<div class="nt-hrs">${I.moon}<span>${esc(hours)}</span></div>` : ''}${body}</li>`;
    }).join('');
    const bar = admin && draft ? draftBar(first) : '';
    listEl.innerHTML = `${bar}<div class="nt-cap">${A.storeTag(NIGHT_WP)}<span>야간 멤버</span></div>${admin ? '<p class="nt-tip">멤버 이름을 누르면 뺄 수 있어요</p>' : ''}<ol class="nt-list">${rows}</ol>`;
    if (admin) {
      act(listEl, 'add', b => openAdd(b.dataset.ds, NIGHT_WP));
      act(listEl, 'hours', b => editHours(b.dataset.ds, NIGHT_WP));
      act(listEl, 'rm', b => {
        const x = b.closest('[data-ds]').dataset.ds, info = A.store.day(x, NIGHT_WP);
        const mem = info.night && info.night.members.find(p => p.id === Number(b.dataset.id));
        if (mem) remove(mem);
      });
    }
    if (bar && A.bindDraft) A.bindDraft(listEl);
  }
  // 야간 시간은 글 그대로 (ARCH "Night hours are free text"). 비우면 운영 기본값
  async function editHours(ds, wp) {
    const info = A.store.day(ds, wp), cur = info.night ? info.night.hours : '';
    const v = await A.prompt({ title: '야간 시간', text: `${A.fmt(ds)} ${wp} · 손님 페이지에도 이대로 보여요`, label: '영업시간 (시작한 날 기준)', value: cur || DEFAULT_HOURS, ok: '저장' });
    if (v === null) return;
    const hrs = v || DEFAULT_HOURS;
    if (hrs === cur) return;
    const r = await A.api.rpc('admin_set_night', { p_admin_id: sid(), p_date: ds, p_workplace: wp, p_on: true, p_hours: hrs });
    if (r === false) return;
    await after(ds, '야간 시간을 바꿨어요');
  }
  A.view('night', {
    title: d => `${d.getFullYear()}년 ${d.getMonth() + 1}월`,
    isNow: d => sameYM(d, A.today()),
    now: ['이번 달', '이번 달로'],
    step: stepMonth,
    chips: false,
    render: renderNight,
  });

  // ───────────────────────── 야간 멤버 넣기 · 빼기 (A.night) ─────────────────────────
  // 야간 문항 라벨의 날짜(예: "8/1-8/2 ...")가 대상 날짜를 포함하는지 (운영 nightCovers)
  function nightCovers(label, year, target) {
    const mt = String(label).match(/(\d{1,2})\/(\d{1,2})(?:\s*[-~]\s*(\d{1,2})\/(\d{1,2}))?/);
    if (!mt) return false;
    const ymd2 = (mo, d) => `${year}-${A.pad(mo)}-${A.pad(d)}`;
    const start = ymd2(+mt[1], +mt[2]), end = mt[3] ? ymd2(+mt[3], +mt[4]) : start;
    return target >= start && target <= end;
  }
  let addBusy = false;
  // 넣기 전에 그날 야간이 꺼져 있으면 켜요. 켜기에 실패하면 멈춰요 (운영 ensureNightOn 은 결과를 안 봐서 고침)
  // quiet: 명단에 없는 이름이지만 손님 페이지에 '게스트'로 표시하지 않기 (supabase-v2-guest-label.sql 적용 뒤에만)
  async function addMember(ds, wp, { staffId = null, name = null, quiet = false }, who, close) {
    if (addBusy) return false;
    if (!A.session) { if (A.auth && A.auth.openLogin) A.auth.openLogin(); return false; }
    addBusy = true;
    try {
      await A.store.ensure(ds, ds);
      let opened = false;
      if (!A.store.day(ds, wp).night) {
        const on = await A.api.rpc('admin_set_night', { p_admin_id: sid(), p_date: ds, p_workplace: wp, p_on: true, p_hours: DEFAULT_HOURS });
        if (on === false) return false;
        opened = true;
      }
      const r = await A.api.rpc('admin_add_night_member', { p_admin_id: sid(), p_date: ds, p_workplace: wp, p_staff_id: staffId == null ? null : Number(staffId), p_name: name });
      const lr = r !== false && quiet ? await A.api.rpc('admin_set_guest_label', { p_admin_id: sid(), p_date: ds, p_workplace: wp, p_name: name, p_show: false }) : null;
      if (r !== false && close) close();
      A.store.invalidate(ds, ds);
      await A.render({ keep: true });
      if (r === false) return false;
      A.toast((who ? (opened ? `야간을 열고 ${who}님을 넣었어요` : `${who}님을 야간에 넣었어요`) : (opened ? '야간을 열고 부족 자리를 넣었어요' : '부족 자리를 넣었어요')) + (quiet && lr !== false ? ' · 게스트 표시 없이' : ''));
      return true;
    } finally { addBusy = false; }
  }
  const staffAvatar = s => s.avatar_url || s.avatar || null;
  async function openAdd(ds, wp = NIGHT_WP) {
    if (!A.session) { if (A.auth && A.auth.openLogin) A.auth.openLogin(); return; }
    await A.store.ensure(ds, ds);
    const info = A.store.day(ds, wp);
    const members = info.night ? info.night.members : [];
    const taken = new Set(members.filter(x => x.staffId != null).map(x => Number(x.staffId)));
    const takenGuests = new Set(members.filter(x => x.staffId == null && !x.short).map(x => x.name));
    const staff = (A.store.staff() || []).filter(s => !taken.has(Number(s.id)));
    const listHtml = qv => {
      const q = qv.toLowerCase();
      const rows = staff.filter(s => !q || String(s.name || '').toLowerCase().includes(q)).map(s =>
        `<button class="lrow" data-staff="${s.id}" data-name="${esc(s.name)}">${A.avatar({ name: s.name, avatar: staffAvatar(s) })}<span class="lm"><span class="lt">${esc(s.name)}</span></span>${I.plus}</button>`).join('');
      const exact = (A.store.staff() || []).some(s => s.name === qv);
      const fresh = qv && !exact && !takenGuests.has(qv)
        ? `<button class="lrow" data-guest="${esc(qv)}">${A.avatar(qv)}<span class="lm"><span class="lt">'${esc(qv)}' 게스트로 넣기</span><span class="ls">명단에 없는 이름이에요</span></span>${I.plus}</button>`
          + (A.guestLabel ? `<button class="lrow" data-guest="${esc(qv)}" data-quiet>${A.avatar(qv)}<span class="lm"><span class="lt">'${esc(qv)}' 게스트 표시 없이 넣기</span><span class="ls">직원인데 명단에 아직 없을 때</span></span>${I.plus}</button>` : '') : '';
      return (rows + fresh) || '<div class="none">넣을 수 있는 사람이 없어요</div>';
    };
    const note = info.night ? '' : `<br>아직 야간이 없는 날이에요. 멤버를 넣으면 야간이 열려요 (${esc(DEFAULT_HOURS)}).`;
    A.sheet({
      title: '야간에 멤버 넣기',
      html: `<p class="sheet-p">${esc(A.fmt(ds))} ${esc(wp)}${note}</p>
        <div class="nm-cands" data-cands><span class="spin"></span></div>
        <input class="fld" data-q maxlength="20" placeholder="이름 찾기 · 새 게스트 이름" autocomplete="off" aria-label="이름 찾기">
        <div class="pick-list" data-pl>${listHtml('')}</div>`,
      actions: [{ label: '부족 자리 넣기', onClick: close => addMember(ds, wp, { staffId: null, name: '부족' }, null, close) }],
      onOpen: (el, close) => {
        const q = el.querySelector('[data-q]'), pl = el.querySelector('[data-pl]');
        const bind = () => pl.querySelectorAll('[data-staff],[data-guest]').forEach(b => b.onclick = () => {
          if (b.dataset.staff) addMember(ds, wp, { staffId: Number(b.dataset.staff), name: null }, b.dataset.name, close);
          else addMember(ds, wp, { staffId: null, name: b.dataset.guest, quiet: 'quiet' in b.dataset }, b.dataset.guest, close);
        });
        q.oninput = () => { pl.innerHTML = listHtml(q.value.trim()); bind(); };
        bind();
        loadCands(el.querySelector('[data-cands]'), ds, wp, taken, close);
      },
    });
  }
  // '가능'이라고 낸 사람 (그날을 덮는 야간 문항 기준, 운영 loadNmCands)
  async function loadCands(box, ds, wp, taken, close) {
    const ym = A.ymOf(ds);
    const [qs, ans] = await Promise.all([A.store.nightQuestions(ym), A.store.answers(ym)]);
    if (!box.isConnected) return;
    if (!qs.length) { box.innerHTML = '<p class="nm-note">이 달 야간 문항이 없어요</p>'; return; }
    const byq = {};
    ans.forEach(a => { if (a.qkey && a.qkey.indexOf('n:') === 0) (byq[a.qkey.slice(2)] = byq[a.qkey.slice(2)] || []).push(a); });
    const yr = Number(ym.split('-')[0]);
    const covering = qs.find(n => n.date === ds && (!n.wp || n.wp === wp)) || qs.find(n => nightCovers(n.label, yr, ds));
    const defId = String((covering || qs[0]).id);
    const sel = qs.length > 1
      ? `<select class="fld" data-qsel aria-label="야간 문항">${qs.map(n => `<option value="${n.id}"${String(n.id) === defId ? ' selected' : ''}>${esc(n.label)}</option>`).join('')}</select>`
      : `<p class="nm-note">${esc(qs[0].label)}</p>`;
    box.innerHTML = `<div class="nm-t">가능하다고 낸 사람 · 누르면 넣어요</div>${sel}<div data-chips></div>`;
    const chipsEl = box.querySelector('[data-chips]'), qsel = box.querySelector('[data-qsel]');
    const draw = () => {
      const qid = qsel ? qsel.value : defId, seen = new Set(), list = [];
      (byq[qid] || []).forEach(r => {
        const id = Number(r.staffId);
        if (r.choice === '가능' && r.staffId != null && !taken.has(id) && !seen.has(id)) { seen.add(id); list.push({ id, name: r.staffName }); }
      });
      list.sort((x, y) => String(x.name).localeCompare(String(y.name), 'ko'));
      chipsEl.innerHTML = list.length
        ? `<div class="nm-chips">${list.map(c => `<button class="nm-chip" data-pick="${c.id}" data-name="${esc(c.name)}">${esc(c.name)}</button>`).join('')}</div>`
        : '<p class="nm-note">이 날짜에 가능하다고 낸 사람이 없어요</p>';
      chipsEl.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => addMember(ds, wp, { staffId: Number(b.dataset.pick), name: null }, b.dataset.name, close));
    };
    if (qsel) qsel.onchange = draw;
    draw();
  }
  // member: store 의 Night ({id, date, wp, name, short})
  async function remove(member) {
    if (!member || member.id == null) return false;
    const short = !!member.short, name = member.name || '';
    const where = member.date ? `${A.fmt(member.date)} ${member.wp || NIGHT_WP} 야간에서 빠져요.` : '';
    if (!await A.confirm({ title: short ? '이 부족 자리를 뺄까요?' : `${name}님을 야간에서 뺄까요?`, text: where, ok: '빼기', danger: true })) return false;
    const r = await A.api.rpc('admin_remove_night_member', { p_admin_id: sid(), p_id: Number(member.id) });
    if (r === false) return false;
    await after(member.date || null, short ? '부족 자리를 뺐어요' : `${name}님을 야간에서 뺐어요`);
    return true;
  }
  A.night = { openAdd, remove };
}

// ── js/12-capture.js ──
// 출근표 이미지 (운영 staff.html 1776-1852): 매장별 한 달 출근표를 그려 html2canvas 로 PNG 를 만들고,
// 휴대폰은 공유 시트(navigator.share), 안 되면 '<매장>_<MM>월_스케줄.png' 로 내려받아요. 로그인 없이도 써요.
{
  const A = window.App;
  const WPS = () => A.FLOORS.map(f => f[0]);
  const monthDays = ym => { const [y, m] = ym.split('-').map(Number); const n = new Date(y, m, 0).getDate(); return Array.from({ length: n }, (_, i) => `${ym}-${A.pad(i + 1)}`); };

  function open(ym, wp) {
    ym = ym || A.ymOf(A.today());
    const [y, m] = ym.split('-').map(Number);
    const days = monthDays(ym);
    let cur = WPS().includes(wp) ? wp : WPS().includes(A.state.wp) ? A.state.wp : WPS()[0];
    let open = true, busy = false, ready = false;

    const chips = () => `<div class="chips cp-chips" role="group" aria-label="매장">${A.FLOORS.map(([w, fl]) => { const th = A.THEMES[w];
      return `<button class="chip${w === cur ? ' on' : ''}" data-w="${w}" aria-pressed="${w === cur}" style="--c:${th.c};--cs:${th.cs};--ci:${th.ci}"><img src="${A.logo(w)}" alt=""><span class="ct"><b>${w}</b><small>${fl}</small></span></button>`; }).join('')}</div>`;

    // 한 칸: 날짜 · 이벤트 · 휴무 또는 (게스트 → 직원 → 부족) · 야간 멤버
    const cell = ds => {
      const d = A.store.day(ds, cur), dow = A.parse(ds).getDay();
      const cls = dow === 0 ? ' sun' : dow === 6 ? ' sat' : '';
      let body = '';
      if (d.closed) body = '<span class="cp-off">휴무</span>';
      else {
        const g = d.shifts.filter(s => s.guest), st = d.shifts.filter(s => !s.guest);
        if (g.length) body += `<span class="cp-gl">게스트</span>${g.map(s => `<span class="cp-nm g">${A.esc(s.name)}</span>`).join('')}${st.length ? '<i class="cp-sep"></i>' : ''}`;
        body += st.map(s => `<span class="cp-nm">${A.esc(s.name)}</span>`).join('');
        body += d.slots.map(() => '<span class="cp-short">부족</span>').join('');
        const nm = d.night ? d.night.members.filter(x => !x.short) : [];
        if (nm.length) body += `<span class="cp-nt"><b>야간</b>${nm.map(x => `<span>${A.esc(x.name)}</span>`).join('')}</span>`;
      }
      return `<div class="cp-c${cls}"><span class="cp-dn">${A.parse(ds).getDate()}</span>${d.event ? `<span class="cp-ev">${A.esc(d.event)}</span>` : ''}${body}</div>`;
    };
    const image = () => {
      const first = new Date(y, m - 1, 1).getDay();
      return `<div class="cp-sheet" data-theme="${A.themeKey(cur)}">
        <div class="cp-head"><img src="${A.logo(cur)}" alt=""><span><b>${A.esc(cur)}</b><small>${y}년 ${m}월 출근표</small></span></div>
        <div class="cp-dow">${A.DAYS.map((d, i) => `<span class="${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${d}</span>`).join('')}</div>
        <div class="cp-grid">${'<div class="cp-c blank"></div>'.repeat(first)}${days.map(cell).join('')}</div></div>`;
    };

    const draw = async () => {
      const el = s.el, wrap = el.querySelector('.cp-wrap'), btn = el.querySelector('.sheet-a .primary');
      el.querySelector('.cp-top').innerHTML = chips();
      el.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { if (busy) return; cur = b.dataset.w; draw(); });
      ready = false; btn.disabled = true;
      const ok = await A.store.ensure(days[0], days[days.length - 1]);
      if (!open || !document.contains(el)) return;
      if (!ok) { wrap.innerHTML = A.emptyBox('cal', '불러오지 못했어요', '시트를 닫고 다시 열어 주세요'); return; }
      if (A.store.day(days[0], cur).draft && !A.isAdmin()) { wrap.innerHTML = A.emptyBox('lock', '아직 공개되지 않은 달이에요'); return; }
      wrap.innerHTML = image();
      ready = true; btn.disabled = false;
    };

    const save = async (close, el) => {
      if (busy || !ready) return;
      const node = el.querySelector('.cp-sheet'), btn = el.querySelector('.sheet-a .primary');
      if (!node) return;
      busy = true; btn.setAttribute('aria-busy', 'true');
      const label = btn.textContent; btn.textContent = '만드는 중…';
      const box = el.querySelector('.sheet-b'), top = box.scrollTop;
      try {
        await Promise.all([...node.querySelectorAll('img')].map(i => i.complete ? null : new Promise(r => { i.onload = i.onerror = r; })));
        const mod = await import('https://esm.sh/html2canvas@1.4.1');
        const html2canvas = mod.default || mod;
        box.scrollTop = 0;
        const canvas = await html2canvas(node, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false });
        box.scrollTop = top;
        const name = `${cur}_${ym.split('-')[1]}월_스케줄.png`;
        const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
        if (!blob) throw new Error('이미지를 만들지 못했어요');
        const file = new File([blob], name, { type: 'image/png' });
        // 휴대폰: 공유 시트 → '이미지 저장' 또는 단톡방
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try { await navigator.share({ files: [file], title: name }); return; }
          catch (e) { if (e && e.name === 'AbortError') return; }
        }
        // 컴퓨터: 바로 내려받기
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        A.toast('이미지를 저장했어요');
      } catch (e) {
        A.toast('이미지를 저장하지 못했어요: ' + ((e && e.message) || e), true);
      } finally {
        box.scrollTop = top;
        busy = false; btn.removeAttribute('aria-busy'); btn.textContent = label;
      }
    };

    const s = A.sheet({
      title: '출근표 이미지',

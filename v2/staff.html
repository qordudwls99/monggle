      html: `<div class="cp-top"></div><div class="cp-wrap"><div class="tl-load"><span class="spin"></span></div></div><p class="sheet-note">휴대폰에서는 공유 창이 열려요. 거기서 이미지 저장이나 단톡방을 골라 주세요.</p>`,
      actions: [{ label: '이미지 저장하기', kind: 'primary', onClick: save }],
      onClose: () => { open = false; },
    });
    draw();
    return s;
  }

  A.capture = { open };
}

// ── js/13-drag.js ──
// 컴퓨터(넓이 980 이상)에서 관리자가 '전체'를 볼 때: 근무를 다른 층으로 끌어 옮기기, 휴지통으로 끌어 지우기
// 운영 staff.html 2148-2169 (bindMoveDrag), 2761-2771 (dragTrash). 일별·주간 모두 data 속성만 봐요:
//   끌 것: [data-shift-id][data-date][data-wp] (data-name 이 있으면 확인 문구에 씀)
//   놓을 곳: [data-drop-wp] (없으면 근무 줄이 아닌 [data-wp]). 놓을 곳에 data-date 가 있고 날짜가 다르면 무시
{
  const A = window.App;
  const wide = () => window.matchMedia('(min-width:980px)').matches;
  const active = () => A.isAdmin() && wide() && A.state.wp === '전체';
  const bound = new WeakSet();
  let cur = null;          // 지금 끄는 근무 {id, wp, date, name, el}
  let trash = null;

  const nameOf = el => el.dataset.name || (el.querySelector('.nm, .n') || el).textContent.trim();
  const zoneOf = t => (t && t.closest) ? (t.closest('[data-drop-wp]') || t.closest('[data-wp]:not([data-shift-id]):not([data-night-id])')) : null;
  const zoneWp = z => z.dataset.dropWp || z.dataset.wp;
  const after = async (ds, msg) => { A.store.invalidate(ds, ds); await A.render({ keep: true }); A.toast(msg); };

  async function move(d, target) {
    if (!d || !target || d.wp === target) return;
    if (!await A.confirm({ title: `${d.name}님을 ${A.storeName(target)}로 옮길까요?`, text: `${A.fmt(d.date)} ${d.wp} → ${target}`, ok: '옮기기' })) return;
    if (await A.api.rpc('admin_move_shift', { p_admin_id: A.session.id, p_shift_id: Number(d.id), p_workplace: target }) === false) return;
    await after(d.date, `${d.name}님을 ${A.storeName(target)}로 옮겼어요`);
  }
  async function remove(d) {
    if (!d) return;
    if (!await A.confirm({ title: `${d.name}님 근무를 지울까요?`, text: `${A.fmt(d.date)} ${d.wp} 근무가 지워져요.`, ok: '지우기', danger: true })) return;
    if (await A.api.rpc('admin_delete_shift', { p_admin_id: A.session.id, p_shift_id: Number(d.id) }) === false) return;
    await after(d.date, `${d.name}님 근무를 지웠어요`);
  }

  function trashEl() {
    if (trash && document.contains(trash)) return trash;
    trash = document.createElement('div');
    trash.className = 'drag-trash';
    trash.setAttribute('aria-hidden', 'true');
    trash.innerHTML = `${A.ICON.x}<span>여기로 끌어 지우기</span>`;
    trash.addEventListener('dragover', e => { if (!cur) return; e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'move'; trash.classList.add('over'); });
    trash.addEventListener('dragleave', () => trash.classList.remove('over'));
    trash.addEventListener('drop', e => { e.preventDefault(); const d = cur; hide(); remove(d); });
    (document.getElementById('app') || document.body).appendChild(trash);
    return trash;
  }
  function hide() {
    if (trash) trash.classList.remove('show', 'over');
    document.querySelectorAll('.dragover').forEach(z => z.classList.remove('dragover'));
    if (cur && cur.el) cur.el.classList.remove('dragging');
  }

  function bind(root) {
    if (!root || bound.has(root) || !active()) return;
    bound.add(root);
    // 운영처럼 사람이 있는 근무만 (빈 자리 줄 .slot 은 빼요)
    root.querySelectorAll('[data-shift-id]:not(.slot)').forEach(el => { el.setAttribute('draggable', 'true'); el.classList.add('can-drag'); });
    root.addEventListener('dragstart', e => {
      const el = e.target.closest && e.target.closest('[data-shift-id][draggable="true"]');
      if (!el || !root.contains(el)) return;
      cur = { id: el.dataset.shiftId, wp: el.dataset.wp, date: el.dataset.date, name: nameOf(el), el };
      if (e.dataTransfer) { e.dataTransfer.setData('text/plain', String(cur.id)); e.dataTransfer.effectAllowed = 'move'; }
      el.classList.add('dragging');
      trashEl().classList.add('show');
    });
    root.addEventListener('dragend', () => { hide(); cur = null; });
    const okZone = z => z && cur && zoneWp(z) && zoneWp(z) !== cur.wp && (!z.dataset.date || z.dataset.date === cur.date);
    root.addEventListener('dragover', e => {
      const z = zoneOf(e.target);
      if (!okZone(z)) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      root.querySelectorAll('.dragover').forEach(x => { if (x !== z) x.classList.remove('dragover'); });
      z.classList.add('dragover');
    });
    root.addEventListener('dragleave', e => { const z = zoneOf(e.target); if (z && e.target === z) z.classList.remove('dragover'); });
    root.addEventListener('drop', e => {
      const z = zoneOf(e.target);
      if (!okZone(z)) return;
      e.preventDefault();
      const d = cur, target = zoneWp(z);
      hide();
      move(d, target);
    });
  }

  A.drag = { bind };
}

// ── js/20-swap.js ──
// 대타 게시판 (운영 staff.html 2312-2411): 구하는 중(근무일 16시 전까지) / 정해짐, 글 자세히(시트), 댓글 달기·지우기,
// 대신 들어가기(accept_sub), 내 글 내리기·관리자 지우기(cancel_sub). 그리고 A.swap.request(shift): 대타 구하기 시트(request_sub)
{
  const A = window.App;
  const esc = A.esc;
  const me = () => A.session;
  const where = s => `${A.fmt(s.date)} ${A.storeName(s.wp)}`;
  // 대타 마감 = 근무 당일 16:00 (운영 swapDeadline). 남은 시간 문구, 지났으면 ''
  const deadline = ds => new Date(ds + 'T16:00:00');
  const remain = ds => {
    const diff = deadline(ds) - Date.now();
    if (diff <= 0) return '';
    const mins = Math.floor(diff / 60000), d = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = mins % 60;
    return d > 0 ? `${d}일 ${h}시간` : h > 0 ? `${h}시간 ${m}분` : `${m}분`;
  };
  const isMine = s => !!me() && s.requesterId === me().id;
  const av = n => A.avatar(n, 'av sw-av');

  // 마지막으로 그린 목록 (자세히 시트가 씀)
  let board = { open: [], done: [], cm: {} };
  const find = id => board.open.find(x => x.id === id) || board.done.find(x => x.id === id);

  // ── 목록 ──
  function rowHtml(s) {
    const open = s.status === 'open', list = board.cm[s.id] || [];
    const top = `${A.storeTag(s.wp)}<span class="sw-date">${esc(A.fmt(s.date))}</span>${isMine(s) ? '<span class="tag soft">내 글</span>' : ''}`;
    const who = open ? `${esc(s.requesterName)}님이 구해요` : `${esc(s.requesterName)}님이 구했어요`;
    const left = open ? remain(s.date) : '';
    const meta = [left ? `마감까지 ${esc(left)}` : '', `댓글 ${list.length}`].filter(Boolean).join(' · ');
    return `<button class="lrow sw" data-sw="${s.id}">
      <span class="lm">
        <span class="sw-top">${top}</span>
        <span class="sw-who">${av(s.requesterName)}<span>${who}</span></span>
        ${open ? '' : `<span class="sw-take"><span class="tag green">${esc(s.takerName || '?')}님이 들어가요</span></span>`}
        ${s.reason ? `<span class="sw-why">${esc(s.reason)}</span>` : ''}
        <span class="sw-meta">${meta}</span>
      </span>${A.ICON.chev}</button>`;
  }
  const section = (title, list, emptyText) =>
    `<section class="sec"><div class="sec-h"><h2>${title}</h2><span class="aside">${list.length}개</span></div>${list.length ? list.map(rowHtml).join('') : `<div class="none">${emptyText}</div>`}</section>`;

  let boardSeq = 0;
  A.screen('swaps', {
    async render(el) {
      const mySeq = ++boardSeq;
      const [open0, done0] = await Promise.all([A.store.swaps({ status: 'open' }), A.store.swaps({ status: 'completed', limit: 30 })]);
      const done = done0.filter(s => s.date >= A.today()).slice(0, 10);   // 정해짐: 오늘 이후 근무만 (지난 기록은 빼요)
      const open = open0.filter(s => deadline(s.date) - Date.now() > 0);   // 당일 16시 지난 글은 숨김 (운영 2357)
      const cm = await A.store.comments([...open, ...done].map(s => s.id));
      if (mySeq !== boardSeq) return;                    // 더 새 그리기가 시작됐으면 옛 데이터로 덮지 않기
      board = { open, done, cm };
      let html = A.pageHead('대타', '빠져야 하는 근무를 올리고 대신 들어갈 사람을 찾아요');
      if (!open.length && !done.length) html += A.emptyBox('swap', '지금 구하는 대타가 없어요', '내 근무에서 대타를 올릴 수 있어요');
      else {
        html += section('구하는 중', open, '지금 구하는 대타가 없어요');
        if (done.length) html += section('정해짐', done, '');
      }
      el.innerHTML = html;
      el.querySelectorAll('[data-sw]').forEach(b => b.onclick = () => openDetail(+b.dataset.sw));
    },
  });

  // ── 글 자세히 ──
  function commentsHtml(s) {
    const list = board.cm[s.id] || [], u = me();
    return `<div class="sw-cm-h">댓글 <b>${list.length}</b></div>` + (list.length
      ? `<div class="sw-cms">${list.map(c => {
        const canDel = u && (c.authorId === u.id || u.is_admin);
        return `<div class="sw-cm">${A.avatar({ name: c.authorName, avatar: c.avatar }, 'av sw-av')}<div class="sw-cm-b"><b>${esc(c.authorName)}</b><span>${esc(c.body)}</span></div>${canDel ? `<button class="sw-cm-x" data-cdel="${c.id}" aria-label="댓글 지우기">${A.ICON.x}</button>` : ''}</div>`;
      }).join('')}</div>`
      : `<div class="none sw-none">아직 댓글이 없어요</div>`);
  }
  function detailHtml(s) {
    const open = s.status === 'open', left = open ? remain(s.date) : '';
    const note = open ? '' : `<p class="sw-state"><span class="tag green">${esc(s.takerName || '?')}님이 들어가요</span><span>대타가 정해졌어요.</span></p>`;
    return `<div class="sw-sd-top">${A.storeTag(s.wp)}${isMine(s) ? '<span class="tag soft">내 글</span>' : ''}</div>
      <div class="sw-sd-date">${esc(A.fmt(s.date))}</div>
      <div class="sw-who">${av(s.requesterName)}<span>${esc(s.requesterName)}님이 ${open ? '구해요' : '구했어요'}</span></div>
      ${s.reason ? `<div class="box sw-reason">${esc(s.reason)}</div>` : ''}
      ${left ? `<div class="sw-meta">마감까지 ${esc(left)}</div>` : ''}
      ${note}
      <div class="sw-cmbox" data-cm>${commentsHtml(s)}</div>
      ${open ? `<form class="sw-form" data-form><input class="fld" data-cmt maxlength="200" placeholder="댓글 달기" autocomplete="off" aria-label="댓글"><button type="submit" class="btn" disabled>등록</button></form>` : ''}`;
  }
  async function reloadComments(id, el) {
    const m = await A.store.comments([id]);
    board.cm[id] = m[id] || [];
    const box = el && el.querySelector('[data-cm]');
    if (box && document.contains(box)) { box.innerHTML = commentsHtml(find(id) || { id }); bindDel(id, el); }
  }
  function bindDel(id, el) {
    el.querySelectorAll('[data-cdel]').forEach(b => b.onclick = async () => {
      if (!await A.auth.require()) return;
      if (!await A.confirm({ title: '댓글을 지울까요?', text: '지우면 다시 볼 수 없어요.', ok: '지우기', danger: true })) return;
      const r = await A.api.rpc('delete_swap_comment', { p_staff_id: me().id, p_id: +b.dataset.cdel });
      if (r === false) return;
      await reloadComments(id, el);
      await A.render({ keep: true });
      A.toast('댓글을 지웠어요');
    });
  }
  function openDetail(id) {
    const s0 = find(id); if (!s0) return;
    const open = s0.status === 'open', admin = A.isAdmin();
    const actions = [];
    if (open && isMine(s0)) actions.push({ label: '글 내리기', kind: 'danger', onClick: c => withdraw(s0, c) });
    else if (open) {
      if (admin) actions.push({ label: '지우기', kind: 'danger', onClick: c => adminDelete(s0, c) });
      actions.push({ label: '대신 들어갈게요', kind: 'primary', onClick: c => take(s0, c) });
    }
    A.sheet({ title: '대타 글', html: detailHtml(s0), actions, onOpen: el => {
      bindDel(id, el);
      const form = el.querySelector('[data-form]');
      if (!form) return;
      const inp = form.querySelector('[data-cmt]'), btn = form.querySelector('button');
      let busy = false;
      inp.oninput = () => { btn.disabled = !inp.value.trim(); };
      form.onsubmit = async e => {
        e.preventDefault();
        const body = inp.value.trim();
        if (!body || busy) return;
        if (!await A.auth.require()) return;
        busy = true; btn.disabled = true;
        const r = await A.api.rpc('add_swap_comment', { p_staff_id: me().id, p_request_id: id, p_body: body });
        busy = false;
        if (r === false) { btn.disabled = !inp.value.trim(); return; }
        // 요청자 + 앞서 댓글 단 사람에게 푸시 (운영 2406 과 같은 body)
        A.api.notify({ request_id: id, body, author_name: me().name, author_id: me().id });
        inp.value = ''; btn.disabled = true;
        await reloadComments(id, el);
        await A.render({ keep: true });
        A.toast('댓글을 남겼어요');
        if (document.contains(inp)) inp.focus();
      };
      // Enter 로 등록 (운영 2410). 한글 조합 중에는 무시
      inp.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); if (form.requestSubmit) form.requestSubmit(); else form.dispatchEvent(new Event('submit', { cancelable: true })); } };
    } });
  }

  // ── 동작 ──
  // 그날 그 매장에 이미 내 근무가 있으면 true (읽기 실패면 막지 않아요)
  async function alreadyThere(s) {
    try {
      await A.store.ensure(s.date, s.date);
      return A.store.day(s.date, s.wp).shifts.some(x => x.staffId === me().id);
    } catch (e) { return false; }
  }
  async function take(s, close) {
    if (!await A.auth.require()) return;
    if (isMine(s)) { A.toast('내가 올린 대타 글이에요', true); return; }   // 로그인하고 보니 내 글
    if (await alreadyThere(s)) { A.toast('이 날 이 매장에 이미 근무가 있어서 대신 들어갈 수 없어요', true); return; }
    if (!await A.confirm({ title: `${where(s)}에 ${s.requesterName}님 대신 들어갈까요?`, text: `${s.requesterName}님은 이 근무에서 빠지고, 내 근무로 들어와요.`, ok: '들어갈게요' })) return;
    const r = await A.api.rpc('accept_sub', { p_staff_id: me().id, p_request_id: s.id });
    if (r === false) return;
    const v2 = !!(A.features && A.features.v2db);
    if (v2) A.api.notify({ event: 'swap_taken', request_id: s.id });   // 요청자에게 (v2 DB 가 있을 때만)
    close();
    A.store.invalidate(s.date, s.date);
    await A.render({ keep: true });
    A.toast(v2 ? `대타가 정해졌어요. ${s.requesterName}님에게 알려 드려요` : '대타를 맡았어요. 고마워요');
  }
  async function cancelReq(s, close, msg) {
    const r = await A.api.rpc('cancel_sub', { p_staff_id: me().id, p_request_id: s.id });
    if (r === false) return;
    close();
    A.store.invalidate(s.date, s.date);
    await A.render({ keep: true });
    A.toast(msg);
  }
  async function withdraw(s, close) {
    if (!await A.auth.require()) return;
    if (!await A.confirm({ title: '대타 글을 내릴까요?', text: `${where(s)} 근무는 그대로 내 근무로 남아요.`, ok: '글 내리기', cancel: '그대로 두기', danger: true })) return;
    await cancelReq(s, close, '대타 글을 내렸어요');
  }
  // 관리자는 남의 글도 내릴 수 있어요 (운영 2396-2399)
  async function adminDelete(s, close) {
    if (!await A.auth.require()) return;
    if (!await A.confirm({ title: '이 대타 글을 지울까요?', text: `${s.requesterName}님 · ${where(s)}. 지우면 게시판에서 사라지고, 근무는 ${s.requesterName}님에게 그대로 남아요.`, ok: '지우기', danger: true })) return;
    await cancelReq(s, close, '대타 글을 지웠어요');
  }

  // ── 대타 구하기 (내 근무, 일별 카드에서) ── shift: Shift (주간 근무만; 야간은 request_sub 가 받지 않아요)
  // 보름 안에 2번 이상 구했으면 한 번 더 물어봐요 (운영 2323-2332, 문구만 부드럽게)
  async function nagOk(u) {
    const since = new Date(Date.now() - 15 * 864e5).toISOString();
    const cnt = (await A.store.swaps({ requesterId: u.id, since })).filter(r => r.status !== 'cancelled').length;
    if (cnt < 2) return true;
    return A.confirm({ title: `최근 보름 동안 대타를 ${cnt}번 구했어요`, text: '자주 빠지면 같이 일하는 분들이 힘들 수 있어요. 그래도 올릴까요?', ok: '그래도 올리기', cancel: '다시 생각하기' });
  }
  async function request(shift) {
    if (!shift || shift.id == null || shift.night) return false;
    if (!await A.auth.require()) return false;
    return new Promise(res => {
      let done = false, busy = false;
      const fin = v => { if (!done) { done = true; res(v); } };
      A.sheet({
        title: '대타 구하기',
        html: `<p class="sheet-p">${esc(where(shift))} 근무에서 빠져요. 게시판에 올리면 대신 들어갈 사람을 찾을 수 있어요.</p>
          <label class="fld-l">빠져야 하는 이유 (안 적어도 돼요)<textarea class="fld" data-why placeholder="예: 갑자기 일이 생겼어요"></textarea></label>`,
        onClose: () => fin(false),
        actions: [{ label: '취소' }, { label: '대타 올리기', kind: 'primary', onClick: async (c, el) => {
          if (busy) return;
          const u = me(); if (!u) { c(); return; }
          const btn = el.querySelector('.sheet-a .primary');
          busy = true; btn.setAttribute('aria-busy', 'true');
          try {
            const reason = el.querySelector('[data-why]').value.trim();
            if (!await nagOk(u)) return;
            const r = await A.api.rpc('request_sub', { p_staff_id: u.id, p_shift_id: shift.id, p_reason: reason || null });
            if (r === false) return;
            A.api.notify({ to: 'admins', title: '대타 요청', body: `${u.name}님이 대타를 구해요`, exclude_id: u.id });   // 운영 2334
            fin(true); c();
            A.store.invalidate(shift.date, shift.date);
            await A.render({ keep: true });
            A.toast('대타 요청을 올렸어요');
            if (A.state.tab !== 'swaps') {
              A.confirm({ title: '대타를 올렸어요', text: '게시판에서 댓글을 받고 대신 들어갈 사람을 만날 수 있어요.', ok: '게시판 보기', cancel: '여기에 있기' })
                .then(go => { if (go) A.go('swaps'); });
            }
          } finally { busy = false; if (document.contains(btn)) btn.removeAttribute('aria-busy'); }
        } }],
        onOpen: el => el.querySelector('[data-why]').focus(),
      });
    });
  }

  A.swap = { request };
}

// ── js/21-mine.js ──
// 내 근무 (운영 staff.html 2414-2458): 오늘부터, 공개된 달만, 야간 포함. 오늘 카드(같이 일하는 사람) + 달별 목록,
// 근무 시트에서 출근표 보기 · 대타 구하기(A.swap.request) · 대타 글 내리기(cancel_sub). 로그아웃이면 로그인 안내
{
  const A = window.App;
  const esc = A.esc;
  const me = () => A.session;
  const where = (ds, wp) => `${A.fmt(ds)} ${A.storeName(wp)}`;
  const floorIdx = wp => { const i = A.FLOORS.findIndex(f => f[0] === wp); return i < 0 ? 9 : i; };
  // 대타 마감(근무일 16:00)까지 남은 시간 (20-swap.js 와 같은 계산)
  const remain = ds => {
    const diff = new Date(ds + 'T16:00:00') - Date.now();
    if (diff <= 0) return '';
    const mins = Math.floor(diff / 60000), d = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = mins % 60;
    return d > 0 ? `${d}일 ${h}시간` : h > 0 ? `${h}시간 ${m}분` : `${m}분`;
  };
  const seeking = e => !!(e.shift && e.shift.status === 'seeking_sub');
  const swapTag = e => seeking(e) ? '<span class="tag red">대타 구하는 중</span>' : '';
  const nightTag = e => e.night ? '<span class="tag">야간</span>' : '';

  // 주간 근무(Shift) 한 건 = 한 줄. 같은 날·매장 야간(Night)은 그 줄에 붙이고, 야간만 있으면 따로 한 줄
  function entriesOf(items) {
    const out = [], byKey = new Map();
    items.filter(x => !x.night).forEach(x => {
      const e = { date: x.date, wp: x.wp, shift: x, night: null };
      out.push(e);
      const k = x.date + '|' + x.wp; if (!byKey.has(k)) byKey.set(k, e);
    });
    items.filter(x => x.night).forEach(x => {
      const k = x.date + '|' + x.wp, e = byKey.get(k);
      if (e && !e.night) e.night = x;
      else { const n = { date: x.date, wp: x.wp, shift: null, night: x }; out.push(n); if (!e) byKey.set(k, n); }
    });
    return out.sort((a, b) => a.date.localeCompare(b.date) || (floorIdx(a.wp) - floorIdx(b.wp)) || ((a.shift ? 0 : 1) - (b.shift ? 0 : 1)));
  }

  // 그날 출근표 (ensure 뒤 바로 읽기). 실패하면 null
  async function dayOf(e) {
    try { await A.store.ensure(e.date, e.date); return A.store.day(e.date, e.wp); } catch (err) { return null; }
  }
  function whatText(e) {
    const t = [];
    if (e.shift) t.push('주간' + (e.shift.start ? ` ${e.shift.start}${e.shift.end ? '~' + e.shift.end : ''}` : ''));
    if (e.night) t.push('야간');
    return t.join(' + ');
  }
  // 야간 시간은 night_view.hours 글자 그대로
  // 내가 직접 넣은 야간 시간(start~end)이 있으면 그걸 먼저 보여줘요
  const ownTime = x => x && (x.start || x.end) ? `${x.start || ''}~${x.end || ''}` : '';
  const hoursHtml = (e, d) => {
    const t = e.night && (ownTime(e.night) || (d && d.night && d.night.hours));
    return t ? `<div class="mn-hours">${esc(t)}</div>` : '';
  };
  function withHtml(e, d) {
    if (!d) return '';
    const myId = me() && me().id;
    const day = d.shifts.filter(x => x.staffId !== myId).map(x => x.name);
    const night = d.night ? d.night.members.filter(x => !x.short && x.staffId !== myId).map(x => x.name) : [];
    const line = (k, l) => l.length ? `<div class="mn-with"><span>${k}</span>${esc(l.join(', '))}</div>` : '';
    return line(e.night ? '주간' : '같이 일해요', day) + (e.night ? line('야간', night) : '')
      || `<div class="mn-with"><span>같이 일해요</span>아직 정해진 사람이 없어요</div>`;
  }
  function todayCard(e, d, i) {
    const act = e.shift
      ? (seeking(e) ? `<button class="btn danger" data-t-cancel="${i}">대타 글 내리기</button>` : remain(e.date) ? `<button class="btn" data-t-seek="${i}">대타 구하기</button>` : '')
      : '';
    return `<div class="box mn-today" data-theme="${A.themeKey(e.wp)}">
        <div class="mn-t-top">${A.storeTag(e.wp)}${nightTag(e)}${swapTag(e)}</div>
        <div class="mn-t-date">${esc(A.fmt(e.date))}</div>
        <div class="mn-t-what">${esc(whatText(e))}</div>
        ${hoursHtml(e, d)}
        ${withHtml(e, d)}
        <div class="mn-t-acts"><button class="btn" data-t-day="${i}">출근표 보기</button>${act}</div>
      </div>`;
  }
  function rowHtml(e, i) {
    const d = A.parse(e.date), dow = d.getDay();
    return `<button class="lrow mn-row" data-i="${i}"><span class="mn-d"><b>${d.getMonth() + 1}/${d.getDate()}</b><small class="${dow === 0 ? 'sun' : dow === 6 ? 'sat' : ''}">${A.DAYS[dow]}</small></span>
      <span class="lm"><span class="mn-line">${A.storeTag(e.wp)}${nightTag(e)}${swapTag(e)}</span></span>${A.ICON.chev}</button>`;
  }

  A.screen('mine', {
    async render(el) {
      if (!me()) {
        el.innerHTML = A.pageHead('내 근무', '로그인하면 다가오는 내 근무를 볼 수 있어요')
          + A.emptyBox('mine', '로그인이 필요해요', '이름과 PIN으로 로그인해 주세요')
          + '<button class="btn lg primary mn-login" data-login>로그인하기</button>';
        el.querySelector('[data-login]').onclick = () => A.auth.openLogin();
        return;
      }
      const list = entriesOf(await A.store.myShifts());
      let html = A.pageHead('내 근무', `다가오는 근무 ${list.length}개`);
      if (!list.length) { el.innerHTML = html + A.emptyBox('mine', '다가오는 근무가 없어요', '스케줄이 나오면 여기에 보여요'); return; }
      const td = A.today();
      const today = list.filter(e => e.date === td), rest = list.filter(e => e.date !== td);
      if (today.length) {
        const d = await dayOf(today[0]);
        const days = today.map(e => e.wp === today[0].wp ? d : A.store.day(e.date, e.wp));
        html += `<section class="sec"><div class="sec-h"><h2>오늘</h2></div><div class="mn-todays">${today.map((e, i) => todayCard(e, days[i], i)).join('')}</div></section>`;
      }
      const groups = new Map();
      rest.forEach((e, i) => { const k = A.ymOf(e.date); if (!groups.has(k)) groups.set(k, []); groups.get(k).push([e, i]); });
      groups.forEach((items, ym) => {
        html += `<section class="sec"><div class="sec-h"><h2>${+ym.slice(5)}월</h2><span class="aside">${items.length}번</span></div>${items.map(([e, i]) => rowHtml(e, i)).join('')}</section>`;
      });
      el.innerHTML = html;
      el.querySelectorAll('[data-t-day]').forEach(b => b.onclick = () => { const e = today[+b.dataset.tDay]; A.goDay(e.date, e.wp); });
      el.querySelectorAll('[data-t-seek]').forEach(b => b.onclick = () => seek(today[+b.dataset.tSeek]));
      el.querySelectorAll('[data-t-cancel]').forEach(b => b.onclick = () => withdraw(today[+b.dataset.tCancel]));
      el.querySelectorAll('[data-i]').forEach(b => b.onclick = () => openShift(rest[+b.dataset.i]));
    },
  });

  const seek = e => {
    if (A.swap && A.swap.request) return A.swap.request(e.shift);
    A.toast('대타 구하기는 준비 중이에요');
  };
  // 이 근무의 열린 대타 요청 (운영 2455: swap_view shift_id + open)
  const openReq = async e => (await A.store.swaps({ shiftId: e.shift.id, status: 'open' }))[0] || null;

  async function openShift(e) {
    const [d, sw] = await Promise.all([dayOf(e), seeking(e) ? openReq(e) : null]);
    let info;
    if (!e.shift) info = '야간 근무는 대타 게시판에 올릴 수 없어요. 빠져야 하면 관리자에게 말해 주세요.';
    else if (seeking(e)) { const left = sw && remain(e.date); info = left ? `대타를 구하는 중이에요. 마감까지 ${left} 남았어요.` : '대타를 구하는 중이에요.'; }
    else info = '빠져야 하면 대타를 올려서 대신 들어갈 사람을 찾을 수 있어요.';
    const actions = [{ label: '출근표에서 보기', onClick: c => { c(); A.goDay(e.date, e.wp); } }];
    if (e.shift && !seeking(e) && remain(e.date)) actions.push({ label: '대타 구하기', kind: 'primary', onClick: c => { c(); seek(e); } });
    else if (seeking(e)) actions.push({ label: '대타 글 내리기', kind: 'danger', onClick: c => { c(); withdraw(e, sw); } });
    if (A.shiftTime && e.wp === '데빌' && bizDay() <= e.date) {
      const kinds = [e.shift && 'day', e.night && 'night'].filter(Boolean);
      kinds.forEach((k, n) => actions.splice(1 + n, 0, { label: kinds.length > 1 ? (k === 'day' ? '주간 시간 바꾸기' : '야간 시간 바꾸기') : '시간 바꾸기', onClick: c => { c(); editTime(e, k, d); } }));
    }
    A.sheet({ title: A.fmt(e.date), actions, html: `<div class="mn-sh-top">${A.storeTag(e.wp)}${nightTag(e)}${swapTag(e)}</div>
      <p class="mn-sh-what">${esc(whatText(e))}</p>${hoursHtml(e, d)}${withHtml(e, d)}<p class="sheet-p">${esc(info)}</p>` });
  }

  // 영업일: 한국 시간 06시 전이면 전날 (DB set_my_shift_time 과 같은 기준)
  const bizDay = () => new Date(Date.now() + 3 * 3600000).toISOString().slice(0, 10);

  // 근무 시간 바꾸기 (데빌 주간 shifts / 야간 night_members). 비우면 기본 시간으로 돌아가요
  function editTime(e, kind, d) {
    const x = kind === 'night' ? e.night : e.shift;
    let st = x.start || '', en = x.end || '';
    const own = !!(st || en);
    if (!own && d && d.night && d.night.hours) {
      // "주간 16:00~23:00 · 야간 23:00~익일 05:00" 에서 이 근무 쪽 시간만
      const h = String(d.night.hours), part = (h.match(new RegExp((kind === 'night' ? '야간' : '주간') + '\\s*([^·]+)')) || [])[1] || (/주간|야간/.test(h) ? '' : h);
      const m = part.match(/\b\d{1,2}:\d{2}\b/g) || [];
      const pad = t => t.padStart(5, '0');
      st = m[0] ? pad(m[0]) : ''; en = m[1] ? pad(m[1]) : '';
    }
    let busy = false;
    const send = async (c, a, b, done) => {
      if (busy) return;
      if (!await A.auth.require()) return;
      busy = true;
      const r = await A.api.rpc('set_my_shift_time', { p_staff_id: me().id, p_kind: kind, p_id: x.id, p_start: a, p_end: b });
      busy = false;
      if (r === false) return;
      c();
      A.store.invalidate(e.date, e.date);
      await A.render({ keep: true });
      A.toast(done);
    };
    const actions = [{ label: '저장', kind: 'primary', onClick: (c, w) => {
      const q = n => w.querySelector(`[data-tm="${n}"]`).value;
      const a = q('s'), b = q('e');
      if (!a || !b) { A.toast('출근과 퇴근을 넣어 주세요', true); return; }
      send(c, a, b, '시간을 바꿨어요');
    } }];
    if (own) actions.push({ label: '기본 시간으로', onClick: c => send(c, '', '', '기본 시간으로 돌렸어요') });
    A.sheet({ title: `${A.fmt(e.date)} 시간`, actions, html: `<div class="fld-row"><label class="fld-l">출근<input class="fld" type="time" data-tm="s" value="${esc(st)}"></label><label class="fld-l">퇴근<input class="fld" type="time" data-tm="e" value="${esc(en)}"></label></div>` });
  }

  // 대타 요청 취소: 열린 요청을 찾아 cancel_sub (운영 2452-2457)
  async function withdraw(e, sw) {
    if (!await A.auth.require()) return;
    if (!await A.confirm({ title: '대타 글을 내릴까요?', text: `${where(e.date, e.wp)} 근무는 그대로 내 근무로 남아요.`, ok: '글 내리기', cancel: '그대로 두기', danger: true })) return;
    const req = sw || await openReq(e);
    if (!req) {
      A.store.invalidate(e.date, e.date);
      await A.render({ keep: true });
      A.toast('열린 대타 요청을 찾지 못했어요', true);
      return;
    }
    const r = await A.api.rpc('cancel_sub', { p_staff_id: me().id, p_request_id: req.id });
    if (r === false) return;
    A.store.invalidate(e.date, e.date);
    await A.render({ keep: true });
    A.toast('대타 요청을 취소했어요');
  }
}

// ── js/22-bell.js ──
// 종(알림) 시트 (운영 staff.html 1667-1722 의 관리자 알림 탭 + v2 개인 알림)
// - A.features.v2db: 로그인 뒤 my_notifications 를 한 번 조용히 불러 보고, 함수가 없으면 false 그대로
// - 관리자: 빈 자리 신청(수락/거절) · 대타 구하는 중 · 최근 정해진 대타 10건. 안 읽음 = noti_seen_ids ('ap:<id>' / 'sw:<id>', 최근 500개)
// - 모두: v2db 가 켜져 있으면 내 알림 (누르면 그 화면으로, mark_my_notifications_read)
{
  const A = window.App;
  const esc = A.esc;
  const features = A.features = A.features || { v2db: false };   // 같은 객체를 계속 써요 (v2db 만 바꿈)
  let pendingReady = null;
  A.featuresReady = A.session ? new Promise(r => { pendingReady = r; }) : Promise.resolve(false);
  const settleReady = v => { if (pendingReady) { const res = pendingReady; pendingReady = null; res(v); } };
  // 예전 세션이 풀리거나 바꾸기가 실패하면 probe 가 안 돌아요. 기다리는 화면이 멈추지 않게 false 로 끝내요
  if (pendingReady) setTimeout(() => settleReady(false), 6000);

  const SEEN_KEY = 'noti_seen_ids';
  const seen = () => { try { return new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || '[]')); } catch (e) { return new Set(); } };
  const saveSeen = set => localStorage.setItem(SEEN_KEY, JSON.stringify([...set].slice(-500)));

  const MISSING_RE = /Could not find the function|does not exist/i;
  const isMissing = err => !!err && (err.code === 'PGRST202' || err.code === '42883' || MISSING_RE.test(String(err.message || '')));

  let sid = null;          // 지금 상태가 누구 것인지
  let probeP = null;
  let personal = [];       // my_notifications 줄
  let adminKeys = [];      // 안 읽음 셀 대상: 열린 신청 + 열린 대타
  let lastFetch = 0, refreshing = null, btnRef = null;

  function reset(id) { sid = id; probeP = null; personal = []; adminKeys = []; lastFetch = 0; }
  const fetchMine = s => A.api.direct('my_notifications', { p_staff_id: s.id, p_pin: s.pin, p_limit: 30 });

  // 로그인 뒤 한 번. 예전 PIN 세션(tk_ 아님)은 upgradeSession 이 바꾼 뒤에만 (안 그러면 토큰 오류로 로그아웃돼요)
  function probe() {
    const s = A.session;
    if (!s || !String(s.pin || '').startsWith('tk_')) { settleReady(false); return null; }
    if (sid !== s.id) reset(s.id);
    if (probeP) return probeP;
    const p = probeP = (async () => {
      const r = await fetchMine(s);
      if (!A.session || A.session.id !== s.id) return features.v2db;
      if (r.error) {
        if (isMissing(r.error)) features.v2db = false;
        else if (probeP === p) probeP = null;   // 네트워크 등: 다음 mount 때 다시. 죽은 토큰은 api 가 처리
        return features.v2db;
      }
      const was = features.v2db;
      features.v2db = true;
      personal = Array.isArray(r.data) ? r.data : [];
      // DB 기능이 처음 보이면 한 번만 다시 그려서 숨겨 둔 v2 기능을 보여 줘요
      if (!was) A.render({ keep: true });
      return true;
    })();
    if (pendingReady) { const res = pendingReady; pendingReady = null; p.then(res, () => res(false)); }
    else A.featuresReady = p;
    return p;
  }

  const unread = () => {
    const sn = seen();
    const a = A.isAdmin() ? adminKeys.filter(k => !sn.has(k)).length : 0;
    const p = features.v2db ? personal.filter(n => !n.read_at).length : 0;
    return a + p;
  };
  function paint() {
    const btn = btnRef;
    if (!btn || !document.contains(btn)) return;
    btn.hidden = !A.isAdmin() && !features.v2db;   // 직원은 개인 알림이 생긴 뒤에만 종을 보여요
    const n = unread();
    let b = btn.querySelector('.nbadge');
    if (n > 0) {
      if (!b) { b = document.createElement('span'); b.className = 'nbadge'; btn.appendChild(b); }
      b.textContent = n > 99 ? '99+' : String(n);
    } else if (b) b.remove();
    btn.setAttribute('aria-label', n > 0 ? `알림 ${n}개` : '알림');
  }

  // 배지용 가벼운 읽기 (운영 updateNotiBadge). force 가 아니면 30초에 한 번
  function refresh(force = false) {
    const s = A.session;
    if (!s) return Promise.resolve();
    if (!force && Date.now() - lastFetch < 30000) return refreshing || Promise.resolve();
    if (refreshing) return refreshing;
    lastFetch = Date.now();
    const id = s.id;
    refreshing = (async () => {
      const [ap, sw, mine] = await Promise.all([
        A.isAdmin() ? A.supa.from('application_view').select('id') : null,
        A.isAdmin() ? A.supa.from('swap_view').select('id,work_date').eq('status', 'open').gte('work_date', A.today()) : null,
        features.v2db ? fetchMine(s) : null,
      ]);
      if (!A.session || A.session.id !== id) return;
      if (ap && sw && !ap.error && !sw.error) adminKeys = [...(ap.data || []).map(a => 'ap:' + a.id), ...(sw.data || []).filter(x => new Date(x.work_date + 'T16:00:00') > Date.now()).map(x => 'sw:' + x.id)];   // 마감 지난 글 빼기
      if (mine && !mine.error) personal = Array.isArray(mine.data) ? mine.data : [];
    })().catch(() => {}).finally(() => { refreshing = null; paint(); });
    return refreshing;
  }

  // ── 시트 ──
  const ago = iso => {
    const t = Date.parse(iso || ''); if (!t) return '';
    const m = Math.floor((Date.now() - t) / 60000);
    if (m < 1) return '방금';
    if (m < 60) return `${m}분 전`;
    const h = Math.floor(m / 60); if (h < 24) return `${h}시간 전`;
    const d = Math.floor(h / 24); if (d < 7) return `${d}일 전`;
    return A.fmtShort(A.ymd(new Date(t)));
  };
  const when = (ds, wp) => `${A.fmtShort(ds)} ${A.storeName(wp)}`;

  let data = { apps: [], open: [], done: [], ok: false };
  async function load() {
    const s = A.session, admin = A.isAdmin();
    let [apR, open, done, mine] = await Promise.all([
      admin ? A.supa.from('application_view').select('*').order('work_date') : null,
      admin ? A.store.swaps({ status: 'open' }) : [],
      admin ? A.store.swaps({ status: 'completed', limit: 10 }) : [],
      features.v2db ? fetchMine(s) : null,
    ]);
    if (apR && apR.error) A.toast('불러오지 못했어요. 당겨서 새로고침해 주세요', true);
    const apps = (apR && apR.data || []).map(a => ({ id: a.id, shiftId: a.shift_id, staffId: a.applicant_id, name: a.applicant_name || '', date: a.work_date, wp: a.workplace }));
    open = open.filter(x => new Date(x.date + 'T16:00:00') > Date.now());   // 마감(근무일 16:00) 지난 글은 게시판처럼 빼요
    data = { apps, open, done, ok: true };
    if (admin && apR && !apR.error) adminKeys = [...apps.map(a => 'ap:' + a.id), ...open.map(x => 'sw:' + x.id)];
    if (mine && !mine.error) personal = Array.isArray(mine.data) ? mine.data : [];
    lastFetch = Date.now();
  }
  function bodyHtml() {
    const sn = seen(), admin = A.isAdmin();
    const head = (t, n) => `<div class="bl-h">${t}${n ? ` <b>${n}</b>` : ''}</div>`;
    let html = '';
    if (features.v2db && personal.length) {
      html += head('내 알림') + `<div class="noti-list">${personal.map(n => `<button class="noti${n.read_at ? '' : ' unread'}" data-p="${esc(n.id)}"><span class="noti-t">${esc(n.title || '')}</span>${n.body ? `<span class="noti-b">${esc(n.body)}</span>` : ''}<span class="noti-s">${esc(ago(n.created_at))}</span></button>`).join('')}</div>`;
    }
    if (admin) {
      const { apps, open, done } = data;
      if (apps.length) html += head('빈 자리 신청', apps.length) + `<div class="noti-list">${apps.map(a => `<div class="noti bl-ap${sn.has('ap:' + a.id) ? '' : ' unread'}">
          <span class="noti-t">${esc(a.name)}님이 ${esc(when(a.date, a.wp))} 빈 자리에 신청했어요</span>
          <span class="bl-acts"><button class="btn sm ghost" data-rej="${a.id}">거절</button><button class="btn sm" data-ok="${a.id}">수락</button></span></div>`).join('')}</div>`;
      if (open.length) html += head('대타 구하는 중', open.length) + `<div class="noti-list">${open.map(x => `<button class="noti${sn.has('sw:' + x.id) ? '' : ' unread'}" data-sw="${x.id}"><span class="noti-t">${esc(x.requesterName)}님이 ${esc(when(x.date, x.wp))} 대타를 구해요</span>${x.reason ? `<span class="noti-b">${esc(x.reason)}</span>` : ''}<span class="noti-s">${esc(ago(x.createdAt))}</span></button>`).join('')}</div>`;
      if (done.length) html += head('최근 정해진 대타') + `<div class="noti-list">${done.map(x => `<button class="noti" data-done="${x.id}"><span class="noti-t">${esc(x.takerName || '?')}님이 ${esc(x.requesterName)}님 대타를 맡았어요</span><span class="noti-s">${esc(when(x.date, x.wp))}</span></button>`).join('')}</div>`;
    }
    return html || A.emptyBox('bell', '새 알림이 없어요', admin ? '빈 자리 신청이나 대타 글이 오면 여기에 보여요' : '');
  }

  // 알림 링크로 가기: {tab, date?, workplace?, ym?}
  function follow(l) {
    if (!l || !l.tab) return;
    const o = {};
    if (l.date) o.date = l.date;
    if (l.workplace) o.wp = l.workplace;
    if (l.tab === 'schedule') {
      if (l.date) o.view = 'day';
      else if (l.ym) { o.date = l.ym + '-01'; o.view = 'month'; }
    }
    A.go(l.tab, o);
  }
  function markPersonal(ids) {
    const s = A.session; if (!s || !features.v2db) return;
    const now = new Date().toISOString();
    personal.forEach(n => { if (!n.read_at && (!ids || ids.includes(n.id))) n.read_at = now; });
    return A.api.rpc('mark_my_notifications_read', { p_staff_id: s.id, p_ids: ids }, { quiet: true });
  }
  const markSeen = keys => { const sn = seen(); keys.forEach(k => sn.add(k)); saveSeen(sn); };

  function draw(el, close) {
    const box = el.querySelector('[data-bl]');
    if (!box || !document.contains(box)) return;
    box.innerHTML = bodyHtml();
    box.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
      const n = personal.find(x => String(x.id) === b.dataset.p); if (!n) return;
      if (!n.read_at) markPersonal([n.id]);
      close(); paint(); follow(n.link);
    });
    box.querySelectorAll('[data-sw]').forEach(b => b.onclick = () => { markSeen(['sw:' + b.dataset.sw]); close(); paint(); A.go('swaps'); });
    box.querySelectorAll('[data-done]').forEach(b => b.onclick = () => { close(); A.go('swaps'); });
    box.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => decide(+b.dataset.ok, true, el, close));
    box.querySelectorAll('[data-rej]').forEach(b => b.onclick = () => decide(+b.dataset.rej, false, el, close));
  }
  // 수락/거절 (운영 1719-1721). 하나 처리하는 동안 다른 수락·거절은 막아요 (같은 자리 두 명 수락 방지)
  let deciding = false;
  async function decide(id, ok, el, close) {
    const a = data.apps.find(x => x.id === id), s = A.session;
    if (!a || !s || deciding) return;
    deciding = true;
    const btns = [...el.querySelectorAll('[data-ok],[data-rej]')];
    btns.forEach(b => { b.disabled = true; });
    try {
      if (!ok && !await A.confirm({ title: `${a.name}님 신청을 거절할까요?`, text: features.v2db ? `${a.name}님에게 거절 알림이 가요.` : `${when(a.date, a.wp)} 빈 자리 신청이에요.`, ok: '거절하기', danger: true })) return;
      const r = await A.api.rpc(ok ? 'admin_approve_application' : 'admin_reject_application', { p_admin_id: s.id, p_app_id: id });
      if (r === false) return;
      if (features.v2db) A.api.notify({ event: 'application_decided', app_id: id });   // 신청자에게 (v2 DB 가 있을 때만)
      markSeen(['ap:' + id]);
      A.store.invalidate(a.date, a.date);
      await A.render({ keep: true });
      A.toast(ok ? '신청을 수락해 배정했어요' : '신청을 거절했어요');
      await load();
      draw(el, close); paint();
    } finally { deciding = false; btns.forEach(b => { if (document.contains(b)) b.disabled = false; }); }
  }
  async function open() {
    if (!A.session) { A.auth.openLogin(); return; }
    const sh = A.sheet({
      title: '알림',
      html: '<div class="bl-body" data-bl><div class="bl-load"><span class="spin"></span></div></div>',
      actions: [{ label: '모두 읽음으로', onClick: async c => {
        markSeen(adminKeys);
        if (features.v2db && personal.some(n => !n.read_at)) await markPersonal(null);
        c(); paint(); A.toast('알림을 모두 읽었어요');
      } }],
    });
    await probe();
    await load();
    draw(sh.el, sh.close);
    paint();
  }

  // core 의 renderShell 이 그릴 때마다 새 종 버튼을 줘요
  function mount(btn) {
    const s = A.session;
    if (!s) return;
    if (sid !== s.id) reset(s.id);
    btnRef = btn;
    btn.onclick = open;
    paint();
    const p = probe();
    if (p) p.then(() => { paint(); refresh(); });
    else refresh();
  }

  A.bell = { mount, open, refresh: () => refresh(true), unread };
}

// ── js/23-account.js ──
// 내 정보 (운영 staff.html 1120-1229): 사진 바꾸기(280 정사각 자르기 → 256×256 JPEG q0.85), 인스타(my_profile / set_my_instagram),
// PIN 바꾸기(6자리, 지금 PIN 칸 없음: set_my_pin), 푸시 켜기, 로그아웃. 임시 PIN 로그인이면 A.onTempPin 이 PIN 바꾸기를 열어요
{
  const A = window.App;
  const esc = A.esc;
  const D = 280, OUT = 256;   // 화면 자르기 칸 / 올릴 크기 (운영 CROP_D, S)

  // ── 사진 고르기 → 자르기 ──
  function pickPhoto(onDone) {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = () => {
      const file = inp.files && inp.files[0]; if (!file) return;
      const rd = new FileReader();
      rd.onload = () => {
        const img = new Image();
        img.onload = () => openCrop(img, onDone);
        img.onerror = () => A.toast('이미지를 읽지 못했어요', true);
        img.src = rd.result;
      };
      rd.onerror = () => A.toast('파일 읽기 실패', true);
      rd.readAsDataURL(file);
    };
    inp.click();
  }
  function openCrop(img, onDone) {
    const st = { img, base: Math.max(D / img.width, D / img.height), zoom: 1, x: 0, y: 0 };
    const sc = () => st.base * st.zoom;
    const center = () => { st.x = (D - img.width * sc()) / 2; st.y = (D - img.height * sc()) / 2; };
    const clamp = () => {
      const w = img.width * sc(), h = img.height * sc();
      st.x = Math.min(0, Math.max(D - w, st.x)); st.y = Math.min(0, Math.max(D - h, st.y));
    };
    let cv, ctx;
    const draw = () => { ctx.clearRect(0, 0, D, D); ctx.drawImage(img, st.x, st.y, img.width * sc(), img.height * sc()); };
    let busy = false;
    A.sheet({
      title: '사진 자르기',
      html: `<div class="crop-wrap"><canvas class="crop-cv" width="${D}" height="${D}" aria-label="끌어서 자리 맞추기"></canvas><div class="crop-ring"></div></div>
        <label class="fld-l">크기<input type="range" class="crop-zoom" min="1" max="3" step="0.01" value="1" aria-label="사진 크기"></label>
        <p class="sheet-note">끌어서 자리를 맞추고, 막대로 크기를 정해요.</p>`,
      actions: [{ label: '취소' }, { label: '이 사진으로', kind: 'primary', onClick: (close, el) => {
        if (busy) return; busy = true;
        const c = document.createElement('canvas'); c.width = OUT; c.height = OUT;
        const g = c.getContext('2d'), r = OUT / D;
        g.fillStyle = '#fff'; g.fillRect(0, 0, OUT, OUT);   // 투명한 PNG 가 검게 나오지 않게
        g.drawImage(img, st.x * r, st.y * r, img.width * sc() * r, img.height * sc() * r);
        c.toBlob(async blob => {
          close();
          if (!blob) { A.toast('사진을 만들지 못했어요', true); return; }
          // uploadAvatar 가 올리기 + set_my_avatar + auth.update({avatar}) + 알림까지 해요
          const url = await A.api.uploadAvatar(blob);
          if (url === false) return;
          A.store.invalidateAll();
          await A.render({ keep: true });
          if (onDone) onDone(url);
        }, 'image/jpeg', 0.85);
      } }],
      onOpen: el => {
        cv = el.querySelector('.crop-cv'); ctx = cv.getContext('2d');
        center(); draw();
        const zoom = el.querySelector('.crop-zoom');
        zoom.oninput = () => {
          const prev = sc(); st.zoom = Number(zoom.value); const now = sc();
          st.x = D / 2 - (D / 2 - st.x) * (now / prev); st.y = D / 2 - (D / 2 - st.y) * (now / prev);
          clamp(); draw();
        };
        // 끌기: 포인터를 붙잡아서 바깥에서 놓아도 시트가 닫히지 않게
        let drag = null;
        cv.addEventListener('pointerdown', e => { drag = { id: e.pointerId, x: e.clientX, y: e.clientY }; try { cv.setPointerCapture(e.pointerId); } catch (_) {} e.preventDefault(); });
        cv.addEventListener('pointermove', e => {
          if (!drag || e.pointerId !== drag.id) return;
          const k = D / cv.getBoundingClientRect().width;   // 좁은 화면에서는 캔버스가 작게 보여요
          st.x += (e.clientX - drag.x) * k; st.y += (e.clientY - drag.y) * k;
          drag.x = e.clientX; drag.y = e.clientY;
          clamp(); draw();
        });
        const end = e => { if (drag && e.pointerId === drag.id) { drag = null; try { cv.releasePointerCapture(e.pointerId); } catch (_) {} } };
        cv.addEventListener('pointerup', end);
        cv.addEventListener('pointercancel', end);
        cv.addEventListener('click', e => e.stopPropagation());
      },
    });
  }

  // ── PIN 바꾸기 (운영 1134-1141) ──
  function openPin({ note } = {}) {
    let busy = false;
    const submit = async (close, el) => {
      if (busy) return;
      const inp = el.querySelector('[data-pin]'), err = el.querySelector('.sheet-err'), v = inp.value.trim();
      if (!/^\d{6}$/.test(v)) { err.hidden = false; err.textContent = 'PIN은 숫자 6자리로 적어 주세요'; inp.focus(); return; }
      const s = A.session; if (!s) { close(); A.auth.openLogin(); return; }
      busy = true; err.hidden = true;
      const r = await A.api.rpc('set_my_pin', { p_staff_id: s.id, p_new_pin: v });
      busy = false;
      if (r === false) return;
      inp.value = '';
      A.auth.update({ pin_temp: false });
      close();
      A.toast('PIN을 바꿨어요');
    };
    A.sheet({
      title: 'PIN 바꾸기',
      html: `${note ? `<p class="sheet-p">${esc(note)}</p>` : ''}
        <label class="fld-l">새 PIN<input class="fld ac-pin" data-pin inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="new-password" placeholder="숫자 6자리"></label>
        <p class="sheet-note">바꾸면 다른 기기에서는 새 PIN으로 다시 로그인해야 해요.</p><p class="sheet-err" hidden></p>`,
      actions: [{ label: '취소' }, { label: 'PIN 바꾸기', kind: 'primary', onClick: submit }],
      onOpen: (el, close) => {
        const inp = el.querySelector('[data-pin]');
        inp.focus();
        inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(close, el); } });
      },
    });
  }

  // ── 내 정보 시트 ──
  function open({ focus, note } = {}) {
    const s = A.session;
    if (!s) { A.auth.openLogin(); return; }
    let ig = '', igLoaded = false;
    const html = `<div class="me-card"><span data-av>${A.avatar({ name: s.name, avatar: s.avatar }, 'me-av lg')}</span><div><b>${esc(s.name)}</b><span class="tag soft">${s.is_admin ? '관리자' : '직원'}</span></div></div>
      <div class="menu-list">
        <button class="menu-row" data-m="photo"><span>프로필 사진 바꾸기</span>${A.ICON.chev}</button>
        <button class="menu-row" data-m="ig"><span class="ac-l">인스타그램<small data-ig>불러오는 중…</small></span>${A.ICON.chev}</button>
        <button class="menu-row" data-m="pin"><span class="ac-l">PIN 바꾸기${s.pin_temp ? '<small class="ac-warn">임시 PIN이에요</small>' : ''}</span>${A.ICON.chev}</button>
        <button class="menu-row" data-m="push"><span class="ac-l">푸시 알림<small data-push>확인 중…</small></span>${A.ICON.chev}</button>
      </div>`;
    const sh = A.sheet({
      title: '내 정보', html,
      actions: [{ label: '로그아웃', kind: 'danger', onClick: async c => {
        if (!await A.confirm({ title: '로그아웃할까요?', text: '다시 들어올 때 이름과 PIN이 필요해요.', ok: '로그아웃', danger: true })) return;
        c(); A.auth.logout();
      } }],
      onOpen: el => {
        const igEl = el.querySelector('[data-ig]'), pushEl = el.querySelector('[data-push]');
        const showIg = () => { igEl.textContent = igLoaded ? (ig ? ig : '아직 없어요') : '불러오지 못했어요'; };
        const loadIg = async () => {
          const cur = A.session; if (!cur) return;
          const r = await A.api.direct('my_profile', { p_staff_id: cur.id, p_pin: cur.pin });
          if (!r.error && r.data) { ig = r.data.instagram || ''; igLoaded = true; }
          if (document.contains(igEl)) showIg();
        };
        const loadPush = async () => { const on = await A.auth.pushOn(); if (document.contains(pushEl)) pushEl.textContent = on ? '이 기기에서 켜져 있어요' : '꺼져 있어요'; return on; };
        loadIg(); loadPush();
        el.querySelector('[data-m="photo"]').onclick = () => pickPhoto(url => {
          const box = el.querySelector('[data-av]');
          if (box && document.contains(box)) box.innerHTML = A.avatar({ name: s.name, avatar: url }, 'me-av lg');
        });
        el.querySelector('[data-m="ig"]').onclick = async () => {
          if (!igLoaded) await loadIg();
          if (!igLoaded) { A.toast('인스타 정보를 불러오지 못했어요. 잠시 뒤에 다시 해 주세요', true); return; }   // 빈 값으로 덮어쓰지 않게
          const v = await A.prompt({ title: '인스타그램', label: '아이디 또는 링크', value: ig, placeholder: '인스타 아이디 또는 링크', ok: '저장' });
          if (v === null || v === ig) return;
          const cur = A.session; if (!cur) return;
          const r = await A.api.rpc('set_my_instagram', { p_staff_id: cur.id, p_insta: v });
          if (r === false) return;
          ig = v; if (document.contains(igEl)) showIg();
          A.store.invalidateAll();
          await A.render({ keep: true });
          A.toast(v ? '저장했어요' : '인스타를 지웠어요');
        };
        el.querySelector('[data-m="pin"]').onclick = () => openPin();
        el.querySelector('[data-m="push"]').onclick = async () => {
          if (await A.auth.pushOn()) { A.toast('이 기기는 알림이 켜져 있어요'); return; }
          await A.auth.enablePush();
          loadPush();
        };
      },
    });
    if (focus === 'pin') openPin({ note });
    return sh;
  }

  A.account = { open };
  // 임시 PIN 으로 로그인했을 때 (04-auth afterLogin)
  A.onTempPin = () => open({ focus: 'pin', note: '임시 PIN으로 로그인했어요. 앞으로 쓸 PIN 6자리를 정해 주세요.' });
}

// ── js/30-submit.js ──
// 시프트 제출 (운영 staff.html 1355-1401): 달 고르기, 날짜마다 한 번 눌러 고르기 + 야간 가능/불가, 낸 뒤 요약과 고치기
// 날은 그 달 모든 날. 안 고른 날은 보내지 않아요 (빈칸으로 남음). 야간은 비워 둬도 돼요.
{
  const A = window.App;
  const esc = A.esc;
  const STORES = A.FLOORS.map(f => f[0]);          // 데빌 → 메이드 → 마츠리
  const ANY = '상관없음', NO = '출근불가능';
  const N_OK = '가능', N_NO = '불가능';              // DB 값 (화면 글자는 가능 / 불가)
  let subYM = null;                                  // 고른 달 (처음엔 가장 이른 제출 달, 없으면 다음 달)
  const picks = {};                                  // '직원id|ym' → {qkey: choice} (다시 그려도 고른 값 유지)
  const editing = {};                                // '직원id|ym' → 고치기를 눌렀음
  let busy = false;

  const nextYM = () => A.ymShift(A.ymOf(A.today()), 1);
  const ymLabel = ym => { const [y, m] = ym.split('-').map(Number); return `${y}년 ${m}월`; };
  const monOf = ym => +ym.slice(5);
  const hrs = h => String(h || '').replace('-', '~');
  const cls = ds => { const d = A.parse(ds).getDay(); return d === 0 ? ' sun' : d === 6 ? ' sat' : ''; };
  const monthDates = ym => {
    const [y, m] = ym.split('-').map(Number), out = [];
    for (let d = new Date(y, m - 1, 1); d.getMonth() === m - 1; d.setDate(d.getDate() + 1)) out.push(A.ymd(d));
    return out;
  };
  const dateLbl = ds => `<span class="sb-date${cls(ds)}" aria-hidden="true"><b>${+ds.slice(8)}</b><small>${A.DAYS[A.parse(ds).getDay()]}</small></span>`;

  function monthBar(ym) {
    return `<div class="datebar sb-mbar"><button class="nav" data-m="-1" aria-label="이전 달">${A.ICON.prev}</button><div class="dlabel">${ymLabel(ym)}</div><button class="nav" data-m="1" aria-label="다음 달">${A.ICON.next}</button></div>`;
  }
  function bindMonthBar(el) {
    el.querySelectorAll('.sb-mbar [data-m]').forEach(b => b.onclick = () => { subYM = A.ymShift(subYM, +b.dataset.m); A.render(); });
  }

  function choiceBtn(ds, v, cur) {
    const on = cur === v, label = A.fmt(ds);
    if (STORES.includes(v)) {
      const t = A.THEMES[v];
      return `<button class="sb-c" data-d="${ds}" data-c="${v}" aria-pressed="${on}" aria-label="${label} ${A.storeName(v)}" style="--c:${t.c};--cs:${t.cs};--ci:${t.ci}"><img src="${A.logo(v)}" alt=""><span>${v}</span></button>`;
    }
    const any = v === ANY;
    return `<button class="sb-c ${any ? 'any' : 'no'}" data-d="${ds}" data-c="${v}" aria-pressed="${on}" aria-label="${label} ${any ? ANY : '출근 불가'}"><span>${any ? ANY : '불가'}</span></button>`;
  }
  function nightRow(n, cur) {
    const ans = v => `<button class="sb-c ${v === N_OK ? 'any' : 'no'}" data-n="${n.id}" data-a="${v}" aria-pressed="${cur === v}" aria-label="${n.date ? A.fmt(n.date) : esc(n.label)} 야간 ${v === N_OK ? '가능' : '불가'}"><span>${v === N_OK ? '가능' : '불가'}</span></button>`;
    const head = n.date && n.wp
      ? `${dateLbl(n.date)}<div class="sb-nm"><img src="${A.logo(n.wp)}" alt=""><span><b>${esc(n.wp)} 야간</b><small>${esc(hrs(n.hours))}</small></span></div>`
      : `<div class="sb-nm"><span><b>${esc(n.label || '야간')}</b></span></div>`;
    return `<div class="sb-row sb-n" role="group" aria-label="${n.date ? A.fmt(n.date) : esc(n.label)} 야간">${head}<div class="sb-ans">${ans(N_OK)}${ans(N_NO)}</div></div>`;
  }

  function renderForm(el, ym, dates, nights, map, key) {
    const m = monOf(ym);
    const rows = dates.map(ds => `<div class="sb-row sb-d" role="group" aria-label="${A.fmt(ds)}">${dateLbl(ds)}<div class="sb-cs">${[...STORES, ANY, NO].map(v => choiceBtn(ds, v, map['d:' + ds])).join('')}</div></div>`).join('');
    el.innerHTML = `${A.pageHead(`${m}월 시프트 제출`, '날짜마다 하나씩 골라 주세요. 마감 전까지 고칠 수 있어요')}${monthBar(ym)}
      <div class="sb-stat"><span class="tag green">제출 받는 중</span><b data-s="cnt"></b></div>
      <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${dates.length}" aria-label="고른 날"><i></i></div>
      <section class="sec sb-sec"><div class="sec-h"><h2>날짜별 근무지</h2></div>${rows}</section>
      ${nights.length ? `<section class="sec sb-sec"><div class="sec-h"><h2>야간 근무</h2><span class="aside" data-s="night"></span></div>
        <p class="sb-quiet">야간은 안 골라도 돼요</p>${nights.map(n => nightRow(n, map['n:' + n.id])).join('')}</section>` : ''}
      <div class="cta"><button class="btn lg primary" id="sbGo">제출하기</button><p class="note" data-s="left" hidden></p></div>`;

    const stats = () => {
      const done = dates.filter(d => map['d:' + d]).length, left = dates.length - done;
      el.querySelector('[data-s="cnt"]').textContent = `${done}/${dates.length}일 골랐어요`;
      const bar = el.querySelector('.prog');
      bar.setAttribute('aria-valuenow', String(done));
      bar.querySelector('i').style.width = `${Math.round(done / dates.length * 100)}%`;
      const note = el.querySelector('[data-s="left"]');
      note.hidden = !left; note.textContent = left ? `고를 날이 ${left}일 남았어요` : '';
      const na = el.querySelector('[data-s="night"]');
      if (na) na.textContent = `${nights.filter(n => map['n:' + n.id]).length}/${nights.length}건`;
    };
    stats();
    // 누르면 그 줄만 바꿔요 (다시 누르면 지워져요)
    el.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
      const q = 'd:' + b.dataset.d, v = b.dataset.c;
      if (map[q] === v) delete map[q]; else map[q] = v;
      b.closest('.sb-cs').querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-pressed', String(map[q] === x.dataset.c)));
      stats();
    });
    el.querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
      const q = 'n:' + b.dataset.n, v = b.dataset.a;
      if (map[q] === v) delete map[q]; else map[q] = v;
      b.closest('.sb-ans').querySelectorAll('[data-a]').forEach(x => x.setAttribute('aria-pressed', String(map[q] === x.dataset.a)));
      stats();
    });
    el.querySelector('#sbGo').onclick = e => submit(e.currentTarget, ym, dates, nights, map, key);
    bindMonthBar(el);
  }

  async function submit(btn, ym, dates, nights, map, key) {
    if (busy) return;
    const s = A.session;
    if (!s) { A.auth.openLogin(); return; }
    const un = dates.filter(d => !map['d:' + d]).length;
    if (un && !await A.confirm({ title: `안 고른 ${un}일은 비워 두고 낼까요?`, text: '고르지 않은 날은 빈칸으로 남아요. 낸 뒤에도 마감 전까지는 고칠 수 있어요.', ok: '이대로 내기', cancel: '더 고르기' })) return;
    // 고른 것만 보내요 (이 달 날짜와 지금 있는 야간 문항만)
    const keys = [...dates.map(d => 'd:' + d), ...nights.map(n => 'n:' + n.id)];
    const answers = keys.filter(q => map[q]).map(q => ({ qkey: q, choice: map[q] }));
    busy = true; btn.setAttribute('aria-busy', 'true');
    const r = await A.api.rpc('submit_shift', { p_staff_id: s.id, p_ym: ym, p_answers: answers });
    busy = false; btn.removeAttribute('aria-busy');
    if (r === false) return;
    delete editing[key]; delete picks[key];
    await A.render({ keep: true });
    A.toast(`${monOf(ym)}월 시프트를 냈어요`);
  }

  function renderDone(el, ym, dates, nights, saved, key) {
    const m = monOf(ym);
    const cnt = v => dates.filter(d => saved['d:' + d] === v).length;
    const done = dates.filter(d => saved['d:' + d]).length, blank = dates.length - done;
    const row = (inner, n, unit = '일') => `<div class="lrow sb-sum"><span class="lm"><span class="lt">${inner}</span></span><span class="la"><b>${n}${unit}</b></span></div>`;
    const sums = STORES.map(wp => row(`<img class="sb-lg" src="${A.logo(wp)}" alt="">${esc(A.storeName(wp))}`, cnt(wp))).join('')

    const nOk = nights.filter(n => saved['n:' + n.id] === N_OK).length, nNo = nights.filter(n => saved['n:' + n.id] === N_NO).length, nNone = nights.length - nOk - nNo;
    el.innerHTML = `${A.pageHead(`${m}월 시프트를 냈어요`, '마감 전까지는 언제든 고칠 수 있어요')}${monthBar(ym)}
      <div class="sb-stat"><span class="tag green">제출 받는 중</span><b>${done}/${dates.length}일을 냈어요</b></div>
      <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${dates.length}" aria-valuenow="${done}" aria-label="낸 날"><i style="width:${Math.round(done / dates.length * 100)}%"></i></div>
      <section class="sec sb-sec"><div class="sec-h"><h2>낸 내용</h2></div>${sums}</section>
      ${nights.length ? `<section class="sec sb-sec"><div class="sec-h"><h2>야간 근무</h2></div>
        ${row('가능', nOk, '건')}${row('불가', nNo, '건')}${nNone ? row('안 정함', nNone, '건') : ''}</section>` : ''}
      <div class="cta"><button class="btn lg" id="sbEdit">고치기</button></div>`;
    el.querySelector('#sbEdit').onclick = () => {
      editing[key] = true; picks[key] = { ...saved };
      A.render({ keep: true });
      A.toast('다시 고를 수 있어요. 다 고치면 제출하기를 눌러 주세요');
    };
    bindMonthBar(el);
  }

  A.screen('submit', {
    async render(el) {
      el.dataset.theme = 'all';
      const s = A.session;
      if (!s) {
        el.innerHTML = `${A.pageHead('시프트 제출')}${A.emptyBox('submit', '로그인하면 시프트를 낼 수 있어요', '이름과 PIN으로 로그인해 주세요')}
          <button class="btn lg primary" id="sbLogin">로그인하기</button>`;
        el.querySelector('#sbLogin').onclick = () => A.auth.openLogin();
        return;
      }
      await A.store.loadStatus();
      const open = A.store.openMonths();
      if (!subYM) subYM = open[0] || nextYM();
      const ym = subYM;
      if (!open.includes(ym)) {
        const hint = open.length ? `제출 받는 달: ${open.map(ymLabel).join(', ')}` : '아직 관리자가 제출을 열지 않았어요';
        el.innerHTML = `${A.pageHead(`${monOf(ym)}월 시프트 제출`)}${monthBar(ym)}${A.emptyBox('lock', '이 달은 제출 기간이 아니에요', hint)}
          ${open.length ? `<div class="sb-jump">${open.map(x => `<button class="btn" data-ym="${x}">${ymLabel(x)} 내러 가기</button>`).join('')}</div>` : ''}`;
        el.querySelectorAll('[data-ym]').forEach(b => b.onclick = () => { subYM = b.dataset.ym; A.render(); });
        bindMonthBar(el);
        return;
      }
      const [nights, saved] = await Promise.all([A.store.nightQuestions(ym), A.store.submission(ym)]);
      const dates = monthDates(ym), key = `${s.id}|${ym}`;
      if (Object.keys(saved).length && !editing[key]) { renderDone(el, ym, dates, nights, saved, key); return; }
      const map = picks[key] || (picks[key] = { ...saved });
      renderForm(el, ym, dates, nights, map, key);
    },
  });
}

// ── js/31-admin.js ──
// 관리 화면 (관리자만, 운영 staff.html 1403-1665 · 2460-2547): 달 단계(제출 열기·마감·공개), 제출 현황, 야간 문항,
// 편성 도구(32-admin-tools.js), 근무 추가, 직원 목록·추가, PIN 없는 직원 임시 PIN. 엑셀 가져오기는 옮기지 않아요.
{

  const ymLabel = ym => { const [y, m] = ym.split('-').map(Number); return `${y}년 ${m}월`; };
  const monOf = ym => +ym.slice(5);
  const hrs = h => String(h || '').replace('-', '~');
  const daysOf = ym => { const [y, m] = ym.split('-').map(Number), out = []; for (let d = new Date(y, m - 1, 1); d.getMonth() === m - 1; d.setDate(d.getDate() + 1)) out.push(A.ymd(d)); return out; };
  const mrow = (attr, t, d) => `<button class="menu-row mr2" ${attr}><span class="mr-t"><b>${t}</b><small>${d}</small></span>${I.chev}</button>`;
  const tool = (kind, ym) => { if (A.adminTools && A.adminTools.open) A.adminTools.open(kind, ym); else A.toast('준비 중이에요'); };

  const after = async (msg, inv = 'all') => {

  };
  // 바쁜 동안 버튼 막기
  const withBusy = async (btn, fn) => {
    if (btn && btn.getAttribute('aria-busy') === 'true') return;

    try { return await fn(); } finally { if (btn) btn.removeAttribute('aria-busy'); }
  };
  // v2 DB 기능이 있는지 (22-bell.js 가 알아봐요). 오래 걸리면 기다리지 않아요
  async function v2db() {
    if (A.featuresReady) await Promise.race([Promise.resolve(A.featuresReady).catch(() => {}), new Promise(r => setTimeout(r, 1500))]);
    return !!(A.features && A.features.v2db);
  }

  // 칸 막대: 30명까지는 한 사람 한 칸, 넘으면 10% 한 칸. 색은 40% 미만 빨강, 80% 미만 주황, 그 위 초록 (프로토타입 그대로)
  function segbar(n, total) {
    const r = total ? n / total : 0, few = total <= 30, cells = few ? total : 10, on = few ? n : Math.floor(r * 10);
    const lvl = r >= .8 ? 'hi' : r >= .4 ? 'mid' : 'lo';
    return `<div class="segbar ${lvl}" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${n}" aria-label="제출한 사람 ${n}/${total}명">${Array.from({ length: cells }, (_, i) => `<i class="${i < on ? 'on' : ''}"></i>`).join('')}</div>`;
  }

  // ── 1. 달 스케줄: 제출 받는 중 → 마감 → 공개됨 ──
  function scheduleSec(ym, st, staff, answers, hasV2) {
    const m = monOf(ym), open = st.submit_open, pub = st.published;
    const done = new Set(answers.map(a => a.staffId));
    const doneList = staff.filter(s => done.has(s.id)), missing = staff.filter(s => !done.has(s.id));
    const tags = [open ? '<span class="tag green">제출 받는 중</span>' : '', pub ? '<span class="tag">공개됨</span>' : !open ? '<span class="tag soft">마감</span>' : ''].join('');
    // 낸 사람은 접어 둬요 (사람이 많아요). 이름을 누르면 그 사람이 낸 내용
    const doneBox = doneList.length ? `<details class="ad-det"><summary class="ad-lbl">낸 사람 ${doneList.length}명 보기</summary><p class="ad-hint">이름을 누르면 낸 내용을 봐요</p>
      <div class="ad-tags">${doneList.map(s => `<button class="tag soft ad-pb" data-person="${s.id}">${esc(s.name)}</button>`).join('')}</div></details>` : '';
    // 공개 뒤 닫힌 달은 안 낸 사람 이름을 감춰요 (프로토타입과 같음)

    // 주 버튼은 하나: 받는 중 → 마감하기, 마감·비공개 → 공개하기. 나머지는 보조 버튼
    const main = open ? '<button class="btn lg primary" id="adMain" data-do="close">제출 마감하기</button>'
      : !pub ? `<button class="btn lg primary" id="adMain" data-do="publish">${m}월 공개하기</button>`

    const sub = [
      !open ? `<button class="btn lg" data-do="open">${pub ? '직원 제출 열기' : '제출 다시 열기'}</button>` : '',

  }
  async function setStage(btn, ym, what) {
    const s = me(), m = monOf(ym);
    if (what === 'close') {
      if (!await A.confirm({ title: '제출을 마감할까요?', text: '마감하면 직원들이 더는 고칠 수 없어요.', ok: '마감하기' })) return;
      await withBusy(btn, async () => {
        if (await A.api.rpc('admin_set_submit_open', { p_admin_id: s.id, p_ym: ym, p_open: false }) === false) return;
        await after('제출을 마감했어요');
      });
    } else if (what === 'open') {
      // 줄이 없는 달에 처음 열면 서버가 published=true 로 만들어요 → 먼저 비공개로 두고 열어요
      const { data, error } = await A.supa.from('schedule_status_view').select('ym').eq('ym', ym);
      if (error) { A.toast('불러오지 못했어요. 다시 해 주세요', true); return; }
      const fresh = !(data && data.length);
      if (!await A.confirm({ title: `${m}월 제출을 열까요?`, text: `직원들이 이 달 희망 근무를 낼 수 있어요.${fresh ? ' 스케줄은 공개 전 상태로 둬요.' : ''}`, ok: '열기' })) return;

        if (await A.api.rpc('admin_set_submit_open', { p_admin_id: s.id, p_ym: ym, p_open: true }) === false) { if (fresh) await after(); return; }
        await after('제출을 열었어요');
      });
    } else if (what === 'publish') {
      if (!await A.confirm({ title: `${m}월 스케줄을 공개할까요?`, text: '공개하면 직원과 손님이 이 달 스케줄을 볼 수 있어요.', ok: '공개하기' })) return;

  }
  function bindNights(el, ym, nights) {
    el.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {

      if (await A.api.rpc('admin_del_night_q', { p_admin_id: me().id, p_id: Number(n.id) }) === false) return;

  function openNightAdd(ym) {

  // ── 3. 편성 도구 (32-admin-tools.js) · 짜기는 스케줄 편집으로 (2026-10-28 합침) ──
  // 짜기(바꾸는 것)와 살펴보기(읽기만)를 나누고, 줄마다 무슨 일을 하는지 한 줄로

      ${mrow(t('builder'), '표로 한 번에 짜기', '사람 × 날짜 표에서 칸마다 매장을 골라요. 큰 화면에서 쓰기 좋아요')}</div></section>

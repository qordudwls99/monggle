      ${mrow(t('hopecal'), '매장별 희망 달력', '매장마다 날짜별로 누가 오고 싶어 하는지 봐요')}
      ${mrow(t('counts'), '근무일수', '사람마다 이 달에 몇 번 일하는지 봐요 (야간 포함)')}
      ${mrow(t('nights'), '데빌 야간 목록', '야간이 있는 날과 멤버를 한눈에 봐요')}</div></section>`;
  }
  function bindTools(el, ym, staff) {
    el.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => tool(b.dataset.tool, ym));
    el.querySelector('#adEdit').onclick = () => {
      const t = A.today();
      A.state.edit = true;
      A.go('schedule', { view: 'day', date: A.ymOf(t) === ym ? t : ym + '-01' });
    };
  }

  // ── 4. 직원: 확인할 사람 먼저, 처음엔 8명만, 초성으로도 찾기 ──
  const cho = A.cho;
  // 확인 필요 = 잠김, PIN 없음 (admin_staff_directory 의 locked / has_pin). 임시 PIN 은 대부분이라 빼요 (사용자 2026-10-28)
  const need = s => !!(s.locked || s.has_pin === false);
  const FILTERS = [['all', '전체', () => true], ['need', '확인 필요', need], ['admin', '관리자', s => !!s.is_admin]];
  const stTags = s => [s.is_admin ? '<span class="tag">관리자</span>' : '', s.locked ? '<span class="tag red">잠김</span>' : '',
    s.has_pin === false ? '<span class="tag soft">PIN 없음</span>' : ''].join('');

  function staffSec(staff) {
    return `<section class="sec ad-sec" id="adStaffSec"><div class="sec-h"><h2>직원 ${staff.length}명</h2><button class="btn sm ad-addb" id="adStaffAdd">${I.plus}직원 추가</button></div>
      <input class="fld" id="adQ" type="search" placeholder="이름 찾기 (초성도 돼요)" aria-label="직원 이름 찾기" autocomplete="off" value="${esc(query)}">
      <div class="seg ad-filt" role="group" aria-label="직원 거르기" id="adFilt"></div>
      <p class="ad-found" id="adFound" aria-live="polite"></p>
      <div id="adStaff"></div>
      <div class="menu-list ad-links"><button class="menu-row" id="adBulkPin">PIN 없는 직원에게 임시 PIN 정하기${staff.some(s => s.has_pin === false) ? `<small>${staff.filter(s => s.has_pin === false).length}명</small>` : I.chev}</button></div></section>`;
  }
  function staffFilters(el, staff) {
    const cnt = k => staff.filter(FILTERS.find(f => f[0] === k)[2]).length;
    if (filt !== 'all' && !cnt(filt)) filt = 'all';
    const box = el.querySelector('#adFilt');
    box.innerHTML = FILTERS.filter(([k]) => k === 'all' || cnt(k)).map(([k, l]) => `<button type="button" data-f="${k}" class="${filt === k ? 'on' : ''}" aria-pressed="${filt === k}">${l} <b>${cnt(k)}</b></button>`).join('');
    box.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filt = b.dataset.f; expanded = false; staffFilters(el, staff); staffRows(el, staff); });
  }
  function staffRows(el, staff) {
    const box = el.querySelector('#adStaff');
    const q = query.trim(), qc = cho(q), f = FILTERS.find(x => x[0] === filt)[2];
    const list = staff.filter(s => f(s) && (!q || String(s.name).includes(q) || cho(s.name).includes(qc)))
      .sort((a, b) => String(a.name).localeCompare(String(b.name), 'ko'));   // 이름순만 (사용자 2026-10-28)
    const cut = !q && filt === 'all' && list.length > SHOW + 2, shown = cut && !expanded ? list.slice(0, SHOW) : list;
    el.querySelector('#adFound').textContent = q ? `${list.length}명 찾았어요` : '';
    box.innerHTML = shown.map(s => `<div class="lrow ad-st"><button class="ad-main" data-st="${s.id}" aria-label="${esc(s.name)}님 관리">${A.avatar(s)}<span class="lt">${esc(s.name)}</span>${stTags(s)}</button>${s.locked ? `<button class="btn sm hit" data-unlock="${s.id}" aria-label="${esc(s.name)}님 잠금 풀기">잠금 풀기</button>` : ''}${I.chev}</div>`).join('')
      + (cut ? `<button class="btn ad-more" id="adMore" aria-expanded="${expanded}">${expanded ? '접기' : `나머지 ${list.length - SHOW}명 보기`}</button>` : '')
      || '<div class="none">찾는 이름이 없어요</div>';
    const more = box.querySelector('#adMore');
    if (more) more.onclick = () => { expanded = !expanded; staffRows(el, staff); if (!expanded) el.querySelector('#adQ').scrollIntoView({ block: 'center' }); };
    box.querySelectorAll('[data-st]').forEach(b => b.onclick = () => openStaff(staff.find(x => String(x.id) === b.dataset.st), staff));
    box.querySelectorAll('[data-unlock]').forEach(b => b.onclick = () => unlock(staff.find(x => String(x.id) === b.dataset.unlock)));
  }
  function bindStaff(el, staff) {
    staffFilters(el, staff); staffRows(el, staff);
    el.querySelector('#adQ').oninput = e => { query = e.target.value; staffRows(el, staff); };
    el.querySelector('#adStaffAdd').onclick = () => openStaffAdd(staff);
    el.querySelector('#adBulkPin').onclick = bulkPin;
  }

  const pinCheck = v => /^\d{6}$/.test(v) ? '' : 'PIN은 숫자 6자리예요';
  async function unlock(s) {
    if (!s) return;
    if (!await A.confirm({ title: `${s.name}님의 잠금을 풀까요?`, text: 'PIN을 여러 번 틀려서 잠겼어요. 풀면 바로 다시 로그인할 수 있어요.', ok: '잠금 풀기' })) return;
    if (await A.api.rpc('admin_unlock_staff', { p_admin_id: me().id, p_target_id: Number(s.id) }) === false) return;
    await after(`${s.name}님의 잠금을 풀었어요`, null);
  }
  function openStaff(s, staff) {
    if (!s) return;
    const self = me() && s.id === me().id, admin = !!s.is_admin, v2 = !!(A.features && A.features.v2db);
    const head = `<div class="me-card">${A.avatar(s, 'me-av lg')}<div><b>${esc(s.name)}</b><span class="ad-tags">${stTags(s) || '<span class="tag soft">직원</span>'}</span></div></div>`;
    const row = (k, t, d) => mrow(`data-act="${k}"`, t, d), noPin = s.has_pin === false;
    // PIN 은 한 줄만: v2 DB 가 있으면 임시 PIN(본인이 다음 로그인 때 바꿈), 없으면 관리자가 직접 정하기
    const pinRow = v2 ? row('temp', noPin ? 'PIN 만들기' : 'PIN 초기화', noPin ? '임시 PIN을 만들어 알려 주면 로그인할 수 있어요' : 'PIN을 잊었을 때 임시 PIN을 만들어 알려 줘요. 다음 로그인 때 본인이 새로 정해요')
      : row('pin', noPin ? 'PIN 만들기' : 'PIN 다시 정하기', 'PIN을 잊었을 때 새 PIN을 정해 알려 줘요');
    const body = `<div class="menu-list">${row('person', `${admYM ? +admYM.slice(5) + '월 ' : ''}제출 내용`, '날짜마다 고른 매장을 봐요')}
      ${s.locked ? row('unlock', '잠금 풀기', 'PIN을 여러 번 틀려 잠겼어요. 풀면 다시 로그인할 수 있어요') : ''}
      ${self ? '' : pinRow}
      ${row('rename', '이름 바꾸기', '출근표와 목록에 보이는 이름이에요')}${row('ig', '인스타그램', '출근표 이름 옆 링크로 보여요')}
      ${self ? '' : row('role', admin ? '직원으로 바꾸기' : '관리자로 바꾸기', admin ? '관리 탭과 출근표 편집을 더는 못 써요' : '관리 탭과 출근표 편집을 쓸 수 있게 돼요')}</div>
      ${self ? '<p class="sheet-p">내 권한과 PIN은 여기서 바꾸지 않아요. 위쪽 내 정보에서 PIN을 바꿀 수 있어요.</p>' : s.has_pin === false ? '<p class="sheet-p">아직 PIN이 없어서 로그인할 수 없어요. PIN을 정해 주세요.</p>' : ''}`;
    const sh = A.sheet({
      title: `${s.name}님`, html: head + body,
      actions: self ? [] : [{ label: '직원 삭제', kind: 'danger', onClick: c => { c(); del(s); } }],
      onOpen: (el, close) => el.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { close(); act(b.dataset.act, s, staff); }),
    });
    return sh;
  }
  async function act(k, s, staff) {
    const sid = Number(s.id), aid = me().id;
    if (k === 'person') { tool('person:' + s.id, admYM); return; }
    if (k === 'unlock') { unlock(s); return; }
    if (k === 'rename') {
      const nm = await A.prompt({ title: '이름 바꾸기', label: '새 이름', value: s.name, maxlength: 30,
        validate: v => !v ? '이름을 적어 주세요' : v !== s.name && staff.some(x => x.name === v) ? '이미 있는 이름이에요' : '' });
      if (nm === null || nm === s.name) return;
      if (await A.api.rpc('admin_rename_staff', { p_admin_id: aid, p_target_id: sid, p_name: nm }) === false) return;
      if (s.id === aid) A.auth.update({ name: nm });
      await after('이름을 바꿨어요');
    } else if (k === 'ig') {
      const ig = await A.prompt({ title: `${s.name}님 인스타그램`, label: '아이디 또는 링크 (지우려면 비워 둬요)', maxlength: 100, placeholder: '예: hana_moe' });
      if (ig === null) return;
      if (await A.api.rpc('admin_set_instagram', { p_admin_id: aid, p_target_id: sid, p_insta: ig }) === false) return;
      await after(ig ? '인스타그램을 저장했어요' : '인스타그램을 지웠어요');
    } else if (k === 'role') {
      const to = s.is_admin ? '직원으로' : '관리자로';
      if (!await A.confirm({ title: `${s.name}님을 ${to} 바꿀까요?`, text: s.is_admin ? '관리 화면과 출근표 편집을 더는 쓸 수 없어요.' : '관리 화면과 출근표 편집을 쓸 수 있어요.', ok: '바꾸기' })) return;
      if (await A.api.rpc('admin_set_role', { p_admin_id: aid, p_target_id: sid, p_is_admin: !s.is_admin }) === false) return;
      await after(`${s.name}님을 ${to} 바꿨어요`, null);
    } else if (k === 'pin') {
      const np = await A.prompt({ title: `${s.name}님 PIN 정하기`, text: '새 PIN을 정하면 그 사람의 기기에서 모두 로그아웃돼요.', label: '새 PIN (숫자 6자리)', inputmode: 'numeric', maxlength: 6, validate: pinCheck, ok: '정하기' });
      if (np === null) return;
      if (await A.api.rpc('admin_set_pin', { p_admin_id: aid, p_target_id: sid, p_new_pin: np }) === false) return;
      await after('PIN을 정했어요', null);
    } else if (k === 'temp') {
      if (!await A.confirm({ title: `${s.name}님의 임시 PIN을 만들까요?`, text: '지금 PIN은 못 쓰게 돼요. 다음 로그인 때 새 PIN으로 바꾸게 해요.', ok: '만들기' })) return;
      const pin = await A.api.rpc('admin_reset_pin', { p_admin_id: aid, p_target_id: sid });
      if (pin === false) return;
      await after(null, null);
      // 한 번만 보여 줘요. 어디에도 남기지 않아요
      A.sheet({ title: '임시 PIN', html: `<p class="sheet-p">${esc(s.name)}님에게 알려 주세요. 이 창을 닫으면 다시 볼 수 없어요.</p><div class="ad-pin">${esc(String(pin))}</div>`,
        actions: [{ label: '확인했어요', kind: 'primary' }] });
    }
  }
  async function del(s) {
    if (!await A.confirm({ title: `${s.name}님을 삭제할까요?`, text: '배정된 근무는 빈 자리가 돼요. 되돌릴 수 없어요.', ok: '삭제', danger: true })) return;
    if (await A.api.rpc('admin_delete_staff', { p_admin_id: me().id, p_target_id: Number(s.id) }) === false) return;
    await after(`${s.name}님을 삭제했어요`);
  }
  function openStaffAdd(staff) {
    let admin = false, busy = false;
    A.sheet({
      title: '직원 추가',
      html: `<label class="fld-l">이름<input class="fld" data-nm maxlength="30" autocomplete="off" placeholder="예: 하나"></label>
        <label class="fld-l">PIN (숫자 6자리, 없으면 비워 둬요)<input class="fld" data-pin inputmode="numeric" maxlength="6" autocomplete="off" placeholder="숫자 6자리"></label>
        <div class="seg" role="group" aria-label="권한"><button type="button" class="on" data-r="0" aria-pressed="true">직원</button><button type="button" data-r="1" aria-pressed="false">관리자</button></div>
        <p class="sheet-note">PIN 없이 추가하면 로그인할 수 없어요. 나중에 PIN을 정해 주세요.</p><p class="sheet-err" hidden></p>`,
      onOpen: el => {
        el.querySelector('[data-nm]').focus();
        el.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
          admin = b.dataset.r === '1';
          el.querySelectorAll('[data-r]').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', String(x === b)); });
        });
      },
      actions: [{ label: '취소' }, { label: '추가', kind: 'primary', onClick: async (close, el) => {
        if (busy) return;
        const name = el.querySelector('[data-nm]').value.trim(), pin = el.querySelector('[data-pin]').value.trim(), err = el.querySelector('.sheet-err');
        const bad = !name ? '이름을 적어 주세요' : staff.some(x => x.name === name) ? '이미 있는 이름이에요' : pin && pinCheck(pin) ? pinCheck(pin) : '';
        if (bad) { err.hidden = false; err.textContent = bad; return; }
        busy = true;
        const r = await A.api.rpc('admin_add_staff', { p_admin_id: me().id, p_name: name, p_new_pin: pin, p_is_admin: admin });
        busy = false;
        if (r === false) return;
        query = ''; close();
        await after(`${name}님을 추가했어요`, null);
      } }],
    });
  }
  async function bulkPin() {
    const np = await A.prompt({ title: '임시 PIN 한 번에 정하기', text: 'PIN이 없는 직원에게 같은 임시 PIN을 정해요. 다음 로그인 때 자기 PIN으로 바꾸게 해요.', label: '임시 PIN (숫자 6자리)', inputmode: 'numeric', maxlength: 6, validate: pinCheck, ok: '정하기' });
    if (np === null) return;
    const n = await A.api.rpc('admin_set_default_pin', { p_admin_id: me().id, p_new_pin: np });
    if (n === false) return;
    await after(`임시 PIN을 ${typeof n === 'number' ? n : 0}명에게 정했어요`, null);
  }

  A.screen('admin', {
    async render(el) {
      el.dataset.theme = 'all';
      if (!A.isAdmin()) { el.innerHTML = A.emptyBox('lock', '관리자만 볼 수 있어요'); return; }
      if (!admYM) admYM = nextYM();
      const ym = admYM;
      const [, staff, nights, answers, hasV2] = await Promise.all([
        A.store.loadStatus(), A.store.directory({ fresh: true }), A.store.nightQuestions(ym), A.store.answers(ym), v2db(),
      ]);
      const st = A.store.status(ym);
      const done = new Set(answers.map(a => a.staffId));
      el.innerHTML = `${A.pageHead('관리', '제출, 야간 문항, 직원을 한곳에서 관리해요')}
        <div class="datebar sb-mbar"><button class="nav" data-m="-1" aria-label="이전 달">${I.prev}</button><div class="dlabel">${ymLabel(ym)}</div><button class="nav" data-m="1" aria-label="다음 달">${I.next}</button></div>
        ${scheduleSec(ym, st, staff, answers, hasV2)}${nightsSec(nights, answers)}${toolsSec(ym)}${staffSec(staff)}`;
      el.querySelectorAll('.sb-mbar [data-m]').forEach(b => b.onclick = () => { admYM = A.ymShift(admYM, +b.dataset.m); A.render(); });
      bindSchedule(el, ym, staff.filter(s => !done.has(s.id)).length);
      bindNights(el, ym, nights);
      bindTools(el, ym, staff);
      bindStaff(el, staff);
    },
  });
}

// ── js/32-admin-tools.js ──
// 관리 도구 (운영 staff.html 1464-1666, 2772-2780): 표로 시프트 짜기 · 제출 표 · 매장별 희망 달력 · 근무일수 ·
// 야간 목록 · 한 사람 제출 내용, 그리고 희망자 넣기 시트. 넓은 표는 시트 안에서 가로로 넘기고 이름 칸과 날짜 줄은 고정.
// 쓰기: admin_set_assignment, admin_assign_from_submission, admin_add_shift (파라미터는 운영과 같음)
{
  const A = window.App;
  const coll = new Intl.Collator('ko');
  const WPS = () => A.FLOORS.map(f => f[0]);                      // 데빌 → 메이드 → 마츠리
  const floorIdx = wp => { const i = WPS().indexOf(wp); return i < 0 ? 9 : i; };
  // 제출 값 → 칸 색 이름 (노랑 없음: 상관없음은 연한 초록, 출근불가능은 연한 빨강)
  const PK = { '데빌': 'devil', '메이드': 'maid', '마츠리': 'matsuri', '상관없음': 'any', '출근불가능': 'off' };
  const SHORT = { '데빌': '데', '메이드': '메', '마츠리': '마', '상관없음': '상' };
  const monthDays = ym => { const [y, m] = ym.split('-').map(Number); const n = new Date(y, m, 0).getDate(); return Array.from({ length: n }, (_, i) => `${ym}-${A.pad(i + 1)}`); };
  const ymLabel = ym => { const [y, m] = ym.split('-').map(Number); return `${y}년 ${m}월`; };
  const dowCls = ds => { const w = A.parse(ds).getDay(); return w === 0 ? 'sun' : w === 6 ? 'sat' : ''; };
  const LOADING = '<div class="tl-load"><span class="spin"></span></div>';
  const none = t => `<p class="tl-none">${A.esc(t)}</p>`;
  const adminId = () => A.session ? A.session.id : null;
  const avUrl = st => (st && (st.avatar_url || st.avatar)) || null;

  // 화면 높이 시트: 위 고정줄(.tl-top) + 넘기는 몸통(.tl-body)
  function toolSheet({ title, sub }) {
    let open = true;
    const s = A.sheet({
      title,
      html: `${sub ? `<p class="tl-sub">${A.esc(sub)}</p>` : ''}<div class="tl-top"></div><div class="tl-body">${LOADING}</div>`,
      onClose: () => { open = false; },
      onOpen: el => el.querySelector('.modal-c').classList.add('tl-sheet'),
    });
    return { ...s, top: s.el.querySelector('.tl-top'), body: s.el.querySelector('.tl-body'), alive: () => open && document.contains(s.el) };
  }
  // 표 머리: 이름 칸 + 날짜 (요일 색)
  const headRow = days => `<thead><tr><th class="tl-nc" scope="col">이름</th>${days.map(ds => { const d = A.parse(ds);
    return `<th class="${dowCls(ds)}" scope="col">${d.getDate()}<small>${A.DAYS[d.getDay()]}</small></th>`; }).join('')}</tr></thead>`;
  const legend = items => `<div class="tl-legend">${items.map(([k, t, sw = '']) => `<span><i class="pf-${k}">${A.esc(sw)}</i>${A.esc(t)}</span>`).join('')}</div>`;
  const PREF_LEGEND = [['devil', '데빌'], ['maid', '메이드'], ['matsuri', '마츠리'], ['any', '상관없음'], ['off', '출근불가능']];
  // 날짜별 희망 (d:YYYY-MM-DD) → {staffId: {ds: choice}}
  const dayPrefs = ans => { const p = {}; ans.forEach(a => { if (a.qkey && a.qkey.startsWith('d:')) (p[a.staffId] = p[a.staffId] || {})[a.qkey.slice(2)] = a.choice; }); return p; };

  // ── 표로 시프트 짜기: 한 사람 × 하루마다 매장 고르기, 고르면 바로 저장 (운영 1504-1530, 2772-2780) ──
  async function builder(ym) {
    const t = toolSheet({ title: '표로 시프트 짜기', sub: `${ymLabel(ym)} · 칸에서 매장을 고르면 바로 저장돼요` });
    const days = monthDays(ym);
    const [ok, ans] = await Promise.all([A.store.ensure(days[0], days[days.length - 1]), A.store.answers(ym)]);
    if (!t.alive()) return;
    if (!ok) { t.body.innerHTML = A.emptyBox('cal', '불러오지 못했어요', '시트를 닫고 다시 열어 주세요'); return; }
    const staff = A.store.staff();
    if (!staff.length) { t.body.innerHTML = none('직원이 없어요'); return; }
    const asn = {};
    days.forEach(ds => WPS().forEach(wp => A.store.day(ds, wp).shifts.forEach(s => { if (s.staffId != null) (asn[s.staffId] = asn[s.staffId] || {})[ds] = wp; })));
    const pref = dayPrefs(ans);
    const opts = cur => `<option value="">-</option>${WPS().map(w => `<option value="${w}"${w === cur ? ' selected' : ''}>${w}</option>`).join('')}`;
    const rows = staff.map(s => `<tr><th class="tl-nc" scope="row">${A.esc(s.name)}</th>${days.map(ds => {
      const cur = (asn[s.id] || {})[ds] || '', p = (pref[s.id] || {})[ds] || '';
      return `<td class="bx-c${p ? ' pf-' + PK[p] : ''}"><select class="bx-sel${cur ? ' as-' + A.themeKey(cur) : ''}" data-sid="${s.id}" data-d="${ds}" data-cur="${cur}" aria-label="${A.esc(s.name)} ${A.fmtShort(ds)}">${opts(cur)}</select></td>`;
    }).join('')}</tr>`).join('');
    t.top.innerHTML = legend(PREF_LEGEND.map(([k, l]) => [k, l, k === 'off' ? '-' : ''])) + '<p class="tl-note">칸 바탕은 희망, 진한 칸은 넣은 매장이에요</p>';
    t.body.innerHTML = `<table class="tl-mx bx">${headRow(days)}<tbody>${rows}</tbody></table>`;
    t.body.addEventListener('change', async e => {
      const sel = e.target.closest && e.target.closest('select.bx-sel');
      if (!sel) return;
      const sid = Number(sel.dataset.sid), ds = sel.dataset.d, wp = sel.value, prev = sel.dataset.cur || '';
      sel.disabled = true;
      const r = await A.api.rpc('admin_set_assignment', { p_admin_id: adminId(), p_date: ds, p_staff_id: sid, p_workplace: wp || null });
      sel.disabled = false;
      if (r === false) { sel.value = prev; return; }
      // 이 칸만 바꿔요 (표 전체를 다시 읽으면 스크롤·선택이 풀리고, 빠르게 두 번 고르면 순서가 엉켜요)
      sel.dataset.cur = wp;
      sel.className = 'bx-sel' + (wp ? ' as-' + A.themeKey(wp) : '');
      A.store.invalidate(ds);
      A.render({ keep: true });
    });
  }

  // ── 제출 표 (읽기만, 운영 1531-1553): 출근불가능·안 고른 날은 빈칸 ──
  async function matrix(ym) {
    const t = toolSheet({ title: '제출 표', sub: `${ymLabel(ym)} · 이름 × 날짜, 옆으로 넘겨 보세요` });
    const days = monthDays(ym);
    const [ans] = await Promise.all([A.store.answers(ym), A.store.directory()]);
    if (!t.alive()) return;
    const pref = dayPrefs(ans);
    const answered = new Set(ans.map(a => a.staffId));
    const rows = A.store.staff().filter(s => answered.has(s.id));
    if (!rows.length) { t.body.innerHTML = none('제출한 사람이 없어요'); return; }
    t.top.innerHTML = legend(PREF_LEGEND.slice(0, 4).map(([k, l]) => [k, l, SHORT[l]]));
    t.body.innerHTML = `<table class="tl-mx mx">${headRow(days)}<tbody>${rows.map(s => `<tr><th class="tl-nc" scope="row">${A.esc(s.name)}</th>${days.map(ds => {
      const c = (pref[s.id] || {})[ds] || '', show = c && c !== '출근불가능';
      return `<td class="mx-c${show ? ' pf-' + PK[c] : ''}"${show ? ` title="${A.esc(c)}"` : ''}>${show ? A.esc(SHORT[c] || c) : ''}</td>`;
    }).join('')}</tr>`).join('')}</tbody></table>`;
  }

  // ── 매장별 희망 달력 (운영 1554-1587): 진한 이름 = 이 매장, 흐린 이름 = 상관없음 ──
  async function hopecal(ym) {
    const t = toolSheet({ title: '희망 달력', sub: ymLabel(ym) });
    let wp = WPS().includes(A.state.wp) ? A.state.wp : WPS()[0];
    const ans = await A.store.answers(ym);
    if (!t.alive()) return;
    const [y, m] = ym.split('-').map(Number);
    const days = monthDays(ym), first = new Date(y, m - 1, 1).getDay();
    const draw = () => {
      t.top.innerHTML = `<div class="chips tl-chips" role="group" aria-label="매장">${A.FLOORS.map(([w, fl]) => { const th = A.THEMES[w];
        return `<button class="chip${w === wp ? ' on' : ''}" data-w="${w}" aria-pressed="${w === wp}" style="--c:${th.c};--cs:${th.cs};--ci:${th.ci}"><img src="${A.logo(w)}" alt=""><span class="ct"><b>${w}</b><small>${fl}</small></span></button>`; }).join('')}</div>
        <div class="tl-legend"><span><b>진한 이름</b> ${A.esc(wp)} 희망</span><span><span class="hc-any">흐린 이름</span> 상관없음</span></div>`;
      t.top.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { wp = b.dataset.w; draw(); });
      const by = {};
      ans.forEach(a => {
        if (!a.qkey || !a.qkey.startsWith('d:')) return;
        const r = by[a.qkey.slice(2)] = by[a.qkey.slice(2)] || { p: [], any: [] };
        if (a.choice === wp) r.p.push(a.staffName); else if (a.choice === '상관없음') r.any.push(a.staffName);
      });
      const sortK = l => l.slice().sort(coll.compare);
      let cells = '<div class="hc-c blank"></div>'.repeat(first);
      days.forEach(ds => {
        const r = by[ds] || { p: [], any: [] };
        cells += `<div class="hc-c ${dowCls(ds)}"><span class="hc-dn">${A.parse(ds).getDate()}</span>${sortK(r.p).map(n => `<span class="hc-nm">${A.esc(n)}</span>`).join('')}${sortK(r.any).map(n => `<span class="hc-nm hc-any">${A.esc(n)}</span>`).join('')}</div>`;
      });
      t.body.innerHTML = `<div class="hc" data-theme="${A.themeKey(wp)}"><div class="mdow">${A.DAYS.map((d, i) => `<span class="${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${d}</span>`).join('')}</div><div class="hc-grid">${cells}</div></div>`;
    };
    draw();
  }

  // ── 근무일수 (야간 포함, 운영 1483-1503) ──
  async function counts(ym) {
    const t = toolSheet({ title: '근무일수', sub: `${ymLabel(ym)} · 한 달 근무한 날 (야간 포함)` });
    const days = monthDays(ym);
    const ok = await A.store.ensure(days[0], days[days.length - 1]);
    if (!t.alive()) return;
    if (!ok) { t.body.innerHTML = A.emptyBox('cal', '불러오지 못했어요', '시트를 닫고 다시 열어 주세요'); return; }
    const per = {};
    const add = (id, name, ds, k) => { if (id == null) return; const p = per[id] = per[id] || { name, dates: new Set(), by: {} }; p.dates.add(ds); (p.by[k] = p.by[k] || new Set()).add(ds); };
    days.forEach(ds => WPS().forEach(wp => {
      const d = A.store.day(ds, wp);
      d.shifts.forEach(s => add(s.staffId, s.name, ds, wp));
      if (d.night) d.night.members.forEach(n => { if (!n.guest && !n.short) add(n.staffId, n.name, ds, '야간'); });
    }));
    const rows = Object.values(per).sort((a, b) => (b.dates.size - a.dates.size) || coll.compare(a.name || '', b.name || ''));
    if (!rows.length) { t.body.innerHTML = none('배정된 근무가 없어요'); return; }
    t.body.innerHTML = `<div class="tl-list">${rows.map(r => {
      const bd = [...WPS(), '야간'].filter(k => r.by[k]).map(k => `${k} ${r.by[k].size}`).join(' · ');
      return `<div class="lrow">${A.avatar(r.name)}<span class="lm"><span class="lt">${A.esc(r.name)}</span>${bd ? `<span class="ls">${A.esc(bd)}</span>` : ''}</span><span class="la"><b class="tl-n">${r.dates.size}일</b></span></div>`;
    }).join('')}</div>`;
  }

  // ── 야간 목록 (운영 1464-1482): 날짜 → 층 순서 ──
  async function nights(ym) {
    const t = toolSheet({ title: '야간 목록', sub: `${ymLabel(ym)} · 야간 영업일과 멤버` });
    const days = monthDays(ym);
    const ok = await A.store.ensure(days[0], days[days.length - 1]);
    if (!t.alive()) return;
    if (!ok) { t.body.innerHTML = A.emptyBox('cal', '불러오지 못했어요', '시트를 닫고 다시 열어 주세요'); return; }
    const list = [];
    days.forEach(ds => WPS().forEach(wp => { const d = A.store.day(ds, wp); if (d.night) list.push({ ds, wp, ...d.night }); }));
    list.sort((a, b) => a.ds.localeCompare(b.ds) || (floorIdx(a.wp) - floorIdx(b.wp)));
    if (!list.length) { t.body.innerHTML = none('이 달 야간 영업이 없어요'); return; }
    t.body.innerHTML = `<div class="tl-list">${list.map(n => {
      const mem = n.members.length ? n.members.map(x => x.short ? '<span class="tag red">부족</span>'
        : `<span class="ng-nm">${A.esc(x.name)}${x.guest ? '<small>게스트</small>' : ''}</span>`).join('') : '<span class="ng-no">멤버 미정</span>';
      return `<div class="ng"><div class="ng-h">${A.storeTag(n.wp)}<b class="${dowCls(n.ds)}">${A.esc(A.fmtShort(n.ds))}</b></div>${n.hours ? `<p class="ng-hrs">${A.esc(n.hours)}</p>` : ''}<div class="ng-names">${mem}</div></div>`;
    }).join('')}</div>`;
  }

  // ── 한 사람 제출 내용 (운영 1588-1612) ──
  async function person(id, ym) {
    const nameOf = () => { const st = A.store.staff().find(s => String(s.id) === String(id)); return st ? st.name : ''; };
    const title = n => n ? `${n}님 제출 내용` : '제출 내용';
    const t = toolSheet({ title: title(nameOf()), sub: ymLabel(ym) });
    const [ans, nq] = await Promise.all([A.store.answers(ym), A.store.nightQuestions(ym), A.store.directory()]);
    if (!t.alive()) return;
    t.el.querySelector('.sheet-h b').textContent = title(nameOf());
    const mine = {};
    ans.forEach(a => { if (String(a.staffId) === String(id)) mine[a.qkey] = a.choice; });
    const pick = c => !c ? '<span class="pc-none">-</span>'
      : WPS().includes(c) ? A.storeTag(c)
      : c === '상관없음' ? '<span class="tag soft">상관없음</span>'
      : c === '출근불가능' || c === '불가능' ? `<span class="tag red">${A.esc(c)}</span>`
      : c === '가능' ? '<span class="tag green">가능</span>' : `<span class="tag soft">${A.esc(c)}</span>`;
    const dayRows = monthDays(ym).map(ds => `<div class="pc-r"><span class="pc-d ${dowCls(ds)}">${A.esc(A.fmtShort(ds))}</span>${pick(mine['d:' + ds])}</div>`).join('');
    const nightRows = nq.map(n => `<div class="pc-r"><span class="pc-d pc-l">${A.esc(n.label)}</span>${pick(mine['n:' + n.id])}</div>`).join('');
    t.body.innerHTML = `<h3 class="tl-h">날짜별 희망</h3><div class="pc">${dayRows}</div>${nq.length ? `<h3 class="tl-h">야간</h3><div class="pc">${nightRows}</div>` : ''}`;
  }

  function open(kind, ym) {
    ym = ym || A.ymShift(A.ymOf(A.today()), 1);   // 운영 admYM 기본값 = 다음 달
    kind = String(kind || '');
    if (kind.startsWith('person:')) return person(kind.slice(7), ym);
    const fn = { builder, matrix, hopecal, counts, nights }[kind];
    if (!fn) { A.toast('준비 중인 도구예요', true); return Promise.resolve(); }
    return fn(ym);
  }

  // ── 희망자 넣기 (운영 1614-1666): 이 매장을 고른 사람(상관없음은 그날 아직 아무 데도 없을 때만) + 이름 검색 ──
  function openHopes(ds, wp) {
    const ym = A.ymOf(ds);
    let open = true, placed = {}, busy = false;
    const sheetEl = () => s.el;
    const reload = async () => {
      A.store.invalidate(ds);
      await A.render({ keep: true });
      if (open) await draw();
    };
    const assign = async ids => A.api.rpc('admin_assign_from_submission', { p_admin_id: adminId(), p_date: ds, p_workplace: wp, p_staff_ids: ids });
    const drawSearch = () => {
      const el = sheetEl();
      const q = el.querySelector('[data-hq]').value.trim().toLowerCase(), box = el.querySelector('.hp-res');
      if (!q) { box.innerHTML = ''; return; }
      const hits = A.store.staff().filter(x => String(x.name || '').toLowerCase().includes(q) && !(placed[x.id] && placed[x.id].has(wp))).slice(0, 10);
      box.innerHTML = hits.length ? hits.map(x => `<div class="lrow">${A.avatar(x.name, 'av', avUrl(x))}<span class="lm"><span class="lt">${A.esc(x.name)}</span></span><span class="la"><button class="btn sm" data-add="${x.id}">넣기</button></span></div>`).join('')
        : '<p class="tl-none">찾는 이름이 없어요</p>';
      box.querySelectorAll('[data-add]').forEach(b => b.onclick = async () => {
        if (busy) return;
        const x = A.store.staff().find(v => String(v.id) === b.dataset.add);
        busy = true; b.setAttribute('aria-busy', 'true');
        const r = await assign([Number(b.dataset.add)]);
        busy = false; b.removeAttribute('aria-busy');
        if (r === false) return;
        await reload();
        A.toast(`${x ? x.name : ''}님을 넣었어요`);
      });
    };
    const draw = async () => {
      const [ok, ans] = await Promise.all([A.store.ensure(ds, ds), A.store.answers(ym)]);
      if (!open || !document.contains(sheetEl())) return;
      const el = sheetEl(), list = el.querySelector('.hp-list');
      if (!ok) { list.innerHTML = '<p class="tl-none">불러오지 못했어요</p>'; return; }
      placed = {};
      WPS().forEach(w => A.store.day(ds, w).shifts.forEach(x => { if (x.staffId != null) (placed[x.staffId] = placed[x.staffId] || new Set()).add(w); }));
      const was = new Set([...list.querySelectorAll('input:checked')].map(i => i.value));
      const cands = [];
      ans.filter(a => a.qkey === 'd:' + ds).forEach(a => {
        if (a.choice === wp) { if (!(placed[a.staffId] && placed[a.staffId].has(wp))) cands.push({ id: a.staffId, name: a.staffName, any: false }); }
        else if (a.choice === '상관없음') { if (!placed[a.staffId]) cands.push({ id: a.staffId, name: a.staffName, any: true }); }
      });
      cands.sort((x, y) => ((x.any ? 1 : 0) - (y.any ? 1 : 0)) || coll.compare(x.name || '', y.name || ''));
      const av = id => avUrl(A.store.staff().find(v => String(v.id) === String(id)));
      list.innerHTML = cands.length ? `<div class="pick-list">${cands.map(c => `<label class="lrow hp-row"><input type="checkbox" value="${c.id}"${was.has(String(c.id)) ? ' checked' : ''}>${A.avatar(c.name, 'av', av(c.id))}<span class="lm"><span class="lt">${A.esc(c.name)}</span></span>${c.any ? '<span class="tag soft">상관없음</span>' : ''}</label>`).join('')}</div>`
        : `<p class="tl-none">${A.esc(wp)}${A.josa(wp, '을', '를')} 고른 사람이 없어요</p>`;
      drawSearch();
    };
    const save = async close => {
      if (busy) return;
      const ids = [...s.el.querySelectorAll('.hp-list input:checked')].map(i => Number(i.value));
      if (!ids.length) { A.toast('넣을 사람을 골라 주세요', true); return; }
      busy = true;
      const r = await assign(ids);
      busy = false;
      if (r === false) return;
      close();
      A.store.invalidate(ds);
      await A.render({ keep: true });
      A.toast(`${typeof r === 'number' ? r : ids.length}명을 넣었어요`);
    };
    const addSlot = async () => {
      if (busy) return;
      busy = true;
      const r = await A.api.rpc('admin_add_shift', { p_admin_id: adminId(), p_work_date: ds, p_workplace: wp, p_start: '', p_end: '', p_assignee: null, p_memo: null, p_guest: null });
      busy = false;
      if (r === false) return;
      await reload();
      A.toast('빈 자리를 추가했어요');
    };
    const html = `<p class="sheet-p">${A.esc(A.fmt(ds))} · ${A.esc(wp)}에 들어가고 싶다고 제출한 사람이에요.</p>
      <div class="hp-list">${LOADING}</div>
      <label class="fld-l">다른 사람 넣기<input class="fld" data-hq type="search" autocomplete="off" placeholder="이름으로 찾기" aria-label="이름으로 찾기"></label>
      <div class="hp-res"></div>`;
    const s = A.sheet({
      title: '희망자', html,
      actions: [{ label: '빈 자리 추가', onClick: addSlot }, { label: '고른 사람 넣기', kind: 'primary', onClick: save }],
      onClose: () => { open = false; },
      onOpen: el => { el.querySelector('[data-hq]').addEventListener('input', drawSearch); },
    });
    draw();
    return s;
  }

  A.adminTools = { open, openHopes };
}

// ── js/34-guest.js ──
// 게스트 → 직원 바꾸기 (운영 staff.html 2268-2304 를 옮김. 실서버에 admin_guest_to_staff 가 없어서 여러 번 불러요)
// 1) 같은 이름 직원 찾기, 없으면 admin_add_staff (PIN 은 비워 둘 수 있음) 뒤 직원 목록 다시 읽어 id 찾기
// 2) 그 이름의 게스트 근무를 모두 admin_update_shift 로 직원에게
// 3) 게스트 야간 멤버: 직원을 먼저 넣고(admin_add_night_member) 성공하면 게스트를 빼요(admin_remove_night_member).
//    운영은 빼고 넣으면서 오류를 안 봐서, 넣기가 실패하면 야간 자리가 사라졌어요. 한 묶음 처리가 아니라 중간 실패는 요약에 남겨요.
{
  const A = window.App;

  // 여러 번 부르는 중에 또 실행하면 야간에 직원이 두 번 들어가요 → 하나씩만
  let converting = false;
  async function convert(name) {
    if (converting) { A.toast('게스트를 직원으로 바꾸는 중이에요'); return false; }
    converting = true;
    try { return await convertRun(name); } finally { converting = false; }
  }
  async function convertRun(name) {
    const g = String(name || '').trim();
    if (!g) { A.toast('게스트 이름이 없어요', true); return false; }
    if (!(await A.auth.require())) return false;

    // 바뀔 개수부터 읽어요 (공개 뷰)
    const [sh, nm] = await Promise.all([
      A.supa.from('shift_view').select('*').eq('guest_name', g),
      A.supa.from('night_member_view').select('*').eq('member_name', g),
      A.store.directory({ fresh: true }),
    ]);
    if (sh.error || nm.error) { A.toast('불러오지 못했어요. 다시 해 주세요', true); return false; }
    const shifts = (sh.data || []).filter(r => r.staff_id == null);
    const nights = (nm.data || []).filter(r => r.staff_id == null);   // 게스트 표시를 꺼 둔 줄도 포함
    if (!shifts.length && !nights.length) { A.toast(`${g}님 이름으로 잡힌 게스트 근무가 없어요`, true); return false; }

    let st = A.store.staff().find(s => s.name === g);
    const what = [shifts.length ? `근무 ${shifts.length}개` : '', nights.length ? `야간 ${nights.length}개` : ''].filter(Boolean).join(', ');
    const ok = await A.confirm({
      title: '직원으로 바꾸기',
      text: st ? `게스트 ${g}님의 ${what}가 같은 이름의 직원 ${g}님에게로 옮겨 가요.`
               : `${g}님을 새 직원으로 만들고, 게스트 ${what}를 그 직원에게로 옮겨요.`,
      ok: '바꾸기',
    });
    if (!ok) return false;

    const admin = A.session && A.session.id;
    if (!st) {
      const pin = await A.prompt({
        title: 'PIN 정하기', text: `${g}님이 로그인할 때 쓸 숫자 6자리예요. 나중에 정하려면 비워 두세요.`,
        label: 'PIN', inputmode: 'numeric', maxlength: 6, placeholder: '숫자 6자리 (비워 두면 나중에)', ok: '다음',
        validate: v => (v && !/^\d{6}$/.test(v)) ? 'PIN은 숫자 6자리로 적어 주세요' : '',
      });
      if (pin === null) return false;
      const r = await A.api.rpc('admin_add_staff', { p_admin_id: admin, p_name: g, p_new_pin: pin || '', p_is_admin: false });
      if (r === false) return false;
      await A.store.directory({ fresh: true });
      st = A.store.staff().find(s => s.name === g);
      if (!st) { A.toast('직원을 만들지 못했어요. 직원 목록을 확인해 주세요', true); return false; }
    }
    const sid = st.id;
    A.toast('바꾸는 중…');

    // 2) 게스트 근무 → 직원
    let moved = 0, shiftFail = 0;
    for (const s of shifts) {
      if (!A.session) { shiftFail++; continue; }
      const r = await A.api.rpc('admin_update_shift', { p_admin_id: admin, p_shift_id: s.id, p_start: s.start_time || '', p_end: s.end_time || '', p_assignee: sid, p_guest: null }, { quiet: true });
      if (r === false) shiftFail++; else moved++;
    }
    // 3) 야간: 직원 넣기 → 성공했을 때만 게스트 빼기
    let nMoved = 0, addFail = 0;
    const leftover = [];
    for (const m of nights) {
      if (!A.session) { addFail++; continue; }
      const add = await A.api.rpc('admin_add_night_member', { p_admin_id: admin, p_date: m.work_date, p_workplace: m.workplace, p_staff_id: sid, p_name: null }, { quiet: true });
      if (add === false) { addFail++; continue; }
      const rem = await A.api.rpc('admin_remove_night_member', { p_admin_id: admin, p_id: m.id }, { quiet: true });
      if (rem === false) leftover.push(A.fmtShort(m.work_date)); else nMoved++;
    }

    A.store.invalidateAll();
    await A.render({ keep: true });
    const done = [shifts.length ? `근무 ${moved}개` : '', nights.length ? `야간 ${nMoved}개` : ''].filter(Boolean).join(', ');
    const bad = [
      shiftFail ? `근무 ${shiftFail}개` : '',
      addFail ? `야간 ${addFail}개` : '',
    ].filter(Boolean).join(', ');
    let msg = `${g}님을 직원으로 바꿨어요 (${done})`;
    if (bad) msg += ` · 못 옮긴 것: ${bad}`;
    if (leftover.length) msg += ` · 게스트 야간이 남았어요: ${leftover.join(', ')}`;
    A.toast(msg, !!(bad || leftover.length));
    return true;
  }

  A.guest = { convert };
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>모에 스케줄 · 직원용</title>
<meta name="description" content="이번 달 시프트를 제출하고 근무표를 확인하세요.">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="모에 스케줄">
<style>
/* ── css/00-moe-system.css ── */
/* 모에 스케줄 디자인 시스템 — 손님 페이지(.ui-design/build/parts/style.css)에서 확정된 최종 값만 정리
   규칙 설명: .ui-design/system/DESIGN.md */

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  /* 글자·면 */
  --ink:#17151a; --ink2:#615c66; --muted:#8f8a94; --line:#eeebef; --fill:#f4f2f5; --cell:#f8f7f9;
  /* 상태 */
  --red:#d92d20; --red-soft:#fdecec; --orange:#e8590c; --green:#1f8a4c; --green-soft:#e6f4ec; --sun:#d92d20; --sat:#2e6be6;
  /* 데빌 야간 · 달 · 데빌 포인트 빨강 */
  --night:#1f1b1e; --moon:#e0525c; --devil-red:#b3262f;
  /* 기본 테마(전체) */
  --acc:#17151a; --acc-ink:#17151a; --acc-soft:#f1eff2;
  --chip-bg:#f4f2f5; --chip-ink:#17151a; --av-bg:#f1eff2; --av-ink:#17151a;
  --r-lg:14px; --r-md:12px; --r-sm:10px; --r-xs:8px;
  --font:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system,system-ui,'Malgun Gothic',sans-serif;
}
/* 매장 테마: 층 순서 3층 데빌 → 2층 메이드 → 1층 마츠리 */
[data-theme="all"]{--acc:#17151a;--acc-ink:#17151a;--acc-soft:#f1eff2;--chip-bg:#f4f2f5;--chip-ink:#17151a;--av-bg:#f1eff2;--av-ink:#17151a}
[data-theme="devil"]{--acc:#26211f;--acc-ink:#26211f;--acc-soft:#eeebec;--chip-bg:#2b2628;--chip-ink:#fff;--av-bg:#2b2628;--av-ink:#fff;
  --band:#26211f;--band-ink:#fff;--band-sub:rgba(255,255,255,.6);--band-line:rgba(255,255,255,.14)}
[data-theme="maid"]{--acc:#d94079;--acc-ink:#b8285f;--acc-soft:#fdedf3;--chip-bg:#fde4ef;--chip-ink:#7d1a42;--av-bg:#fde4ef;--av-ink:#b8285f;
  --band:#d94079;--band-ink:#fff;--band-sub:rgba(255,255,255,.7);--band-line:rgba(255,255,255,.2)}
[data-theme="matsuri"]{--acc:#e0452e;--acc-ink:#c2381f;--acc-soft:#ffeadf;--chip-bg:#ffe6d6;--chip-ink:#8f2a12;--av-bg:#ffe6d6;--av-ink:#c2381f;
  --band:#e0452e;--band-ink:#fff;--band-sub:rgba(255,255,255,.7);--band-line:rgba(255,255,255,.2)}

html,body{height:100%}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:var(--font);color:var(--ink);background:var(--fill);letter-spacing:-0.2px}
button,input,select,textarea{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
::selection{background:var(--acc-soft);color:var(--acc-ink)}

/* ── 앱 틀 ── */
.app{width:100%;max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:#fff;position:relative;overflow:hidden}
.top{display:flex;align-items:center;gap:6px;padding:max(6px,env(safe-area-inset-top)) 8px 6px 20px;min-height:56px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:20}
.brand{font-size:18px;font-weight:800;letter-spacing:-.4px;margin-right:auto;display:flex;align-items:center;gap:6px}
.icon-btn{width:44px;height:44px;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);border-radius:12px;position:relative;flex-shrink:0}
.icon-btn svg{width:23px;height:23px}
.icon-btn:active{transform:scale(.92)}
.body{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;padding:14px 16px 28px}

/* 보기 전환(일별·주간…) */
.seg{display:flex;background:var(--fill);border-radius:10px;padding:3px}
.seg button{flex:1;border:none;cursor:pointer;font-weight:700;font-size:13.5px;padding:7px 11px;border-radius:8px;background:none;color:var(--ink2);transition:background-color .15s ease,color .15s ease}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* 날짜 줄: ‹ 날짜 › + 아래 '오늘' */
.datebar{display:flex;align-items:center;gap:8px;margin-top:10px}
.datebar .nav{width:40px;height:40px;flex-shrink:0;border:none;border-radius:50%;background:var(--fill);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.datebar .nav svg{width:18px;height:18px}
.datebar .nav:active{transform:scale(.92)}
.datebar .nav:disabled{opacity:.3;pointer-events:none}
.dlabel{flex:1;border:none;background:none;cursor:pointer;min-width:0;font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.subline{height:28px;margin-top:2px;display:flex;align-items:center;justify-content:center}
.today-tag{font-size:12px;font-weight:800;color:#fff;background:var(--acc);border-radius:99px;padding:3px 10px}
.today-btn{border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:12.5px;font-weight:700;border-radius:99px;padding:4px 12px;cursor:pointer}
.today-tag[hidden],.today-btn[hidden]{display:none}

/* 매장 고르기: 실제 로고 칩 (전체 · 3층 데빌 · 2층 메이드 · 1층 마츠리) */
.chips{display:grid;grid-template-columns:.62fr 1fr 1fr 1fr;gap:6px}
.chip{height:52px;min-width:0;padding:0 6px;border:1px solid var(--line);background:#fff;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--ink2);transition:border-color .15s ease,background-color .15s ease,color .15s ease,transform .12s ease}
.chip img{width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.chip .ct{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;min-width:0}
.chip .ct b{font-size:14.5px;font-weight:800;white-space:nowrap}
.chip .ct small{font-size:11px;font-weight:700;color:var(--muted)}
.chip.all b{font-size:15px;font-weight:800}
.chip.on{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:var(--cs);color:var(--ci)}
.chip.on .ct small{color:inherit;opacity:.75}
.chip:active{transform:scale(.97)}

/* ── 출근표: 층 구역 ── */
.floor{padding:4px 0 6px}
.floor+.floor{margin:10px -16px 0;padding:16px 16px 6px;border-top:8px solid var(--fill)}
.floor-h{display:flex;align-items:center;gap:9px;padding:2px 0 10px}
.floor-h .store{display:flex;align-items:center;gap:9px;min-width:0;min-height:44px;color:inherit;text-decoration:none}
.floor-h img{width:38px;height:38px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.floor-h .fl{font-size:14px;font-weight:800;color:var(--acc-ink)}
.floor-h b{font-size:19px;font-weight:800;letter-spacing:-.4px}
.floor-h .cnt{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.ig-mini{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;background:linear-gradient(45deg,#f09433,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888)}
.ig-mini svg{width:14px;height:14px}

/* 이벤트 날: 층 색으로 꽉 찬 띠 */
.event{display:flex;align-items:center;gap:10px;background:var(--acc);color:#fff;border-radius:14px;padding:12px 14px;margin-bottom:4px}
.event .ev-tag{flex-shrink:0;font-size:11.5px;font-weight:800;border-radius:99px;padding:3px 9px;background:rgba(255,255,255,.2)}
[data-theme="devil"] .event .ev-tag{background:var(--devil-red)}
.event .ev-name{min-width:0;font-size:17px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 이름 줄 */
.row{display:flex;align-items:center;gap:13px;min-height:60px;padding:8px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.av{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--av-bg) center/cover no-repeat;color:var(--av-ink);font-size:16px;font-weight:800}
.av.photo{color:transparent}
.nm{flex:1;min-width:0;font-size:18px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 게스트: 노란색 금지. 매장 색 뱃지, 데빌 야간은 데빌 빨강 */
.gbadge{flex-shrink:0;display:inline-flex;align-items:center;font-size:12.5px;font-weight:800;color:#fff;background:var(--acc);border-radius:99px;padding:3px 10px}
.night .gbadge,.dn-col.night .gbadge{background:var(--devil-red)}
.gcount{display:inline-flex;align-items:center;font-size:13px;font-weight:800;color:var(--ink2);margin-right:8px}
.ig{width:44px;height:44px;margin:-6px -6px -6px 0;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:12px}
.ig span{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(45deg,#f09433,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888)}
.ig svg{width:19px;height:19px}
.ig:active{transform:scale(.92)}
.none{text-align:center;color:var(--muted);font-weight:600;font-size:14px;padding:20px 0}
.hrs-line{font-size:13px;font-weight:600;color:var(--ink2);padding:8px 2px 0}

/* 데빌 주간 | 야간 두 칸 (야간 = 유일한 어두운 면) */
.dn{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start;margin-top:8px}
.dn-col{min-width:0;border-radius:14px;padding:2px 10px 6px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.dn-col.night{box-shadow:none;background:var(--night);color:#fff}
.dn-h{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;padding:10px 0 6px;font-size:14px}
.dn-h b{font-weight:800}
.dn-h span{font-weight:700;color:var(--ink2)}
.dn-h small{flex-basis:100%;font-size:12px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.dn-h svg{width:13px;height:13px;color:var(--moon)}
.dn-col.night .dn-h span,.dn-col.night .dn-h small{color:rgba(255,255,255,.7)}
.dn-col.night .row{border-bottom-color:rgba(255,255,255,.1)}
.dn-col.night .av{background-color:rgba(255,255,255,.12);color:#fff}
.dn-col.night .none{color:rgba(255,255,255,.6)}
.row.sm{gap:9px;min-height:50px;padding:6px 0}
.row.sm .av{width:32px;height:32px;font-size:13px}
.row.sm .nm{font-size:16px}
.row.sm .ig{width:36px;height:40px;margin:-4px -4px -4px 0}
.row.sm .ig span{width:26px;height:26px;border-radius:8px}
.row.sm .ig svg{width:16px;height:16px}
.row.sm .gbadge{font-size:10.5px;padding:2px 6px}

/* 빈 상태 */
.empty-box{text-align:center;padding:52px 20px 40px;color:var(--ink2)}
.empty-box .e-ic{display:flex;justify-content:center;color:#b4afb9}
.empty-box .e-ic svg{width:44px;height:44px}
.empty-box .e-t{font-weight:800;font-size:19px;margin-top:14px;color:var(--ink)}
.empty-box .e-s{font-size:14px;font-weight:500;margin-top:6px}

/* ── 주간 시간표: 층 = 가로 단색 띠, 날짜 = 세로 칸 ── */
.wt{margin:0 -6px}
.wt-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wt-h{border:none;background:none;cursor:pointer;color:var(--ink);padding:2px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.wt-h .dow{font-size:11px;font-weight:700;color:var(--ink2)}
.wt-h.sun .dow{color:var(--sun)}.wt-h.sat .dow{color:var(--sat)}
.wt-h .dn{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.wt-h.today .dn{background:var(--acc);color:#fff}
.wt-h .st{font-size:10px;font-weight:700;color:var(--muted)}
.wt-band{margin-top:8px;border-radius:12px;background:var(--band);color:var(--band-ink);overflow:hidden}
.wt-label{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--band-ink);padding:8px 10px 2px}
.wt-label i{width:8px;height:8px;border-radius:2px;background:#fff}
.wt-c{min-width:0;border:none;background:none;cursor:pointer;padding:4px 1px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--band-ink)}
.wt-c+.wt-c{box-shadow:inset 1px 0 var(--band-line)}
.wt-c:active{background:rgba(0,0,0,.04)}
.wt-c .n,.mnm{display:flex;align-items:center;justify-content:center;max-width:100%;font-size:11.5px;font-weight:700;letter-spacing:-.5px;line-height:1.2;white-space:nowrap;overflow:hidden;color:var(--band-ink)}
.wt-c .n.g,.mnm.g{font-weight:800}
.wt-c .no{font-size:10.5px;font-weight:600;color:var(--band-sub)}
.wt-c .ev,.mev{align-self:stretch;margin:0 3px;font-size:10px;font-weight:800;line-height:1.25;color:var(--acc-ink);background:#fff;border-radius:5px;padding:3px 2px;text-align:center;white-space:nowrap;overflow:hidden;letter-spacing:-.3px}
[data-theme="devil"] .wt-c .ev,[data-theme="devil"] .mev{color:var(--devil-red)}
.wk-hint{font-size:12.5px;color:var(--muted);padding:12px 2px 0}
/* 칸 안: 게스트 묶음 · 야간 묶음 */
.gl{font-size:8.5px;font-weight:700;line-height:1.1;color:var(--band-sub)}
.gsep{align-self:stretch;height:1px;background:var(--band-line);margin:2px 5px}
.nsep{align-self:stretch;height:2px;border-radius:1px;background:var(--band-line);margin:4px 3px 2px}
.ntl{display:flex;align-items:center;justify-content:center;gap:2px;font-size:9px;font-weight:800;line-height:1.1;color:var(--band-ink)}
.ntl svg{width:8px;height:8px;color:#fff}

/* ── 월간: 작은 달력 + 아래 상세 ── */
.mlegend{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.mlegend span{display:inline-flex;align-items:center;gap:4px}
.mlegend i{width:10px;height:10px;border-radius:3px;background:var(--band)}
.mlegend i.evd{width:7px;height:7px;border-radius:50%;background:var(--ink);box-shadow:none}
.mdow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;font-weight:700;color:var(--ink2);padding:4px 0}
.mdow .sun{color:var(--sun)}.mdow .sat{color:var(--sat)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mc{min-width:0;min-height:58px;border:none;background:var(--cell);border-radius:9px;padding:3px 2px 4px;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:2px;cursor:pointer;text-align:center;color:var(--ink)}
.mc:active{background:#f0eef2}
.mc.blank{background:none;pointer-events:none}
.mc:disabled{opacity:.35;cursor:default}
.mc .mn{position:relative;align-self:center;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
.mc.sun .mn{color:var(--sun)}.mc.sat .mn{color:var(--sat)}
.mc.today .mn{background:var(--ink);color:#fff}
.mc.sel{background:#fff;box-shadow:inset 0 0 0 2px var(--ink)}
.mc .mn .evd{position:absolute;top:-1px;right:-5px}
.evd{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 1.5px #fff}
.mb{display:flex;align-items:center;justify-content:center;gap:1px;height:13px;margin:0 1px;border-radius:4px;background:var(--band);color:#fff;font-size:9.5px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.mb svg{width:7px;height:7px;margin-left:2px;color:#fff}
.moff{font-size:10px;font-weight:600;color:var(--muted);margin-top:4px}
.md-h{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 10px;margin-top:14px}
.md-h b{font-size:18px;font-weight:800;letter-spacing:-.4px}
.md-go{display:flex;align-items:center;gap:2px;border:none;background:var(--fill);border-radius:99px;padding:6px 8px 6px 12px;font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer}
.md-go svg{width:14px;height:14px}
.dfl{background:var(--band);color:var(--band-ink);border-radius:14px;padding:10px 12px 12px;margin-bottom:8px}
.dfh{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;margin-bottom:6px}
.dfh i{width:8px;height:8px;border-radius:2px;background:#fff}
.dfh .dev{font-size:11.5px;font-weight:800;background:#fff;color:var(--acc-ink);border-radius:99px;padding:2px 8px}
[data-theme="devil"] .dfh .dev{color:var(--devil-red)}
.dfh .dcnt{margin-left:auto;font-weight:700;opacity:.8}
.dl{display:flex;gap:8px;align-items:baseline}
.dl+.dl{margin-top:6px;padding-top:6px;border-top:1px solid var(--band-line)}
.dl em{flex-shrink:0;display:flex;align-items:center;gap:2px;font-style:normal;font-size:11.5px;font-weight:800;opacity:.75}
.dl em svg{width:10px;height:10px}
.dnm{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:15px;font-weight:600}
.dnm b{font-weight:800}
.dnm .dg{font-size:11px;font-weight:800;opacity:.75}
.dnm .dsep{width:1px;height:12px;background:var(--band-sub);align-self:center}
.dnm .no{font-size:13px;opacity:.7}

/* ── 버튼: 평평한 2단계 (주 버튼은 화면당 하나) ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;cursor:pointer;font-weight:700;white-space:nowrap;
  height:40px;padding:0 16px;border-radius:var(--r-sm);font-size:15px;background:var(--fill);color:var(--ink);transition:filter .12s ease,transform .12s ease}
.btn.lg{height:48px;border-radius:var(--r-md);font-size:16px;width:100%}
.btn.sm{height:32px;padding:0 12px;border-radius:var(--r-xs);font-size:13px}
.btn.primary{background:var(--ink);color:#fff}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.ghost{background:none;color:var(--ink2)}
.btn:active{filter:brightness(.92);transform:scale(.98)}
.btn:disabled,.btn[aria-busy="true"]{opacity:.45;pointer-events:none}
.btn svg{width:18px;height:18px}

/* ── 시트 · 알림 ── */
/* 바텀시트: 가장자리에서 띄운 카드(네 모서리 둥글게). 손잡이를 끌면 따라 내려오고, 놓으면 닫히거나 제자리로 돌아가요 */
.modal{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:flex-end;padding:max(12px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));background:rgba(20,14,22,0);transition:background-color .3s ease}
.modal.show{display:flex}
.modal.in{background:rgba(20,14,22,calc(.42 * var(--dim,1)))}
.modal.closing{pointer-events:none;transition-duration:.24s}
.modal-c{position:relative;width:100%;max-width:480px;max-height:100%;display:flex;flex-direction:column;overflow:hidden;background:#fff;border-radius:28px;transform:translateY(calc(100% + 24px));transition:transform .42s cubic-bezier(.32,.72,0,1)}
.modal.in .modal-c{transform:none}
.modal.closing .modal-c{transition-duration:.26s;transition-timing-function:cubic-bezier(.4,0,.9,.6)}
.modal.drag,.modal.drag .modal-c{transition:none}
.sheet-top{flex-shrink:0;padding:8px 14px 0 20px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.grab{width:36px;height:5px;border-radius:3px;background:#ddd9e0;margin:0 auto 4px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;margin-bottom:8px}
.sheet-h b{font-size:20px;font-weight:800;letter-spacing:-.4px;line-height:1.3;min-width:0}
.sheet-x{flex:none;width:34px;height:34px;border:none;border-radius:50%;background:var(--fill);color:var(--ink2);display:grid;place-items:center;cursor:pointer}
.sheet-x svg{width:16px;height:16px}
.sheet-x:active{background:var(--line)}
.sheet-b{flex:0 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 20px 4px}
.sheet-b:last-child{padding-bottom:22px}
.toast{position:fixed;left:50%;bottom:96px;z-index:90;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;font-size:14px;font-weight:700;border-radius:99px;padding:11px 18px;max-width:calc(100% - 40px);text-align:center;transition:opacity .2s ease,transform .2s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 입력 */
.fld{width:100%;height:48px;border:1px solid var(--line);background:#f7f6f8;border-radius:var(--r-md);padding:0 14px;font-size:16px;color:var(--ink)}
textarea.fld{height:auto;min-height:88px;padding:12px 14px;resize:vertical;line-height:1.5}
.fld:focus{outline:none;border-color:var(--ink);background:#fff}

.spin{display:inline-block;width:20px;height:20px;border:3px solid #ece8ee;border-top-color:var(--acc);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes slideR{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.anim-r{animation:slideR .26s cubic-bezier(.22,.61,.36,1)}
.anim-l{animation:slideL .26s cubic-bezier(.22,.61,.36,1)}
.anim-f{animation:fadeUp .24s ease}
@media (prefers-reduced-motion:reduce){.anim-r,.anim-l,.anim-f{animation:none}.modal,.modal-c{transition:none}.toast{transition:none}}

/* ── css/01-staff.css ── */
/* 직원 페이지 공통: 위 바 · 아래 메뉴 · 스케줄 머리 · 페이지 제목 · 목록 줄 · 태그 · 시트 안쪽
   토큰과 기본 부품은 moe-system.css. 여기 값은 그 토큰만 씀 */

/* ── 위 바: 브랜드 + '직원' 표 + 종(관리자) + 내 사진 동그라미 ── */
.brand em{font-style:normal;font-size:11px;font-weight:800;letter-spacing:0;background:var(--ink);color:#fff;border-radius:6px;padding:3px 6px}
.nbadge{position:absolute;top:6px;right:6px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 0 0 2px #fff;font-variant-numeric:tabular-nums}
.me-av{width:32px;height:32px;border-radius:50%;background:#3a3539 center/cover no-repeat;color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.me-av.lg{width:52px;height:52px;font-size:20px}

/* ── 아래 메뉴 ── */
.mtabbar{display:grid;background:#fff;border-top:1px solid var(--line);padding:6px 4px max(10px,env(safe-area-inset-bottom));position:relative;z-index:20}
.mtab{border:none;background:none;cursor:pointer;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);transition:color .15s ease,transform .12s ease}
.mtab svg{width:24px;height:24px}
.mtab.on{color:var(--ink)}
.mtab.on span{font-weight:800}
.mtab:active{transform:scale(.95)}

/* ── 스케줄 머리: 보기 전환 + 편집(관리자) ── */
.sched-h{display:flex;align-items:stretch;gap:8px}
.sched-h .seg{flex:1}
.edit-tg{flex-shrink:0;height:auto;min-height:40px;border-radius:10px}
.edit-tg.on{background:#e6e3e8}
.edit-tg svg{width:16px;height:16px}
.sched-h+.chips{margin-top:10px}
/* 고르는 줄(보기·매장·날짜)과 내용 사이를 한 단계 띄움 */
#list{margin-top:10px}
.dn.stack{grid-template-columns:1fr}
.modal-c:focus{outline:none}

/* 공개 전 달 (관리자만 보임) */
.draft-bar{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:var(--r-md);padding:10px 10px 10px 14px;margin-bottom:16px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.draft-bar>svg{width:18px;height:18px;flex-shrink:0;color:var(--ink2)}
.draft-bar span{flex:1;min-width:0;line-height:1.4}
.draft-bar b{color:var(--ink);font-weight:800}

/* 층별 편집 도구 (관리자 편집 중) */
.ftools{display:flex;gap:6px;overflow-x:auto;margin:-2px -16px 8px;padding:0 16px 2px;scrollbar-width:none}
.ftools::-webkit-scrollbar{display:none}
.ftools .btn{flex-shrink:0}
.ftools .btn b{font-weight:800;color:var(--acc-ink)}

/* 출근표 줄 덧붙임: 나 · 더보기 · 빈 자리 */
.mybadge{flex-shrink:0;font-size:11.5px;font-weight:800;color:var(--acc-ink);background:var(--acc-soft);border-radius:99px;padding:3px 8px}
[data-theme="devil"] .mybadge{color:#fff;background:var(--devil-red)}
.row.me .nm{font-weight:800}
.more{width:40px;height:40px;margin:-6px -8px -6px 0;border:none;background:none;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);flex-shrink:0}
.more svg{width:20px;height:20px}
.more:active{background:var(--fill)}
.dn-col.night .more{color:rgba(255,255,255,.7)}
.row.slot .av.empty{background:none;box-shadow:inset 0 0 0 1.5px #d6d2da;color:#b4afb9}
.row.slot .av.empty svg{width:18px;height:18px}
.row.slot .nm{color:var(--ink2)}
.row.slot .ap{display:block;font-size:12.5px;font-weight:700;color:var(--acc-ink);margin-top:1px}
.row.slot .slot-a{display:flex;gap:6px;flex-shrink:0}

/* ── 다른 화면들이 같이 쓰는 부품 ── */
.page-h{padding:6px 2px 20px}
.page-h h1{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.25}
.page-h p{font-size:14px;font-weight:600;color:var(--ink2);margin-top:4px;line-height:1.45}

.sec+.sec{margin:16px -16px 0;padding:20px 16px 0;border-top:8px solid var(--fill)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 2px 6px}
.sec-h h2{font-size:17px;font-weight:800;letter-spacing:-.3px}
.sec-h .aside{font-size:13px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}

.lrow{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit}
.lrow:last-child{border-bottom:none}
button.lrow{cursor:pointer}
button.lrow:active{background:var(--cell)}
.lrow .lm{flex:1;min-width:0}
.lrow .lt{display:block;font-size:16px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .ls{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-top:2px}
.lrow .la{flex-shrink:0;display:flex;align-items:center;gap:6px}
.lrow>svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}

.tag{display:inline-flex;align-items:center;gap:3px;flex-shrink:0;font-size:12px;font-weight:800;border-radius:99px;padding:3px 9px;background:var(--ink);color:#fff;white-space:nowrap}
.tag.soft{background:var(--fill);color:var(--ink2)}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.acc{background:var(--acc-soft);color:var(--acc-ink)}

/* 매장 표시: 로고 + 이름만 (바탕·테두리 없음) */
.store-tag{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap}
.store-tag img{width:22px;height:22px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.06)}

.box{background:var(--cell);border-radius:var(--r-lg);padding:14px}
.tools{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tools .btn{flex-shrink:0}
.prog{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.prog i{display:block;height:100%;border-radius:4px;background:var(--ink)}
/* 진행 칸 막대: 칸 = 사람(30명 넘으면 10%씩 10칸), 색 = 진행 정도 빨강 → 주황 → 초록 */
.segbar{display:flex;gap:3px;height:10px}
.segbar i{flex:1;min-width:0;border-radius:2px;background:var(--fill)}
.segbar i:first-child{border-radius:5px 2px 2px 5px}
.segbar i:last-child{border-radius:2px 5px 5px 2px}
.segbar.lo i.on{background:var(--red)}
.segbar.mid i.on{background:var(--orange)}
.segbar.hi i.on{background:var(--green)}
/* 화면 아래 붙는 주 버튼 */
.cta{position:sticky;bottom:-28px;z-index:5;margin:18px -16px -28px;padding:12px 16px 16px;background:#fff;border-top:1px solid var(--line)}
.cta .note{font-size:12.5px;font-weight:600;color:var(--ink2);text-align:center;margin-top:8px}

/* ── 시트 안쪽 ── */
.sheet-b{display:flex;flex-direction:column;gap:12px}
.sheet-a{display:flex;gap:8px;flex-shrink:0;padding:16px 20px 20px}
.sheet-a .btn{flex:1;width:auto}
.sheet-p{font-size:15px;font-weight:500;color:var(--ink2);line-height:1.55}
.sheet-err{color:var(--red);font-size:13.5px;font-weight:700}
.sheet-err[hidden]{display:none}
.fld-l{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.fld-row{display:flex;gap:8px}
.fld-row>*{flex:1;min-width:0}
select.fld{appearance:none;-webkit-appearance:none}
.sheet-b .seg{margin-bottom:2px}
.pick-list{max-height:46vh;overflow-y:auto;margin:0 -4px;padding:0 4px}
.pick-list .lrow{min-height:54px;padding:6px 2px}
.pick-list .av{width:34px;height:34px;font-size:14px}

.noti-list{display:flex;flex-direction:column}
.noti{display:flex;flex-direction:column;gap:3px;text-align:left;border:none;background:none;cursor:pointer;padding:12px 2px 12px 18px;border-bottom:1px solid var(--line);position:relative;color:var(--ink2)}
.noti:last-child{border-bottom:none}
.noti.unread{color:var(--ink)}
.noti.unread::before{content:"";position:absolute;left:3px;top:19px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.noti-t{font-size:15px;font-weight:700;line-height:1.4}
.noti-s{font-size:12.5px;font-weight:600;color:var(--muted)}
.noti:active{background:var(--cell)}

.me-card{display:flex;align-items:center;gap:14px;padding:4px 2px 8px}
.me-card b{display:block;font-size:19px;font-weight:800;margin-bottom:4px}
.menu-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.menu-row{display:flex;align-items:center;justify-content:space-between;min-height:54px;border:none;border-bottom:1px solid var(--line);background:none;cursor:pointer;font-size:16px;font-weight:700;padding:0 2px;text-align:left}
.menu-row svg{width:18px;height:18px;color:var(--muted)}
.menu-row:active{background:var(--cell)}
.menu-row small{font-size:13px;font-weight:600;color:var(--ink2)}

/* 아주 좁은 화면(320): 매장 칩은 로고·이름만 */
@media (max-width:359px){.chips{gap:4px}.chip{gap:5px;padding:0 4px}.chip img{width:24px;height:24px}.chip .ct b{font-size:13px}.chip .ct small{display:none}}

/* ── v2 실서버 연결용 덧붙임: 숨김 · 로그인 · 띠 · 당겨서 새로고침 · 알림 오류 ── */
[hidden]{display:none!important}
.screen-root{min-height:100%}
.top-login{margin-right:4px}
.icon-btn.bell[hidden]{display:none}

/* 화면 몸통 + 당겨서 새로고침 표시 */
.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.ptr{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);opacity:0;pointer-events:none}
.ptr .spin{width:16px;height:16px;border-width:2.5px}

/* 설치·알림 띠 (위 바 바로 아래) */
.installbar{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 16px;background:var(--fill);border-bottom:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--ink)}
.installbar .ib-t{flex:1;min-width:0;line-height:1.4}
.installbar .ib-go{background:#fff;flex-shrink:0;min-height:36px}
.ib-x{width:44px;height:44px;border:none;background:none;cursor:pointer;color:var(--ink2);display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:10px}
.ib-x svg{width:18px;height:18px}
.ib-x:active{background:#ebe8ed}

/* 로그인 시트 */
.login-f{display:flex;flex-direction:column;gap:12px}
.login-f .fld{font-variant-numeric:tabular-nums}
.sheet-note{font-size:13px;font-weight:600;color:var(--muted);line-height:1.5}

/* 알림(토스트) 오류 */
.toast.err{background:var(--red)}

/* 직원 고르기: 찾기 칸 + 목록 (드롭다운 대신, 사람이 많아도 이름으로 찾기) */
.spk{display:flex;flex-direction:column;gap:6px}
.spk-h{display:flex;align-items:baseline;gap:8px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.spk-h b{font-size:14.5px;font-weight:800;color:var(--ink)}
.spk-list{position:relative;max-height:min(244px,32vh);overflow-y:auto;border:1px solid var(--line);border-radius:var(--r-md);padding:0 12px;overscroll-behavior:contain}
.spk-row{min-height:48px;padding:6px 0;gap:10px}
.spk-row .av{width:30px;height:30px;font-size:13px}
.spk-row .lt{font-size:15.5px;font-weight:600}
.spk-row.on .lt{font-weight:800}
.spk-ck{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent}
.spk-ck svg{width:13px;height:13px}
.spk-row.on .spk-ck{background:var(--ink);border-color:var(--ink);color:#fff}
.spk .none{padding:16px 0}

/* 로그인 전 입구: 탭 없이 로그인만 */
body.gated #tabbar{display:none}
.gate{display:flex;flex-direction:column;justify-content:center;min-height:100%;padding:0 24px 48px}
.gate .empty-box{padding:0 0 24px}
.gate-a{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:360px;margin:0 auto}
.gate-guest{font-size:14px;font-weight:600;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;padding:8px}

/* 근무 시트: 게스트 표시 켜고 끄기 */
.chk-row{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-top:10px;border-radius:14px;background:var(--fill);cursor:pointer}
.chk-row input{width:22px;height:22px;margin:0;flex-shrink:0;accent-color:var(--ink)}
.chk-row .lm{flex:1;min-width:0}
.chk-row .lt{display:block;font-size:15px;font-weight:700;letter-spacing:-.2px}
.chk-row .ls{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-top:2px}

/* ── css/10-day.css ── */
/* 스케줄 일별 · 달력 시트 · 끌어 옮기기 (10-day.js, 13-drag.js). 공통 줄·칸은 00-moe-system.css / 01-staff.css */

/* 줄 덧붙임: 대타 구하는 중 · 대타 구하기 · 야간 부족 */
.row .seek{flex-shrink:0;font-size:11.5px;font-weight:800;color:var(--red);background:var(--red-soft);border-radius:99px;padding:3px 8px;white-space:nowrap}
.row.sm .seek{font-size:10.5px;padding:2px 6px}
.dn-col.night .row .seek{color:#fff;background:var(--devil-red)}
.row .sub-btn{flex-shrink:0;white-space:nowrap}
.row.sm .sub-btn{padding-left:7px;padding-right:7px}
.row.short .av.empty{background:none;box-shadow:inset 0 0 0 1.5px #d6d2da;color:#b4afb9}
.row.short .av.empty svg{width:16px;height:16px}
.row.short .nm{color:var(--ink2)}
.dn-col.night .row.short .av.empty{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3);color:rgba(255,255,255,.6)}
.dn-col.night .row.short .nm{color:rgba(255,255,255,.7)}
.slot-a+.more,.row.slot>.btn+.more{margin-left:2px}
.hrs-box{font-size:15px;font-weight:700;color:var(--ink);line-height:1.5}

/* 달력 시트 (날짜 고르기) */
.calp-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.calp-h b{font-size:17px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.calp-h .nav{width:40px;height:40px;flex-shrink:0;border:none;border-radius:50%;background:var(--fill);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.calp-h .nav svg{width:18px;height:18px}
.calp-h .nav:active{transform:scale(.92)}
.calp-dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;font-weight:700;color:var(--ink2);padding:4px 0}
.calp-dow .sun{color:var(--sun)}.calp-dow .sat{color:var(--sat)}
.calp-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calp-c{height:44px;border:none;border-radius:12px;background:var(--cell);color:var(--ink);font-size:15px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.calp-c.blank{background:none;pointer-events:none}
.calp-c.sun{color:var(--sun)}.calp-c.sat{color:var(--sat)}
.calp-c.today{box-shadow:inset 0 0 0 2px var(--ink)}
.calp-c.sel{background:var(--ink);color:#fff}
.calp-c:active{transform:scale(.94)}

/* 끌어 옮기기 (넓은 화면, 관리자, 전체) */
.can-drag{cursor:grab}
.dragging{opacity:.4}
.dragover{box-shadow:inset 0 0 0 2px var(--ink);border-radius:12px}
.drag-trash{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:130;display:none;align-items:center;gap:8px;background:var(--red-soft);color:var(--red);font-weight:800;font-size:14px;padding:14px 22px;border-radius:14px;box-shadow:0 10px 26px -12px rgba(0,0,0,.35);transition:transform .12s ease}
.drag-trash svg{width:18px;height:18px}
.drag-trash.show{display:flex}
.drag-trash.over{background:var(--red);color:#fff;transform:translateX(-50%) scale(1.06)}
@media (prefers-reduced-motion:reduce){.drag-trash,.drag-trash.over{transition:none}.drag-trash.over{transform:translateX(-50%)}}
.row.sm.me .nm{min-width:2em}

/* 편집 중 희망자: 매장 칸 아래, 누르면 바로 넣기. 흐린 칩 = 상관없음 */
.hope{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.hope-h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.hope-h b{font-size:14px;font-weight:800}
.hope-h span{font-size:12.5px;font-weight:600;color:var(--muted)}
.hchips{display:flex;flex-wrap:wrap;gap:6px}
.hchip{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 10px 0 13px;border:1px solid var(--line);border-radius:18px;background:#fff;font:inherit;font-size:14.5px;font-weight:700;color:var(--ink);cursor:pointer}
.hchip svg{width:14px;height:14px;color:var(--ink2)}
.hchip.any{background:var(--fill);border-color:transparent;font-weight:600;color:var(--ink2)}
.hchip:active{background:var(--cell)}
.hchip[aria-busy="true"]{opacity:.5}
.hope-none{font-size:13.5px;font-weight:600;color:var(--muted)}
.hchip small{font-size:11.5px;font-weight:700;color:var(--red);margin-left:1px}

/* ── css/11-views.css ── */
/* 주간 · 월간 · 야간 보기 + 야간 멤버 시트 (11-views.js). 토큰·주간표·달력 틀은 00-moe-system.css */
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── 주간 ── */
.wt-h .dn{margin-top:0;gap:0}                       /* 야간 두 칸용 .dn 과 이름이 겹쳐서 날짜 동그라미만 되돌려요 */
.wt-h{min-height:44px}
.wt-c{min-height:44px;text-align:center;-webkit-user-select:none;user-select:none}
.wt-c:focus-visible,.wt-h:focus-visible{outline:2px solid #fff;outline-offset:-3px;border-radius:8px}
.wt-h:focus-visible{outline-color:var(--ink);outline-offset:-2px}
.wt-c .vw-p{gap:2px;width:100%}
.wav{width:14px;height:14px;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.22) center/cover no-repeat;color:var(--band-ink);font-size:8px;font-weight:800;letter-spacing:0;line-height:1}
.wav.photo{color:transparent}
.vw-nm{min-width:0;overflow:hidden}
.wt-c .n.me .vw-nm{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:2px}
.vw-op{max-width:100%;font-size:9.5px;font-weight:800;line-height:1.2;color:var(--band-ink);background:rgba(255,255,255,.2);border-radius:4px;padding:2px 3px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}

/* ── 월간: 층마다 달력 ── */
.vm-capture{width:100%;margin-bottom:14px}
.vm-floor+.vm-floor{margin:18px -16px 0;padding:16px 16px 0;border-top:8px solid var(--fill)}
.vm-h{display:flex;align-items:center;padding:0 2px 4px}
.vm-c{min-height:60px;background:var(--acc-soft);-webkit-user-select:none;user-select:none}
.vm-c:active{filter:brightness(.97)}
.vm-c:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.vm-c .mn .vm-moon{position:absolute;top:-3px;right:-8px;display:flex}
.vm-c .mn .vm-moon svg{width:9px;height:9px;color:var(--moon)}
.vm-c .mnm{color:var(--ink);font-size:10px;font-weight:700;letter-spacing:-.6px;line-height:1.25}
.vm-c .mnm.g{font-weight:800}
.vm-c .mnm.me{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:2px}
.vm-gl{font-size:8px;font-weight:700;line-height:1.1;color:var(--ink2)}
.vm-gsep{height:1px;margin:1px 5px;background:rgba(0,0,0,.12)}
.vm-nsep{height:2px;margin:3px 3px 1px;border-radius:1px;background:rgba(0,0,0,.14)}
.vm-ntl{display:flex;align-items:center;justify-content:center;gap:1px;font-size:8.5px;font-weight:800;line-height:1.1;color:var(--ink2)}
.vm-ntl svg{width:8px;height:8px;color:var(--moon)}
.vm-short{display:block;margin:0 1px;padding:2px 0;border:none;border-radius:5px;background:var(--red-soft);color:var(--red);font-size:9.5px;font-weight:800;line-height:1.25;text-align:center}
button.vm-short{cursor:pointer}
.vm-c .mev{margin:0 1px;font-size:9.5px;padding:2px 1px;text-overflow:clip}
button.mev{border:none;cursor:pointer}
.vm-ev.add,.vm-tb{display:block;margin:0 1px;padding:2px 0;border:none;border-radius:5px;background:rgba(255,255,255,.75);color:var(--ink2);font-size:9px;font-weight:700;line-height:1.25;cursor:pointer;white-space:nowrap;overflow:hidden}
.vm-tb{margin-top:auto}
.vm-ev.add:active,.vm-tb:active,button.vm-short:active,button.mev:active{filter:brightness(.92)}

/* ── 야간 (데빌) ── */
.nt-cap{display:flex;align-items:center;gap:5px;padding:2px 2px 0;font-size:17px;font-weight:800;letter-spacing:-.3px;color:var(--ink)}
.nt-cap .store-tag{font-size:inherit;font-weight:inherit;gap:8px}
.nt-cap .store-tag img{width:26px;height:26px}
.nt-tip{font-size:13px;font-weight:500;color:var(--ink2);padding:4px 2px 0 36px}
.nt-list{list-style:none;margin-top:6px}
.nt-i{padding:14px 2px 16px;border-bottom:1px solid var(--line)}
.nt-i:last-child{border-bottom:none}
.nt-i.today{background:var(--cell);margin:0 -8px;padding:14px 10px 16px;border-radius:var(--r-md);border-bottom-color:transparent}
.nt-h{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;min-height:40px}
.nt-d{font-size:17px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.nt-i.today .nt-d{font-size:18px}
.nt-acts{display:flex;gap:6px;margin-left:auto}
.nt-acts .btn.sm{height:40px;padding:0 14px}
.nt-hrs{display:flex;align-items:flex-start;gap:5px;margin-top:2px;font-size:13px;font-weight:600;line-height:1.45;color:var(--ink2);font-variant-numeric:tabular-nums}
.nt-hrs svg{width:12px;height:12px;margin-top:3px;color:var(--moon);flex-shrink:0}
.nt-m{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nt-p{position:relative;display:inline-flex;align-items:center;gap:4px;height:36px;max-width:100%;padding:0 12px 0 4px;border:none;border-radius:99px;background:var(--fill);color:var(--ink);font-size:15px;font-weight:700;letter-spacing:-.2px}
.nt-p.has-ig{padding-right:7px}
.nt-p.short{padding:0 14px;background:var(--red-soft);color:var(--red);font-weight:800}
button.nt-p{cursor:pointer}
.nt-pb{position:relative;display:inline-flex;align-items:center;gap:6px;min-width:0;height:100%;padding:0;border:none;background:none;color:inherit;font:inherit;letter-spacing:inherit}
button.nt-pb{cursor:pointer}
button.nt-pb::after,button.nt-p::after{content:"";position:absolute;inset:-4px -2px}   /* 보이는 크기 36px, 누르는 자리 44px */
.nt-nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--av-bg) center/cover no-repeat;color:var(--av-ink);font-size:12px;font-weight:800}
.nt-av.photo{color:transparent}
.nt-ig{position:relative;margin-left:4px}
.nt-ig::after{content:"";position:absolute;inset:-11px -6px}
button.nt-p:active,.nt-p:has(button.nt-pb:active){background:#e6e3e8}
button.nt-p.short:active{filter:brightness(.95)}
button.nt-p:focus-visible,button.nt-pb:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.nt-g,.nt-me{font-size:11px;font-weight:800;color:#fff;border-radius:99px;padding:2px 7px;line-height:1.3}
.nt-g{background:var(--devil-red)}
.nt-me{background:var(--ink)}
.nt-none{font-size:14px;font-weight:600;color:var(--muted);margin-top:4px}
.nt-none.wait{color:var(--ink2)}

/* ── 야간 멤버 넣기 시트 ── */
.nm-cands{display:flex;flex-direction:column;gap:8px}
.nm-cands>.spin{align-self:center;margin:6px 0}
.nm-t{font-size:13.5px;font-weight:800;color:var(--ink2)}
.nm-note{font-size:13px;font-weight:600;color:var(--muted);line-height:1.5}
.nm-chips{display:flex;flex-wrap:wrap;gap:8px}
.nm-chip{position:relative;height:36px;padding:0 14px;border:none;border-radius:99px;background:var(--fill);color:var(--ink);font-size:15px;font-weight:700;cursor:pointer}
.nm-chip::after{content:"";position:absolute;inset:-4px -2px}
.nm-chip:active{background:#e6e3e8}

/* 320px: 주간 제목이 달을 넘나들 때("11월 29일 – 12월 5일") › 버튼과 닿지 않게 */
@media (max-width:359px){.dlabel{font-size:19px}.nt-acts .btn.sm{padding:0 11px}}

/* ── css/20-people.css ── */
/* 대타 게시판 · 내 근무 · 종(알림) · 내 정보: 01-staff.css 에 없는 것만 (시안 swap.css 바탕) */

/* ── 대타 목록 줄 ── */
.lrow.sw{padding:16px 2px}
.lrow.sw .lm{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
/* 묶음: [매장·날짜 + 구하는 사람] 8 [사유 + 마감] */
.lrow.sw .sw-who{margin-bottom:2px}
.lrow.sw .sw-meta{margin-top:-4px}
.lrow.sw .sw-who+.sw-meta{margin-top:0}
.sw-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;min-width:0}
.sw-date{font-size:15px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.sw-who{display:flex;align-items:center;gap:8px;min-width:0;font-size:16px;font-weight:800;letter-spacing:-.3px}
.sw-who>span:last-child{min-width:0}
.av.sw-av{width:26px;height:26px;font-size:12px;flex-shrink:0}
.sw-take{display:flex}
.sw-why{display:block;max-width:100%;font-size:14.5px;font-weight:500;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw-meta{font-size:13px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}

/* ── 대타 글 시트 ── */
.sw-sd-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sw-sd-top+.sw-sd-date{margin-top:-8px}
.sw-reason+.sw-meta{margin-top:-6px}
.sw-sd-date{font-size:22px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.sw-reason{font-size:15px;font-weight:600;line-height:1.55;overflow-wrap:anywhere}
.sw-state{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14px;font-weight:600;color:var(--ink2)}
.sw-cmbox{border-top:1px solid var(--line);padding-top:12px}
.sw-cm-h{font-size:15px;font-weight:800}
.sw-cm-h b{font-variant-numeric:tabular-nums}
.sw-cm{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.sw-cm:last-child{border-bottom:none}
.sw-cm .av.sw-av{margin-top:1px}
.sw-cm-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sw-cm-b b{font-size:14px;font-weight:800}
.sw-cm-b span{font-size:15px;font-weight:500;line-height:1.5;overflow-wrap:anywhere}
.sw-cm-x{width:44px;height:44px;margin:-10px -10px -10px 0;flex-shrink:0;border:none;background:none;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.sw-cm-x svg{width:16px;height:16px}
.sw-cm-x:active{background:var(--fill)}
.sw-none{padding:14px 0 4px}
.sw-form{display:flex;gap:8px}
.sw-form .fld{flex:1;min-width:0}
.sw-form .btn{height:48px;flex-shrink:0;border-radius:var(--r-md)}

/* ── 내 근무 ── */
.mn-todays{display:flex;flex-direction:column;gap:10px}
.mn-today{padding:16px;display:flex;flex-direction:column;gap:4px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.mn-t-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.mn-t-date{font-size:24px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums;margin-top:4px}
.mn-t-what{font-size:15px;font-weight:700;color:var(--acc-ink);font-variant-numeric:tabular-nums;margin-bottom:8px}
.mn-hours{font-size:13px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums;margin:-6px 0 6px;overflow-wrap:anywhere}
.mn-with{font-size:14px;font-weight:600;line-height:1.5;color:var(--ink2);overflow-wrap:anywhere}
.mn-with span{display:inline-block;min-width:3.6em;margin-right:8px;font-size:12.5px;font-weight:800;color:var(--ink)}
.mn-t-acts{display:flex;gap:8px;margin-top:12px}
.mn-t-acts .btn{flex:1;height:44px;min-width:0}
.mn-login{width:100%;margin-top:4px}

.mn-row{gap:14px;min-height:64px}
.mn-d{width:58px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.mn-d b{font-size:21px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.mn-d small{font-size:11.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
.mn-d small.sun{color:var(--sun)}
.mn-d small.sat{color:var(--sat)}
.mn-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px}

.mn-sh-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.mn-sh-what{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.sheet-b .mn-hours{margin:-8px 0 0}

/* ── 종(알림) 시트 ── */
.bl-body{display:flex;flex-direction:column}
.bl-load{display:flex;justify-content:center;padding:30px 0}
.bl-h{font-size:13.5px;font-weight:800;color:var(--ink2);padding:14px 2px 2px}
.bl-h:first-child{padding-top:0}
.bl-h b{font-variant-numeric:tabular-nums;color:var(--ink)}
.noti-b{font-size:14px;font-weight:600;line-height:1.45;color:var(--ink2);overflow-wrap:anywhere}
.noti.bl-ap{cursor:default}
.noti.bl-ap:active{background:none}
.bl-acts{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.bl-acts .btn{min-width:64px}

/* ── 내 정보 ── */
.ac-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.ac-l small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-l small.ac-warn{color:var(--red)}
.ac-pin{font-variant-numeric:tabular-nums;letter-spacing:2px}
.crop-wrap{position:relative;width:100%;max-width:280px;aspect-ratio:1;margin:0 auto;border-radius:var(--r-lg);overflow:hidden;background:var(--fill)}
.crop-cv{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.crop-cv:active{cursor:grabbing}
.crop-ring{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(255,255,255,.6);pointer-events:none}
.crop-zoom{width:100%;height:44px;accent-color:var(--ink)}

@media (max-width:340px){
  .mn-d{width:50px}
  .mn-d b{font-size:18px}
  .mn-row{gap:10px}
  .sw-sd-date,.mn-t-date{font-size:20px}
}

/* ── css/30-admin.css ── */
/* 시프트 제출 + 관리 화면: moe-system / staff.css에 없는 것만 */

/* 작은 버튼도 누르는 자리는 44px */
.btn.t44{min-height:44px}
.btn.sm.hit{position:relative}
.btn.sm.hit::after{content:"";position:absolute;inset:-6px -4px}

.sb-quiet{font-size:13px;font-weight:600;color:var(--muted);padding:0 2px 6px}

/* ── 시프트 제출 ── */
.sb-stat{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px;font-variant-numeric:tabular-nums}
.sb-stat b{font-weight:800}
.sb-sec{margin-top:24px}
.sb-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.sb-sec .sb-row:last-child{border-bottom:none}
.sb-date{width:34px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;line-height:1.15;font-variant-numeric:tabular-nums}
.sb-date b{font-size:17px;font-weight:800;letter-spacing:-.3px}
.sb-date small{font-size:11.5px;font-weight:700;color:var(--ink2)}
.sb-date.sat b,.sb-date.sat small{color:var(--sat)}
.sb-date.sun b,.sb-date.sun small{color:var(--sun)}

.sb-cs{flex:1;min-width:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.sb-c{min-width:0;min-height:52px;padding:4px 2px;border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink2);font-size:12px;font-weight:700;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;
  transition:border-color .15s ease,background-color .15s ease,color .15s ease,transform .12s ease}
.sb-c img{width:22px;height:22px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.sb-c span{max-width:100%;overflow:hidden;text-overflow:clip}
.sb-c:active{transform:scale(.96)}
.sb-c[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:var(--cs);color:var(--ci);font-weight:800}
.sb-c.any[aria-pressed="true"]{border-color:var(--ink);box-shadow:none;background:var(--ink);color:#fff}
.sb-c.no[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red);background:var(--red-soft);color:var(--red)}
.sb-c.any,.sb-c.no{font-size:12.5px}

/* 야간: 날짜 + 시간 + 가능/불가 */
.sb-n .sb-nm{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.sb-nm img{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.sb-nm span{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.sb-nm b{font-size:14.5px;font-weight:800;white-space:nowrap}
.sb-nm small{font-size:12px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.sb-ans{display:grid;grid-template-columns:repeat(2,56px);gap:4px;flex-shrink:0}
.sb-ans .sb-c{min-height:48px;font-size:14px}

/* 제출 끝난 화면 */
.sb-sum{min-height:52px}
.sb-sum b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.sb-lg{width:24px;height:24px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px;box-shadow:0 0 0 1px rgba(0,0,0,.06)}

/* 320px: 날짜를 윗줄로 올리고 5칸을 한 줄 전체로 */
@media (max-width:350px){
  .sb-d{flex-wrap:wrap;gap:4px 0}
  .sb-d .sb-date{width:100%;flex-direction:row;justify-content:flex-start;align-items:baseline;gap:5px}
  .sb-d .sb-cs{flex:1 1 100%}
  .sb-c{font-size:11.5px}
  .sb-c.any,.sb-c.no{font-size:12px}
  .sb-n{flex-wrap:wrap;gap:4px 8px}
  .sb-n .sb-date{width:100%;flex-direction:row;justify-content:flex-start;align-items:baseline;gap:5px}
  .sb-n .sb-ans{margin-left:auto}
}

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ── js/00-config.js ──
// 설정: 운영 staff.html 과 같은 Supabase 공개 값 (anon key 는 이미 공개돼 있어요)
{
  const CONFIG = {
    SUPABASE_URL:      'https://izpotztbvjazfvcntqyh.supabase.co',
    SUPABASE_ANON_KEY: 'sb_publishable_ToHVeUEnJVmlHCcu_-QcnQ_ofP55Q_N',
  };
  const VAPID_PUBLIC = 'BIGMR24JXMJI0jjsqGLmUfR-IT2ry-BBHf3KoNqijazAHB91X2Gw1Lm_P3Ou7Jd0R1XQgzrZjNmdjQ1vrY7Zwrs';

  const A = window.App = window.App || {};
  A.CONFIG = CONFIG;
  A.VAPID_PUBLIC = VAPID_PUBLIC;
  A.supa = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
}

// ── js/01-api.js ──
// 서버 호출: rpc(운영 staff.html 1072-1079 와 같은 규칙) · direct · notify · 사진 올리기 · 오류 문구
// 화면은 쓰기 뒤에 App.store.invalidate…() 하고 App.render({keep:true}) 를 불러요. rpc 는 다시 그리지 않아요.
{
  const A = window.App;
  // 'P0001: 관리자만 가능합니다' → '관리자만 가능합니다'
  const errText = (e, fallback = '') => String((e && e.message) || e || '').replace(/^.*?:\s*/, '') || fallback;
  const STALE_RE = /PIN이 올바르지 않습니다/;   // _verify 실패 (토큰이 지워졌거나 PIN이 바뀜)
  const ADMIN_RE = /관리자만 가능합니다/;       // 관리자 RPC: 토큰이 죽었거나 관리자에서 빠졌을 때 둘 다

  // '관리자만 가능합니다' 가 오면 my_profile 로 토큰이 살아 있는지, 아직 관리자인지 확인해요.
  let checking = null;
  function checkAdmin() {
    const s = A.session;
    if (!s || checking) return checking;
    checking = (async () => {
      try {
        const { data, error } = await A.supa.rpc('my_profile', { p_staff_id: s.id, p_pin: s.pin });
        if (error) { if (STALE_RE.test(String(error.message || ''))) A.auth.expire(); return; }
        if (data && data.is_admin === false && A.session && A.session.is_admin) A.auth.update({ is_admin: false });
      } catch (e) { /* 네트워크 오류: 다음에 다시 */ }
    })().finally(() => { checking = null; });
    return checking;
  }
  // 토큰이 죽은 오류면 로그아웃 처리하고 true
  function onError(error) {
    if (!A.session) return false;
    const raw = String((error && error.message) || '');
    if (STALE_RE.test(raw)) { A.auth.expire(); return true; }
    if (ADMIN_RE.test(raw) && A.session.is_admin) checkAdmin();
    return false;
  }

  // 로그인한 사람의 RPC. 실패하면 정확히 false, 성공하면 data ?? true (0 이 올 수 있으니 === false 로 확인)
  async function rpc(fn, args = {}, { ok, quiet } = {}) {
    let s = A.session;
    if (!s) { A.auth.openLogin(); return false; }
    if (!String(s.pin || '').startsWith('tk_')) {           // 예전 PIN 세션: 먼저 토큰으로 바꿔요 (운영 969-978)
      await A.auth.upgradeSession();
      s = A.session;
      if (!s) { A.auth.openLogin(); return false; }
      if (!String(s.pin || '').startsWith('tk_')) { if (!quiet) A.toast('연결을 확인하고 다시 해 주세요', true); return false; }
    }
    let res;
    try { res = await A.supa.rpc(fn, { ...args, p_pin: s.pin }); }
    catch (e) { res = { error: e }; }
    const { data, error } = res;
    if (error) {
      if (!onError(error) && !quiet) A.toast(errText(error, '오류'), true);
      return false;
    }
    if (ok) A.toast(ok);
    return data ?? true;
  }

  // 그대로 부르는 RPC (p_pin 을 붙이지 않음, 알림 없음). {data, error, text}
  async function direct(fn, args) {
    try {
      const { data, error } = args === undefined ? await A.supa.rpc(fn) : await A.supa.rpc(fn, args);
      if (error) { onError(error); return { data: null, error, text: errText(error, '오류') }; }
      return { data, error: null, text: '' };
    } catch (e) { return { data: null, error: e, text: errText(e, '오류') }; }
  }

  // notify 엣지 함수: 기다리지 않고 보내요 (운영과 같음). 운영에서 쓰는 body 만 보내 주세요.
  function notify(body = {}) {
    const s = A.session;
    if (!s) return;
    try { Promise.resolve(A.supa.functions.invoke('notify', { body: { ...body, staff_id: s.id, token: s.pin } })).catch(() => {}); }
    catch (e) { /* 무시 */ }
  }

  // 프로필 사진: avatars/<id>-<시각>.jpg (JPEG, 1MB 이하) 올리고 set_my_avatar. 성공하면 주소, 실패하면 false
  async function uploadAvatar(blob) {
    const s = A.session;
    if (!s) { A.auth.openLogin(); return false; }
    if (!blob || blob.size > 1024 * 1024) { A.toast('사진이 너무 커요. 1MB 이하로 올려 주세요', true); return false; }
    A.toast('사진 올리는 중…');
    try {
      const path = `${s.id}-${Date.now()}.jpg`;
      const bucket = A.supa.storage.from('avatars');
      const up = await bucket.upload(path, blob, { contentType: 'image/jpeg', upsert: false });
      if (up.error) throw up.error;
      const url = bucket.getPublicUrl(path).data.publicUrl;
      const { error } = await A.supa.rpc('set_my_avatar', { p_staff_id: s.id, p_pin: s.pin, p_url: url });
      if (error) { if (onError(error)) return false; throw error; }
      A.auth.update({ avatar: url });
      A.toast('프로필 사진을 바꿨어요');
      return url;
    } catch (e) {
      A.toast('사진 업로드 실패: ' + errText(e, String(e)), true);
      return false;
    }
  }

  A.api = { rpc, direct, notify, uploadAvatar, errText };
}

// ── js/02-store.js ──
// 읽기 저장소: 스케줄은 달 단위로 모아 두고(ensure → day 는 바로 읽기), 나머지는 부를 때마다 새로 읽어요.
// 뷰·열·조건은 운영 staff.html 그대로 (.ui-design/v2-plan/staff-inventory.md §1.2). 쓰기 뒤에는 invalidate….
{
  const A = window.App;
  const coll = new Intl.Collator('ko');
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const ymOf = ds => String(ds).slice(0, 7);
  const monthEnd = ym => { const [y, m] = ym.split('-').map(Number); return `${ym}-${pad(new Date(y, m, 0).getDate())}`; };
  const monthsIn = (from, to) => {
    const out = [], last = ymOf(to);
    let [y, m] = ymOf(from).split('-').map(Number);
    for (let i = 0; i < 240; i++) {
      const ym = `${y}-${pad(m)}`; out.push(ym);
      if (ym >= last) break;
      if (++m > 12) { m = 1; y++; }
    }
    return out;
  };
  const isAdmin = () => !!(A.session && A.session.is_admin);
  // 게스트 먼저, 그다음 이름 (가나다)
  const byGuestFirst = (a, b) => ((b.guest ? 1 : 0) - (a.guest ? 1 : 0)) || coll.compare(a.name || '', b.name || '');
  let lastFail = 0;
  const failToast = () => { const t = Date.now(); if (t - lastFail < 3000) return; lastFail = t; A.toast('불러오지 못했어요. 당겨서 새로고침해 주세요', true); };

  // ── 모양 맞추기 ──
  // Shift: empty = 직원도 게스트도 없는 줄 (빈 자리 / 부족). status 'seeking_sub' = 대타 구하는 중
  // gname = 명단에 없는 이름으로 넣은 줄. guest = 손님 페이지에 '게스트'로 보이는지 (표시를 끄면 gname 이어도 false)
  // showGuest: DB 에 show_guest 칸이 있을 때만 true/false, 없으면 null (supabase-v2-guest-label.sql 적용 전)
  const showGuestOf = r => { if (!('show_guest' in r)) return null; A.guestLabel = true; return r.show_guest !== false; };
  // start_time 칸이 있을 때만 A.shiftTime (supabase-v2-shift-time.sql 적용 전엔 근무 시간 바꾸기를 숨겨요)
  const shiftTimeOf = r => { if ('start_time' in r) A.shiftTime = true; return r; };
  const toShift = r => {
    const guestName = r.guest_name || null;
    const empty = r.staff_id == null && !guestName;
    return {
      gname: !empty && r.staff_id == null, showGuest: showGuestOf(r),
      id: r.id, date: r.work_date, wp: r.workplace,
      name: empty ? '' : (r.display_name || r.staff_name || guestName || ''),
      staffId: r.staff_id ?? null,
      guest: !empty && (r.is_guest != null ? !!r.is_guest : r.staff_id == null),
      insta: r.staff_instagram || null, avatar: r.staff_avatar || null,
      start: r.start_time || '', end: r.end_time || '', memo: r.memo || '',
      status: r.status || 'confirmed', empty,
    };
  };
  // Night: short = 이름 '부족' + 직원 없음 (자리 표시)
  const toNight = r => {
    const short = r.member_name === '부족' && r.staff_id == null;
    return {
      gname: !short && r.staff_id == null, showGuest: showGuestOf(r),
      id: r.id, date: r.work_date, wp: r.workplace, name: r.member_name || '',
      staffId: r.staff_id ?? null, guest: !short && (r.is_guest != null ? !!r.is_guest : r.staff_id == null),
      insta: r.instagram || null, avatar: r.avatar || null, short,
      start: shiftTimeOf(r).start_time || '', end: r.end_time || '',
    };
  };
  const toSwap = r => ({
    id: r.id, shiftId: r.shift_id, status: r.status, reason: r.reason || '', createdAt: r.created_at,
    requesterId: r.requester_id, requesterName: r.requester_name || '',
    takerId: r.taker_id ?? null, takerName: r.taker_name || '',
    date: r.work_date, wp: r.workplace, start: r.start_time || '', end: r.end_time || '',
  });

  // ── 상태(공개·제출) ──
  let statusMap = new Map(), statusP = null;
  function loadStatus({ cached = false } = {}) {
    if (cached && statusP) return statusP;
    const p = statusP = (async () => {
      const { data, error } = await A.supa.from('schedule_status_view').select('*');
      if (error) { if (statusP === p) statusP = null; failToast(); return false; }
      statusMap = new Map((data || []).map(r => [r.ym, { published: r.published !== false, submit_open: !!r.submit_open }]));
      return true;
    })();
    return p;
  }
  // 줄이 없는 달 = 공개 + 제출 닫힘
  const status = ym => ({ ...(statusMap.get(ym) || { published: true, submit_open: false }) });
  const isDraft = ds => status(ymOf(ds)).published === false;
  const openMonths = () => [...statusMap].filter(([, v]) => v.submit_open).map(([k]) => k).sort();

  // ── 직원 목록 (관리자는 admin_staff_directory, 실패하면 공개 목록) ──
  let staff = [], dirP = null;
  function directory({ fresh = false } = {}) {
    if (fresh) dirP = null;
    if (dirP) return dirP;
    const p = dirP = (async () => {
      const s = A.session;
      let r = null;
      if (s && s.is_admin) r = await A.api.direct('admin_staff_directory', { p_admin_id: s.id, p_pin: s.pin });
      if (!r || r.error) r = await A.api.direct('staff_directory');
      if (r.error) { if (dirP === p) dirP = null; failToast(); return staff; }
      staff = (r.data || []).map(x => ({ ...x }))
        .sort((a, b) => ((b.is_admin ? 1 : 0) - (a.is_admin ? 1 : 0)) || coll.compare(a.name || '', b.name || ''));
      return staff;
    })();
    return p;
  }

  // ── 달 단위 스케줄 ──
  const months = new Map();   // ym -> {p, data}
  async function loadMonth(ym) {
    const from = `${ym}-01`, to = monthEnd(ym);
    const range = v => A.supa.from(v).select('*').gte('work_date', from).lte('work_date', to);
    const res = await Promise.all([
      range('shift_view').order('work_date').order('workplace').order('start_time'),
      range('closure_view'), range('night_view'), range('day_event_view'),
      range('night_member_view'), range('application_view'),
    ]);
    const bad = res.find(r => r.error);
    if (bad) throw bad.error;
    const [sh, cl, ni, ev, nm, ap] = res.map(r => r.data || []);
    const d = { shifts: new Map(), closed: new Set(), nights: new Map(), events: new Map(), members: new Map(), apps: new Map() };
    const push = (m, k, v) => { if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
    const key = r => r.work_date + '|' + r.workplace;
    sh.forEach(r => push(d.shifts, key(r), toShift(r)));
    cl.forEach(r => d.closed.add(key(r)));
    ni.forEach(r => d.nights.set(key(r), r.hours));
    ev.forEach(r => { if (r.event) d.events.set(key(r), r.event); });
    nm.forEach(r => push(d.members, key(r), toNight(r)));
    ap.forEach(r => push(d.apps, r.shift_id, { appId: r.id, staffId: r.applicant_id, name: r.applicant_name || '' }));
    return d;
  }
  // from~to 의 달을 모두 읽어 둬요 (+ 공개 상태, 직원 목록). 다 되면 true, 하나라도 실패하면 false
  async function ensure(from, to = from) {
    if (from > to) [from, to] = [to, from];
    const jobs = monthsIn(from, to).map(ym => {
      let e = months.get(ym);
      if (!e) {
        e = { p: null, data: null };
        months.set(ym, e);
        const mine = e;
        e.p = loadMonth(ym).then(
          d => { if (months.get(ym) === mine) mine.data = d; return true; },
          err => { console.warn('store: month load failed', ym, err && err.message); if (months.get(ym) === mine) months.delete(ym); failToast(); return false; });
      }
      return e.p;
    });
    jobs.push(loadStatus({ cached: true }), directory());
    const r = await Promise.all(jobs);
    return r.every(x => x !== false);
  }
  // 바로 읽기 (ensure 뒤). 관리자가 아니면 공개 전 달은 비워서 줘요 (draft:true 만 남김).
  function day(ds, wp) {
    const key = ds + '|' + wp, e = months.get(ymOf(ds)), d = e && e.data;
    const draft = isDraft(ds);
    const blank = { ds, wp, closed: false, event: null, shifts: [], slots: [], night: null, draft };
    if (!d || (draft && !isAdmin())) return blank;
    if (d.closed.has(key)) return { ...blank, closed: true };
    const all = d.shifts.get(key) || [];
    const shifts = all.filter(s => !s.empty).sort(byGuestFirst);
    const slots = all.filter(s => s.empty).map(s => ({ ...s, applicants: (d.apps.get(s.id) || []).slice() }));
    const hours = d.nights.get(key);
    const night = hours ? {
      hours,
      members: (d.members.get(key) || []).slice().sort((a, b) => ((a.short ? 1 : 0) - (b.short ? 1 : 0)) || byGuestFirst(a, b)),
    } : null;
    return { ds, wp, closed: false, event: d.events.get(key) || null, shifts, slots, night, draft };
  }
  function invalidate(from, to = from) {
    if (from > to) [from, to] = [to, from];
    monthsIn(from, to).forEach(ym => months.delete(ym));
  }
  function invalidateAll() { months.clear(); statusP = null; dirP = null; }

  // ── 화면별 읽기 (캐시 없음) ──
  // 대타: {status:'open'|'completed'|…, requesterId, shiftId, since(ISO), limit}. open 은 근무일 순, 그 밖은 최근 글 순
  async function swaps({ status: st, requesterId, shiftId, since, limit } = {}) {
    let q = A.supa.from('swap_view').select('*');
    if (st) q = q.eq('status', st);
    if (requesterId != null) q = q.eq('requester_id', requesterId);
    if (shiftId != null) q = q.eq('shift_id', shiftId);
    if (since) q = q.gte('created_at', since);
    q = st === 'open' ? q.order('work_date').order('start_time') : q.order('created_at', { ascending: false });
    if (limit) q = q.limit(limit);
    const { data, error } = await q;
    if (error) { failToast(); return []; }
    return (data || []).map(toSwap);
  }
  // 댓글: {요청 id: [댓글…]} (오래된 순)
  async function comments(ids = []) {
    const out = {};
    ids = [...new Set(ids)].filter(x => x != null);
    if (!ids.length) return out;
    const { data, error } = await A.supa.from('swap_comment_view').select('*').in('request_id', ids).order('created_at');
    if (error) { failToast(); return out; }
    (data || []).forEach(r => (out[r.request_id] = out[r.request_id] || []).push({
      id: r.id, requestId: r.request_id, authorId: r.author_id, authorName: r.author_name || '',
      avatar: r.avatar || null, body: r.body || '', createdAt: r.created_at,
    }));
    return out;
  }
  // 내 근무: 오늘부터, 주간(Shift, night:false) + 야간(Night, night:true), 공개된 달만, 날짜 순
  async function myShifts() {
    const s = A.session;
    if (!s) return [];
    const today = ymd(new Date());
    const [sh, nm, st] = await Promise.all([
      A.supa.from('shift_view').select('*').eq('staff_id', s.id).gte('work_date', today).order('work_date').order('start_time'),
      A.supa.from('night_member_view').select('*').eq('staff_id', s.id).gte('work_date', today).order('work_date'),
      loadStatus({ cached: true }),
    ]);
    if (sh.error || nm.error || st === false) { failToast(); return []; }   // 공개 상태를 모르면 공개 전 달이 섞일 수 있어요
    return [
      ...(sh.data || []).map(r => ({ ...toShift(r), night: false })),
      ...(nm.data || []).map(r => ({ ...toNight(r), night: true })),
    ].filter(x => !isDraft(x.date))
      .sort((a, b) => a.date.localeCompare(b.date) || ((a.night ? 1 : 0) - (b.night ? 1 : 0)) || String(a.start || '').localeCompare(String(b.start || '')));
  }
  // 내 제출: {qkey: choice} ('d:YYYY-MM-DD' → '메이드'…, 'n:<id>' → '가능'|'불가능')
  async function submission(ym) {
    const s = A.session;
    if (!s) return {};
    const r = await A.api.direct('my_submission', { p_staff_id: s.id, p_pin: s.pin, p_ym: ym });
    const map = {};
    if (r.error) { if (A.session) A.toast(r.text, true); return map; }
    (Array.isArray(r.data) ? r.data : []).forEach(a => { if (a && a.qkey) map[a.qkey] = a.choice; });
    return map;
  }
  // 야간 문항: 날짜 → sort → id 순
  async function nightQuestions(ym) {
    const { data, error } = await A.supa.from('submission_night_view').select('*').eq('ym', ym);
    if (error) { failToast(); return []; }
    return (data || []).map(n => ({ id: n.id, ym: n.ym, label: n.label || '', sort: n.sort, wp: n.workplace, date: n.work_date, hours: n.hours || '' }))
      .sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')) || (a.sort - b.sort) || (a.id - b.id));
  }
  // 모두의 제출 답 (관리자 화면용; 뷰는 공개)
  async function answers(ym) {
    const { data, error } = await A.supa.from('submission_answer_view').select('*').eq('ym', ym);
    if (error) { failToast(); return []; }
    return (data || []).map(a => ({ staffId: a.staff_id, staffName: a.staff_name || '', ym: a.ym, qkey: a.qkey, choice: a.choice }));
  }

  A.store = {
    ensure, day, isDraft, status, loadStatus, openMonths, directory, staff: () => staff,
    invalidate, invalidateAll, swaps, comments, myShifts, submission, nightQuestions, answers,
  };
}

// 해시 바로가기, 당겨서 새로고침, 위 바·아래 메뉴. 화면 파일은 App.screen()/App.view()로 자기를 등록해요.
{

  const $ = id => (pendingRoot && pendingRoot.querySelector('#' + CSS.escape(id))) || document.getElementById(id);

  const pad = n => String(n).padStart(2, '0');

  const emptyBox = (ic, t, s) => `<div class="empty-box"><div class="e-ic">${ICON[ic] || ''}</div><div class="e-t">${esc(t)}</div>${s ? `<div class="e-s">${esc(s)}</div>` : ''}</div>`;
  // 사진 주소 안의 따옴표·괄호 등은 %인코딩 → style 밖으로 못 빠져나감 (운영 avStyle)
  const cssUrl = url => String(url).replace(/["'()\\<>&\s]/g, c => '%' + c.charCodeAt(0).toString(16).padStart(2, '0'));
  // avatar(name, cls, url) 또는 avatar({name, avatar}, cls): 사진이 있으면 사진, 없으면 첫 글자
  const avatar = (name, cls = 'av', url = null) => {
    if (name && typeof name === 'object') { url = url ?? name.avatar; name = name.name; }

  };
  const storeTag = (wp, cls = 'store-tag') => `<span class="${cls}"><img src="${logo(wp)}" alt=""><span>${esc(storeName(wp))}</span></span>`;
  const pageHead = (title, sub) => `<header class="page-h"><h1>${esc(title)}</h1>${sub ? `<p>${esc(sub)}</p>` : ''}</header>`;
  const isAdmin = () => !!(A.session && A.session.is_admin);

  // ── 이름 찾기: 초성도 돼요 (ㄹㅇ → 레인) ──
  const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  const cho = s => [...String(s)].map(c => { const k = c.charCodeAt(0) - 0xAC00; return k >= 0 && k < 11172 ? CHO[Math.floor(k / 588)] : c; }).join('');
  const nameHit = (name, q) => { q = String(q || '').trim(); if (!q) return true; const n = String(name || ''); return n.toLowerCase().includes(q.toLowerCase()) || cho(n).includes(cho(q)); };

  // ── 직원 고르기: 찾기 칸 + 목록. 고른 id 는 숨은 input(attr)에 담겨서 .value 로 읽어요 ──
  // staffPick({ staff, sel, attr: 'data-f="staff"', wrap: 'data-p="staff"' }) → html, bindStaffPick(el) 로 연결
  const koColl = new Intl.Collator('ko');
  const staffPick = ({ staff = [], sel = null, attr = '', wrap = '', label = '직원' }) => {
    const list = staff.slice().sort((a, b) => koColl.compare(String(a.name || ''), String(b.name || '')));
    const cur = list.find(s => sel != null && String(s.id) === String(sel));
    const rows = list.map(s => { const on = cur === s;
      return `<button type="button" class="lrow spk-row${on ? ' on' : ''}" role="option" aria-selected="${on}" data-id="${esc(s.id)}" data-n="${esc(s.name)}">${avatar(s.name, 'av', s.avatar_url || s.avatar || null)}<span class="lm"><span class="lt">${esc(s.name)}</span></span><span class="spk-ck">${ICON.check}</span></button>`; }).join('');
    return `<div class="spk" data-spk ${wrap}><input type="hidden" ${attr} value="${cur ? esc(cur.id) : ''}">
      <div class="spk-h"><span>${esc(label)}</span><b data-spk-cur>${cur ? esc(cur.name) : ''}</b></div>
      <input class="fld" type="search" data-spk-q placeholder="이름 찾기 (초성도 돼요)" aria-label="${esc(label)} 이름 찾기" autocomplete="off" enterkeyhint="done">
      <div class="spk-list" role="listbox" aria-label="${esc(label)}">${rows}<div class="none" data-spk-none hidden></div></div></div>`;
  };
  const bindStaffPick = el => el.querySelectorAll('[data-spk]').forEach(w => {
    const hid = w.querySelector('input[type=hidden]'), q = w.querySelector('[data-spk-q]'), box = w.querySelector('.spk-list');
    const rows = [...w.querySelectorAll('.spk-row')], none = w.querySelector('[data-spk-none]'), curEl = w.querySelector('[data-spk-cur]');
    const pick = r => {
      rows.forEach(x => { const on = x === r; x.classList.toggle('on', on); x.setAttribute('aria-selected', String(on)); });
      hid.value = r.dataset.id; curEl.textContent = r.dataset.n; q.blur();
    };
    rows.forEach(r => r.onclick = () => pick(r));
    q.oninput = () => {
      let n = 0;
      rows.forEach(r => { const hit = nameHit(r.dataset.n, q.value); r.hidden = !hit; if (hit) n++; });
      none.hidden = !!n; none.textContent = `'${q.value.trim()}' 이름이 없어요`; box.scrollTop = 0;
    };
    q.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); const r = rows.find(x => !x.hidden); if (r) pick(r); } };
    const on = rows.find(r => r.classList.contains('on'));
    if (on) requestAnimationFrame(() => { box.scrollTop = on.offsetTop - box.clientHeight / 2 + on.offsetHeight / 2; });
  });

  // ── 시트·확인·입력·알림 ──
  let sheetSeq = 0;
  // 바텀시트: 화면 가장자리에서 띄운 카드. 손잡이·제목 줄을 끌면 따라 내려오고, 충분히 내리거나 빠르게 튕기면 닫혀요.
  // 내용은 맨 위에서 아래로 당길 때만 같이 끌려요 (안쪽 목록·입력칸에서는 안 끌림). close() 는 바로 정리하고 화면만 내려가며 사라져요.
  const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function sheet({ title, html = '', actions = [], onOpen, onClose } = {}) {

    const wrap = document.createElement('div');
    wrap.className = 'modal show'; wrap.id = id;
    wrap.innerHTML = `<div class="modal-c" role="dialog" aria-modal="true" tabindex="-1" aria-label="${esc(title || '')}">
      <div class="sheet-top"><div class="grab"></div><div class="sheet-h"><b>${esc(title || '')}</b><button class="sheet-x" data-x aria-label="닫기">${ICON.x}</button></div></div>
      <div class="sheet-b">${html}</div>${actions.length ? `<div class="sheet-a">${actions.map((a, i) => `<button class="btn lg ${a.kind || ''}" data-a="${i}">${esc(a.label)}</button>`).join('')}</div>` : ''}</div>`;
    const c = wrap.querySelector('.modal-c'), body = wrap.querySelector('.sheet-b'), top = wrap.querySelector('.sheet-top');

    const NO_PULL = 'input,textarea,select,.spk-list,.pick-list,.tl-body,.crop-cv,[data-nopull]';
    const nestedScroller = el => { for (let n = el; n && n !== body; n = n.parentElement) { if (n.scrollHeight > n.clientHeight + 1 && /(auto|scroll)/.test(getComputedStyle(n).overflowY)) return true; } return false; };

    document.getElementById('app').appendChild(wrap);
    void c.offsetHeight;                                      // 아래에 둔 채로 한 번 그린 뒤 올려요
    wrap.classList.add('in');

    if (onOpen) onOpen(wrap, close);
    return { el: wrap, close };
  }
  // 확인: 주 버튼은 오른쪽(마지막) 하나, 지우기·빼기는 연한 빨강. 닫으면 false
  const confirmBox = ({ title, text = '', ok = '확인', cancel = '취소', danger = false } = {}) => new Promise(res => {
    let done = false; const fin = v => { if (!done) { done = true; res(v); } };
    sheet({ title, html: text ? `<p class="sheet-p">${esc(text)}</p>` : '', onClose: () => fin(false), actions: [

  // 한 줄 입력: 다듬은 글자 또는 null(취소). validate(v) 가 문구를 돌려주면 시트 안에 보여 주고 기다려요.
  const promptBox = ({ title, text = '', label = '', value = '', placeholder = '', inputmode = '', maxlength, validate, ok = '확인', cancel = '취소' } = {}) => new Promise(res => {
    let done = false; const fin = v => { if (!done) { done = true; res(v); } };
    const attrs = `${inputmode ? ` inputmode="${esc(inputmode)}"` : ''}${maxlength ? ` maxlength="${+maxlength}"` : ''}${placeholder ? ` placeholder="${esc(placeholder)}"` : ''}`;
    const html = `${text ? `<p class="sheet-p">${esc(text)}</p>` : ''}<label class="fld-l">${esc(label)}<input class="fld" data-prompt autocomplete="off" aria-label="${esc(label || title || '')}" value="${esc(value)}"${attrs}></label><p class="sheet-err" hidden></p>`;

  const TABS = [['schedule', '스케줄', 'cal'], ['swaps', '대타', 'swap'], ['mine', '내 근무', 'mine'], ['submit', '제출', 'submit'], ['admin', '관리', 'admin']];
  const TAB_KEYS = TABS.map(t => t[0]);

  const tabFromHash = () => { const h = (location.hash || '').replace('#', ''); const k = ALIAS[h] || h; return TAB_KEYS.includes(k) ? k : null; };
  const state = { tab: 'schedule', view: 'day', date: parse(today()), wp: '전체', edit: false, dir: 0, quiet: false };
  // role: 'admin' | 'staff' | 'out' (로그아웃)
  Object.defineProperty(state, 'role', { enumerable: true, get: () => !A.session ? 'out' : A.session.is_admin ? 'admin' : 'staff' });
  const screens = {}, views = {};

  function renderShell() {
    const s = A.session, admin = isAdmin();
    const right = s
      ? `<button class="icon-btn bell" id="bellBtn" aria-label="알림">${ICON.bell}</button><button class="icon-btn me-btn" id="whoBtn" aria-label="내 정보">${avatar(s.name, 'me-av', s.avatar)}</button>`
      : `<button class="btn sm top-login" id="loginBtn">로그인</button>`;

    top.innerHTML = `<span class="brand">모에 스케줄<em>직원</em></span>${right}`;
    const tabs = TABS.filter(t => t[0] !== 'admin' || admin);
    const bar = document.getElementById('tabbar');
    bar.style.gridTemplateColumns = `repeat(${tabs.length},1fr)`;
    bar.innerHTML = tabs.map(([k, l, ic]) => `<button class="mtab${state.tab === k ? ' on' : ''}" data-tab="${k}"${state.tab === k ? ' aria-current="page"' : ''}>${ICON[ic]}<span>${l}</span></button>`).join('');
    bar.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab));

  }
  const syncHash = () => { const h = '#' + state.tab; if (location.hash !== h) history.replaceState(null, '', h); };

  // 그리기: 떼어 둔 화면(el)에 그린 뒤, 그 사이 더 새 그리기가 시작되지 않았을 때만 붙여요.
  // keep: 같은 화면에서 내용만 바뀔 때(쓰기 뒤) 스크롤 자리를 두고 움직임을 뺌. 붙였으면 true
  let seq = 0;
  // 로그인 전: 탭도 화면도 없이 입구만 (직원 전용). 주소의 탭(#swaps 등)은 그대로 두고, 로그인하면 그 탭이 열려요.
  function renderGate() {

  async function render({ keep = false } = {}) {

    syncHash();
    renderShell();
    const host = document.getElementById('screen');
    const s = screens[state.tab];
    if (keep) state.dir = 0;
    state.quiet = keep;
    const root = document.createElement('div');
    root.className = 'screen-root';
    pendingRoot = root;
    host.setAttribute('aria-busy', 'true');
    try {
      if (s) await s.render(root, { keep });
      else root.innerHTML = emptyBox('cal', '준비 중인 화면이에요');
    } catch (e) {
      console.error(e);
      if (my !== seq) return false;
      root.innerHTML = emptyBox('cal', '화면을 불러오지 못했어요', '당겨서 새로고침해 주세요');
    }
    if (my !== seq) return false;
    pendingRoot = null;
    const top = host.scrollTop;
    document.body.dataset.theme = root.dataset.theme || 'all';
    host.replaceChildren(root);
    host.scrollTop = keep ? top : 0;
    host.removeAttribute('aria-busy');
    state.quiet = false;
    return true;
  }
  function go(tab, opts = {}) {
    tab = ALIAS[tab] || tab;
    state.tab = TAB_KEYS.includes(tab) ? tab : 'schedule';
    if (opts.date) state.date = typeof opts.date === 'string' ? parse(opts.date) : new Date(opts.date);
    if (opts.view) state.view = opts.view;
    if (opts.wp) state.wp = opts.wp;
    state.dir = 0;
    return render();
  }
  const goDay = (ds, wp) => go('schedule', { date: ds, view: 'day', wp });

  // ── 당겨서 새로고침 (운영 setupPTR) ──
  function setupPTR(container, onRefresh) {
    let startY = 0, mode = 0, applied = 0, refreshing = false;   // mode: 0 미정, 1 당기는 중, -1 일반 스크롤
    const THRESH = 60, MAX = 90, DEAD = 12;
    const ptr = document.getElementById('ptr'), txt = document.getElementById('ptrTxt'), spin = document.getElementById('ptrSpin');
    const show = v => { if (ptr) ptr.style.opacity = String(Math.min(1, v / THRESH)); };
    container.addEventListener('touchstart', e => {
      if (refreshing || e.touches.length !== 1 || document.querySelector('#app > .modal:not(.closing)')) { mode = -1; return; }
      mode = 0; applied = 0; startY = e.touches[0].clientY;
    }, { passive: true });
    container.addEventListener('touchmove', e => {
      if (refreshing || mode === -1) return;
      const dy = e.touches[0].clientY - startY;
      if (mode === 0) {

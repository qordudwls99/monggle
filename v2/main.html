<!DOCTYPE html>
<html lang="ko">
<head>
<!-- Lucide icons © Lucide Contributors (ISC License) — https://lucide.dev -->

<title>모에 스케줄</title>
<meta name="description" content="오늘 누가 출근하는지 확인하세요." />
<meta property="og:title" content="모에 스케줄" />
<meta property="og:description" content="오늘 누가 출근하는지 확인하세요." />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://moetable.com/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="theme-color" content="#ffffff" />
<script>
/* 첫 화면 전에 밝기 모드를 정해요 (깜빡임 없음) */
(function(){try{var m=localStorage.getItem('moe_appearance'),d=m==='dark'||(m!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-appearance',d?'dark':'light');var t=document.querySelector('meta[name="theme-color"]');if(t)t.content=d?'#121214':'#ffffff';}catch(e){}})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="모에 스케줄" />
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#17151a; --ink2:#615c66; --muted:#8f8a94; --line:#eeebef; --fill:#f4f2f5;
  /* 매장 색: 인스타 프로필 로고 기준 */
  --acc:#d94079; --acc-ink:#b8285f; --acc-soft:#fdedf3; --night:#1f1b1e;
  --chip-bg:#fde4ef; --chip-ink:#7d1a42; --av-bg:#fde4ef; --av-ink:#b8285f;
}
[data-theme="all"]{ --acc:#17151a; --acc-ink:#17151a; --acc-soft:#f1eff2; --chip-bg:#f4f2f5; --chip-ink:#17151a; --av-bg:#f1eff2; --av-ink:#17151a; }
[data-theme="maid"]{ --acc:#d94079; --acc-ink:#b8285f; --acc-soft:#fdedf3; --chip-bg:#fde4ef; --chip-ink:#7d1a42; --av-bg:#fde4ef; --av-ink:#b8285f; }
[data-theme="devil"]{ --acc:#26211f; --acc-ink:#26211f; --acc-soft:#eeebec; --chip-bg:#2b2628; --chip-ink:#fff; --av-bg:#2b2628; --av-ink:#fff; }
[data-theme="matsuri"]{ --acc:#e0452e; --acc-ink:#c2381f; --acc-soft:#ffeadf; --chip-bg:#ffe6d6; --chip-ink:#8f2a12; --av-bg:#ffe6d6; --av-ink:#c2381f; }
html,body{height:100%}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system,system-ui,'Malgun Gothic',sans-serif;
  color:var(--ink); background:#f4f2f5; display:flex; justify-content:center; letter-spacing:-0.2px;
}
::selection{background:var(--acc-soft);color:var(--acc-ink)}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.app{width:100%;max-width:480px;min-height:100vh;min-height:100dvh;position:relative;display:flex;flex-direction:column;background:#fff}
#mainApp{flex:1;min-height:0;height:100dvh}

/* top bar */
.top{display:flex;align-items:center;gap:6px;padding:max(6px,env(safe-area-inset-top)) 8px 6px 20px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:20}
.brand{font-size:18px;font-weight:800;letter-spacing:-.4px;margin-right:auto}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:3px}
.seg button{border:none;cursor:pointer;font-weight:700;font-size:13.5px;padding:7px 13px;border-radius:8px;background:none;color:var(--ink2);transition:background-color .15s ease,color .15s ease}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.icon-btn{width:44px;height:44px;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);border-radius:12px}
.icon-btn svg{width:23px;height:23px}

.body{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;padding:14px 16px max(28px,env(safe-area-inset-bottom))}
.ptr{height:44px;margin-top:-44px;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-size:12.5px;font-weight:700}

/* store switch with the stores' own logos */
.chips{display:grid;grid-template-columns:.62fr 1fr 1fr 1fr;gap:6px}
.chip{height:52px;min-width:0;padding:0 6px;border:1px solid var(--line);background:#fff;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;font-size:15px;font-weight:700;color:var(--ink2);transition:border-color .15s ease,background-color .15s ease,color .15s ease,transform .12s ease}
.chip img{width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.chip img[data-missing]{display:none}
.chip.on{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:var(--cs);color:var(--ci)}
.chip:active{transform:scale(.97)}

/* date */
.datebar{display:flex;align-items:center;gap:8px;margin-top:2px}
.datebar .nav{width:40px;height:40px;flex-shrink:0;border:none;border-radius:50%;background:var(--fill);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.datebar .nav svg{width:18px;height:18px}
.dlabel{flex:1;border:none;background:none;cursor:pointer;min-width:0;font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.subline{height:28px;margin-top:2px;display:flex;align-items:center;justify-content:center}
.today-tag{font-size:12px;font-weight:800;color:#fff;background:var(--acc);border-radius:99px;padding:3px 10px}
.today-btn{border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:12.5px;font-weight:700;border-radius:99px;padding:4px 12px;cursor:pointer}
.today-tag[hidden],.today-btn[hidden]{display:none}
#list{margin-top:12px}

/* event day */
.event{display:flex;align-items:center;gap:10px;background:var(--acc);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:6px}
.event .ev-tag{flex-shrink:0;font-size:11.5px;font-weight:800;border-radius:99px;padding:3px 9px;background:rgba(255,255,255,.2)}
[data-theme="devil"] .event .ev-tag{background:#b3262f}
.event .ev-name{min-width:0;font-size:18px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* member rows */
.sec-h{display:flex;align-items:baseline;gap:8px;padding:14px 2px 6px;font-size:13.5px;font-weight:800;color:var(--ink)}
.sec-h .hrs{font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.sec-h .cnt{margin-left:auto;display:flex;align-items:center;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:13px;min-height:60px;padding:8px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.av{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--av-bg) center/cover no-repeat;color:var(--av-ink);font-size:16px;font-weight:800}
.av.photo{color:transparent}
.nm{flex:1;min-width:0;font-size:18px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbadge{flex-shrink:0;display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:800;color:#fff;background:var(--acc);border-radius:99px;padding:3px 10px 3px 8px}
.gbadge svg,.gcount svg,.wn svg{width:11px;height:11px;flex-shrink:0}
.gcount{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:800;color:var(--ink2);margin-right:8px}
.ig{width:44px;height:44px;margin:-6px -6px -6px 0;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:12px;transition:transform .12s ease}
.ig span{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(45deg,#f09433,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888)}
.ig svg{width:19px;height:19px}
.ig:active{transform:scale(.92)}
.none{text-align:center;color:var(--muted);font-weight:600;font-size:14px;padding:20px 0}
.hrs-line{font-size:13px;font-weight:600;color:var(--ink2);padding:8px 2px 0}

/* 데빌 night band: the only dark area */
.night{background:var(--night);color:#fff}
.night .sec-h{color:#fff}
.night .sec-h svg{width:14px;height:14px;align-self:center;color:#e0525c}
.night .sec-h .hrs{color:rgba(255,255,255,.7)}
.night .sec-h .cnt{color:rgba(255,255,255,.8)}
.night .row{border-bottom-color:rgba(255,255,255,.1)}
.night .av{background-color:rgba(255,255,255,.12);color:#fff}
.night .none{color:rgba(255,255,255,.6)}

/* empty / closed */
.empty-box{text-align:center;padding:52px 20px 40px;color:var(--ink2)}
.empty-box .e-ic{display:flex;justify-content:center;color:#b4afb9}
.empty-box .e-ic svg{width:44px;height:44px}
.empty-box .e-t{font-weight:800;font-size:19px;margin-top:14px;color:var(--ink)}
.empty-box .e-s{font-size:14px;font-weight:500;margin-top:6px}

/* week */
.wk{display:flex;flex-direction:column}
.wrow{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:none;background:none;cursor:pointer;padding:12px 2px;border-bottom:1px solid var(--line);transition:background-color .15s ease}
.wrow:last-child{border-bottom:none}
.wrow:active{background:#faf9fb}
.wd{width:42px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.wd .dow{font-size:12px;font-weight:700;color:var(--ink2)}
.wd .dn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.wrow.weekend .wd .dow{color:var(--acc-ink)}
.wrow.today .wd .dow{color:var(--acc-ink)}
.wrow.today .wd .dn{background:var(--acc);color:#fff}
.wbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;padding-top:3px}
.wnames{display:flex;flex-wrap:wrap;gap:6px}
.wn{display:inline-flex;align-items:center;gap:5px;font-size:14.5px;font-weight:700;padding:3px 10px 3px 3px;border-radius:99px;background:var(--chip-bg);color:var(--chip-ink)}
.wn .wa{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.8) center/cover no-repeat;color:var(--av-ink);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.wn .wa.photo{color:transparent}
.wn.guest{padding-right:8px}
.woff{font-size:15px;font-weight:600;color:var(--muted);padding-top:4px}
.wtags{display:flex;gap:6px;flex-wrap:wrap}
.wtag{font-size:12px;font-weight:800;border-radius:99px;padding:2px 9px;background:var(--acc-soft);color:var(--acc-ink)}
.wtag.nt{background:var(--night);color:#fff}
.wchev{flex-shrink:0;align-self:center;color:#c8c4cc}
.wchev svg{width:18px;height:18px}
.wk-hint{font-size:12.5px;color:var(--muted);padding:12px 2px 0}

/* calendar sheet */
/* 직원 페이지와 같은 바텀시트: 띄운 카드, 손잡이를 끌어서 닫기 */
.modal{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:flex-end;padding:max(12px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));background:rgba(20,14,22,0);transition:background-color .3s ease}
.modal.show{display:flex}
.modal.in{background:rgba(20,14,22,calc(.42 * var(--dim,1)))}
.modal.closing{pointer-events:none;transition-duration:.24s}
.modal-c{width:100%;max-width:480px;max-height:100%;overflow-y:auto;overscroll-behavior:contain;background:#fff;border-radius:28px;padding:0 20px 22px;transform:translateY(calc(100% + 24px));transition:transform .42s cubic-bezier(.32,.72,0,1)}
.modal.in .modal-c{transform:none}
.modal.closing .modal-c{transition-duration:.26s;transition-timing-function:cubic-bezier(.4,0,.9,.6)}
.modal.drag,.modal.drag .modal-c{transition:none}
.sheet-top{padding-top:8px;margin-right:-6px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.grab{width:36px;height:5px;border-radius:3px;background:#ddd9e0;margin:0 auto 4px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;margin-bottom:8px}
.sheet-h b{font-size:20px;font-weight:800;letter-spacing:-.4px}
.sheet-x{flex:none;width:34px;height:34px;border:none;border-radius:50%;background:var(--fill);color:var(--ink2);display:grid;place-items:center;cursor:pointer}
.sheet-x svg{width:16px;height:16px}
.sheet-x:active{background:var(--line)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h .cal-t{font-weight:800;font-size:16.5px}
.cal-h button{border:none;background:var(--fill);cursor:pointer;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.cal-h button svg{width:18px;height:18px}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
.cal-dow span{text-align:center;font-size:12px;font-weight:700;color:var(--ink2);padding:6px 0}
.cal-dow span.sun{color:#d92d20}.cal-dow span.sat{color:#2e6be6}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-cell{aspect-ratio:1;max-height:46px;border:none;background:none;cursor:pointer;font-size:16px;font-weight:600;color:var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:transform .1s ease}
.cal-cell:active{transform:scale(.9)}
.cal-cell.dim{pointer-events:none}
.cal-cell.sun{color:#d92d20}.cal-cell.sat{color:#2e6be6}
.cal-cell.today{box-shadow:inset 0 0 0 1.5px var(--acc)}
.cal-cell.sel{background:var(--acc)!important;color:#fff!important;font-weight:800}
.cal-cell:disabled{color:#d6d2d9;pointer-events:none}

.spin{display:inline-block;width:20px;height:20px;border:3px solid #ece8ee;border-top-color:var(--acc);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes slideR{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.anim-r{animation:slideR .26s cubic-bezier(.22,.61,.36,1)}
.anim-l{animation:slideL .26s cubic-bezier(.22,.61,.36,1)}
.anim-f{animation:fadeUp .24s ease}
.datebar .nav:active,.icon-btn:active{transform:scale(.92)}
@media (prefers-reduced-motion:reduce){.anim-r,.anim-l,.anim-f{animation:none}.modal,.modal-c{transition:none}}

.setup{padding:40px 22px;color:var(--ink)}
.setup h1{font-size:24px;font-weight:800}
.setup p{font-size:14px;line-height:1.7;margin-top:12px;font-weight:600;color:var(--ink2)}
.chip .ct{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;min-width:0}
.chip .ct b{font-size:14.5px;font-weight:800;white-space:nowrap}
.chip .ct small{font-size:11px;font-weight:700;color:var(--muted)}
.chip.on .ct small{color:inherit;opacity:.75}
.chip.all b{font-size:15px;font-weight:800}

/* 전체: 층별 구역 (3층 데빌 → 2층 메이드 → 1층 마츠리) */
.floor{padding:4px 0 6px}
.floor+.floor{margin:10px -16px 0;padding:16px 16px 6px;border-top:8px solid var(--fill)}
.floor-h{display:flex;align-items:center;gap:9px;padding:2px 0 10px}
.floor-h img{width:38px;height:38px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.floor-h .fl{font-size:14px;font-weight:800;color:var(--acc-ink)}
.floor-h b{font-size:19px;font-weight:800;letter-spacing:-.4px}
.floor-h .cnt{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.floor .event{padding:12px 14px;margin-bottom:4px}
.floor .event .ev-name{font-size:17px}

/* 데빌 주간 | 야간 두 칸 */
.dn{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start;margin-top:8px}
.dn-col{min-width:0;border-radius:14px;padding:2px 10px 6px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.dn-col.night{box-shadow:none;background:var(--night);color:#fff}
.dn-h{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;padding:10px 0 6px;font-size:14px}
.dn-h b{font-weight:800}
.dn-h span{font-weight:700;color:var(--ink2)}
.dn-h small{flex-basis:100%;font-size:12px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.dn-h svg{width:13px;height:13px;color:#e0525c}
.dn-col.night .dn-h span,.dn-col.night .dn-h small{color:rgba(255,255,255,.7)}
.row.sm{gap:9px;min-height:50px;padding:6px 0}
.row.sm .av{width:32px;height:32px;font-size:13px}
.row.sm .nm{font-size:16px}
.row.sm .ig{width:36px;height:40px;margin:-4px -4px -4px 0}
.row.sm .ig span{width:26px;height:26px;border-radius:8px}
.row.sm .ig svg{width:16px;height:16px}
.row.sm .gbadge{font-size:10.5px;padding:2px 6px 2px 5px}
.row.sm .gbadge svg{width:9px;height:9px}

/* 전체 주간: 층별 줄 */
.wfl+.wfl{margin-top:6px;padding-top:8px;border-top:1px dashed var(--line)}
.wfl-h{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:13px;font-weight:800;margin-bottom:6px}
.wfl-h .fl{font-size:13px;font-weight:800;color:var(--acc-ink)}
.wfl-h{gap:5px}
.wfl-h .wtag{margin-left:3px}
.wfl .woff{font-size:13.5px;padding-top:0}

/* bottom tab bar: store switch (전체 · 3층 데빌 · 2층 메이드 · 1층 마츠리) */
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 4px max(8px,env(safe-area-inset-bottom));position:relative;z-index:20}
.tab{border:none;background:none;cursor:pointer;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--muted);transition:color .15s ease,transform .12s ease}
.tab img,.tab .tab-ic{width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0;transition:opacity .15s ease,box-shadow .15s ease}
.tab img{opacity:.55;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.tab img[data-missing]{display:none}
.tab .tab-ic{display:block;opacity:.55;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.tab .tab-ic svg{display:block;width:30px;height:30px}
.tab.on .tab-ic{opacity:1;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--c)}
.tab.on{color:var(--ci)}
.tab.on span{font-weight:800}
.tab.on img{opacity:1;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--c)}
.tab:active{transform:scale(.95)}

/* 매장 머리줄 → 공식 인스타 링크 */
.floor-h a.store{display:flex;align-items:center;gap:9px;min-width:0;min-height:44px;color:inherit;text-decoration:none;border-radius:12px;transition:opacity .15s ease}
.floor-h a.store:active{opacity:.6}
.floor-h .ig-mini{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;background:linear-gradient(45deg,#f09433,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888)}
.floor-h .ig-mini svg{width:14px;height:14px}

/* 데빌 칩: 검정 바탕 */
[data-theme="devil"] .wn .wa{background-color:rgba(255,255,255,.16);color:#fff}
[data-theme="devil"] .wtag:not(.nt){background:#eeebec;color:#26211f}

/* 월간 */
.mlegend{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.mlegend span{display:inline-flex;align-items:center;gap:4px}
.mlegend i{width:10px;height:10px;border-radius:3px;background:var(--chip-bg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.mdow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;font-weight:700;color:var(--ink2);padding:4px 0}
.mdow .sun{color:#d92d20}.mdow .sat{color:#2e6be6}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mc{min-width:0;min-height:64px;border:none;background:#f8f7f9;border-radius:9px;padding:3px 2px 5px;display:flex;flex-direction:column;align-items:stretch;gap:2px;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink)}
.mc:active{background:#f0eef2}
.mc.blank{background:none;pointer-events:none}
.mc:disabled{opacity:.35;cursor:default}
.mc .mn{align-self:center;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
.mc.sun .mn{color:#d92d20}.mc.sat .mn{color:#2e6be6}
.mc.today{background:#fff;box-shadow:inset 0 0 0 1.5px var(--acc)}
.mc.today .mn{background:var(--acc);color:#fff}
.mev{font-size:9px;font-weight:800;color:var(--acc-ink);white-space:nowrap;overflow:hidden;letter-spacing:-.4px}
.mp{display:flex;align-items:center;justify-content:center;gap:1px;font-size:10.5px;font-weight:800;line-height:1.3;border-radius:5px;background:var(--chip-bg);color:var(--chip-ink);font-variant-numeric:tabular-nums}
.mp svg{width:8px;height:8px}
.mp > svg{color:#e0525c}
.moff{font-size:10px;font-weight:600;color:var(--muted);margin-top:4px}
.seg button{padding:7px 11px}

/* 주간 시간표: 층 = 가로 띠, 날짜 = 세로 칸 */
[data-theme="devil"]{--band:#f2f0f1}
[data-theme="maid"]{--band:#fdf0f5}
[data-theme="matsuri"]{--band:#fff1e8}
.wt{margin:0 -6px}
.wt-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wt-h{border:none;background:none;cursor:pointer;font-family:inherit;color:var(--ink);padding:2px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.wt-h .dow{font-size:11px;font-weight:700;color:var(--ink2)}
.wt-h.sun .dow{color:#d92d20}.wt-h.sat .dow{color:#2e6be6}
.wt-h .dn{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.wt-h.today .dn{background:var(--acc);color:#fff}
.wt-h .st{font-size:10px;font-weight:700;color:var(--muted)}
.wt-e{min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 1px 2px}
.wt-e span{max-width:100%;font-size:10px;font-weight:800;line-height:1.25;color:var(--acc-ink);background:var(--acc-soft);border-radius:5px;padding:2px 3px;word-break:break-all;text-align:center}
.wt-band{margin-top:8px;border-radius:12px;background:var(--band);overflow:hidden}
.wt-label{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--acc-ink);padding:8px 10px 2px}
.wt-label i{width:8px;height:8px;border-radius:2px;background:var(--acc)}
.wt-c{min-width:0;border:none;background:none;cursor:pointer;font-family:inherit;padding:4px 1px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.wt-c+.wt-c{box-shadow:inset 1px 0 rgba(0,0,0,.06)}
.wt-c:active{background:rgba(0,0,0,.04)}
.wt-c.off{background:rgba(255,255,255,.55)}
.wt-c .n{display:flex;align-items:center;gap:1px;max-width:100%;font-size:11.5px;font-weight:700;letter-spacing:-.5px;line-height:1.2;white-space:nowrap;overflow:hidden}
.wt-c .n svg{width:8px;height:8px;flex-shrink:0}
.wt-c .no{font-size:11px;color:#c3bec7}
.wt-c .nt{display:flex;align-items:center;gap:1px;font-size:9.5px;font-weight:800;color:var(--night)}
.wt-c .nt svg{width:8px;height:8px;color:#e0525c}
.wt-c .ev{max-width:100%;font-size:9.5px;font-weight:800;line-height:1.25;color:var(--acc-ink);background:#fff;box-shadow:inset 0 0 0 1px var(--acc-soft);border-radius:5px;padding:2px 3px;word-break:break-all;text-align:center}
/* 월간: 이름 전부 */
.mg{display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:6px;background:var(--band);padding:3px 1px}
.mnm{display:flex;align-items:center;gap:1px;max-width:100%;font-size:10px;font-weight:700;letter-spacing:-.6px;line-height:1.25;color:var(--ink);white-space:nowrap;overflow:hidden}
.mnm svg{width:7px;height:7px;flex-shrink:0}
.mnt{display:flex;align-items:center;gap:1px;font-size:9px;font-weight:800;color:var(--night)}
.mnt svg{width:7px;height:7px;color:#e0525c}
.mc{justify-content:flex-start}
.mlegend i{background:var(--band);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.wt-c .no{font-size:10.5px;font-weight:600;color:var(--muted)}
/* 이벤트 데이: 층 색으로 채운 태그 */
.wt-c .ev,.mev{align-self:stretch;margin:0 3px;font-size:10px;font-weight:800;line-height:1.25;color:#fff;background:var(--acc);box-shadow:none;border-radius:5px;padding:3px 2px;word-break:break-all;text-align:center;white-space:normal;overflow:visible;letter-spacing:-.3px}
.mev{margin:0 1px 2px;font-size:9.5px}
[data-theme="devil"] .wt-c .ev,[data-theme="devil"] .mev{background:#b3262f}
/* 게스트: 아이콘 없이 글자로만 (진한 금색 + 아주 굵게) */
.wt-c .n,.mnm{white-space:normal;word-break:break-all;text-align:center;justify-content:center}
.gbadge{padding:3px 10px}
/* 층 띠 색 진하게 (구분 우선) */
.wt-band{color:var(--band-ink)}
.wt-label{color:var(--band-ink)}
[data-theme="devil"] .wt-label i{background:#e0525c}
.wt-c{color:var(--band-ink)}
.wt-c+.wt-c{box-shadow:inset 1px 0 var(--band-line)}
.wt-c.off{background:transparent}
.wt-c .no{color:var(--band-sub)}
.wt-c .nt,.mnt{color:var(--band-ink)}
.mnm{color:var(--band-ink)}
.mlegend i{box-shadow:none}
/* 이름은 한 줄 (긴 이름은 JS가 글자 크기를 줄임) */
.wt-c .n,.mnm{white-space:nowrap;word-break:normal;overflow:hidden;text-overflow:clip}
/* 세 층 모두 같은 진하기의 단색 (데빌 검정에 맞춤) */
[data-theme="devil"]{--band:#26211f;--band-ink:#fff;--band-sub:rgba(255,255,255,.6);--band-line:rgba(255,255,255,.14)}
[data-theme="maid"]{--band:#d94079;--band-ink:#fff;--band-sub:rgba(255,255,255,.7);--band-line:rgba(255,255,255,.2)}
[data-theme="matsuri"]{--band:#e0452e;--band-ink:#fff;--band-sub:rgba(255,255,255,.7);--band-line:rgba(255,255,255,.2)}
.wt-label i{background:#fff}
[data-theme="devil"] .wt-label i{background:#fff}
/* 이벤트 태그: 단색 띠 위에서는 흰 바탕 + 층 색 글자 */
.wt-c .ev,.mev{background:#fff;color:var(--acc-ink)}
[data-theme="devil"] .wt-c .ev,[data-theme="devil"] .mev{background:#fff;color:#b3262f}
[data-theme="maid"] .wt-c .ev,[data-theme="maid"] .mev{color:#b8285f}
.wt-c .n,.mnm{font-weight:700}
.wt-c .n.g,.mnm.g{font-weight:900}
.wt-c .ev,.mev{white-space:nowrap;word-break:normal;overflow:hidden}
/* 게스트: 노란색 없이 — 주간·월간은 '게스트' 묶음, 일별은 매장색 뱃지 */
.wt-c .n.g,.mnm.g{color:var(--band-ink);font-weight:800}
.gl{font-size:8.5px;font-weight:700;line-height:1.1;color:var(--band-sub);letter-spacing:0}
.gsep{align-self:stretch;height:1px;background:var(--band-line);margin:2px 5px}
.mg .gsep{margin:2px 4px}
.gbadge{background:var(--acc);color:#fff}
.night .gbadge{background:#b3262f;color:#fff}
.row.guest .av,.night .row.guest .av{background-color:var(--av-bg);color:var(--av-ink)}
.night .row.guest .av{background-color:rgba(255,255,255,.12);color:#fff}
.gcount{color:var(--ink2);font-weight:800}
/* 주간·월간 칸 안 야간 */
.nsep{align-self:stretch;height:2px;border-radius:1px;background:var(--band-line);margin:4px 3px 2px}
.ntl{display:flex;align-items:center;justify-content:center;gap:2px;font-size:9px;font-weight:800;line-height:1.1;color:var(--band-ink)}
.ntl svg{width:8px;height:8px;color:#fff}
.mg .no,.wt-c .no{font-size:9.5px}
/* 월간 v3: 작은 달력 + 아래 상세 */
.mc{min-height:58px;padding:3px 2px 4px;gap:2px;justify-content:flex-start}
.mc .mn{position:relative}
.mc .mn .evd{position:absolute;top:-1px;right:-5px}
.evd{display:inline-block;width:6px;height:6px;border-radius:50%;background:#17151a;box-shadow:0 0 0 1.5px #fff}
.mc.sel{background:#fff;box-shadow:inset 0 0 0 2px #17151a}
.mc.today .mn{background:#17151a;color:#fff}
.mb{display:flex;align-items:center;justify-content:center;gap:1px;height:13px;margin:0 1px;border-radius:4px;background:var(--band);color:#fff;font-size:9.5px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.mb svg{width:7px;height:7px;margin-left:2px;color:#fff}
.mlegend .evd{box-shadow:none}
#mdetail{margin-top:14px;scroll-margin-bottom:12px}
.md-h{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 10px}
.md-h b{font-size:18px;font-weight:800;letter-spacing:-.4px}
.md-go{display:flex;align-items:center;gap:2px;border:none;background:var(--fill);border-radius:99px;padding:6px 8px 6px 12px;font-size:12.5px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit}
.md-go svg{width:14px;height:14px}
.dfl{background:var(--band);color:var(--band-ink);border-radius:14px;padding:10px 12px 12px;margin-bottom:8px}
.dfh{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;margin-bottom:6px}
.dfh i{width:8px;height:8px;border-radius:2px;background:#fff}
.dfh .dev{font-size:11.5px;font-weight:800;background:#fff;color:var(--acc-ink);border-radius:99px;padding:2px 8px}
[data-theme="devil"] .dfh .dev{color:#b3262f}
.dfh .dcnt{margin-left:auto;font-weight:700;opacity:.8}
.dl{display:flex;gap:8px;align-items:flex-start}
.dl+.dl{margin-top:6px;padding-top:6px;border-top:1px solid var(--band-line)}
.dl em{flex-shrink:0;display:flex;align-items:center;gap:2px;height:22px;font-style:normal;font-size:11.5px;font-weight:800;opacity:.75}
.dl em svg{width:10px;height:10px}
.dnm{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:15px;line-height:22px;font-weight:600}
.dnm b{font-weight:800}
.dnm .dg{font-size:11px;font-weight:800;opacity:.75}
.dnm .dsep{width:1px;height:12px;background:var(--band-sub)}
.dnm .no{font-size:13px;opacity:.7}
.mc.today:not(.sel){background:#f8f7f9;box-shadow:none}
.evd{width:7px;height:7px}
.mlegend i.evd{width:7px;height:7px;border-radius:50%;background:#17151a}
/* 전체 탭과 매장 탭 사이 구분선 */
.tab[data-w="전체"]{position:relative}
.tab[data-w="전체"]::after{content:"";position:absolute;right:0;top:50%;width:1px;height:34px;transform:translateY(-50%);background:var(--line)}
/* 근무자별 달력 (이름을 누르거나 '근무자 찾기'): 출근한 날은 매장 색으로 칠해요 */
.who{display:flex;align-items:center;gap:13px;flex:1;min-width:0;border:none;background:none;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.who:active .nm{opacity:.6}
.p-who{display:flex;align-items:center;gap:12px;min-width:0}
.p-who .av{width:46px;height:46px;font-size:18px}
.p-who b{display:block;font-size:20px;font-weight:800;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-who small{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-top:2px}
.p-acts{display:flex;align-items:center;gap:6px;flex:none}
.p-ig{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink)}
.p-ig svg{width:17px;height:17px}
a.p-ig{border-radius:10px;color:#fff;background:linear-gradient(45deg,#f09433,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888)}
a.p-ig svg{width:19px;height:19px}
a.p-ig:active{transform:scale(.92)}
.p-sum{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.p-pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:15px;background:var(--fill);font-size:13px;font-weight:700;color:var(--ink)}
.p-pill i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.p-pill.total{background:var(--ink);color:#fff}
.pc-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.pc{min-width:0;min-height:60px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;color:var(--ink);overflow:hidden}
.pc.blank{border:none;background:none}
.pc .d{font-size:13.5px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.pc.sun .d{color:#d92d20}.pc.sat .d{color:#2e6be6}
.pc.today{box-shadow:inset 0 0 0 2px var(--ink)}
.pc.on{border-color:transparent;background:var(--c);color:#fff;cursor:pointer}
.pc.on .d{color:#fff}
.pc.on:active{opacity:.8}
.pc .w{display:flex;align-items:center;gap:2px;font-size:10.5px;font-weight:800;line-height:1.2;white-space:nowrap}
.pc .w svg{width:9px;height:9px}
.pc .x{max-width:100%;font-size:9.5px;font-weight:700;line-height:1.2;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.pc.on.today{box-shadow:inset 0 0 0 2px rgba(255,255,255,.9)}
.p-note{margin-top:12px;font-size:12.5px;font-weight:600;color:var(--muted);text-align:center}
.f-q{position:sticky;top:0;z-index:1;background:#fff;padding-bottom:10px}
.f-q input{width:100%;height:46px;border:1px solid var(--line);background:#f7f6f8;border-radius:12px;padding:0 14px;font:inherit;font-size:16px;color:var(--ink)}
.f-q input:focus{outline:none;border-color:var(--ink);background:#fff}
.f-sub{font-size:13.5px;font-weight:600;color:var(--ink2);margin:-2px 0 10px}
.f-row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 2px;border:none;border-bottom:1px solid var(--line);background:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.f-row:last-child{border-bottom:none}
.f-row:active{background:#f8f7f9}
.f-row .av{width:36px;height:36px;font-size:14px}
.f-row b{flex:1;min-width:0;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-row small{font-size:13px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.f-row svg{width:16px;height:16px;color:var(--muted)}
/* 좁은 폰(≤374px): 머리 줄이 두 줄로 깨지지 않게. 날짜 고르기는 가운데 날짜를 눌러도 열려서 달력 아이콘은 숨겨요 */
.brand,.seg button{white-space:nowrap}
.top{gap:4px;padding-right:6px}
.top .icon-btn{width:40px}
@media (max-width:374px){
  .top{padding-left:14px}
  .brand{font-size:16.5px}
  .seg button{padding:7px 9px;font-size:13px}
}
@media (max-width:359px){.brand{display:none}.seg{margin-right:auto}.top{padding-left:10px}}
/* ── 알림 ── */
[hidden]{display:none!important}
:root{--on:#1a9a52;--toast-bg:#17151a;--toast-fg:#fff}
.toast{position:fixed;left:50%;top:max(64px,env(safe-area-inset-top));transform:translate(-50%,-8px);z-index:200;background:var(--toast-bg);color:var(--toast-fg);border-radius:16px;padding:11px 18px;font-size:14px;font-weight:700;max-width:calc(100% - 32px);width:max-content;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ── 이번 주 이벤트 ── */
.eb{margin:0 -16px 4px;padding:2px 0 12px;border-bottom:8px solid var(--fill)}
.eb-h{display:flex;align-items:center;gap:8px;width:100%;border:none;background:none;font:inherit;color:var(--ink);padding:4px 16px 8px;cursor:pointer;text-align:left}
.eb-h .ttl{display:flex;align-items:center;gap:6px;min-width:0;font-size:15px;font-weight:800}
.eb-h .ttl svg{width:19px;height:19px;flex:none}
.eb-h .more{margin-left:auto;display:flex;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}
.eb-h .more svg{width:15px;height:15px;transition:transform .2s}
.eb-h[aria-expanded=true] .more svg{transform:rotate(-90deg)}
.cnt-pill{font-size:12px;font-weight:800;background:var(--fill);color:var(--ink2);border-radius:99px;padding:2px 9px;font-variant-numeric:tabular-nums}
.eb-chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 2px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-left:16px}
.eb-chips::-webkit-scrollbar{display:none}
.eb-chip{flex:none;min-width:136px;max-width:190px;scroll-snap-align:start;border:none;background:#fff;box-shadow:inset 0 0 0 1px var(--line);border-radius:14px;padding:10px 12px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:4px}
.eb-chip small{font-size:12px;font-weight:700;color:var(--ink2)}
.eb-chip b{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eb-chip.cur{box-shadow:inset 0 0 0 2px var(--ink)}
.eb-chip .eb-sw{margin-top:2px}
.eb-sw{display:flex;align-items:center;gap:5px;min-width:0;font-size:12.5px;font-weight:700;color:var(--ink2)}
.eb-sw i{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.eb-sw i+i{margin-left:-2px}
.eb-sw span{margin-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eb-all{padding:0 16px}
.eb-fold{display:flex;align-items:center;gap:6px;width:100%;border:none;background:var(--fill);border-radius:12px;padding:12px 14px;font:inherit;font-size:14px;font-weight:700;color:var(--ink2);cursor:pointer;margin-top:12px}
.eb-fold svg{width:16px;height:16px;margin-left:auto;transition:transform .2s}
.eb-fold[aria-expanded=true] svg{transform:rotate(90deg)}
.eb-row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:9px 2px;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.eb-row:active{background:var(--fill)}
.eb-d{width:42px;text-align:center;flex:none}
.eb-d small{display:block;font-size:11.5px;font-weight:700;color:var(--ink2)}
.eb-d b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.eb-d.sat small{color:#2e6be6}.eb-d.sun small{color:#d92d20}
.eb-m{min-width:0;flex:1}
.eb-m b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eb-m .eb-sw{margin-top:3px;font-weight:600}

function sheetCtl(wrap){
  const c = wrap.querySelector('.modal-c'), top = wrap.querySelector('.sheet-top');
  let drag = null, timer = 0;
  const reduce = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const open = () => { clearTimeout(timer); wrap.classList.remove('closing'); wrap.classList.add('show'); void c.offsetHeight; wrap.classList.add('in'); };
  const close = () => {
    if (!wrap.classList.contains('in')) return;
    wrap.classList.add('closing'); wrap.classList.remove('in', 'drag'); c.style.transform = ''; wrap.style.removeProperty('--dim'); drag = null;
    const fin = () => { if (wrap.classList.contains('closing')) wrap.classList.remove('show', 'closing'); };
    if (reduce()) fin(); else timer = setTimeout(fin, 320);
  };
  const end = () => {
    if (!drag) return;
    const d = drag; drag = null; wrap.classList.remove('drag');
    const [t0, y0] = d.pts[0], [t1, y1] = d.pts[d.pts.length - 1], v = t1 > t0 ? (y1 - y0) / (t1 - t0) : 0;
    if (d.y > Math.min(150, d.h * 0.3) || (v > 0.6 && d.y > 16)) close();
    else { c.style.transform = ''; wrap.style.removeProperty('--dim'); }
  };
  top.addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.target.closest('button') || !wrap.classList.contains('in')) return;
    drag = { pid: e.pointerId, y0: e.clientY, y: 0, pts: [[performance.now(), 0]], h: c.getBoundingClientRect().height || 1 };
    wrap.classList.add('drag');
    try { top.setPointerCapture(e.pointerId); } catch (_) {}
  });
  top.addEventListener('pointermove', e => {
    if (!drag || drag.pid !== e.pointerId) return;
    let dy = e.clientY - drag.y0; if (dy < 0) dy = -Math.min(18, Math.sqrt(-dy) * 2);
    drag.y = dy; drag.pts.push([performance.now(), dy]); if (drag.pts.length > 5) drag.pts.shift();
    c.style.transform = `translateY(${dy}px)`; wrap.style.setProperty('--dim', String(Math.max(0, 1 - Math.max(0, dy) / drag.h)));
  });
  top.addEventListener('pointerup', e => { if (drag && drag.pid === e.pointerId) end(); });
  top.addEventListener('pointercancel', e => { if (drag && drag.pid === e.pointerId) end(); });
  wrap.addEventListener('touchmove', e => { if (e.target === wrap) e.preventDefault(); }, { passive: false });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  return { open, close };
}

function setupPTR(container, onRefresh){
  // mode: 0 미정, 1 당기는중, -1 일반스크롤
  let startY=0, mode=0, applied=0, refreshing=false;
  const THRESH=60, MAX=90, DEAD=12, txt=$('ptrTxt'), spin=$('ptrSpin');
  container.addEventListener('touchstart', e=>{
    if(refreshing || e.touches.length!==1){ mode=-1; return; }
    mode=0; applied=0; startY=e.touches[0].clientY;
  }, {passive:true});
  container.addEventListener('touchmove', e=>{
    if(refreshing || mode===-1) return;
    const dy=e.touches[0].clientY - startY;
    if(mode===0){
      if(container.scrollTop>0 || dy<0){ mode=-1; return; }
      if(dy<DEAD) return;
      mode=1;
    }
    if(container.scrollTop>0){ mode=-1; container.style.transform=''; return; }
    applied=Math.min((dy-DEAD)*0.5, MAX); if(applied<0) applied=0;
    container.style.transform=`translateY(${applied}px)`;
    if(txt) txt.textContent = applied>=THRESH ? '놓으면 새로고침' : '↓ 당겨서 새로고침';
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
  const finish=async()=>{
    if(mode!==1){ mode=0; return; }
    const go=applied>=THRESH; mode=0;
    container.style.transition='transform .22s';
    if(go){
      refreshing=true;
      container.style.transform='translateY(44px)';
      if(spin) spin.style.display='inline-block';
      if(txt) txt.textContent='새로고침 중…';
      try{ await onRefresh(); }catch(e){}
      refreshing=false;
      if(spin) spin.style.display='none';
      if(txt) txt.textContent='↓ 당겨서 새로고침';
    }
    container.style.transform='';
    setTimeout(()=>{ container.style.transition=''; }, 240);
    applied=0;
  };
  container.addEventListener('touchend', finish);
  container.addEventListener('touchcancel', finish);
}

    ? `${av}<span class="nmw"><span class="nml">${nm}${gb}</span><span class="stl ${st.k}"><i class="dot ${st.k}"></i>${stTxt}</span></span>`
    : `${av}${nm}`;
  // 직원 이름을 누르면 그 사람의 한 달 달력 (게스트는 그대로)
  const main = !guest && sid!=null ? `<button class="who" data-sid="${esc(sid)}" data-n="${esc(name)}" data-av="${esc(avatar||'')}" data-ig="${esc(insta||'')}" aria-label="${esc(name)} 출근 달력 보기">${who}</button>` : who;
  return `<div class="row${sm?' sm':''}${guest?' guest':''}${st&&st.k==='done'?' done':''}">${main}${st?'':gb}${ig?`<a class="ig" href="${esc(ig)}" target="_blank" rel="noopener" aria-label="${esc(name)} 인스타그램"><span>${IG_SVG}</span></a>`:''}</div>`;
};
const eventHtml = memo => `<div class="event"><span class="ev-tag">이벤트</span><span class="ev-name">${esc(memo)}</span></div>`;
const guestPill = n => n ? `<span class="gcount">게스트 ${n}</span>` : '';

// 근무 상태 (데빌만, 오늘만): 블록 시간("16:00~23:00", "23:00~익일 05:00")을 기본으로, 사람별 start_time/end_time 이 있으면 그걸 써요
const ST_RANK = {on:0, later:1, done:2};
const toBm = (h, m) => (h<6 ? h+24 : h)*60 + m;
function parseHours(txt){
  const t = String(txt||'').match(/(\d{1,2}):(\d{2})\s*[~\-–—]\s*(?:익일\s*)?(\d{1,2}):(\d{2})/); if(!t) return null;
  const s0 = toBm(+t[1], +t[2]); let e0 = toBm(+t[3], +t[4]); if(e0<=s0) e0 += 1440;
  return { s:s0, e:e0, start:t[1].padStart(2,'0')+':'+t[2] };
}
const hmOf = v => { const m=String(v||'').match(/^(\d{1,2}):(\d{2})/); return m ? [+m[1], +m[2]] : null; };
function stateOf(blk, row, bm){
  let s0=blk.s, e0=blk.e, start=blk.start;
  const a=hmOf(row.start_time), b=hmOf(row.end_time);
  if(a){ s0=toBm(a[0], a[1]); start=String(a[0]).padStart(2,'0')+':'+String(a[1]).padStart(2,'0'); }
  if(b) e0=toBm(b[0], b[1]);
  if(e0<=s0) e0 += 1440;
  return { k: bm<s0 ? 'later' : bm>=e0 ? 'done' : 'on', start };
}
let statSig = '';   // 이번에 그린 상태들 (바뀌었을 때만 다시 그려요)

// 데빌 주간·야간: 세로로 쌓지 않고 두 칸으로 나란히. clock 이 있으면 줄마다 근무 상태
function dayNightHtml(named, mem, nightHrs, clock){
  const pick = k => (String(nightHrs).match(new RegExp(k+'\\s*([^·]+)'))||[])[1]?.trim()||'';
  const dh = pick('주간'), nh = pick('야간');
  const withSt = (list, hrs) => { const blk = clock ? parseHours(hrs) : null;
    const a = list.map((x,i)=>({x, i, st: blk ? stateOf(blk, x, clock.bm) : null}));
    if(blk) a.sort((p,q)=>ST_RANK[p.st.k]-ST_RANK[q.st.k] || p.i-q.i);
    statSig += a.map(r=>r.st ? r.st.k[0]+r.st.start : '-').join(','); return a; };
  const dRows = withSt(named, dh), nRows = withSt(mem, nh);
  const col = (cls, head, hrs, list, empty) => `<div class="dn-col${cls}"><div class="dn-h">${head}<span>${list.length}명</span>${hrs?`<small>${esc(hrs)}</small>`:''}</div>${list.length?list.join(''):`<div class="none">${empty}</div>`}</div>`;
  return `${(!dh&&!nh)?`<div class="hrs-line">${esc(nightHrs)}</div>`:''}<div class="dn">`
    + col('', '<b>주간</b>', dh, dRows.map(({x,st})=>memberRow(x.display_name||x.staff_name, x.is_guest, x.staff_instagram, x.staff_avatar, true, x.staff_id, st)), '없음')
    + col(' night', `${ICON.moon}<b>야간</b>`, nh, nRows.map(({x,st})=>memberRow(x.member_name, x.is_guest, x.instagram, x.avatar, true, x.staff_id, st)), '미정')
    + `</div>`;
}

let dayState = null, daySig = '';
async function renderDay(){
  const d=selectedDate, ds=ymd(d), isToday=ds===ymd(bizToday());
  $('dateLabel').textContent = `${d.getMonth()+1}월 ${d.getDate()}일 (${DAYS[d.getDay()]})`;
  setTodayLine(isToday, '오늘', '오늘로');
  drawEvents();
  dayState = null;
  if(draftMonths.has(ymOf(d))){
    $('list').innerHTML = emptyBox('lock', '아직 공개되지 않은 달이에요', '스케줄이 확정되면 볼 수 있어요');
    animList(); return;
  }
  $('list').innerHTML = `<div style="text-align:center;padding:30px"><span class="spin"></span></div>`;
  const shifts = await fetchRange(ds, ds); if(shifts===null) return;
  const closed = await fetchClosures(ds, ds);
  const night = await fetchNight(ds, ds);
  const nmem = await fetchNightMembers(ds);
  dayState = { ds, shifts, closed, night, nmem };
  $('list').innerHTML = buildDay(); daySig = statSig;

function buildDay(){
  const { ds, shifts, closed, night, nmem } = dayState;
  statSig = '';
  const clock = bizClock(), live = ds===clock.date;   // 근무 상태는 영업일 기준 오늘만
  const all = wpFilter==='전체';
  const groups = all ? FLOORS.map(f=>f[0]) : [wpFilter];
  let html='', total=0, shown=0;
  groups.forEach(wp=>{
    const isClosed = closed.has(ds+'|'+wp);
    const nightHrs = night[ds+'|'+wp];
    const rows = shifts.filter(s=>s.workplace===wp);
    const named = rows.filter(s=>s.display_name||s.staff_name).sort(byGuestFirst);
    const mem = nightHrs ? [...(nmem[ds+'|'+wp]||[])].sort(byGuestFirst) : [];
    const memo = rows.find(r=>r.memo)?.memo;
    const guests = named.filter(s=>s.is_guest).length + mem.filter(m=>m.is_guest).length;
    total += named.length+(isClosed?1:0)+(nightHrs?1:0);
    if(all && (isClosed || (!named.length && !nightHrs))) return;   // 전체: 쉬는 층은 숨김
    shown++;
    let inner='';
    if(isClosed) inner = all ? `<div class="none">휴무일이에요</div>` : emptyBox('closed', '휴무일이에요', `이 날은 ${wp} 매장이 쉬어요`);
    else {
      if(memo) inner += eventHtml(memo);
      if(nightHrs) inner += dayNightHtml(named, mem, nightHrs, live && wp==='데빌' ? clock : null);
      else if(named.length){
        inner += named.map(s=>memberRow(s.display_name||s.staff_name, s.is_guest, s.staff_instagram, s.staff_avatar, false, s.staff_id)).join('');
      }
      else inner += `<div class="none">근무 없음</div>`;
    }
    const t = THEMES[wp];
    const cnt = isClosed ? '휴무' : nightHrs ? `주간 ${named.length} · 야간 ${mem.length}` : `${named.length}명`;
    // 매장 이름(로고)을 누르면 공식 인스타그램으로
    const head = `<a class="store" href="${t.ig}" target="_blank" rel="noopener" aria-label="${wp} 공식 인스타그램"><img src="assets/logo-${t.key}.jpg" alt="" onerror="this.remove()"><span class="fl">${floorOf(wp)}</span><b>${wp}</b><span class="ig-mini">${IG_SVG}</span></a>`;
    html += `<section class="floor" data-theme="${t.key}"><div class="floor-h">${head}<span class="cnt">${isClosed?'':guestPill(guests)}${cnt}</span></div>${inner}</section>`;
  });
  return (total===0 || (all && !shown))
    ? (all && total>0 ? emptyBox('closed', '휴무일이에요', '이 날은 모든 매장이 쉬어요') : emptyBox('cal', '이 날은 등록된 근무가 없어요', '다른 날짜를 확인해 보세요'))
    : html;
}
// 1분마다: 근무 상태가 바뀐 때만 다시 그려요 (데이터는 다시 받지 않아요)

// ── 이번 주 이벤트 (일별 화면 위 띠): 시프트 memo 를 날짜·이름으로 합쳐요. 휴무 매장·공개 전 달은 빼요 ──
let evList = [], evOpen = false, evPastOpen = false, evFor = '';
async function loadEvents(){
  evList = [];
  if(!minDate || !maxDate) return;
  const [rows, cl] = await Promise.all([
    fetchAll(()=>supa.from('shift_view').select('work_date,workplace,memo').not('memo','is',null).gte('work_date',minDate).lte('work_date',maxDate).order('id')),
    supa.from('closure_view').select('work_date,workplace').gte('work_date',minDate).lte('work_date',maxDate),
  ]);
  if(!rows) return;
  const closedSet = new Set(((cl&&cl.data)||[]).map(c=>c.work_date+'|'+c.workplace));
  const m = new Map();
  rows.forEach(r=>{
    const t = String(r.memo||'').trim();
    if(!t || closedSet.has(r.work_date+'|'+r.workplace) || draftMonths.has(r.work_date.slice(0,7))) return;
    const k = r.work_date+'|'+t; if(!m.has(k)) m.set(k, { d:r.work_date, t, ws:new Set() });
    m.get(k).ws.add(r.workplace);
  });
  evList = [...m.values()].map(g=>({ d:g.d, t:g.t, ws:FLOORS.map(f=>f[0]).filter(w=>g.ws.has(w)) }))
    .filter(g=>g.ws.length).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
}
const dayDiff = (a,b) => Math.round((Date.parse(a+'T00:00:00Z')-Date.parse(b+'T00:00:00Z'))/864e5);
const addDays = (ds,n) => new Date(Date.parse(ds+'T00:00:00Z')+n*864e5).toISOString().slice(0,10);
const relDay = (d,today) => { const n=dayDiff(d,today); return n===0?'오늘':n===1?'내일':n===2?'모레':n>0?n+'일 뒤':Math.abs(n)+'일 전'; };
const dayLabel = ds => { const d=new Date(ds+'T00:00:00'); return `${d.getMonth()+1}월 ${d.getDate()}일 (${DAYS[d.getDay()]})`; };
const evSwatch = (ws, txt) => `<span class="eb-sw">${ws.map(w=>`<i style="--c:${THEMES[w].c}"></i>`).join('')}<span>${esc(txt)}</span></span>`;
function drawEvents(){
  const eb = $('eb'); if(!eb) return;
  const today = bizClock().date, wkEnd = addDays(today, 6);
  evFor = today;
  const up = evList.filter(g=>g.d>=today), past = evList.filter(g=>g.d<today).reverse(), wk = up.filter(g=>g.d<=wkEnd);
  if(viewMode!=='day' || !wk.length){ eb.hidden = true; return; }
  const cur = ymd(selectedDate), chips = $('ebChips'), keep = chips.scrollLeft;

  chips.innerHTML = wk.map(g=>`<button class="eb-chip${g.d===cur?' cur':''}" data-d="${g.d}"><small>${dayLabel(g.d)} · ${relDay(g.d,today)}</small><b>${esc(g.t)}</b>${evSwatch(g.ws, g.ws.length===3?'모든 층':g.ws.join(' · '))}</button>`).join('');
  chips.scrollLeft = keep;
  if(!evOpen){ return; }
  const row = (g, p) => { const d=new Date(g.d+'T00:00:00'), w=d.getDay();
    return `<button class="eb-row${p?' past':''}" data-d="${g.d}"><span class="eb-d${w===6?' sat':w===0?' sun':''}"><small>${DAYS[w]}</small><b>${d.getDate()}</b></span><span class="eb-m"><b>${esc(g.t)}</b>${evSwatch(g.ws, g.ws.length===3?'모든 층':g.ws.map(x=>floorOf(x)+' '+x).join(' · '))}</span><span class="eb-rl">${relDay(g.d,today)}</span></button>`; };
  let h = '', mm0 = '';
  up.forEach(g=>{ const mm=g.d.slice(5,7); if(mm!==mm0){ mm0=mm; h += `<div class="eb-mh">${+mm}월</div>`; } h += row(g, false); });
  if(past.length) h += `<button class="eb-fold" id="ebPast" aria-expanded="${evPastOpen}">지난 이벤트 ${past.length}개${ICON.chev}</button><div${evPastOpen?'':' hidden'}>${past.map(g=>row(g, true)).join('')}</div>`;
  $('ebAll').innerHTML = h;
}
function ebClick(e){

// 주간은 일요일 시작 (일월화수목금토)
const sundayOf = d => { const x=new Date(d); x.setDate(x.getDate()-x.getDay()); x.setHours(0,0,0,0); return x; };
// 이름을 한 줄에: 칸 너비(px)에 맞춰 긴 이름만 글자를 줄임 (한글 1em, 영문·기호 약 0.55em)
const fitName = (name, base, avail) => { let u=0; for(const ch of String(name)) u += /[\u3131-\uD7A3]/.test(ch) ? 1 : 0.55;
  const fs = Math.max(7, Math.min(base, Math.floor(avail/Math.max(u,1)*10)/10)); return fs<base ? ` style="font-size:${fs}px"` : ''; };
// 주간·월간 칸: 게스트를 위에 모아 작은 '게스트' 글자로 묶고, 선 아래에 직원
const cellNames = (list, cls, base, avail) => {
  const nm = s => `<span class="${cls}${s.is_guest?' g':''}"${fitName(nameOf(s), base, avail)}>${esc(nameOf(s))}</span>`;
  const gs = list.filter(s=>s.is_guest), st = list.filter(s=>!s.is_guest);
  return (gs.length ? `<span class="gl">게스트</span>${gs.map(nm).join('')}${st.length?'<span class="gsep"></span>':''}` : '') + st.map(nm).join('');
};
// 일별/주간/월간 이동
function step(dir){
  if(viewMode==='month'){ selectedDate.setDate(1); selectedDate.setMonth(selectedDate.getMonth()+dir); }
  else selectedDate.setDate(selectedDate.getDate()+dir*(viewMode==='week'?7:1));
}
function updateNav(){
  const t=ymd(selectedDate); let cp=true, cn=true;
  if(viewMode==='day'){ cp=!minDate||t>minDate; cn=!maxDate||t<maxDate; }
  else if(viewMode==='week'){ const sw=sundayOf(selectedDate); const nw=new Date(sw); nw.setDate(nw.getDate()+7);
    cp=!minDate||ymd(sw)>minDate; cn=!maxDate||ymd(nw)<=maxDate; }
  else { const f=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1), nf=new Date(f.getFullYear(),f.getMonth()+1,1);
    cp=!minDate||ymd(f)>minDate; cn=!maxDate||ymd(nf)<=maxDate; }
  $('prev').disabled=!cp; $('next').disabled=!cn;
  $('prev').style.opacity=cp?'':'.3'; $('next').style.opacity=cn?'':'.3';
}

function goDay(root){

const dowCls = d => d.getDay()===0?' sun':d.getDay()===6?' sat':'';
// 한 날짜·매장의 출근 정보
function dayInfo(dayShifts, closed, night, ds, wp, nmem){
  const isClosed = closed.has(ds+'|'+wp);
  const filled = isClosed ? [] : dayShifts.filter(s=>s.workplace===wp&&(s.display_name||s.staff_name)).sort(byGuestFirst);
  const memo = isClosed ? null : dayShifts.find(r=>r.workplace===wp && r.memo)?.memo;
  const hasNight = !isClosed && !!night[ds+'|'+wp];
  const nightList = hasNight ? [...((nmem||{})[ds+'|'+wp]||[])].sort(byGuestFirst) : [];
  return { filled, memo, night: hasNight, nightList, any: filled.length>0 || hasNight, guests: filled.filter(s=>s.is_guest).length };
}
// 주간·월간용: 기간 안의 야간 멤버
async function fetchNightMembersRange(from,to){
  const { data } = await supa.from('night_member_view').select('*').gte('work_date',from).lte('work_date',to);
  const m={}; (data||[]).forEach(r=>(m[r.work_date+'|'+r.workplace]=m[r.work_date+'|'+r.workplace]||[]).push(r)); return m;
}
// 칸 안 이름: 야간이 있으면 '주간' / 선 / '야간' 으로 나눔

// 주간: 월~일 7칸 × 층별 띠 (시간표형)

  const bands = groups.map(wp=>{ const t=THEMES[wp];
    const cells = days.map(x=>{ const p=x.per[wp];
      const names = cellBody(p, 'n', 11.5, 46);

    return `<div class="wt-band" data-theme="${t.key}"><div class="wt-label"><i></i>${floorOf(wp)} ${wp}</div><div class="wt-row">${cells}</div></div>`; }).join('');
  $('list').innerHTML = `<div class="wt"><div class="wt-row wt-head">${head}</div>${bands}</div><div class="wk-hint">날짜를 누르면 그날 출근 멤버를 자세히 볼 수 있어요</div>`;
  animList(); goDay($('list'));

    cells += `<button class="mc${dowCls(day)}${ds===todayStr?' today':''}${ds===sel?' sel':''}" data-sel="${ds}"${out?' disabled':''}><span class="mn">${d}${ev?'<i class="evd"></i>':''}</span>${bars || (out?'':'<span class="moff">휴무</span>')}</button>`;
  }
  const legend = all ? `<div class="mlegend">${FLOORS.map(([wp,fl])=>`<span data-theme="${THEMES[wp].key}"><i></i>${fl} ${wp}</span>`).join('')}<span><i class="evd"></i>이벤트</span></div>` : '';
  $('list').innerHTML = `${legend}<div class="mdow">${['일','월','화','수','목','금','토'].map((x,i)=>`<span class="${i===0?'sun':i===6?'sat':''}">${x}</span>`).join('')}</div><div class="mgrid">${cells}</div><div id="mdetail"></div>`;

// 한 사람의 한 달 출근 (days: 날짜 → [{wp, day, night, time}], memo: '날짜|매장' → 이벤트 이름)
async function loadPersonMonth(id, ym){
  const [from, to] = monthRange(ym);
  const [a, b, c] = await Promise.all([
    supa.from('shift_view').select('work_date,workplace,start_time,end_time').eq('staff_id', id).gte('work_date',from).lte('work_date',to),
    supa.from('night_member_view').select('work_date,workplace').eq('staff_id', id).gte('work_date',from).lte('work_date',to),
    fetchAll(()=>supa.from('shift_view').select('work_date,workplace,memo').not('memo','is',null).gte('work_date',from).lte('work_date',to).order('id')),
  ]);
  if(a.error || b.error) return null;
  const memo = {}; (c||[]).forEach(r=>{ if(r.memo) memo[r.work_date+'|'+r.workplace] = r.memo; });
  const days = {};   // ds → [{wp, night, time}]
  const add = (ds, wp, night, time) => { const l = days[ds] = days[ds] || []; let x = l.find(v=>v.wp===wp); if(!x) l.push(x = { wp, day:false, night:false, time:'' }); if(night) x.night = true; else { x.day = true; if(time) x.time = time; } };
  (a.data||[]).forEach(r=>add(r.work_date, r.workplace, false, r.start_time ? `${r.start_time}${r.end_time?'–'+r.end_time:''}` : ''));
  (b.data||[]).forEach(r=>add(r.work_date, r.workplace, true, ''));
  const order = w => FLOORS.findIndex(f=>f[0]===w);
  Object.values(days).forEach(l=>l.sort((x,y)=>order(x.wp)-order(y.wp)));
  return { days, memo };
}

// 한 달 달력 그림: 이름·달·출근 일수, 출근한 날은 매장 색 칸 (+ 야간·이벤트 이름)
function monthCanvas(name, ym, data){
  const [y, m] = ym.split('-').map(Number), first = new Date(y, m-1, 1).getDay(), n = new Date(y, m, 0).getDate();
  const W = 1080, PAD = 48, GAP = 8, CW = Math.floor((W-PAD*2-GAP*6)/7), CH = 150, rows = Math.ceil((first+n)/7);
  const top = PAD + 190, H = top + rows*(CH+GAP) + 36 + PAD;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  const F = "'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system,system-ui,'Malgun Gothic',sans-serif";
  const rr = (x, yy, w, h, r) => { c.beginPath(); c.moveTo(x+r, yy); c.arcTo(x+w, yy, x+w, yy+h, r); c.arcTo(x+w, yy+h, x, yy+h, r); c.arcTo(x, yy+h, x, yy, r); c.arcTo(x, yy, x+w, yy, r); c.closePath(); };
  const fit = (t, w) => { if(c.measureText(t).width<=w) return t; const a=[...t]; while(a.length>1 && c.measureText(a.join('')+'…').width>w) a.pop(); return a.join('')+'…'; };
  c.fillStyle = '#fff'; c.fillRect(0, 0, W, H);
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  let fs = 64; c.font = `800 ${fs}px ${F}`; while(c.measureText(name).width > W-PAD*2 && fs > 30){ fs -= 2; c.font = `800 ${fs}px ${F}`; }
  c.fillStyle = '#17151a'; c.fillText(name, PAD, PAD+62);
  c.fillStyle = '#615c66'; c.font = `700 34px ${F}`;
  c.fillText(`${y}년 ${m}월 · ${Object.keys(data.days).length}일 출근`, PAD, PAD+118);
  c.textAlign = 'center'; c.font = `700 26px ${F}`;
  DAYS.forEach((x, i)=>{ c.fillStyle = i===0 ? '#d92d20' : i===6 ? '#2e6be6' : '#615c66'; c.fillText(x, PAD+i*(CW+GAP)+CW/2, top-14); });
  for(let d=1; d<=n; d++){
    const idx = first+d-1, col = idx%7, row = Math.floor(idx/7), x = PAD+col*(CW+GAP), yy = top+row*(CH+GAP);
    const ds = `${ym}-${String(d).padStart(2,'0')}`, l = data.days[ds];
    c.textAlign = 'center';
    if(!l){
      rr(x, yy, CW, CH, 16); c.strokeStyle = '#eeebef'; c.lineWidth = 2; c.stroke();
      c.fillStyle = col===0 ? '#d92d20' : col===6 ? '#2e6be6' : '#17151a'; c.font = `800 32px ${F}`; c.fillText(String(d), x+CW/2, yy+46);
      continue;
    }
    rr(x, yy, CW, CH, 16); c.fillStyle = THEMES[l[0].wp].c; c.fill();
    c.fillStyle = '#fff'; c.font = `800 34px ${F}`; c.fillText(String(d), x+CW/2, yy+46);
    c.font = `800 24px ${F}`;
    l.slice(0, 2).forEach((v, i)=>{ c.fillText(fit(`${v.day?v.wp:''}${v.night?(v.day?' 야간':'야간'):''}`, CW-12), x+CW/2, yy+78+i*28); });
    const ev = l.map(v=>data.memo[ds+'|'+v.wp]).find(Boolean);
    if(ev){ c.globalAlpha = .88; c.font = `700 21px ${F}`; c.fillText(fit(ev, CW-12), x+CW/2, yy+CH-14); c.globalAlpha = 1; }
  }
  c.textAlign = 'right'; c.fillStyle = '#8f8a94'; c.font = `700 26px ${F}`; c.fillText('모에 스케줄', W-PAD, H-PAD+8);
  return cv;
}

// 주소로 바로 열기: ?p=<staff_id>&ym=<YYYY-MM> → 그 사람의 그 달 달력. 없는 사람·공개 전·볼 수 없는 달은 무시해요
async function openFromUrl(){
  const q = new URLSearchParams(location.search), pid = q.get('p');
  if(pid===null) return;
  const ymQ = q.get('ym');
  try{ history.replaceState(null, '', location.pathname+location.hash); }catch(e){}
  if(!/^\d{1,9}$/.test(pid) || +pid<=0) return;
  const ym = ymQ===null ? ymOf(bizToday()) : ymQ;
  if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(ym) || draftMonths.has(ym) || !monthOk(ym)) return;
  const id = +pid;
  let p = null;
  const a = await supa.from('shift_view').select('staff_id,staff_name,display_name,staff_avatar,staff_instagram').eq('staff_id', id).order('work_date', {ascending:false}).limit(1);
  const r = a.data && a.data[0];
  if(r) p = { id, name:r.display_name||r.staff_name, avatar:r.staff_avatar, insta:r.staff_instagram };
  else {
    const b = await supa.from('night_member_view').select('staff_id,member_name,avatar,instagram').eq('staff_id', id).limit(1);
    const t = b.data && b.data[0];
    if(t) p = { id, name:t.member_name, avatar:t.avatar, insta:t.instagram };
  }
  if(!p || !p.name) return;
  openPerson(p, ym);
}

boot();

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>
/* 주소는 늘 /staff.html (2026-11-11 사장님: 저장한 링크가 나중에 합쳐도 그대로 쓰이게).
   /v2/staff.html 로 열리면 이 기기를 새 화면으로 켜고(ui_v2) 주소만 /staff.html 로 바꿔요. 그림 · 파일은 /v2/assets/ 로 적어요 */
(function(){try{if(location.pathname==='/v2/staff.html'){localStorage.setItem('ui_v2','1');history.replaceState(history.state,'','/staff.html'+location.search+location.hash);}}catch(e){}})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>모에 스케줄 · 직원용</title>
<meta name="description" content="이번 달 시프트를 제출하고 근무표를 확인하세요.">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="모에 스케줄">
<!--STYLE-->
</head>
<body data-theme="all">
<div class="app" id="app">
  <header class="top" id="top"></header>
  <div class="bars" id="bars">
    <div class="installbar" id="myBar" hidden>
      <img class="ib-my" src="/v2/assets/mateyou.png" alt="" width="22" height="22">
      <span class="ib-t">메이트유 계정을 연결할까요?</span>
      <button class="btn sm ib-go" id="myBarBtn">연결</button>
      <button class="ib-x" id="myBarX" aria-label="닫기"></button>
    </div>
    <div class="installbar" id="installBar" hidden>
      <span class="ib-t">직원용을 앱으로 설치하면 더 편해요</span>
      <button class="btn sm ib-go" id="installBtn">설치</button>
      <button class="ib-x" id="installX" aria-label="닫기"></button>
    </div>
    <div class="installbar" id="pushBar" hidden>
      <span class="ib-t">대타 댓글 알림을 받을까요?</span>
      <button class="btn sm ib-go" id="pushAskBtn">켜기</button>
      <button class="ib-x" id="pushAskX" aria-label="닫기"></button>
    </div>
  </div>
  <div class="stage">
    <div class="ptr" id="ptr" aria-hidden="true"><span class="spin" id="ptrSpin" hidden></span><span id="ptrTxt">당겨서 새로고침</span></div>
    <main class="body" id="screen"></main>
  </div>
  <nav class="mtabbar" id="tabbar" aria-label="메뉴"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<!--SCRIPT-->
</body>
</html>
